name: CP2 Encrypted Backup Export

on:
  push:
    branches:
      - evidence/checkpoints-1-2-20260901
    paths:
      - .github/workflows/cp2-backup-export.yml

permissions:
  contents: read

jobs:
  export-encrypt-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://siimvrusnzxexizpyoib.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpaW12cnVzbnp4ZXhpenB5b2liIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MzQzMDQsImV4cCI6MjEwMzMxMDMwNH0.i8nOoczTEPuokNnbO9-gTlWPP1qZX1ge5gUh56i_gOw
      CP2_TOKEN: Fhrigm8icK2GZMeRx58L0PSJAX106mZ_jafFqJReBxbsVM0o7RGFHg
    steps:
      - name: Download one-time logical backup from ERP Enteng UAT
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --request POST \
            "$SUPABASE_URL/functions/v1/cp2-backup-export-20260901" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "x-cp2-token: $CP2_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            --dump-header response-headers.txt \
            --output erp-enteng-cp2-raw.zip
          test -s erp-enteng-cp2-raw.zip
          unzip -tq erp-enteng-cp2-raw.zip

      - name: Verify internal file checksums and recovery manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path

          archive = Path('erp-enteng-cp2-raw.zip')
          raw_sha = hashlib.sha256(archive.read_bytes()).hexdigest()
          with zipfile.ZipFile(archive) as zf:
              names = set(zf.namelist())
              required = {
                  'RECOVERY_MANIFEST.json',
                  'ERP_ENTENG_CATALOG_SNAPSHOT.json',
                  'ERP_ENTENG_BEFORE_REBUILD.sql',
                  'ERP_ENTENG_DATA_RESTORE.sql',
                  'STORAGE_MANIFEST.json',
                  'SHA256SUMS.json',
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'missing required files: {missing}')
              manifest = json.loads(zf.read('RECOVERY_MANIFEST.json'))
              checksums = json.loads(zf.read('SHA256SUMS.json'))
              if manifest['project_ref'] != 'siimvrusnzxexizpyoib':
                  raise SystemExit('wrong project ref')
              if manifest['source_commit_sha'] != 'bf3ce8e2821f120d8abd8788daf07f6da7c15459':
                  raise SystemExit('wrong source sha')
              if manifest['expected_schema_fingerprint'] != 'a0c59b96b3879edd28f3d8c57d0894a3':
                  raise SystemExit('wrong schema fingerprint')
              if manifest['auth']['users'] != 0 or manifest['auth']['app_users'] != 0:
                  raise SystemExit('unexpected auth rows')
              if len(manifest['table_data']) < 142:
                  raise SystemExit(f"too few table payloads: {len(manifest['table_data'])}")
              if len(manifest['storage']) != 1:
                  raise SystemExit(f"unexpected storage object count: {len(manifest['storage'])}")
              for name, expected in checksums.items():
                  actual = hashlib.sha256(zf.read(name)).hexdigest()
                  if actual != expected:
                      raise SystemExit(f'checksum mismatch: {name}')
              report = {
                  'status': 'PASS',
                  'raw_archive_sha256': raw_sha,
                  'raw_archive_bytes': archive.stat().st_size,
                  'captured_at_utc': manifest['captured_at_utc'],
                  'project_ref': manifest['project_ref'],
                  'source_commit_sha': manifest['source_commit_sha'],
                  'expected_schema_fingerprint': manifest['expected_schema_fingerprint'],
                  'table_payloads': len(manifest['table_data']),
                  'table_rows': sum(item['rows'] for item in manifest['table_data']),
                  'storage_objects': len(manifest['storage']),
                  'storage_bytes': sum(item['bytes'] for item in manifest['storage']),
                  'platform_migrations': manifest['migration']['platform_count'],
                  'application_migrations': manifest['migration']['application_count'],
              }
              Path('cp2-export-validation.json').write_text(json.dumps(report, indent=2) + '\n')
              Path('raw.sha256').write_text(f"{raw_sha}  erp-enteng-cp2-raw.zip\n")
          PY

      - name: Encrypt, decrypt-test, and destroy plaintext archive
        shell: bash
        run: |
          set -euo pipefail
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          encrypted="ERP_ENTENG_CP2_BACKUP_${timestamp}.zip.enc"
          keyfile="ERP_ENTENG_CP2_RECOVERY_KEY_${timestamp}.txt"
          umask 077
          openssl rand -base64 48 > recovery-passphrase.tmp
          {
            echo 'ERP Enteng Checkpoint 2 recovery key'
            echo "Created UTC: ${timestamp}"
            echo 'Cipher: AES-256-CBC, PBKDF2-HMAC-SHA256, 600000 iterations'
            echo 'Store this file separately from the encrypted backup.'
            echo
            cat recovery-passphrase.tmp
          } > "$keyfile"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -md sha256 \
            -pass file:recovery-passphrase.tmp \
            -in erp-enteng-cp2-raw.zip \
            -out "$encrypted"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 \
            -pass file:recovery-passphrase.tmp \
            -in "$encrypted" \
            -out restore-selftest.zip
          cmp --silent erp-enteng-cp2-raw.zip restore-selftest.zip
          unzip -tq restore-selftest.zip
          sha256sum "$encrypted" > ENCRYPTED_SHA256SUMS.txt
          sha256sum "$keyfile" > RECOVERY_KEY_FILE_SHA256.txt
          printf '%s\n' "$encrypted" > encrypted-file-name.txt
          printf '%s\n' "$keyfile" > key-file-name.txt
          rm -f restore-selftest.zip recovery-passphrase.tmp
          shred -u erp-enteng-cp2-raw.zip || rm -f erp-enteng-cp2-raw.zip

      - name: Upload encrypted backup only
        uses: actions/upload-artifact@v4
        with:
          name: cp2-encrypted-backup
          path: |
            ERP_ENTENG_CP2_BACKUP_*.zip.enc
            ENCRYPTED_SHA256SUMS.txt
            cp2-export-validation.json
            raw.sha256
          if-no-files-found: error
          retention-days: 3

      - name: Upload recovery key separately
        uses: actions/upload-artifact@v4
        with:
          name: cp2-recovery-key-separate
          path: |
            ERP_ENTENG_CP2_RECOVERY_KEY_*.txt
            RECOVERY_KEY_FILE_SHA256.txt
          if-no-files-found: error
          retention-days: 1
