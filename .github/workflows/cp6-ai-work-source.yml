name: CP6 AI Work Source Family
'on':
  push:
    branches:
    - competition/cp6-j-closure-20260911
    paths:
    - .github/workflows/cp6-ai-work-source.yml
    - scripts/cp6_v2620ai_*.py
    - scripts/cp6_ai_gate_scope.py
    - scripts/cp6_ah_independent_review.py
    - scripts/cp6_preuse_rollback_maintenance.py
    - docs/cp6-ai-competition-handoff.md
    - docs/evidence/cp6-ai-*.json
    - supabase/migrations/*_erp_v2_6_20ai_*.sql
    - supabase/rollbacks/*_erp_v2_6_20ai_*.sql
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: cp6-ai-work-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # BEGIN AJ QUALIFIED ROUTE
  review-scope:
    runs-on: ubuntu-24.04
    outputs:
      aj: ${{ steps.scope.outputs.aj }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - id: scope
      shell: bash
      run: |
        if python scripts/cp6_disposable_ui_scope.py; then
          echo 'aj=true' >> "$GITHUB_OUTPUT"
        else
          echo 'aj=false' >> "$GITHUB_OUTPUT"
        fi
  # END AJ QUALIFIED ROUTE
  review:
    needs: review-scope
    if: needs.review-scope.outputs.aj != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CP6_AC_INDEPENDENT_CONFIRM: postgres
      CP6_AF_INDEPENDENT_CONFIRM: postgres
      CP6_AF_HARNESS_HEAD: ${{ github.sha }}
      CP6_AUDIT_HARNESS_HEAD: ${{ github.sha }}
      CP6_DATABASE_CONTAINER: supabase_db_cp5-local
      CP6_MAINTENANCE_PGURL: postgresql://postgres:postgres@127.0.0.1:54322/template1
      CP6_ROLLBACK_RACE_PGURL: postgresql://postgres:postgres@127.0.0.1:54322/cp6_rollback
      CP6_MAINTENANCE_CONFIRM_DATABASE: postgres
      CP6_MAINTENANCE_ALLOW_SYSTEM_DATABASE: postgres
      CP6_AH_CONFIRM: postgres
      CP6_AI_CONFIRM: postgres
      CP6_AH_INDEPENDENT_CONFIRM: postgres
    steps:
    - name: Checkout exact AI candidate
      uses: actions/checkout@v4
      with:
        path: candidate
        fetch-depth: 0
    - name: Checkout immutable original AH
      uses: actions/checkout@v4
      with:
        path: original
        fetch-depth: 0
        ref: 965ceac45ef15ddc19c178d87a3606adffcf53a6
    - name: Checkout immutable AC runtime source
      uses: actions/checkout@v4
      with:
        path: base
        ref: 1bdca3766f7c9800d68295ff5122798060b8a05d
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned disposable runtime
      shell: bash
      run: "set -euo pipefail\npython -m pip install --quiet 'psycopg[binary]==3.2.10' 'PyYAML==6.0.2'\nsudo apt-get\
        \ update -qq\nsudo apt-get install -y -qq ca-certificates curl gnupg\nsudo install -d /usr/share/postgresql-common/pgdg\n\
        sudo curl --fail --silent --show-error \\\n  -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\
        \ \\\n  https://www.postgresql.org/media/keys/ACCC4CF8.asc\nkey_fingerprint=\"$(gpg --show-keys --with-colons\
        \ \\\n  /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \\\n  | awk -F: '$1 == \"fpr\" { print\
        \ $10; exit }')\"\ntest \"$key_fingerprint\" = 'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'\n. /etc/os-release\n\
        architecture=\"$(dpkg --print-architecture)\"\nsudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null\
        \ <<EOF\nTypes: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: ${VERSION_CODENAME}-pgdg\n\
        Architectures: ${architecture}\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n\
        EOF\nsudo apt-get update -qq\nsudo apt-get install -y -qq postgresql-client-17\ntest -x /usr/lib/postgresql/17/bin/psql\n\
        echo '/usr/lib/postgresql/17/bin' >> \"$GITHUB_PATH\"\n"
    - name: Install pinned Supabase CLI
      uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
      with:
        version: 2.116.0
    - name: Verify pinned whole-family scope
      working-directory: candidate
      run: python scripts/cp6_ai_gate_scope.py
    - name: Start disposable database
      working-directory: base
      shell: bash
      run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = 1bdca3766f7c9800d68295ff5122798060b8a05d\ntest \"\
        $(git rev-parse HEAD^{tree})\" = 334629c626257b8b713826f491cdf62385d5299b\ntest -z \"$(git status --porcelain)\"\
        \nmkdir cp5-local\nsupabase init --force --workdir cp5-local\nmkdir -p cp5-local/supabase/.temp\necho '17.6.1.165'\
        \ > cp5-local/supabase/.temp/postgres-version\nsed -i '0,/^enable_signup = true$/s//enable_signup = false/'\
        \ cp5-local/supabase/config.toml\nsupabase start --workdir cp5-local \\\n  -x realtime,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor\n"
    - name: Verify exact incoming AF writer proof
      working-directory: candidate
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\nmkdir -p cp6-proof/independent-af cp6-proof/writer-ae cp6-proof/writer-af\ngh api\
        \ repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10429202482/zip > \"$RUNNER_TEMP/af-writer.zip\"\n\
        python - <<'PYVERIFY'\nfrom pathlib import Path\nimport os,hashlib,zipfile,json\np=Path(os.environ['RUNNER_TEMP'])/'af-writer.zip'\n\
        assert p.stat().st_size==45580397\nassert hashlib.sha256(p.read_bytes()).hexdigest()=='f35be1721e99df6ce2c03662b1ae6856f38e9886dcfc8fe5165ba12e2737696c'\n\
        with zipfile.ZipFile(p) as z:\n assert z.testzip() is None\n for phase,count in {'admission':7,'focused':30,'detector':11,'crossflow':134}.items():\n\
        \  r=json.loads(z.read('candidate/cp6-proof/writer-af/'+phase+'.json'))\n  assert r['head']=='f46699865501b03f9fba3a8b188f3fd01eedf404'\
        \ and r['status']=='PASS' and r['passed']==count and r['failed']==0\n r=json.loads(z.read('candidate/cp6-proof/AF_MAINTENANCE_ROLLBACK/manifest.json'))\n\
        \ assert r['status']=='PASS' and r['completed_case_count']==20\nPath('cp6-proof/independent-af/INCOMING_WRITER.json').write_text(json.dumps({'status':'REUSED_VERIFIED_AF_NATIVE10','artifact_id':10429202482,'artifact_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'historical_matrix_reexecuted':False,'production_go':False},indent=2)+'\\\
        n')\nPYVERIFY\n"
    - name: Restore exact AC runtime
      working-directory: base
      env:
        GITHUB_SHA: 1bdca3766f7c9800d68295ff5122798060b8a05d
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\nexport CP6_AC_WRITER_ARTIFACT=\"$RUNNER_TEMP/ac-native200.zip\"\ngh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10392910720/zip\
        \ \\\n  > \"$CP6_AC_WRITER_ARTIFACT\"\nPYTHONPATH=scripts python ../candidate/scripts/cp6_ac_audit_bootstrap.py\n"
    - name: Apply exact AD predecessor
      working-directory: candidate
      shell: bash
      run: "set -euo pipefail\nmkdir -p cp6-proof/writer-ae\npsql \"$PGURL\" -X -v ON_ERROR_STOP=1 \\\n  -f supabase/migrations/20260915113627_erp_v2_6_20ad_cp6_opening_material_business_day.sql\
        \ \\\n  > cp6-proof/writer-ae/AD_APPLY.log 2>&1\nPYTHONPATH=scripts python - <<'PY'\nimport os\nimport psycopg\n\
        import cp6_v2620ad_runtime as runtime\nwith psycopg.connect(os.environ['PGURL']) as connection, connection.cursor()\
        \ as cur:\n    cur.execute(\n        'insert into supabase_migrations.schema_migrations(version,name,statements)\
        \ '\n        'values(%s,%s,%s)',\n        (runtime.STAMP, runtime.NAME, [runtime.MIGRATION.read_text()]),\n\
        \    )\n    assert len(runtime.verified_successor(cur)) == 274\nPY\n"
    - name: Apply exact AE comparison runtime
      working-directory: candidate
      shell: bash
      run: "set -euo pipefail\npsql \"$PGURL\" -X -v ON_ERROR_STOP=1 \\\n  -f supabase/migrations/20260915201500_erp_v2_6_20ae_cp6_opening_roll_integrity.sql\
        \ \\\n  > cp6-proof/writer-ae/AE_APPLY.log 2>&1\nPYTHONPATH=scripts python - <<'PY'\nimport os\nimport psycopg\n\
        import cp6_v2620ae_runtime as runtime\nwith psycopg.connect(os.environ['PGURL']) as connection, connection.cursor()\
        \ as cur:\n    cur.execute(\n        'insert into supabase_migrations.schema_migrations(version,name,statements)\
        \ '\n        'values(%s,%s,%s)',\n        (runtime.STAMP, runtime.NAME, [runtime.MIGRATION.read_text()]),\n\
        \    )\n    assert len(runtime.verified_successor(cur)) == 276\nPY\n"
    - name: Install AF and bind exact 278-object runtime
      working-directory: candidate
      shell: bash
      run: "set -euo pipefail\npsql \"$PGURL\" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260916014332_erp_v2_6_20af_cp6_posted_child_integrity.sql\
        \ > cp6-proof/writer-af/AF_APPLY.log 2>&1\nPYTHONPATH=scripts python - <<'PYINSTALL'\nimport os,psycopg\n\
        import cp6_v2620af_runtime as r\nwith psycopg.connect(os.environ['PGURL']) as conn,conn.cursor() as cur:\n\
        \ cur.execute('insert into supabase_migrations.schema_migrations(version,name,statements) values(%s,%s,%s)',(r.STAMP,r.NAME,[r.MIGRATION.read_text()]))\n\
        \ assert len(r.verified_successor(cur))==278\nPYINSTALL\n"
    - name: Verify exact AG writer and original return counterexample artifacts
      working-directory: candidate
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\nmkdir -p cp6-proof/writer-ah\n# Evidence is read and hashed, never executed as SQL.\n\
        gh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10432153459/zip > \"$RUNNER_TEMP/ag-writer.zip\"\
        \ngh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10434213550/zip > cp6-proof/writer-ah/AG_ORIGINAL_RETURN_COUNTEREXAMPLE.zip\n\
        python - <<'PYVERIFY'\nfrom pathlib import Path\nimport os,hashlib,zipfile,json\np=Path(os.environ['RUNNER_TEMP'])/'ag-writer.zip'\n\
        assert p.stat().st_size==44481450\nassert hashlib.sha256(p.read_bytes()).hexdigest()=='c7292683dcb0729b9634f1736f1dc42d2ed56b32af6a209b569b001a20e0b469'\n\
        with zipfile.ZipFile(p) as z:\n assert z.testzip() is None\n for phase,count in {'admission':10,'focused':51,'detector':23,'crossflow':142}.items():\n\
        \  r=json.loads(z.read('candidate/cp6-proof/writer-ag/'+phase+'.json'))\n  assert r['head']=='119f8f133131eaf373f08cc45b7b3d6fc27a3d3e'\
        \ and r['status']=='PASS' and r['passed']==count and r['failed']==0\n r=json.loads(z.read('candidate/cp6-proof/AG_MAINTENANCE_ROLLBACK/manifest.json'))\n\
        \ assert r['status']=='PASS' and r['completed_case_count']==20\np=Path('cp6-proof/writer-ah/AG_ORIGINAL_RETURN_COUNTEREXAMPLE.zip')\n\
        assert p.stat().st_size==44431\nassert hashlib.sha256(p.read_bytes()).hexdigest()=='2b5e604bcf42fc6185f4de50ed8be5bb6a403ec93661028e6b4ef24df39e48c3'\n\
        with zipfile.ZipFile(p) as z:\n assert z.testzip() is None\n r=json.loads(z.read('candidate/cp6-proof/ag-residual/RESULT.json'))\n\
        \ assert r['candidate_head']=='119f8f133131eaf373f08cc45b7b3d6fc27a3d3e'\n assert r['status']=='QUALIFIED_COUNTEREXAMPLE'\
        \ and (r['controls'],r['counterexamples'],r['incomplete'])==(15,6,0)\n assert r['source_sha256']==hashlib.sha256(Path('scripts/cp6_ag_residual_review.py').read_bytes()).hexdigest()\n\
        Path('cp6-proof/writer-ah/INCOMING_AG.json').write_text(json.dumps(dict(status='VERIFIED',writer_run=35060285362,counterexample_run=35066611261,historical_500_matrix_reexecuted=False,independent_ag_acceptance=False,production_go=False),indent=2)+'\\\
        n')\nPYVERIFY"
    - name: Install unchanged AG predecessor and verify 690 objects
      working-directory: candidate
      run: "set -euo pipefail\npsql \"$PGURL\" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260916050822_erp_v2_6_20ag_cp6_sale_reservation_lineage.sql\
        \ > cp6-proof/writer-ah/AG_APPLY.log 2>&1\nPYTHONPATH=scripts python - <<'PYINSTALL'\nimport os,psycopg\n\
        import cp6_v2620ag_runtime as r\nwith psycopg.connect(os.environ['PGURL']) as conn,conn.cursor() as cur:\n\
        \ cur.execute('insert into supabase_migrations.schema_migrations(version,name,statements) values(%s,%s,%s)',(r.STAMP,r.NAME,[r.MIGRATION.read_text()]))\n\
        \ assert len(r.verified_successor(cur))==690\nPYINSTALL"
    - name: Provision isolated rollback authority
      working-directory: candidate
      shell: bash
      run: "set -euo pipefail\nmaintenance_password=\"$(openssl rand -hex 32)\"\nmaintenance_pgurl=\"postgresql://cp6_maintenance_admission:${maintenance_password}@127.0.0.1:54322/template1\"\
        \necho \"::add-mask::$maintenance_password\"\necho \"::add-mask::$maintenance_pgurl\"\ndocker exec -i \"\
        $CP6_DATABASE_CONTAINER\" \\\n  psql -U supabase_admin -d template1 -X -v ON_ERROR_STOP=1 \\\n    -v cp6_password=\"\
        $maintenance_password\" <<'SQL'\ncreate role cp6_maintenance_admission\n  login superuser noinherit nocreatedb\
        \ nocreaterole noreplication\n  connection limit 4 password :'cp6_password';\nSQL\nprintf 'CP6_ADMISSION_CONTROL_PGURL=%s\\\
        n' \"$maintenance_pgurl\" >> \"$GITHUB_ENV\"\n"
    - name: Install AH and verify all 533 functions and 157 relation objects
      working-directory: candidate
      run: "set -euo pipefail\npsql \"$PGURL\" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260916070451_erp_v2_6_20ah_cp6_return_allocation_eligibility.sql\
        \ > cp6-proof/writer-ah/AH_APPLY.log 2>&1\nPYTHONPATH=scripts python - <<'PYINSTALL'\nimport os,json,psycopg\n\
        from pathlib import Path\nimport cp6_v2620ah_runtime as r\nwith psycopg.connect(os.environ['PGURL']) as\
        \ conn,conn.cursor() as cur:\n cur.execute('insert into supabase_migrations.schema_migrations(version,name,statements)\
        \ values(%s,%s,%s)',(r.STAMP,r.NAME,[r.MIGRATION.read_text()]))\n objects=r.verified_successor(cur);assert\
        \ len(objects)==690\n Path('cp6-proof/writer-ah/AH_INSTALLED_RUNTIME.json').write_text(json.dumps({'status':'PASS','head':os.environ['GITHUB_SHA'],'objects':objects,'production_go':False},indent=2)+'\\\
        n')\nPYINSTALL\n"
    - name: Verify original AH writer and initial independent evidence
      working-directory: candidate
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\nmkdir -p cp6-proof/writer-ai\ngh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10436024116/zip\
        \ > \"$RUNNER_TEMP/ai-ah-writer.zip\"\ngh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10438516795/zip\
        \ > \"$RUNNER_TEMP/ai-ah-independent.zip\"\npython - <<'PYVERIFY'\nfrom pathlib import Path\nimport os,hashlib,zipfile,json\n\
        root=Path('cp6-proof/writer-ai');p=Path(os.environ['RUNNER_TEMP'])/'ai-ah-writer.zip'\nassert hashlib.sha256(p.read_bytes()).hexdigest()=='3f05dead84a0e7bb67a69230c94e9677e3728152ca1f01cddbf8aa355f3195d6'\n\
        with zipfile.ZipFile(p) as z:\n assert z.testzip() is None\n for phase,n in [('focused',82),('detector',31),('crossflow',142),('admission',9)]:\n\
        \  d=json.loads(z.read('candidate/cp6-proof/writer-ah/'+phase+'.json'))\n  assert d['status']=='PASS' and\
        \ d['passed']==n and d['failed']==0 and d['head']=='965ceac45ef15ddc19c178d87a3606adffcf53a6' and d['tree']=='183a0c2af8ba201e3754e9db77fe47501c196f4d'\n\
        p=Path(os.environ['RUNNER_TEMP'])/'ai-ah-independent.zip'\nassert hashlib.sha256(p.read_bytes()).hexdigest()=='3a020902f2e03798b698eb6729358ef9d875474d1a6b72b29ba76668ef887a1a'\n\
        with zipfile.ZipFile(p) as z:\n assert z.testzip() is None\n d=json.loads(z.read('candidate/cp6-proof/independent-ah/RESULT.json'))\n\
        \ assert (d['controls'],d['bugs'],d['incomplete'])==(5,1,6)\n assert d['candidate_head']=='965ceac45ef15ddc19c178d87a3606adffcf53a6'\n\
        \ assert d['cases']['WORK_HEADER_PO']['status']=='BUG_PROVEN'\n (root/'AH_FIRST_INDEPENDENT_RESULT.json').write_text(json.dumps(d,indent=2)+'\\\
        n')\n(root/'INCOMING_AH.json').write_text(json.dumps(dict(status='VERIFIED',original_writer_run=35070855729,original_independent_run=35076310148,first_fixture_failures_preserved=True,production_go=False))+'\\\
        n')\nPYVERIFY\n"
    - name: Finish original AH checks with valid two-allocation fixtures
      working-directory: original
      run: 'PYTHONPATH=scripts python - <<''PYPROOF''

        import subprocess,json

        from pathlib import Path

        r=subprocess.run([''python'',''../candidate/scripts/cp6_ah_independent_review.py''])

        d=json.loads(Path(''cp6-proof/independent-ah/RESULT.json'').read_text())

        assert r.returncode==1 and d[''status'']==''BUG_PROVEN'' and (d[''controls''],d[''bugs''],d[''incomplete''])==(11,1,0),d

        assert d[''function_catalog_unchanged''] and d[''unseeded_boundary_restored''] and d[''schema_usage_restored'']

        assert d[''candidate_head'']==''965ceac45ef15ddc19c178d87a3606adffcf53a6''

        PYPROOF

        '
    - name: Verify AI admission and exact AH restoration boundary
      working-directory: candidate
      run: PYTHONPATH=scripts python scripts/cp6_v2620ai_family.py --phase admission
    - name: Install AI and bind the full original catalog
      working-directory: candidate
      run: "set -euo pipefail\npsql \"$PGURL\" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260916090022_erp_v2_6_20ai_cp6_work_source_lineage.sql\
        \ > cp6-proof/writer-ai/AI_APPLY.log 2>&1\nPYTHONPATH=scripts python - <<'PYINSTALL'\nimport os,json,psycopg\n\
        from pathlib import Path\nimport cp6_v2620ai_runtime as r\nwith psycopg.connect(os.environ['PGURL']) as\
        \ conn,conn.cursor() as cur:\n cur.execute('insert into supabase_migrations.schema_migrations(version,name,statements)\
        \ values(%s,%s,%s)',(r.STAMP,r.NAME,[r.MIGRATION.read_text()]))\n objects=r.verified_successor(cur);assert\
        \ len(objects)==690\n Path('cp6-proof/writer-ai/AI_INSTALLED_RUNTIME.json').write_text(json.dumps(dict(status='PASS',head=os.environ['GITHUB_SHA'],objects=objects,production_go=False),indent=2)+'\\\
        n')\nPYINSTALL\n"
    - name: Run 99 focused and 36 report controls before combined gate
      working-directory: candidate
      run: "status=0\nfor phase in focused detector; do\n  PYTHONPATH=scripts python scripts/cp6_v2620ai_family.py\
        \ --phase \"$phase\" || status=1\ndone\nexit \"$status\"\n"
    - name: Run 142 unchanged combined business expectations
      working-directory: candidate
      run: PYTHONPATH=scripts python scripts/cp6_v2620ai_family.py --phase crossflow
    - name: Run 16 actual work and return two-session schedules
      working-directory: candidate
      run: PYTHONPATH=scripts python scripts/cp6_v2620ai_concurrency.py
    - name: Run 20 AI maintenance schedules
      working-directory: candidate
      env:
        CP6_AI_MAINTENANCE_CONFIRM: cp6_rollback
        CP6_MAINTENANCE_CONFIRM_DATABASE: cp6_rollback
      run: PYTHONPATH=scripts python scripts/cp6_v2620ai_maintenance_schedules.py
    - name: Verify 8 rollback refusals and exact AH restore
      working-directory: candidate
      run: PYTHONPATH=scripts python scripts/cp6_v2620ai_rollback_guards.py
    - name: Stop disposable database and prove removal
      if: always()
      working-directory: base
      shell: bash
      run: "set -euo pipefail\nif test -f cp5-local/supabase/config.toml; then\n  supabase stop --workdir cp5-local\
        \ --no-backup\nfi\nremaining=\"$(docker ps -aq --filter name='^/supabase_db_cp5-local$')\"\ntest -z \"$remaining\"\
        \nmkdir -p ../candidate/cp6-proof/writer-ai\nprintf 'status=PASS\\nremaining_database_container=0\\nproduction_go=false\\\
        n' > ../candidate/cp6-proof/writer-ai/PHYSICAL_CLEANUP.txt\n"
    - name: Preserve AI qualification and original AH observations
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cp6-ai-work-source-family
        path: 'candidate/cp6-proof/writer-ai

          candidate/cp6-proof/AI_MAINTENANCE_ROLLBACK

          original/cp6-proof/independent-ah

          base/cp6-proof/AC_AUDIT_RUNTIME_BOOTSTRAP.json'
        if-no-files-found: error
        compression-level: 9
        retention-days: 30
