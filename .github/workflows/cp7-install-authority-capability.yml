name: CP7 A isolated Supabase17 installation capabilities only
'on':
  push:
    branches: [astra-a/install-authority-capability-20261102]
    paths:
      - .github/workflows/cp7-install-authority-capability.yml
      - scripts/current-install-authority-capability/**
permissions:
  contents: read
  packages: read
concurrency:
  group: cp7-install-authority-capability-20261102
  cancel-in-progress: false
jobs:
  capability:
    if: github.ref == 'refs/heads/astra-a/install-authority-capability-20261102'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AFUI_CONFIRM: cp6_rollback
      CAPABILITY_CONFIRM: cp7_install_authority_only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
      - name: Check every sealed capability input before any database operation
        run: |
          mkdir -p cp7-proof
          python -B scripts/current-install-authority-capability/probe.py --check > cp7-proof/SOURCE_IDENTITY.json
          python -m pip install --quiet 'psycopg[binary]==3.2.10'
      - name: Start only the existing exact Supabase17 disposable profile
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          mkdir cp5-local
          supabase init --force --workdir cp5-local
          mkdir -p cp5-local/supabase/.temp
          echo '17.6.1.165' > cp5-local/supabase/.temp/postgres-version
          sed -i '0,/^enable_signup = true$/s//enable_signup = false/' cp5-local/supabase/config.toml
          python -u -B scripts/current-install-authority-capability/probe.py --start
          docker inspect supabase_db_cp5-local --format '{{json .Config.Image}}' > cp7-proof/ACTUAL_SUPABASE_POSTGRES_IMAGE.json
      - name: Provision only isolated local maintenance authority
        run: |
          set -euo pipefail
          maintenance_password="$(openssl rand -hex 32)"
          maintenance_pgurl="postgresql://cp6_maintenance_admission:${maintenance_password}@127.0.0.1:54322/template1"
          echo "::add-mask::$maintenance_password"
          echo "::add-mask::$maintenance_pgurl"
          docker exec -i supabase_db_cp5-local psql -U supabase_admin -d template1 -X -v ON_ERROR_STOP=1 -v cp6_password="$maintenance_password" <<'SQL'
          create role cp6_maintenance_admission login superuser noinherit
            nocreatedb nocreaterole noreplication connection limit 4 password :'cp6_password';
          SQL
          printf 'CP6_ADMISSION_CONTROL_PGURL=%s\n' "$maintenance_pgurl" >> "$GITHUB_ENV"
      - name: Run only remaining Afui17 capability; retain Mandor pass and catalog refusal
        run: python -u -B scripts/current-install-authority-capability/probe.py --run
      - name: Stop disposable containers and retain its log
        if: always()
        run: supabase stop --workdir cp5-local --no-backup > cp7-proof/STOP.log 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cp7-install-authority-capabilities-${{ github.sha }}
          path: |
            cp7-proof/
            cp6-proof/t3/AFUI_FUNCTION_ACL_CAPABILITY.json
          retention-days: 30
