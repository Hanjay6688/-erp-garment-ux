name: CP3 R4 Service Role Harness Hotfix

on:
  push:
    branches:
      - ops/cp3-r4-lock-order-hotfix-20260901
    paths:
      - .github/workflows/cp3-r4-lock-order-hotfix.yml

permissions:
  contents: write

jobs:
  patch-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_BRANCH: cp3/hpp-attendance-sewing-terminal-r4-20260901
      EXPECTED_HEAD: 7c8d92b1455e33188302be3e18b1d7227877818e
      OLD1_B64: 
      NEW1_B64: 
      OLD2_B64: 
      NEW2_B64: ICAgIHVucHJvdGVjdGVkX3JldmVyc2FsID0gb25lKAogICAgICAgICdzZWxlY3QgZXJwLnJldmVyc2Vfam91cm5hbCglczo6dXVpZCwlcyknLAogICAgICAgIChzdHIodW5wcm90ZWN0ZWRfaWQpLCAnQ1AzIFI0IHVucHJvdGVjdGVkIGNvbXBhdGliaWxpdHknKSwKICAgICkK
      OLD3_B64: ICAgICAgICAnZGlyZWN0X3NlcnZpY2Vfcm9sZV9yZWplY3Rpb25zJzogcmVqZWN0ZWQsCg==
      NEW3_B64: ICAgICAgICAnc2VydmljZV9yb2xlX3B1YmxpY19kZW5pYWxzJzogcmVqZWN0ZWQsCg==
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cp3/hpp-attendance-sewing-terminal-r4-20260901
          fetch-depth: 0

      - name: Patch exact harness and refresh frozen digest
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, os, py_compile
          script = Path('scripts/cp3_r4_full_schema_concurrency.py')
          manifest_path = Path('docs/evidence/cp3_r4_source_hashes.json')
          text = script.read_text(encoding='utf-8')
          for index in (1, 2, 3):
              old = base64.b64decode(os.environ[f'OLD{index}_B64']).decode()
              new = base64.b64decode(os.environ[f'NEW{index}_B64']).decode()
              if text.count(old) != 1:
                  raise SystemExit(f'expected one harness anchor {index}, found {text.count(old)}')
              text = text.replace(old, new, 1)
          script.write_text(text, encoding='utf-8')
          py_compile.compile(str(script), doraise=True)
          raw = script.read_bytes()
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          entry = manifest['files'][str(script)]
          entry.update(bytes=len(raw), sha256=hashlib.sha256(raw).hexdigest())
          manifest['last_security_harness_alignment'] = {
              'scope': 'harness-only; runtime source unchanged',
              'observed_boundary': 'service_role lacks USAGE on private erp schema before CP4 grants',
              'expected_result': 'public RPC denied and protected journals unchanged; owner lifecycle still proven',
              'source_head': os.environ['EXPECTED_HEAD']
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(entry, sort_keys=True))
          PY
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check

      - name: Commit and push exact target fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/cp3_r4_full_schema_concurrency.py docs/evidence/cp3_r4_source_hashes.json
          git commit -m 'test(cp3): align service-role harness with pre-CP4 schema boundary'
          git push origin HEAD:"$TARGET_BRANCH"
