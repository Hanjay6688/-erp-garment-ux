name: CP3 R4 Lock Order Hotfix

on:
  push:
    branches:
      - ops/cp3-r4-lock-order-hotfix-20260901
    paths:
      - .github/workflows/cp3-r4-lock-order-hotfix.yml

permissions:
  contents: write

jobs:
  patch-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_BRANCH: cp3/hpp-attendance-sewing-terminal-r4-20260901
      EXPECTED_HEAD: 7173fcda2c13788be4bf4d3481f8c115a0b3d961
      MARKER_B64: LS0gMi4gUG9saWN5IGNoYW5nZSBhZnRlciBBQ1RJVkUgcG9vbDogbG9jayBpcyBhbHJlYWR5IGhlbGQgYnkgdGhlIFIzIHNldHRlcjsKLS0gY2hlY2sgdGhlIGV4YWN0IG5ldyBlZmZlY3RpdmUgc2xpY2UgYWZ0ZXIgbmV4dC12ZXJzaW9uIGJvdW5kYXJ5IGlzIGtub3duLgo=
      PATCH_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cp3/hpp-attendance-sewing-terminal-r4-20260901
          fetch-depth: 0

      - name: Patch exact target and refresh frozen migration digest
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, os
          migration = Path('supabase/migrations/20260901023400_erp_v2_6_14d_cp3_r4_race_and_reversal_hardening.sql')
          manifest_path = Path('docs/evidence/cp3_r4_source_hashes.json')
          text = migration.read_text(encoding='utf-8')
          marker = base64.b64decode(os.environ['MARKER_B64']).decode()
          patch = base64.b64decode(os.environ['PATCH_B64']).decode()
          if text.count(marker) != 1:
              raise SystemExit(f'expected one lock-order marker, found {text.count(marker)}')
          migration.write_text(text.replace(marker, patch, 1), encoding='utf-8')
          raw = migration.read_bytes()
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          entry = manifest['files'][str(migration)]
          entry.update(bytes=len(raw), sha256=hashlib.sha256(raw).hexdigest())
          manifest['last_lock_order_hardening'] = {
              'scope': 'runtime source and real two-session race safety',
              'root_cause': 'policy setter held contractor row before shared advisory while activation held advisory before FK key-share',
              'fix': 'contractor advisory before contractor row lock',
              'source_head': os.environ['EXPECTED_HEAD']
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(entry, sort_keys=True))
          PY
          git diff --check
          grep -F 'Policy mutation must take the contractor advisory lock before' supabase/migrations/20260901023400_erp_v2_6_14d_cp3_r4_race_and_reversal_hardening.sql >/dev/null

      - name: Commit and push clean target fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_HEAD"
          git config user.name 'Hanjay6688'
          git config user.email 'jktr9n2g88@privaterelay.appleid.com'
          git add supabase/migrations/20260901023400_erp_v2_6_14d_cp3_r4_race_and_reversal_hardening.sql docs/evidence/cp3_r4_source_hashes.json
          git commit -m 'fix(cp3): enforce contractor advisory-before-row lock order'
          git push origin HEAD:"$TARGET_BRANCH"
