name: CP7 P19 UTF8 Receiver Original Retention
'on':
  push:
    branches:
      - cp7/integration
    paths:
      - docs/cp7/p19/native152_utf8_receiver_projection.json
      - .github/workflows/cp7-p19-utf8-originals.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cp7-p19-utf8-originals-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  retain:
    name: Read exact source0bd Originals / zero ERP execution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify existing projection and complete Original validators
        run: |
          python scripts/cp7_native_artifact_projection_test.py
          python scripts/cp7_verify_retained_originals_test.py
      - name: Retain pinned archive without database or product execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/cp7_native_artifact_projection.py docs/cp7/p19/native152_utf8_receiver_projection.json cp7-proof/analysis152-0bd
          python scripts/cp7_verify_retained_originals.py cp7-proof/analysis152-0bd --manifest docs/cp7/p19/native152_utf8_receiver_projection.json --projection-head "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cp7-p19-utf8-analysis152-originals
          path: cp7-proof/analysis152-0bd
          if-no-files-found: error
          retention-days: 90
