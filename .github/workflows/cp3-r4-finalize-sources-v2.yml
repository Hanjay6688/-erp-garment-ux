name: CP3 R4 Finalize Sources V2

on:
  push:
    branches:
      - cp3/hpp-attendance-sewing-terminal-r4-20260901
    paths:
      - scripts/cp3_r4_finalize_sources_v2.py
      - .github/workflows/cp3-r4-finalize-sources-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cp3/hpp-attendance-sewing-terminal-r4-20260901
          fetch-depth: 0
      - name: Generate and statically prove exact R4 source boundary
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cp3_r4_finalize_sources_v2.py
          python -m py_compile \
            scripts/cp3_r4_full_schema_concurrency.py \
            scripts/cp3_render_r4_reviewed_rollback.py \
            scripts/test_cp3_render_r4_reviewed_rollback.py
          python scripts/test_cp3_render_r4_reviewed_rollback.py
          git diff --check
      - name: Remove one-time transports and commit complete R4 source boundary
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/cp3_r4_finalize_sources.py scripts/cp3_r4_finalize_sources_v2.py
          rm -f .github/workflows/cp3-r4-finalize-sources.yml .github/workflows/cp3-r4-finalize-sources-v2.yml
          rm -f .github/workflows/cp3-r4-source-export.yml
          git config user.name 'Hanjay6688'
          git config user.email 'jktr9n2g88@privaterelay.appleid.com'
          git add -A
          git diff --cached --check
          git commit -m 'test(cp3): finalize R4 full-schema proof boundary'
          git push origin HEAD:cp3/hpp-attendance-sewing-terminal-r4-20260901
