name: CP3 R4 Extract Failure

on:
  push:
    branches:
      - cp3/hpp-attendance-sewing-terminal-r4-20260901
    paths:
      - '.github/workflows/cp3-r4-extract-failure.yml'

permissions:
  actions: read
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cp3-r4-full-schema-proof
          path: proof
          github-token: ${{ github.token }}
          run-id: 33523757519
          repository: Hanjay6688/-erp-garment-ux
      - name: Print exact two-connection race failure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          candidates = [
              *Path('proof').rglob('r4-race-seed.log'),
              *Path('proof').rglob('r4-concurrency.log'),
              *Path('proof').rglob('cp3-r4-concurrency-report.json'),
          ]
          if not candidates:
              raise SystemExit('race proof files not found')

          for path in candidates:
              print(f'===== {path} =====')
              lines = path.read_text(errors='replace').splitlines()
              hits = [
                  i for i, line in enumerate(lines)
                  if any(token in line.lower() for token in (
                      'error:', 'traceback', 'assertionerror', 'failed', 'failure', 'exception', 'deadlock', 'timeout'
                  ))
              ]
              if not hits:
                  start = max(0, len(lines) - 160)
                  for i in range(start, len(lines)):
                      print(f'{i+1}: {lines[i]}')
                  continue
              shown = set()
              for hit in hits:
                  for i in range(max(0, hit - 15), min(len(lines), hit + 30)):
                      if i not in shown:
                          print(f'{i+1}: {lines[i]}')
                          shown.add(i)
          PY
