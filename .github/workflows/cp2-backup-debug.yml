name: CP2 Backup Export Debug

on:
  push:
    branches:
      - evidence/checkpoints-1-2-20260901
    paths:
      - .github/workflows/cp2-backup-debug.yml

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://siimvrusnzxexizpyoib.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpaW12cnVzbnp4ZXhpenB5b2liIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MzQzMDQsImV4cCI6MjEwMzMxMDMwNH0.i8nOoczTEPuokNnbO9-gTlWPP1qZX1ge5gUh56i_gOw
      CP2_TOKEN: Fhrigm8icK2GZMeRx58L0PSJAX106mZ_jafFqJReBxbsVM0o7RGFHg
    steps:
      - name: Capture exporter response
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --request POST \
            "$SUPABASE_URL/functions/v1/cp2-backup-export-20260901" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "x-cp2-token: $CP2_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            --output response.bin \
            --write-out '%{http_code}')"
          echo "HTTP status: $status"
          if [[ "$status" != "200" ]]; then
            python - <<'PY'
          from pathlib import Path
          body = Path('response.bin').read_bytes()
          print(body[:4096].decode('utf-8', errors='replace'))
          PY
            exit 1
          fi
          echo 'Exporter returned HTTP 200.'
