name: Sol K4 revision unchanged independent kernel
'on':
  push:
    branches: [audit/sol-k4-retest-8116800c-20261010]
    paths: [.github/workflows/sol-k4-retest-kernel.yml]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  kernel:
    name: ${{ matrix.probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        probe: [cold-runner]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Native disposable PostgreSQL and driver
        run: |
          if ! test -x /usr/lib/postgresql/16/bin/initdb; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-16
          fi
          python -m pip install 'psycopg[binary]==3.2.10'
      - name: Independently declared cases and strict oracle
        run: |
          test "$(sha256sum scripts/cp7-src/planning/analysis-stages.sql | cut -d' ' -f1)" = 325962068ec3ee9218b4b2aa76aec230fc79ba88844bf692be4704a89b84c8f6
          test "$(sha256sum audit/sol_p20_k4/cold_runner.py | cut -d' ' -f1)" = a38864a9c6f68db6c84b853654a8d7b896a8b347edc213d57140d2cf3c232ab4
          python audit/sol_p20_k4/cold_runner.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sol-k4-retest-${{ matrix.probe }}
          path: test-results/sol-p20-k4/*.json
          if-no-files-found: error
          retention-days: 30
