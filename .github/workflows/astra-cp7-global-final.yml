name: Astra CP1-CP7 independent reminder retest
on:
  push:
    branches: [audit/astra-cp7-public-ffda]
    paths:
      - '.github/workflows/astra-cp7-global-final.yml'
      - 'qualification/astra-public/global-final/**'
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TZ: Asia/Jakarta
    steps:
      - name: Checkout independent qualification
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: qualification/astra-public/global-final
          path: evidence-source
          persist-credentials: false
      - name: Checkout the original public QA fixture clients
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a62504d71a6ca1cdbaa59b6fe0fd5739693f100a
          sparse-checkout: |
            scripts
            src
            contracts
            supabase
            ops
            docs/cp7/d17-18
            docs/cp7/framework-v2
            docs/cp7/d17-14
            docs/evidence
          path: fixtures
          persist-credentials: false
      - name: Checkout pinned reminder test transport and Global installer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6b22d308e83e69c2ea6fafa937ade1ee1f6498c4
          sparse-checkout: |
            qualification/close12/product
            qualification/cp75-reminders
          path: rig
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare independent test clients
        run: python -m pip install --quiet 'psycopg[binary]==3.2.10' 'PyYAML==6.0.2' 'jsonschema==4.25.1'
      - id: global
        name: Open the final certified checkpoint
        uses: Hanjay6688/-erp-garment-ux/qualification/close11/open@f8520a7da6cec188540a1e52bb20ecbfaf064b19
        with:
          origin-run: '44671146483'
          origin-runner: f8520a7da6cec188540a1e52bb20ecbfaf064b19
      - name: Reconcile both browser sessions with fresh PostgreSQL reads
        working-directory: fixtures
        env:
          PGHOST: ${{ steps.global.outputs.socket }}
          REMINDER_APP: ${{ steps.global.outputs.application }}
          WRITER_RESULTS: ${{ runner.temp }}/astra-reminder-retest
          PYTHONPATH: ${{ github.workspace }}/fixtures/scripts
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          test -x "$CHROME_BIN"
          python -u "$GITHUB_WORKSPACE/evidence-source/qualification/astra-public/global-final/verify_reminder_ui.py"
      - name: Preserve final independent observations
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: astra-reminder-retest-${{ github.run_id }}
          path: ${{ runner.temp }}/astra-reminder-retest/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Remove this job's disposable clone
        if: ${{ always() && steps.global.outcome == 'success' }}
        env:
          C: ${{ steps.global.outputs.container }}
        run: |
          test -n "$C"
          docker rm -f "$C"
          docker volume rm "$C-data" "$C-config"
          docker network rm "$C-network"
