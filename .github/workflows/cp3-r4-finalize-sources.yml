name: CP3 R4 Finalize Sources

on:
  push:
    branches:
      - cp3/hpp-attendance-sewing-terminal-r4-20260901
    paths:
      - scripts/cp3_r4_finalize_sources.py
      - .github/workflows/cp3-r4-finalize-sources.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact R4 writer branch
        uses: actions/checkout@v4
        with:
          ref: cp3/hpp-attendance-sewing-terminal-r4-20260901
          fetch-depth: 0

      - name: Reconcile deterministic finalizer with current hard-coded harness and acceptance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          path=Path('scripts/cp3_r4_finalize_sources.py')
          text=path.read_text()

          obsolete_blocks=[
            (
              r"# 1\. Harden generic RPC argument discovery in the real two-session harness\..*?harness_path\.write_text\(harness, encoding=\"utf-8\"\)\n\n",
              "# 1. The committed R4 race harness is already hard-coded to the exact owning RPC signatures.\n"
              "#    There is no generic argument resolver to patch; keep the harness byte-stable here.\n\n",
              'obsolete harness resolver block',
            ),
            (
              r"# 2\. Grant the test role access only to the session-local ID table\..*?accept_path\.write_text\(accept, encoding=\"utf-8\"\)\n\n",
              "# 2. Protected-journal service-role rejection is exercised by the real two-connection harness.\n"
              "#    The committed rollback acceptance has no role-switch anchor and needs no temp-table grant.\n\n",
              'obsolete acceptance temp-table grant block',
            ),
          ]
          for pattern,replacement,label in obsolete_blocks:
              text,n=re.subn(pattern,replacement,text,count=1,flags=re.S)
              if n!=1:
                  raise SystemExit(f'R4 finalizer reconciliation expected one {label}, found {n}')

          race_pattern=(
            r'race_marker = "scripts/cp3_r3_full_schema_concurrency\.py"\n'
            r'.*?workflow = "\\n"\.join\(new_lines\) \+ "\\n"\n'
          )
          race_replacement=(
            "r3_race_trigger = \"      - 'scripts/cp3_r3_full_schema_concurrency.py'\\n\"\n"
            "if workflow.count(r3_race_trigger) != 1:\n"
            "    raise SystemExit(f\"R4 workflow: expected one R3 concurrency trigger path, found {workflow.count(r3_race_trigger)}\")\n"
            "workflow = workflow.replace(\n"
            "    r3_race_trigger,\n"
            "    r3_race_trigger + \"      - 'scripts/cp3_r4_full_schema_concurrency.py'\\n\",\n"
            "    1,\n"
            ")\n\n"
            "r3_race_command = \"          python scripts/cp3_r3_full_schema_concurrency.py | tee cp3-r3-concurrency.log\\n\"\n"
            "if workflow.count(r3_race_command) != 1:\n"
            "    raise SystemExit(f\"R4 workflow: expected one R3 concurrency execution command, found {workflow.count(r3_race_command)}\")\n"
            "workflow = workflow.replace(\n"
            "    r3_race_command,\n"
            "    r3_race_command + \"          python scripts/cp3_r4_full_schema_concurrency.py 2>&1 | tee cp3-r4-proof/r4-concurrency.log\\n\",\n"
            "    1,\n"
            ")\n"
          )
          text,n=re.subn(race_pattern,race_replacement,text,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'R4 finalizer reconciliation expected one obsolete concurrency derivation block, found {n}')
          path.write_text(text)
          PY

      - name: Verify writer branch and generate exact R4 sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "cp3/hpp-attendance-sewing-terminal-r4-20260901"
          python scripts/cp3_r4_finalize_sources.py
          python -m py_compile \
            scripts/cp3_r4_full_schema_concurrency.py \
            scripts/cp3_render_r4_reviewed_rollback.py \
            scripts/test_cp3_render_r4_reviewed_rollback.py
          python scripts/test_cp3_render_r4_reviewed_rollback.py
          git diff --check

      - name: Remove one-time transports and superseded interim R4 candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/cp3_r4_finalize_sources.py
          rm -f .github/workflows/cp3-r4-finalize-sources.yml
          rm -f .github/workflows/cp3-r4-finalize-sources-v2.yml
          rm -f .github/workflows/cp3-r4-source-export.yml
          rm -f .github/workflows/cp3-r4-full-schema-validation-final.yml
          rm -f supabase/migrations/20260901023300_erp_v2_6_14d_active_pool_and_protected_reversal_guards.sql
          rm -f supabase/tests/cp3_r4_full_schema_seed.sql
          rm -f supabase/tests/cp3_r4_full_schema_race_seed.sql
          rm -f supabase/tests/attendance_hpp_r4_validator_benchmark_rollback.sql
          rm -f docs/evidence/2026-09-01/checkpoint_3_r4_fixed_source_manifest.json
          test -s supabase/migrations/20260901023400_erp_v2_6_14d_cp3_r4_race_and_reversal_hardening.sql
          test -s .github/workflows/cp3-r4-full-schema-validation.yml
          test "$(grep -Rsl "version='v2.6.14d'" supabase/migrations/20260901*14d*.sql | wc -l)" -eq 1
          git config user.name 'Hanjay6688'
          git config user.email 'jktr9n2g88@privaterelay.appleid.com'
          git add -A
          git diff --cached --check
          git commit -m 'test(cp3): finalize single R4 full-schema proof boundary'
          git push origin HEAD:cp3/hpp-attendance-sewing-terminal-r4-20260901
