name: Read exact terminal Afuic790 evidence without ERP execution
'on':
  push:
    branches:
    - astra-a/afuic790-evidence-intake-20261105
    paths:
    - scripts/afuic790-evidence-intake-20261105/**
    - .github/workflows/afuic790-evidence-intake-20261105.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: afuic790-evidence-intake-20261105
  cancel-in-progress: false
jobs:
  retain:
    if: github.ref == 'refs/heads/astra-a/afuic790-evidence-intake-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - name: Retain exact terminal current archive and complete job log without ERP
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 -B scripts/afuic790-evidence-intake-20261105/retain.py all
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: afui-41968344868-exact-diagnostics
        path: afuic790-evidence-intake-20261105/diagnostics
        compression-level: 0
        retention-days: 30
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: afui-41968344868-exact-core
        path: afuic790-evidence-intake-20261105/core
        compression-level: 0
        retention-days: 30
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && hashFiles('afuic790-evidence-intake-20261105/part-001/INTAKE_MANIFEST.json')
        != ''
      with:
        name: afui-41968344868-exact-part-001
        path: afuic790-evidence-intake-20261105/part-001
        compression-level: 0
        retention-days: 30
        if-no-files-found: error
