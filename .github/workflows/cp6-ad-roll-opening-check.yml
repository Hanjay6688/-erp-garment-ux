name: CP6 AE Roll Opening Family

on:
  push:
    branches: [competition/cp6-j-closure-20260911]
    paths:
      - .github/workflows/cp6-ad-roll-opening-check.yml
      - .github/workflows/cp6-full-schema-validation.yml
      - docs/evidence/cp6-ae-runtime-pins.json
      - scripts/cp6_preuse_rollback_maintenance.py
      - scripts/cp6_v2620ae_build_sql.py
      - scripts/cp6_v2620ae_family.py
      - scripts/cp6_v2620ae_rollback_guards.py
      - scripts/cp6_v2620ae_runtime.py
      - supabase/migrations/20260915201500_erp_v2_6_20ae_cp6_opening_roll_integrity.sql
      - supabase/rollbacks/20260915201500_erp_v2_6_20ae_cp6_opening_roll_integrity.rollback.sql
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cp6-ae-roll-opening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CP6_AC_INDEPENDENT_CONFIRM: postgres
      CP6_AD_ROLL_CHECK_CONFIRM: postgres
      CP6_AE_FAMILY_CONFIRM: postgres
      CP6_MAINTENANCE_CONFIRM_DATABASE: postgres
      CP6_MAINTENANCE_ALLOW_SYSTEM_DATABASE: postgres
      CP6_DATABASE_CONTAINER: supabase_db_cp5-local
      CP6_AUDIT_HARNESS_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout exact AE candidate
        uses: actions/checkout@v4
        with:
          path: candidate
          fetch-depth: 0
      - name: Checkout frozen bug comparison
        uses: actions/checkout@v4
        with:
          path: bug-round
          ref: b2663a0cb490432b53ca92670a17f7a268a8e7a3
          fetch-depth: 0
      - name: Checkout immutable AC runtime source
        uses: actions/checkout@v4
        with:
          path: base
          ref: 1bdca3766f7c9800d68295ff5122798060b8a05d
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned disposable runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'psycopg[binary]==3.2.10' 'PyYAML==6.0.2'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ca-certificates curl gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          key_fingerprint="$(gpg --show-keys --with-colons \
            /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$key_fingerprint" = 'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'
          . /etc/os-release
          architecture="$(dpkg --print-architecture)"
          sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<EOF
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: ${VERSION_CODENAME}-pgdg
          Architectures: ${architecture}
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          test -x /usr/lib/postgresql/17/bin/psql
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
      - name: Start disposable database
        working-directory: base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1bdca3766f7c9800d68295ff5122798060b8a05d
          test "$(git rev-parse HEAD^{tree})" = 334629c626257b8b713826f491cdf62385d5299b
          test -z "$(git status --porcelain)"
          mkdir cp5-local
          supabase init --force --workdir cp5-local
          mkdir -p cp5-local/supabase/.temp
          echo '17.6.1.165' > cp5-local/supabase/.temp/postgres-version
          sed -i '0,/^enable_signup = true$/s//enable_signup = false/' cp5-local/supabase/config.toml
          supabase start --workdir cp5-local \
            -x realtime,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor
      - name: Restore exact AC runtime
        working-directory: base
        env:
          GITHUB_SHA: 1bdca3766f7c9800d68295ff5122798060b8a05d
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export CP6_AC_WRITER_ARTIFACT="$RUNNER_TEMP/ac-native200.zip"
          gh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10392910720/zip \
            > "$CP6_AC_WRITER_ARTIFACT"
          PYTHONPATH=scripts python ../candidate/scripts/cp6_ac_audit_bootstrap.py
      - name: Apply exact AD predecessor
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cp6-proof/writer-ae
          psql "$PGURL" -X -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260915113627_erp_v2_6_20ad_cp6_opening_material_business_day.sql \
            > cp6-proof/writer-ae/AD_APPLY.log 2>&1
          PYTHONPATH=scripts python - <<'PY'
          import os
          import psycopg
          import cp6_v2620ad_runtime as runtime
          with psycopg.connect(os.environ['PGURL']) as connection, connection.cursor() as cur:
              cur.execute(
                  'insert into supabase_migrations.schema_migrations(version,name,statements) '
                  'values(%s,%s,%s)',
                  (runtime.STAMP, runtime.NAME, [runtime.MIGRATION.read_text()]),
              )
              assert len(runtime.verified_successor(cur)) == 274
          PY
      - name: Reconfirm the frozen five-case comparison
        working-directory: bug-round
        env:
          GITHUB_SHA: b2663a0cb490432b53ca92670a17f7a268a8e7a3
        shell: bash
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=scripts python scripts/cp6_ad_roll_opening_check.py
          result=$?
          set -e
          test "$result" = '1'
          test "$(jq -r '.status' cp6-proof/ad-roll-opening/RESULT.json)" = 'BUG_PROVEN'
          test "$(jq '.bugs_proven' cp6-proof/ad-roll-opening/RESULT.json)" = '3'
          test "$(jq '.controls_ok' cp6-proof/ad-roll-opening/RESULT.json)" = '2'
      - name: Check all AE admission cases against exact AD
        working-directory: candidate
        shell: bash
        run: PYTHONPATH=scripts python scripts/cp6_v2620ae_family.py --phase admission
      - name: Apply AE and verify all 276 pinned objects
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          psql "$PGURL" -X -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260915201500_erp_v2_6_20ae_cp6_opening_roll_integrity.sql \
            > cp6-proof/writer-ae/AE_APPLY.log 2>&1
          PYTHONPATH=scripts python - <<'PY'
          import os
          import psycopg
          import cp6_v2620ae_runtime as runtime
          with psycopg.connect(os.environ['PGURL']) as connection, connection.cursor() as cur:
              cur.execute(
                  'insert into supabase_migrations.schema_migrations(version,name,statements) '
                  'values(%s,%s,%s)',
                  (runtime.STAMP, runtime.NAME, [runtime.MIGRATION.read_text()]),
              )
              assert len(runtime.verified_successor(cur)) == 276
          PY
      - name: Run the focused successor family
        working-directory: candidate
        shell: bash
        run: PYTHONPATH=scripts python scripts/cp6_v2620ae_family.py --phase successor
      - name: Run the focused report controls
        working-directory: candidate
        shell: bash
        run: PYTHONPATH=scripts python scripts/cp6_v2620ae_family.py --phase detector
      - name: Provision isolated rollback authority
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          maintenance_password="$(openssl rand -hex 32)"
          maintenance_pgurl="postgresql://cp6_maintenance_admission:${maintenance_password}@127.0.0.1:54322/template1"
          echo "::add-mask::$maintenance_password"
          echo "::add-mask::$maintenance_pgurl"
          docker exec -i "$CP6_DATABASE_CONTAINER" \
            psql -U supabase_admin -d template1 -X -v ON_ERROR_STOP=1 \
              -v cp6_password="$maintenance_password" <<'SQL'
          create role cp6_maintenance_admission
            login superuser noinherit nocreatedb nocreaterole noreplication
            connection limit 4 password :'cp6_password';
          SQL
          printf 'CP6_ADMISSION_CONTROL_PGURL=%s\n' "$maintenance_pgurl" >> "$GITHUB_ENV"
      - name: Restore exact AD through the reviewed path
        working-directory: candidate
        shell: bash
        run: PYTHONPATH=scripts python scripts/cp6_v2620ae_rollback_guards.py
      - name: Stop disposable database and prove removal
        if: always()
        working-directory: base
        shell: bash
        run: |
          set -euo pipefail
          if test -f cp5-local/supabase/config.toml; then
            supabase stop --workdir cp5-local --no-backup
          fi
          remaining="$(docker ps -aq --filter name='^/supabase_db_cp5-local$')"
          test -z "$remaining"
      - name: Preserve focused results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp6-ae-roll-opening-family
          path: |
            candidate/cp6-proof/writer-ae
            bug-round/cp6-proof/ad-roll-opening
            base/cp6-proof/AC_AUDIT_RUNTIME_BOOTSTRAP.json
          if-no-files-found: warn
          compression-level: 9
          retention-days: 30
