name: CP6 AF Posted Child Family
permissions:
  contents: read
  actions: read
concurrency:
  group: cp6-af-family-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CP6_AC_INDEPENDENT_CONFIRM: postgres
      CP6_AD_ROLL_CHECK_CONFIRM: postgres
      CP6_AE_FAMILY_CONFIRM: postgres
      CP6_MAINTENANCE_PGURL: postgresql://postgres:postgres@127.0.0.1:54322/template1
      CP6_ROLLBACK_RACE_PGURL: postgresql://postgres:postgres@127.0.0.1:54322/cp6_rollback
      CP6_AE_MAINTENANCE_CONFIRM: cp6_rollback
      CP6_MAINTENANCE_CONFIRM_DATABASE: postgres
      CP6_MAINTENANCE_ALLOW_SYSTEM_DATABASE: postgres
      CP6_DATABASE_CONTAINER: supabase_db_cp5-local
      CP6_AUDIT_HARNESS_HEAD: ${{ github.sha }}
      CP6_AE_INDEPENDENT_CONFIRM: postgres
      CP6_AF_FAMILY_CONFIRM: postgres
      CP6_AF_MAINTENANCE_CONFIRM: cp6_rollback
    steps:
    - name: Checkout exact AF source
      uses: actions/checkout@v4
      with:
        path: candidate
        fetch-depth: 0
    - name: Checkout immutable AC runtime source
      uses: actions/checkout@v4
      with:
        path: base
        ref: 1bdca3766f7c9800d68295ff5122798060b8a05d
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned disposable runtime
      shell: bash
      run: "set -euo pipefail\npython -m pip install --quiet 'psycopg[binary]==3.2.10' 'PyYAML==6.0.2'\nsudo apt-get\
        \ update -qq\nsudo apt-get install -y -qq ca-certificates curl gnupg\nsudo install -d /usr/share/postgresql-common/pgdg\n\
        sudo curl --fail --silent --show-error \\\n  -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\
        \ \\\n  https://www.postgresql.org/media/keys/ACCC4CF8.asc\nkey_fingerprint=\"$(gpg --show-keys --with-colons\
        \ \\\n  /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \\\n  | awk -F: '$1 == \"fpr\" { print\
        \ $10; exit }')\"\ntest \"$key_fingerprint\" = 'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'\n. /etc/os-release\n\
        architecture=\"$(dpkg --print-architecture)\"\nsudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null\
        \ <<EOF\nTypes: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: ${VERSION_CODENAME}-pgdg\n\
        Architectures: ${architecture}\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n\
        EOF\nsudo apt-get update -qq\nsudo apt-get install -y -qq postgresql-client-17\ntest -x /usr/lib/postgresql/17/bin/psql\n\
        echo '/usr/lib/postgresql/17/bin' >> \"$GITHUB_PATH\"\n"
    - name: Install pinned Supabase CLI
      uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
      with:
        version: 2.116.0
    - name: Start disposable database
      working-directory: base
      shell: bash
      run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = 1bdca3766f7c9800d68295ff5122798060b8a05d\ntest \"\
        $(git rev-parse HEAD^{tree})\" = 334629c626257b8b713826f491cdf62385d5299b\ntest -z \"$(git status --porcelain)\"\
        \nmkdir cp5-local\nsupabase init --force --workdir cp5-local\nmkdir -p cp5-local/supabase/.temp\necho '17.6.1.165'\
        \ > cp5-local/supabase/.temp/postgres-version\nsed -i '0,/^enable_signup = true$/s//enable_signup = false/'\
        \ cp5-local/supabase/config.toml\nsupabase start --workdir cp5-local \\\n  -x realtime,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor\n"
    - name: Verify incoming AE artifact bytes and phase results
      working-directory: candidate
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\nmkdir -p cp6-proof/independent-ae\ngh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10418502157/zip\
        \ > \"$RUNNER_TEMP/ae-writer.zip\"\npython - <<'VERIFY'\nimport hashlib,json,os,zipfile\nfrom pathlib import\
        \ Path\np=Path(os.environ['RUNNER_TEMP'])/'ae-writer.zip'\nh=hashlib.sha256(p.read_bytes()).hexdigest()\n\
        assert h=='ba9d500385c2eaba019bdae0465aede37fd07e729c2a6d6ac4cdc7180a6c3200'\nexpected={'admission':7,'successor':14,'detector':6,'crossflow':134}\n\
        with zipfile.ZipFile(p) as z:\n assert z.testzip() is None\n phases={}\n for name in z.namelist():\n  stem=Path(name).stem\n\
        \  if stem in expected and 'writer-ae' in name:\n   r=json.loads(z.read(name))\n   assert r['status']=='PASS'\
        \ and r['passed']==expected[stem] and r['failed']==0\n   assert r['head']=='ce8e8ea5cdfab4b39ea7095c1b3bd1c8ab1f33d1'\n\
        \   phases[stem]={'passed':r['passed'],'sha256':hashlib.sha256(z.read(name)).hexdigest()}\n assert set(phases)==set(expected),(phases,z.namelist()[:30])\n\
        \ result={'status':'VERIFIED_INCOMING_WRITER_EVIDENCE','artifact_id':10418502157,'zip_sha256':h,'entries':len(z.infolist()),'phases':phases,'production_go':False}\n\
        Path('cp6-proof/independent-ae/INCOMING_WRITER.json').write_text(json.dumps(result,indent=2)+'\\n')\nprint(json.dumps(result))\n\
        VERIFY\n"
    - name: Restore exact AC runtime
      working-directory: base
      env:
        GITHUB_SHA: 1bdca3766f7c9800d68295ff5122798060b8a05d
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\nexport CP6_AC_WRITER_ARTIFACT=\"$RUNNER_TEMP/ac-native200.zip\"\ngh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10392910720/zip\
        \ \\\n  > \"$CP6_AC_WRITER_ARTIFACT\"\nPYTHONPATH=scripts python ../candidate/scripts/cp6_ac_audit_bootstrap.py\n"
    - name: Apply exact AD predecessor
      working-directory: candidate
      shell: bash
      run: "set -euo pipefail\nmkdir -p cp6-proof/writer-ae\npsql \"$PGURL\" -X -v ON_ERROR_STOP=1 \\\n  -f supabase/migrations/20260915113627_erp_v2_6_20ad_cp6_opening_material_business_day.sql\
        \ \\\n  > cp6-proof/writer-ae/AD_APPLY.log 2>&1\nPYTHONPATH=scripts python - <<'PY'\nimport os\nimport psycopg\n\
        import cp6_v2620ad_runtime as runtime\nwith psycopg.connect(os.environ['PGURL']) as connection, connection.cursor()\
        \ as cur:\n    cur.execute(\n        'insert into supabase_migrations.schema_migrations(version,name,statements)\
        \ '\n        'values(%s,%s,%s)',\n        (runtime.STAMP, runtime.NAME, [runtime.MIGRATION.read_text()]),\n\
        \    )\n    assert len(runtime.verified_successor(cur)) == 274\nPY\n"
    - name: Verify AF exact source and one writer head
      working-directory: candidate
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

        test "$(git ls-remote origin refs/heads/competition/cp6-j-closure-20260911 | awk ''{print $1}'')" = "$GITHUB_SHA"

        PYTHONPATH=scripts python - <<''PYVERIFY''

        import cp6_v2620af_runtime as r

        print(r.verify_audit_source())

        PYVERIFY

        '
    - name: Apply exact AE comparison runtime
      working-directory: candidate
      shell: bash
      run: "set -euo pipefail\npsql \"$PGURL\" -X -v ON_ERROR_STOP=1 \\\n  -f supabase/migrations/20260915201500_erp_v2_6_20ae_cp6_opening_roll_integrity.sql\
        \ \\\n  > cp6-proof/writer-ae/AE_APPLY.log 2>&1\nPYTHONPATH=scripts python - <<'PY'\nimport os\nimport psycopg\n\
        import cp6_v2620ae_runtime as runtime\nwith psycopg.connect(os.environ['PGURL']) as connection, connection.cursor()\
        \ as cur:\n    cur.execute(\n        'insert into supabase_migrations.schema_migrations(version,name,statements)\
        \ '\n        'values(%s,%s,%s)',\n        (runtime.STAMP, runtime.NAME, [runtime.MIGRATION.read_text()]),\n\
        \    )\n    assert len(runtime.verified_successor(cur)) == 276\nPY\n"
    - name: Provision isolated rollback authority
      working-directory: candidate
      shell: bash
      run: "set -euo pipefail\nmaintenance_password=\"$(openssl rand -hex 32)\"\nmaintenance_pgurl=\"postgresql://cp6_maintenance_admission:${maintenance_password}@127.0.0.1:54322/template1\"\
        \necho \"::add-mask::$maintenance_password\"\necho \"::add-mask::$maintenance_pgurl\"\ndocker exec -i \"\
        $CP6_DATABASE_CONTAINER\" \\\n  psql -U supabase_admin -d template1 -X -v ON_ERROR_STOP=1 \\\n    -v cp6_password=\"\
        $maintenance_password\" <<'SQL'\ncreate role cp6_maintenance_admission\n  login superuser noinherit nocreatedb\
        \ nocreaterole noreplication\n  connection limit 4 password :'cp6_password';\nSQL\nprintf 'CP6_ADMISSION_CONTROL_PGURL=%s\\\
        n' \"$maintenance_pgurl\" >> \"$GITHUB_ENV\"\n"
    - name: Seven AF admission checks on original AE
      working-directory: candidate
      shell: bash
      run: 'set -euo pipefail

        PYTHONPATH=scripts python scripts/cp6_v2620af_family.py --phase admission

        '
    - name: Original AE two-session comparison
      working-directory: candidate
      shell: bash
      run: 'set -euo pipefail

        PYTHONPATH=scripts python scripts/cp6_v2620af_concurrency.py --generation AE

        '
    - name: Install AF and bind exact 278-object runtime
      working-directory: candidate
      shell: bash
      run: "set -euo pipefail\npsql \"$PGURL\" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260916014332_erp_v2_6_20af_cp6_posted_child_integrity.sql\
        \ > cp6-proof/writer-af/AF_APPLY.log 2>&1\nPYTHONPATH=scripts python - <<'PYINSTALL'\nimport os,psycopg\n\
        import cp6_v2620af_runtime as r\nwith psycopg.connect(os.environ['PGURL']) as conn,conn.cursor() as cur:\n\
        \ cur.execute('insert into supabase_migrations.schema_migrations(version,name,statements) values(%s,%s,%s)',(r.STAMP,r.NAME,[r.MIGRATION.read_text()]))\n\
        \ assert len(r.verified_successor(cur))==278\nPYINSTALL\n"
    - name: Focused shared guard and original opening cases
      working-directory: candidate
      shell: bash
      run: 'set -euo pipefail

        PYTHONPATH=scripts python scripts/cp6_v2620af_family.py --phase focused

        '
    - name: Owner report controls
      working-directory: candidate
      shell: bash
      run: 'set -euo pipefail

        PYTHONPATH=scripts python scripts/cp6_v2620af_family.py --phase detector

        '
    - name: Combined134 unchanged stock cost payment return and date oracles
      working-directory: candidate
      shell: bash
      run: 'set -euo pipefail

        PYTHONPATH=scripts python scripts/cp6_v2620af_family.py --phase crossflow

        '
    - name: Four AF two-session transaction schedules
      working-directory: candidate
      shell: bash
      run: 'set -euo pipefail

        PYTHONPATH=scripts python scripts/cp6_v2620af_concurrency.py --generation AF

        '
    - name: Twenty AF maintenance schedules with unchanged oracle
      working-directory: candidate
      shell: bash
      run: 'set -euo pipefail

        PYTHONPATH=scripts python scripts/cp6_v2620af_maintenance_schedules.py

        '
      env:
        CP6_MAINTENANCE_CONFIRM_DATABASE: cp6_rollback
    - name: Eight atomic rollback refusals and exact AE restore
      working-directory: candidate
      shell: bash
      run: 'set -euo pipefail

        PYTHONPATH=scripts python scripts/cp6_v2620af_rollback_guards.py

        '
    - name: Stop disposable database and prove removal
      if: always()
      working-directory: base
      shell: bash
      run: "set -euo pipefail\nif test -f cp5-local/supabase/config.toml; then\n  supabase stop --workdir cp5-local\
        \ --no-backup\nfi\nremaining=\"$(docker ps -aq --filter name='^/supabase_db_cp5-local$')\"\ntest -z \"$remaining\"\
        \n"
    - name: Preserve AF evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cp6-af-posted-child-family
        path: 'candidate/cp6-proof/writer-af

          candidate/cp6-proof/AF_MAINTENANCE_ROLLBACK

          candidate/cp6-proof/independent-ae

          base/cp6-proof/AC_AUDIT_RUNTIME_BOOTSTRAP.json'
        if-no-files-found: warn
        compression-level: 9
        retention-days: 30
    - name: Require complete AF writer evidence
      working-directory: candidate
      shell: bash
      run: "set -euo pipefail\npython - <<'PYVERDICT'\nimport json\nfrom pathlib import Path\nroot=Path('cp6-proof/writer-af')\n\
        expected={'admission':7,'focused':25,'detector':11,'crossflow':134}\nfor phase,count in expected.items():\n\
        \ r=json.loads((root/(phase+'.json')).read_text())\n assert r['status']=='PASS' and r['passed']==count and\
        \ r['failed']==0,(phase,{k:v for k,v in r.items() if k!='cases'})\nfor generation,status,count in [('AE','ORIGINAL_BUG_CONFIRMED',1),('AF','PASS',4)]:\n\
        \ r=json.loads((root/'concurrency'/generation/'RESULT.json').read_text())\n assert r['status']==status and\
        \ len(r['cases'])==count and r['clone_removed']\nr=json.loads((root/'AF_EXACT_AE_RESTORE.json').read_text());assert\
        \ r['status']=='PASS'\nr=json.loads(Path('cp6-proof/AF_MAINTENANCE_ROLLBACK/manifest.json').read_text());assert\
        \ r['status']=='PASS' and r['completed_case_count']==20\nprint('AF WRITER PASS within recorded scope; independent\
        \ review pending; production_go:false')\nPYVERDICT\n"
      if: always()
'on':
  push:
    branches:
    - competition/cp6-j-closure-20260911
    paths:
    - .github/workflows/cp6-ad-roll-opening-check.yml
    - .github/workflows/cp6-full-schema-validation.yml
    - docs/cp6-af-competition-handoff.md
    - docs/evidence/cp6-af-*.json
    - scripts/cp6_v2620af_*.py
    - scripts/cp6_preuse_rollback_maintenance.py
    - supabase/migrations/20260916014332_erp_v2_6_20af_cp6_posted_child_integrity.sql
    - supabase/rollbacks/20260916014332_erp_v2_6_20af_cp6_posted_child_integrity.rollback.sql
  workflow_dispatch: null
