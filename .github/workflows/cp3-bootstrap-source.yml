name: CP3 Bootstrap Source Candidate

on:
  push:
    branches:
      - cp3/hpp-attendance-sewing-terminal-reconstruction-20260901
    paths:
      - .github/workflows/cp3-bootstrap-source.yml

permissions:
  contents: write
  actions: read

jobs:
  reconstruct-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact bootstrap head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact reviewed source with first fixture fix
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF_NAME}" = 'cp3/hpp-attendance-sewing-terminal-reconstruction-20260901'
          git show bfcf36fa3653446a0cb89625eadcac48b9284d5f:.cp3-bootstrap/part00.b64 > /tmp/cp3-part00-reviewed.b64
          cat /tmp/cp3-part00-reviewed.b64 \
              .cp3-bootstrap/part01.b64 \
              .cp3-bootstrap/part02.b64 \
              .cp3-bootstrap/part03.b64 \
              .cp3-bootstrap/part04.b64 \
              .cp3-bootstrap/part05.b64 \
            | base64 --decode > /tmp/cp3-source-bundle.zip
          echo 'fbb3108eadd1c61c46a730d951126da497a4ac7f8f0a997da14520eaac31382f  /tmp/cp3-source-bundle.zip' | sha256sum -c -
          unzip -tq /tmp/cp3-source-bundle.zip
          unzip -oq /tmp/cp3-source-bundle.zip -d cp3-diagnostic-source
          python - <<'PY'
          from pathlib import Path
          path = Path('cp3-diagnostic-source/supabase/tests/attendance_hpp_sewing_terminal_rollback.acceptance.sql')
          text = path.read_text()
          old = "   null, null, null,\n   gen_random_uuid(), null, true, false, date '2026-08-20', 900.00, null);"
          new = "   null, null,\n   gen_random_uuid(), null, true, false, date '2026-08-20', 900.00, null);"
          if text.count(old) != 1:
              raise SystemExit('ZERO_DENOM arity patch target changed')
          path.write_text(text.replace(old, new))
          PY
          sha256sum cp3-diagnostic-source/supabase/migrations/*.sql \
                    cp3-diagnostic-source/supabase/tests/*.sql \
                    cp3-diagnostic-source/scripts/* > cp3-diagnostic-source/SHA256SUMS.txt

      - name: Upload source diagnostic package
        uses: actions/upload-artifact@v4
        with:
          name: cp3-reconstructed-source-diagnostic
          path: cp3-diagnostic-source
          retention-days: 3

      - name: Cleanup
        if: always()
        run: rm -rf cp3-diagnostic-source /tmp/cp3-source-bundle.zip /tmp/cp3-part00-reviewed.b64
