# Off-site nightly backup tool (owner decisions 13 Oct 2026, D13-5/6/7): tested on disposable servers only.
# Source: the aligned CP6 copy in the runner's Supabase container (same steps as CP7 P19 Analysis Job Transport).
# Scratch server: a second container of the same Supabase Postgres image on the runner. Remote: an S3 API emulator on
# the runner (moto; the rclone s3 path R2 takes) and a local directory (the same tool path any rclone remote takes;
# Google Drive is not reachable from CI without the owner's account and is not claimed). Nothing here touches hosted,
# R2 or Drive. First run 38380406480 stopped before any case: the MinIO image pull from quay.io was refused.
name: CP7 Offsite Backup
'on':
  push:
    branches:
    - claude/new-session-deapao
    paths:
    - scripts/cp7_offsite_backup.py
    - scripts/cp7_offsite_backup_cases.py
    - scripts/cp7_nightly_backup.py
    - .github/workflows/cp7-offsite-backup.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cp7-offsite-backup-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  offsite:
    name: offsite-backup-11
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CP6_AC_INDEPENDENT_CONFIRM: postgres
      CP6_AF_INDEPENDENT_CONFIRM: postgres
      CP6_AH_CONFIRM: postgres
      CP6_AI_CONFIRM: postgres
      CP6_AH_INDEPENDENT_CONFIRM: postgres
      CP6_AI_INDEPENDENT_CONFIRM: postgres
      CP6_AUDIT_HARNESS_HEAD: c6b0e4fb119c4e91fecea66ebf2d789426b22c2b
      CP6_AF_HARNESS_HEAD: c6b0e4fb119c4e91fecea66ebf2d789426b22c2b
      CP6_DATABASE_CONTAINER: supabase_db_cp5-local
      CP6_MAINTENANCE_CONFIRM_DATABASE: cp6_rollback
      CP6_AR_CONFIRM: cp6_rollback
      CP6_AU_BROWSER_CONFIRM: cp6_rollback
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: writer
        fetch-depth: 0
        ref: ca7f09556397801c50a2277bdb65b1bf019f9a05
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: auditor
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: harness
        fetch-depth: 0
        ref: c6b0e4fb119c4e91fecea66ebf2d789426b22c2b
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: candidate
        fetch-depth: 0
        ref: 25fa4736329e5148dfdb3572bc169952cba23251
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: base
        fetch-depth: 0
        ref: 1bdca3766f7c9800d68295ff5122798060b8a05d
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - name: Install pinned disposable runtime
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --quiet 'psycopg[binary]==3.2.10' 'PyYAML==6.0.2' 'jsonschema==4.25.1'
        sudo apt-get update -qq
        sudo apt-get install -y -qq ca-certificates curl gnupg
        sudo install -d /usr/share/postgresql-common/pgdg
        sudo curl --fail --silent --show-error \
          -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
          https://www.postgresql.org/media/keys/ACCC4CF8.asc
        key_fingerprint="$(gpg --show-keys --with-colons \
          /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
          | awk -F: '$1 == "fpr" { print $10; exit }')"
        test "$key_fingerprint" = 'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'
        . /etc/os-release
        architecture="$(dpkg --print-architecture)"
        sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<EOF
        Types: deb
        URIs: https://apt.postgresql.org/pub/repos/apt
        Suites: ${VERSION_CODENAME}-pgdg
        Architectures: ${architecture}
        Components: main
        Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
        EOF
        sudo apt-get update -qq
        sudo apt-get install -y -qq postgresql-client-17
        test -x /usr/lib/postgresql/17/bin/psql
        echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
    - name: Install pinned Supabase CLI
      uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
      with:
        version: 2.116.0
    - name: Record proposed source and prepare isolated proof paths
      id: source_scope
      working-directory: writer
      run: |
        set -euo pipefail
        PYTHONPATH=scripts python -c "import cp6_au_trial; cp6_au_trial.source()"
        mkdir -p ../candidate/cp6-proof/writer-{ae,af,ah,ai,aj,ak,al,am,an}
    - name: Start disposable database
      working-directory: base
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = 1bdca3766f7c9800d68295ff5122798060b8a05d
        test "$(git rev-parse HEAD^{tree})" = 334629c626257b8b713826f491cdf62385d5299b
        test -z "$(git status --porcelain)"
        supabase --help >/dev/null
        supabase init --help >/dev/null
        supabase start --help >/dev/null
        mkdir cp5-local
        supabase init --force --workdir cp5-local
        mkdir -p cp5-local/supabase/.temp
        echo '17.6.1.165' > cp5-local/supabase/.temp/postgres-version
        sed -i '0,/^enable_signup = true$/s//enable_signup = false/' cp5-local/supabase/config.toml
        # ghcr.io can rate-limit image pulls before anything runs. Retry the start
        # only (no test has run), falling back to the same image tags on public.ecr.aws.
        for attempt in 1 2 3 4; do
          if [ "$attempt" -ge 2 ]; then export SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws; fi
          if supabase start --workdir cp5-local \
            -x realtime,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor \
            > "$RUNNER_TEMP/cp6-local-start.log" 2>&1; then
            echo "supabase start succeeded on attempt $attempt from ${SUPABASE_INTERNAL_IMAGE_REGISTRY:-default}"
            break
          fi
          tail -n 20 "$RUNNER_TEMP/cp6-local-start.log"
          supabase stop --workdir cp5-local --no-backup || true
          if [ "$attempt" = 4 ]; then exit 1; fi
          sleep $((attempt * 60))
        done
    - name: Rebuild to v2.6.20, align with hosted, continue the frozen path to AB
      working-directory: base
      env:
        GITHUB_SHA: 1bdca3766f7c9800d68295ff5122798060b8a05d
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        export CP6_AC_WRITER_ARTIFACT="$RUNNER_TEMP/ac-native200.zip"
        gh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10392910720/zip \
          > "$CP6_AC_WRITER_ARTIFACT"
        mkdir -p ../auditor/cp6-proof/t3
        status=0
        PYTHONPATH=scripts python ../auditor/scripts/cp6_t3_aligned_chain.py ../auditor/cp6-proof/t3/ALIGNED_CHAIN.json --stop-after-ab || status=$?
        python - <<'PY'
        import json
        d=json.load(open('../auditor/cp6-proof/t3/ALIGNED_CHAIN.json'))
        print(json.dumps({k:d.get(k) for k in ('status','refused_step','alignment')},default=str)[:6000])
        print(json.dumps([(s['name'],s['exit_code'],s['after_alignment']) for s in d['steps']])[:6000])
        PY
        exit "$status"
    - name: Clone the aligned AB state for install
      working-directory: writer
      run: |
        set -euo pipefail
        mkdir -p '../auditor/cp6-proof/t3'
        bash scripts/clone-cp6-disposable-database.sh \
          'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
          'postgresql://postgres:postgres@127.0.0.1:54322/template1' \
          'postgresql://postgres:postgres@127.0.0.1:54322/cp6_rollback' \
          cp6_rollback supabase_db_cp5-local '../auditor/cp6-proof/t3/CLONE_install'
    - name: Off-site tools, scratch server and S3 emulator on the runner
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get install -y -qq rclone gnupg
        rclone version | head -1
        image="$(docker inspect supabase_db_cp5-local --format '{{.Config.Image}}')"
        echo "scratch image: $image"
        docker run -d --name cp7_offsite_scratch -p 127.0.0.1:54339:5432 -e POSTGRES_PASSWORD=postgres "$image" >/dev/null
        # S3 API on the runner (moto, from PyPI): the same rclone s3 path that Cloudflare R2 takes. Its own venv.
        python -m venv "$RUNNER_TEMP/s3emu"
        "$RUNNER_TEMP/s3emu/bin/pip" install --quiet 'moto[server]==5.1.10'
        nohup "$RUNNER_TEMP/s3emu/bin/moto_server" -H 127.0.0.1 -p 9000 > "$RUNNER_TEMP/s3emu.log" 2>&1 &
        umask 077
        cat > "$RUNNER_TEMP/rclone.conf" <<CONF
        [s3emu]
        type = s3
        provider = Other
        access_key_id = cp7-offsite-test
        secret_access_key = cp7-offsite-test
        endpoint = http://127.0.0.1:9000
        region = us-east-1
        CONF
        openssl rand -base64 48 > "$RUNNER_TEMP/offsite.pass"
        echo "RCLONE_CONFIG=$RUNNER_TEMP/rclone.conf" >> "$GITHUB_ENV"
        for i in $(seq 1 90); do
          if psql 'postgresql://postgres:postgres@127.0.0.1:54339/postgres' -Atc 'select 1' >/dev/null 2>&1 \
             && RCLONE_CONFIG="$RUNNER_TEMP/rclone.conf" rclone mkdir s3emu:cp7-offsite >/dev/null 2>&1; then break; fi
          if [ "$i" = 90 ]; then docker logs --tail 40 cp7_offsite_scratch; tail -20 "$RUNNER_TEMP/s3emu.log"; exit 1; fi
          sleep 2
        done
        # In this image postgres is not a superuser (as on hosted). The scratch server is this runner's own throwaway
        # container, so the restore runs as a superuser made there, so owners and ACLs restore as they are.
        docker exec -i cp7_offsite_scratch psql -U supabase_admin -d postgres -X -q -v ON_ERROR_STOP=1 \
          -c "create role cp7_scratch_admin login superuser password 'cp7-scratch'"
        psql 'postgresql://cp7_scratch_admin:cp7-scratch@127.0.0.1:54339/postgres' -Atc "select current_setting('server_version'), rolsuper from pg_roles where rolname=current_user"
        psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -Atc "select current_setting('server_version')"
    - name: Off-site backup cases (S3 remote)
      working-directory: auditor
      run: |
        python scripts/cp7_offsite_backup_cases.py \
          'postgresql://postgres:postgres@127.0.0.1:54322/cp6_rollback' \
          'postgresql://cp7_scratch_admin:cp7-scratch@127.0.0.1:54339/postgres' \
          s3emu:cp7-offsite/cases "$RUNNER_TEMP/offsite.pass" "$RUNNER_TEMP/offsite-s3.json"
    - name: Off-site backup cases (local directory remote)
      working-directory: auditor
      run: |
        python scripts/cp7_offsite_backup_cases.py \
          'postgresql://postgres:postgres@127.0.0.1:54322/cp6_rollback' \
          'postgresql://cp7_scratch_admin:cp7-scratch@127.0.0.1:54339/postgres' \
          "$RUNNER_TEMP/offsite-local/cases" "$RUNNER_TEMP/offsite.pass" "$RUNNER_TEMP/offsite-local.json"
    - name: Remove disposable servers
      if: always()
      working-directory: base
      run: |
        docker rm -f cp7_offsite_scratch || true
        pkill -f moto_server || true
        supabase stop --workdir cp5-local --no-backup
