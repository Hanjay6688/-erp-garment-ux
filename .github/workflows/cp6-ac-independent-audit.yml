name: CP6 AD Whole Family Qualification

on:
  push:
    branches: [competition/cp6-j-closure-20260911]
    paths:
      - .github/workflows/cp6-ac-independent-audit.yml
      - scripts/cp6_ac_independent_audit.py
      - scripts/cp6_ac_audit_bootstrap.py
      - scripts/cp6_v2620ad_*.py
      - scripts/cp6_preuse_rollback_maintenance.py
      - scripts/cp6_v2620h_maintenance_rollback_matrix.py
      - supabase/migrations/*_erp_v2_6_20ad_*.sql
      - supabase/rollbacks/*_erp_v2_6_20ad_*.sql
      - docs/evidence/cp6-ad-*.json

permissions:
  contents: read
  actions: read

concurrency:
  group: cp6-ac-independent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-scope:
    runs-on: ubuntu-24.04
    outputs:
      ae: ${{ steps.scope.outputs.ae }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Route the exact successor to its combined qualification
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python - <<'PY'
          import os
          from pathlib import Path
          # BEGIN AJ QUALIFIED ROUTE
          if Path('scripts/cp6_v2620aj_runtime.py').exists():
              from cp6_disposable_ui_scope import verify
              verify()
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('ae=true\n')
              raise SystemExit(0)
          # END AJ QUALIFIED ROUTE
          # BEGIN AI QUALIFIED ROUTE
          if Path('scripts/cp6_ai_gate_scope.py').exists():
              from cp6_ai_gate_scope import verify
              verify()
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('ae=true\n')
              raise SystemExit(0)
          # END AI QUALIFIED ROUTE
          # BEGIN AH INDEPENDENT ROUTE
          if Path('scripts/cp6_ah_review_scope.py').exists():
              from cp6_ah_review_scope import verify
              verify()
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('ae=true\n')
              raise SystemExit(0)
          # END AH INDEPENDENT ROUTE
          # BEGIN AH QUALIFIED ROUTE
          if Path('scripts/cp6_ah_gate_scope.py').exists():
              from cp6_ah_gate_scope import verify
              verify()
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('ae=true\n')
              raise SystemExit(0)
          # END AH QUALIFIED ROUTE
          # BEGIN AG QUALIFIED ROUTE
          if Path('scripts/cp6_ag_gate_scope.py').exists():
              from cp6_ag_gate_scope import verify
              verify()
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('ae=true\n')
              raise SystemExit(0)
          # END AG QUALIFIED ROUTE
          successor = Path('scripts/cp6_v2620ae_runtime.py').exists()
          if Path('scripts/cp6_v2620af_runtime.py').exists():
              import cp6_v2620af_runtime as runtime
              runtime.verify_audit_source()
          elif successor:
              import cp6_v2620ae_runtime as runtime
              runtime.verify_audit_source()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ae=' + str(successor).lower() + '\n')
          PY
  audit:
    needs: source-scope
    if: needs.source-scope.outputs.ae != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CP6_AC_INDEPENDENT_CONFIRM: postgres
      CP6_AD_PROOF_CONFIRM: postgres
      CP6_MAINTENANCE_PGURL: postgresql://postgres:postgres@127.0.0.1:54322/template1
      CP6_ROLLBACK_RACE_PGURL: postgresql://postgres:postgres@127.0.0.1:54322/cp6_rollback
      CP6_MAINTENANCE_CONFIRM_DATABASE: cp6_rollback
      CP6_AD_MAINTENANCE_CONFIRM: cp6_rollback
      CP6_DATABASE_CONTAINER: supabase_db_cp5-local
      CP6_AUDIT_HARNESS_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout audit harness
        uses: actions/checkout@v4
        with:
          path: audit-harness
          fetch-depth: 0
      - name: Checkout immutable AC business candidate
        uses: actions/checkout@v4
        with:
          path: candidate
          ref: 1bdca3766f7c9800d68295ff5122798060b8a05d
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install disposable validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet 'psycopg[binary]==3.2.10' 'PyYAML==6.0.2'
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ca-certificates curl gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          key_fingerprint="$(gpg --show-keys --with-colons \
            /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$key_fingerprint" = 'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'
          . /etc/os-release
          architecture="$(dpkg --print-architecture)"
          sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<EOF
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: ${VERSION_CODENAME}-pgdg
          Architectures: ${architecture}
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          test -x /usr/lib/postgresql/17/bin/pg_dump
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
          python -m pip install --quiet 'psycopg[binary]==3.2.10'
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
      - name: Start pinned disposable Supabase
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1bdca3766f7c9800d68295ff5122798060b8a05d
          test "$(git rev-parse HEAD^{tree})" = 334629c626257b8b713826f491cdf62385d5299b
          test -z "$(git status --porcelain)"
          mkdir cp5-local
          supabase init --force --workdir cp5-local
          mkdir -p cp5-local/supabase/.temp
          echo '17.6.1.165' > cp5-local/supabase/.temp/postgres-version
          sed -i '0,/^enable_signup = true$/s//enable_signup = false/' cp5-local/supabase/config.toml
          supabase start --workdir cp5-local -x realtime,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor
      - name: Restore admitted AC runtime without historical matrix execution
        working-directory: candidate
        env:
          GITHUB_SHA: 1bdca3766f7c9800d68295ff5122798060b8a05d
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export CP6_AC_WRITER_ARTIFACT="$RUNNER_TEMP/ac-native200.zip"
          gh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10392910720/zip > "$CP6_AC_WRITER_ARTIFACT"
          PYTHONPATH=scripts python ../audit-harness/scripts/cp6_ac_audit_bootstrap.py
      - name: Preserve exact AC construction and incoming lossless evidence
        working-directory: audit-harness
        run: |
          set -euo pipefail
          mkdir -p cp6-proof/bootstrap-ac cp6-proof/incoming
          cp -a ../candidate/cp6-proof/. cp6-proof/bootstrap-ac/
          cp "$RUNNER_TEMP/ac-native200.zip" cp6-proof/incoming/AC_NATIVE200.zip
      - name: Provision isolated rollback admission-control authority
        working-directory: audit-harness
        run: |
          set -euo pipefail
          maintenance_password="$(openssl rand -hex 32)"
          maintenance_pgurl="postgresql://cp6_maintenance_admission:${maintenance_password}@127.0.0.1:54322/template1"
          echo "::add-mask::$maintenance_password"
          echo "::add-mask::$maintenance_pgurl"
          test "$(docker exec "$CP6_DATABASE_CONTAINER" \
            psql -U supabase_admin -d template1 -X -At -v ON_ERROR_STOP=1 \
              -c "select count(*) from pg_roles where rolname='cp6_maintenance_admission'")" = '0'
          docker exec -i "$CP6_DATABASE_CONTAINER" \
            psql -U supabase_admin -d template1 -X -v ON_ERROR_STOP=1 \
              -v cp6_password="$maintenance_password" <<'SQL'
          create role cp6_maintenance_admission
            login superuser noinherit nocreatedb nocreaterole noreplication
            connection limit 4 password :'cp6_password';
          SQL
          printf 'CP6_ADMISSION_CONTROL_PGURL=%s\n' "$maintenance_pgurl" >> "$GITHUB_ENV"
          psql "$maintenance_pgurl" -X -At -v ON_ERROR_STOP=1 <<'SQL' \
            | tee cp6-proof/CP6_ADMISSION_CONTROL_PREFLIGHT.json
          select jsonb_pretty(jsonb_build_object(
            'status','PASS',
            'role',current_user,
            'database',current_database(),
            'superuser',(select rolsuper from pg_roles where rolname=current_user),
            'ephemeral_disposable_ci',true,
            'credential_persisted_in_proof',false,
            'production_go',false
          ));
          SQL
          test "$(jq -r '.status' cp6-proof/CP6_ADMISSION_CONTROL_PREFLIGHT.json)" = 'PASS'
          test "$(jq -r '.role' cp6-proof/CP6_ADMISSION_CONTROL_PREFLIGHT.json)" = 'cp6_maintenance_admission'
          test "$(jq -r '.database' cp6-proof/CP6_ADMISSION_CONTROL_PREFLIGHT.json)" = 'template1'
          test "$(jq -r '.superuser' cp6-proof/CP6_ADMISSION_CONTROL_PREFLIGHT.json)" = 'true'
      - name: Qualify 55 predecessor cases and all admission controls before AD
        working-directory: audit-harness
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/cp6_v2620ad_family_proof.py --phase predecessor
          PYTHONPATH=scripts python scripts/cp6_v2620ad_family_proof.py --phase admission
      - name: Apply the complete AD fix and verify all 274 pinned objects
        working-directory: audit-harness
        run: |
          set -euo pipefail
          psql "$PGURL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260915113627_erp_v2_6_20ad_cp6_opening_material_business_day.sql > cp6-proof/writer-ad/AD_APPLY.log 2>&1
          PYTHONPATH=scripts python - <<'PY'
          import json,os,pathlib,psycopg,subprocess
          import cp6_v2620ad_runtime as r
          with psycopg.connect(os.environ['PGURL']) as conn,conn.cursor() as cur:
              cur.execute('insert into supabase_migrations.schema_migrations(version,name,statements) values(%s,%s,%s)',(r.STAMP,r.NAME,[r.MIGRATION.read_text()]))
              objects=r.verified_successor(cur)
              assert len(objects)==274
          pathlib.Path('cp6-proof/writer-ad/AD_INSTALLED_RUNTIME.json').write_text(json.dumps({'status':'PASS','objects':objects,'production_go':False},indent=2)+'\n')
          replay=subprocess.run(['psql',os.environ['PGURL'],'-X','-v','ON_ERROR_STOP=1','-f',str(r.MIGRATION)],capture_output=True,text=True)
          pathlib.Path('cp6-proof/writer-ad/AD_REPLAY.log').write_text(replay.stdout+replay.stderr)
          assert replay.returncode!=0 and 'AD_REQUIRES_EXACT_AC_WITHOUT_AD_RESIDUE' in replay.stderr
          PY
      - name: Finish all family cases and detector controls before maintenance matrix
        working-directory: audit-harness
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/cp6_v2620ad_family_proof.py --phase successor
          PYTHONPATH=scripts python scripts/cp6_v2620ad_family_proof.py --phase detector
          PYTHONPATH=scripts python scripts/cp6_v2620ad_family_proof.py --phase rollback
      - name: Verify and reuse the completed 20 Native5 AD maintenance schedules
        working-directory: audit-harness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/cp6_v2620ad_reuse_matrix.py
      - name: Close admission and restore exact AC after AD
        working-directory: audit-harness
        env:
          CP6_MAINTENANCE_CONFIRM_DATABASE: postgres
          CP6_MAINTENANCE_ALLOW_SYSTEM_DATABASE: postgres
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/cp6_v2620ad_rollback_guards.py
      - name: Verify unchanged source and zero user or clone residue
        working-directory: audit-harness
        if: always()
        run: |
          set -euo pipefail
          mkdir -p cp6-proof
          # A failure can leave admission closed, so observe through local superuser.
          test -z "$(git diff --name-only)"
          if docker ps --format '{{.Names}}' | grep -Fxq supabase_db_cp5-local; then
            docker exec supabase_db_cp5-local psql -U supabase_admin -d template1 -X -v ON_ERROR_STOP=1 -c 'alter database postgres with allow_connections true'
            psql "$PGURL" -X -At -v ON_ERROR_STOP=1 -c "select json_build_object('auth_users',(select count(*) from auth.users),'app_users',(select count(*) from erp.app_users),'remaining_clone_databases',(select count(*) from pg_database where datname='cp6_rollback'),'production_go',false)" > cp6-proof/AD_FINAL_BOUNDARY.json
            python - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('cp6-proof/AD_FINAL_BOUNDARY.json').read_text())
          assert r['auth_users']==r['app_users']==r['remaining_clone_databases']==0
          PY
          fi
      - name: Stop disposable stack and prove physical removal
        if: always()
        working-directory: candidate
        run: |
          set -euo pipefail
          mkdir -p ../audit-harness/cp6-proof
          if test -f cp5-local/supabase/config.toml; then supabase stop --workdir cp5-local --no-backup; fi
          remaining="$(docker ps -aq --filter name='^/supabase_db_cp5-local$')"
          test -z "$remaining"
          printf 'status=PASS\nremaining_database_container=0\nproduction_go=false\n' > ../audit-harness/cp6-proof/AD_PHYSICAL_CLEANUP.txt
      - name: Bind complete writer proof and create lossless transfer
        working-directory: audit-harness
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/cp6_v2620ad_proof.py
      - name: Preserve every failed or successful native attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp6-ad-raw-attempt
          path: audit-harness/cp6-proof
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
      - name: Preserve qualified lossless writer transfer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cp6-ad-lossless-transfer
          path: audit-harness/cp6-ad-transfer
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
