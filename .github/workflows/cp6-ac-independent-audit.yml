name: CP6 AC Independent Date Family Audit

on:
  push:
    branches: [competition/cp6-j-closure-20260911]
    paths:
      - .github/workflows/cp6-ac-independent-audit.yml
      - scripts/cp6_ac_independent_audit.py
      - scripts/cp6_ac_audit_bootstrap.py

permissions:
  contents: read
  actions: read

concurrency:
  group: cp6-ac-independent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CP6_AC_INDEPENDENT_CONFIRM: postgres
      CP6_DATABASE_CONTAINER: supabase_db_cp5-local
      CP6_AUDIT_HARNESS_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout audit harness
        uses: actions/checkout@v4
        with:
          path: audit-harness
          fetch-depth: 0
      - name: Checkout immutable AC business candidate
        uses: actions/checkout@v4
        with:
          path: candidate
          ref: 1bdca3766f7c9800d68295ff5122798060b8a05d
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install disposable validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet 'psycopg[binary]==3.2.10' 'PyYAML==6.0.2'
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ca-certificates curl gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          key_fingerprint="$(gpg --show-keys --with-colons \
            /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$key_fingerprint" = 'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'
          . /etc/os-release
          architecture="$(dpkg --print-architecture)"
          sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<EOF
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: ${VERSION_CODENAME}-pgdg
          Architectures: ${architecture}
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          test -x /usr/lib/postgresql/17/bin/pg_dump
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
          python -m pip install --quiet 'psycopg[binary]==3.2.10'
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
      - name: Start pinned disposable Supabase
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1bdca3766f7c9800d68295ff5122798060b8a05d
          test "$(git rev-parse HEAD^{tree})" = 334629c626257b8b713826f491cdf62385d5299b
          test -z "$(git status --porcelain)"
          mkdir cp5-local
          supabase init --force --workdir cp5-local
          mkdir -p cp5-local/supabase/.temp
          echo '17.6.1.165' > cp5-local/supabase/.temp/postgres-version
          sed -i '0,/^enable_signup = true$/s//enable_signup = false/' cp5-local/supabase/config.toml
          supabase start --workdir cp5-local -x realtime,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor
      - name: Restore admitted AC runtime without historical matrix execution
        working-directory: candidate
        env:
          GITHUB_SHA: 1bdca3766f7c9800d68295ff5122798060b8a05d
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export CP6_AC_WRITER_ARTIFACT="$RUNNER_TEMP/ac-native200.zip"
          gh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10392910720/zip > "$CP6_AC_WRITER_ARTIFACT"
          PYTHONPATH=scripts python ../audit-harness/scripts/cp6_ac_audit_bootstrap.py
      - name: Run independent opening and attendance family cases
        working-directory: candidate
        env:
          GITHUB_SHA: 1bdca3766f7c9800d68295ff5122798060b8a05d
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python ../audit-harness/scripts/cp6_ac_independent_audit.py
      - name: Verify source and fixture cleanup
        if: always()
        working-directory: candidate
        run: |
          set -euo pipefail
          mkdir -p cp6-proof
          test -z "$(git diff --name-only)"
          if docker ps --format '{{.Names}}' | grep -Fxq supabase_db_cp5-local; then
            psql "$PGURL" -X -At -v ON_ERROR_STOP=1 -c "select json_build_object('auth_users',(select count(*) from auth.users),'app_users',(select count(*) from erp.app_users),'source_unchanged',true,'production_go',false)" > cp6-proof/AC_AUDIT_FINAL_BOUNDARY.json
            python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('cp6-proof/AC_AUDIT_FINAL_BOUNDARY.json').read_text())
          assert r['auth_users']==r['app_users']==0
          PY
          fi
      - name: Stop disposable stack and prove removal
        if: always()
        working-directory: candidate
        run: |
          set -euo pipefail
          mkdir -p cp6-proof
          if test -f cp5-local/supabase/config.toml; then supabase stop --workdir cp5-local --no-backup; fi
          remaining="$(docker ps -aq --filter name='^/supabase_db_cp5-local$')"
          test -z "$remaining"
          printf 'status=PASS\nremaining_database_container=0\nproduction_go=false\n' > cp6-proof/AC_AUDIT_PHYSICAL_CLEANUP.txt
      - name: Preserve every independent case and bootstrap log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp6-ac-independent-date-family
          path: candidate/cp6-proof
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
