name: Uji backup sintetis

on:
  push:
    branches: [writer-a/cp7c-backup-publik]
    paths:
      - '.github/workflows/cp7c-backup-sintetis.yml'
      - 'qualification/cp7c-backup-sintetis/**'

permissions:
  contents: read

jobs:
  simulate:
    name: Integritas backup sintetis dan pecah-gabung 250 MB
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /qualification/cp7c-backup-sintetis/
      - name: Siapkan simulator sementara
        run: |
          python3 -m venv "$RUNNER_TEMP/checks"
          "$RUNNER_TEMP/checks/bin/python" -m pip install --quiet 'boto3==1.40.76' 'moto[s3]==5.1.17'
      - name: Jalankan tes dengan penyimpanan simulasi
        run: |
          "$RUNNER_TEMP/checks/bin/python" qualification/cp7c-backup-sintetis/test_transfer.py -v
      - name: Uji pecah-gabung Box dengan data buatan sampai 600 MB
        run: |
          if ! command -v rclone >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends rclone
          fi
          rclone version
          "$RUNNER_TEMP/checks/bin/python" qualification/cp7c-backup-sintetis/test_box_parts.py -v
