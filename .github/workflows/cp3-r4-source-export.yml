name: CP3 R4 Source Export

on:
  push:
    branches:
      - cp3/hpp-attendance-sewing-terminal-r4-20260901
    paths:
      - .github/workflows/cp3-r4-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package exact R4 starting source
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > /tmp/CP3_R4_EXPORT_HEAD.txt
          tar --exclude=.git -C "$GITHUB_WORKSPACE" -czf /tmp/cp3-r4-source.tar.gz .
          sha256sum /tmp/cp3-r4-source.tar.gz /tmp/CP3_R4_EXPORT_HEAD.txt > /tmp/CP3_R4_EXPORT_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cp3-r4-source-export
          path: |
            /tmp/cp3-r4-source.tar.gz
            /tmp/CP3_R4_EXPORT_HEAD.txt
            /tmp/CP3_R4_EXPORT_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
