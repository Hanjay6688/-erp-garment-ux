name: CP3.5 Bootstrap Source Backup

on:
  push:
    branches:
      - cp3.5/canonical-cleanup-r1-20260901
    paths:
      - .github/workflows/cp3-5-bootstrap-source-backup.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout packaging branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind exact reviewed R5 source
        shell: bash
        env:
          SOURCE_SHA: 469f48a0724b447fc397a2a932c4872c2ed27488
          SOURCE_TREE: c993c11f3500ae7f0b666d3fe9d60a1a032144a6
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_SHA}^{commit}"
          test "$(git rev-parse "${SOURCE_SHA}^{tree}")" = "${SOURCE_TREE}"
          git fetch --prune origin             '+refs/heads/*:refs/remotes/origin/*'             '+refs/tags/*:refs/tags/*'

      - name: Create exact source archive and repository bundle
        shell: bash
        env:
          SOURCE_SHA: 469f48a0724b447fc397a2a932c4872c2ed27488
          SOURCE_TREE: c993c11f3500ae7f0b666d3fe9d60a1a032144a6
        run: |
          set -euo pipefail
          mkdir -p backup
          git archive --format=zip             --prefix=erp-garment-r5-source/             --output=backup/erp-garment-r5-source.zip             "${SOURCE_SHA}"
          git bundle create backup/erp-garment-repository-all-history.bundle --all
          sha256sum             backup/erp-garment-r5-source.zip             backup/erp-garment-repository-all-history.bundle             > backup/SHA256SUMS.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "status": "PASS",
              "repository": "Hanjay6688/-erp-garment-ux",
              "source_branch": "cp3/hpp-attendance-sewing-terminal-r5-integration-20260901",
              "source_sha": os.environ["SOURCE_SHA"],
              "source_tree": os.environ["SOURCE_TREE"],
              "packaging_branch": os.environ["GITHUB_REF_NAME"],
              "packaging_commit": os.environ["GITHUB_SHA"],
              "source_archive_exact_commit": True,
              "git_bundle_all_visible_refs": True,
          }
          Path("backup/SOURCE_MANIFEST.json").write_text(
              json.dumps(manifest, indent=2) + "\n"
          )
          PY
          unzip -tq backup/erp-garment-r5-source.zip
          git bundle verify backup/erp-garment-repository-all-history.bundle

      - name: Upload exact source and history
        uses: actions/upload-artifact@v4
        with:
          name: cp3-5-r5-source-and-history
          path: backup
          if-no-files-found: error
          retention-days: 14
