name: CP7C Nightly Backup (template, not installed)
# Owner decisions 9 Oct 2026 WIB ("backup malam yang sudah disepakati") and 13 Oct 2026 (D13-5/6/7): one full backup of
# the ERP database every night at 01:00 WIB, encrypted and copied to a private store outside the database (any rclone
# remote: Google Drive or Cloudflare R2), fetched back from that store, restored on this runner's own PostgreSQL of the
# same version and compared with the source (data, structure, owner, ACL), newest 14 verified nights kept on the store.
# Tool: scripts/cp7_offsite_backup.py, tested on disposable servers by CP7 Offsite Backup (.github/workflows/cp7-offsite-backup.yml).
# The same-server tool scripts/cp7_nightly_backup.py stays tested by k3-cleanup-24 (K3C_RACE_NIGHTLY_BACKUP_VERIFIED,
# K3C_RACE_BACKUP_RETRY_SAME_SECOND, K3C_RACE_BACKUP_SCRATCH_OWNERSHIP_BY_OID); its scratch rules are reused here.
# Installing it waits for the audit and the owner's installation permission: until the repository variable
# CP7_NIGHTLY_BACKUP_INSTALLED is 'true' this job never runs, and the schedule below stays commented out.
# At installation the owner stores, in the repository settings (never in chat):
#   secret   CP7_BACKUP_SOURCE_URL      read access to the production database (Supabase session pooler, IPv4)
#   secret   CP7_BACKUP_RCLONE_CONFIG   the rclone configuration of the private store
#   secret   CP7_BACKUP_PASSPHRASE      the encryption passphrase; the owner also keeps it offline, without it no
#                                       backup can be restored
#   variable CP7_BACKUP_REMOTE          e.g. erpbackup:erp-garment-backup/nightly
#   variable CP7_BACKUP_SCRATCH_IMAGE   the Supabase Postgres image of the production version
# The job prints one line of codes and counts; the dump never goes to the log, an artifact or the repository.
on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: '0 18 * * *'   # 01:00 WIB nightly — enabled only at the approved installation
permissions:
  contents: read
concurrency:
  group: cp7-nightly-backup
  cancel-in-progress: false
jobs:
  backup:
    if: ${{ vars.CP7_NIGHTLY_BACKUP_INSTALLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Client tools (PostgreSQL 17 client, rclone, gpg)
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq ca-certificates curl gnupg rclone
        sudo install -d /usr/share/postgresql-common/pgdg
        sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
          https://www.postgresql.org/media/keys/ACCC4CF8.asc
        test "$(gpg --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc | awk -F: '$1 == "fpr" { print $10; exit }')" \
          = 'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'
        . /etc/os-release
        echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
          | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
        sudo apt-get update -qq
        sudo apt-get install -y -qq postgresql-client-17
        echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
        python -m pip install --quiet 'psycopg[binary]==3.2.10'
    - name: Scratch server on this runner (same Supabase Postgres image as production)
      shell: bash
      env:
        CP7_BACKUP_SCRATCH_IMAGE: ${{ vars.CP7_BACKUP_SCRATCH_IMAGE }}
      run: |
        set -euo pipefail
        pw="$(openssl rand -hex 24)"
        echo "::add-mask::$pw"
        docker run -d --name cp7_backup_scratch -p 127.0.0.1:54339:5432 -e POSTGRES_PASSWORD="$pw" "$CP7_BACKUP_SCRATCH_IMAGE" >/dev/null
        for i in $(seq 1 90); do
          psql "postgresql://postgres:$pw@127.0.0.1:54339/postgres" -Atc 'select 1' >/dev/null 2>&1 && break
          if [ "$i" = 90 ]; then echo CP7_BACKUP_SCRATCH_NOT_READY; exit 1; fi
          sleep 2
        done
        # postgres is not a superuser in this image; the throwaway scratch server gets its own superuser for the restore.
        admin="$(openssl rand -hex 24)"
        echo "::add-mask::$admin"
        docker exec -i cp7_backup_scratch psql -U supabase_admin -d postgres -X -q -v ON_ERROR_STOP=1 -v pw="$admin" \
          <<< "create role cp7_scratch_admin login superuser password :'pw';"
        echo "CP7_BACKUP_SCRATCH_URL=postgresql://cp7_scratch_admin:$admin@127.0.0.1:54339/postgres" >> "$GITHUB_ENV"
    - name: Backup, encrypt, store, fetch back, restore-verify, keep newest verified nights
      shell: bash
      env:
        CP7_BACKUP_SOURCE_URL: ${{ secrets.CP7_BACKUP_SOURCE_URL }}
        CP7_BACKUP_RCLONE_CONFIG: ${{ secrets.CP7_BACKUP_RCLONE_CONFIG }}
        CP7_BACKUP_PASSPHRASE: ${{ secrets.CP7_BACKUP_PASSPHRASE }}
        CP7_BACKUP_REMOTE: ${{ vars.CP7_BACKUP_REMOTE }}
      run: |
        set -euo pipefail
        umask 077
        printf '%s\n' "$CP7_BACKUP_RCLONE_CONFIG" > "$RUNNER_TEMP/rclone.conf"
        printf '%s' "$CP7_BACKUP_PASSPHRASE" > "$RUNNER_TEMP/backup.pass"
        python scripts/cp7_offsite_backup.py --source-url "$CP7_BACKUP_SOURCE_URL" --scratch-admin-url "$CP7_BACKUP_SCRATCH_URL" \
          --remote "$CP7_BACKUP_REMOTE" --passphrase-file "$RUNNER_TEMP/backup.pass" --rclone-config "$RUNNER_TEMP/rclone.conf" --keep 14
    - name: Remove secrets and the scratch server
      if: always()
      run: |
        rm -f "$RUNNER_TEMP/rclone.conf" "$RUNNER_TEMP/backup.pass"
        docker rm -f cp7_backup_scratch >/dev/null 2>&1 || true
