        import hashlib,json,re
        from pathlib import Path
        source=Path('supabase/tests')
        output=Path('cp6-proof/ui-fixture')
        output.mkdir(parents=True,exist_ok=True)
        names=['cp3_r3_full_schema_seed.sql','cp3_r4_full_schema_seed.sql','cp6_laundry_qc_concurrency_seed.sql']
        pattern=re.compile(r'\b([0-9a-f]{8}-[0-9a-f]{4})-0000-0000-([0-9a-f]{12})\b')
        manifest=[]
        mapping={}
        for name in names:
            text=(source/name).read_text()
            def canonical(match):
                replacement=match[1]+'-4000-8000-'+match[2]
                assert replacement not in text
                mapping[match[0]]=replacement
                return replacement
            qualified,count=pattern.subn(canonical,text)
            (output/name).write_text(qualified)
            manifest.append(dict(file=name,replacements=count,
                original_sha256=hashlib.sha256(text.encode()).hexdigest(),
                qualified_sha256=hashlib.sha256(qualified.encode()).hexdigest()))
        assert mapping and len(set(mapping.values()))==len(mapping)
        Path('cp6-proof/final-audit/UI_FIXTURE.json').write_text(json.dumps(dict(
            transformation='Synthetic UUID version/variant only, before insertion into fresh clone',
            sources=manifest,unique_ids=len(mapping),schema_acl_modified=False,
            admitted_sources_modified=False,production_go=False),indent=2)+'\n')
