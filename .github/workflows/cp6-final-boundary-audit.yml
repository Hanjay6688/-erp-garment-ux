name: CP6 Final Boundary Audit
'on':
  push:
    branches:
    - competition/cp6-j-closure-20260911
    paths:
    - .github/workflows/cp6-final-boundary-audit.yml
    - scripts/cp6_final_crossflow_review.py
    - scripts/cp6_final_gap_native.py
    - scripts/cp6_final_gap_midnight.py
    - scripts/cp6_final_gap_ui.mjs
    - scripts/cp6_frontend_recovery*
    - scripts/cp6_foundation_qualification.py
    - tests/fixtures/productionRecovery.ts
    - scripts/cp6_final_independent_acceptance.py
    - scripts/cp6_final_ak_independent.py
    - scripts/cp6_final_money_independent.mjs
    - scripts/cp6_v2620aj_*.py
    - scripts/cp6_v2620ak_*.py
    - scripts/cp6_v2620al_*.py
    - scripts/cp6_v2620am_*.py
    - supabase/migrations/*20am*
    - supabase/rollbacks/*20am*
    - docs/evidence/cp6-am-*.json
    - supabase/migrations/*20al*
    - supabase/rollbacks/*20al*
    - docs/evidence/cp6-al-*.json
    - supabase/migrations/*20ak*
    - supabase/rollbacks/*20ak*
    - docs/evidence/cp6-ak-*.json
    - scripts/cp6_preuse_rollback_maintenance.py
    - supabase/migrations/*20aj*
    - supabase/rollbacks/*20aj*
    - docs/evidence/cp6-aj-*.json
    - scripts/cp6_disposable_ui_e2e.mjs
    - scripts/cp6_disposable_ui_scope.py
    - scripts/assert-cp6-disposable-env.mjs
    - docs/evidence/cp6-disposable-ui-source-pins.json
    - src/**
    - package.json
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: cp6-final-boundary-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CP6_AC_INDEPENDENT_CONFIRM: postgres
      CP6_AF_INDEPENDENT_CONFIRM: postgres
      CP6_AF_HARNESS_HEAD: ${{ github.sha }}
      CP6_AUDIT_HARNESS_HEAD: ${{ github.sha }}
      CP6_DATABASE_CONTAINER: supabase_db_cp5-local
      CP6_MAINTENANCE_PGURL: postgresql://postgres:postgres@127.0.0.1:54322/template1
      CP6_ROLLBACK_RACE_PGURL: postgresql://postgres:postgres@127.0.0.1:54322/cp6_rollback
      CP6_MAINTENANCE_CONFIRM_DATABASE: postgres
      CP6_MAINTENANCE_ALLOW_SYSTEM_DATABASE: postgres
      CP6_AH_CONFIRM: postgres
      CP6_AI_CONFIRM: postgres
      CP6_AH_INDEPENDENT_CONFIRM: postgres
      CP6_AI_INDEPENDENT_CONFIRM: postgres
      CP6_AUTH_PGURL: postgresql://postgres:postgres@127.0.0.1:54322/cp6_auth
      CP6_AUTH_REPORT: cp6-proof/final-audit/HTTP.json
      CP6_REPAIR_AJ: 'true'
      CP6_AJ_REPAIR_FOLLOWUP: 'false'
      CP6_RUNTIME_GENERATION: ${{ (contains(github.event.head_commit.message, '[cp6-am-full]') || contains(github.event.head_commit.message, '[cp6-am-followup]')) && 'AM' || 'AL' }}
      CP6_RUNTIME_HEAD: ${{ github.sha }}
      CP6_UI_FOCUSED: ${{ contains(github.event.head_commit.message, '[cp6-ui-focused]') }}
      CP6_QUALIFICATION_ONLY: ${{ contains(github.event.head_commit.message, '[cp6-foundation-focused]') }}
      CP6_AM_TRIAL: ${{ contains(github.event.head_commit.message, '[cp6-am-trial]') }}
      CP6_AM_FULL: ${{ (contains(github.event.head_commit.message, '[cp6-am-full]') || contains(github.event.head_commit.message, '[cp6-am-followup]')) }}
      CP6_AM_FOLLOWUP: ${{ contains(github.event.head_commit.message, '[cp6-am-followup]') }}
    steps:
    - name: Checkout exact AI candidate
      uses: actions/checkout@v4
      with:
        path: candidate
        fetch-depth: 0
        ref: 25fa4736329e5148dfdb3572bc169952cba23251
    - name: Checkout independent harness
      uses: actions/checkout@v4
      with:
        path: harness
        fetch-depth: 0
    - name: Checkout immutable AC runtime source
      uses: actions/checkout@v4
      with:
        path: base
        ref: 1bdca3766f7c9800d68295ff5122798060b8a05d
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Bind immutable runtime tree
      working-directory: harness
      run: |
        set -euo pipefail
        mkdir -p ../candidate/cp6-proof/final-audit
        python - <<'PYTREE'
        import os,subprocess
        with open(os.environ['GITHUB_ENV'],'a') as out:
            out.write('CP6_RUNTIME_TREE='+subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()+'\n')
        PYTREE
    - name: Qualify disposable frontend and install browser
      if: ${{ env.CP6_AM_FOLLOWUP != 'true' }}
      working-directory: harness
      run: |
        set -euo pipefail
        npm ci
        mkdir -p ../candidate/cp6-proof/final-audit
        npm test -- --reporter=dot --reporter=json --outputFile=../candidate/cp6-proof/final-audit/FRONTEND_UNIT_DOM.json
        node --experimental-strip-types scripts/cp6_final_money_independent.mjs ../candidate/cp6-proof/final-audit/MONEY_INDEPENDENT.json
        npm run test:security
        npm run build
        npx playwright install --with-deps chromium
        npm run test:browser:cp5
        npm run test:browser:cp6
        npx --yes agent-browser@0.38.0 --version
    - name: Install pinned disposable runtime
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --quiet 'psycopg[binary]==3.2.10' 'PyYAML==6.0.2'
        sudo apt-get update -qq
        sudo apt-get install -y -qq ca-certificates curl gnupg
        sudo install -d /usr/share/postgresql-common/pgdg
        sudo curl --fail --silent --show-error \
          -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
          https://www.postgresql.org/media/keys/ACCC4CF8.asc
        key_fingerprint="$(gpg --show-keys --with-colons \
          /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
          | awk -F: '$1 == "fpr" { print $10; exit }')"
        test "$key_fingerprint" = 'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'
        . /etc/os-release
        architecture="$(dpkg --print-architecture)"
        sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<EOF
        Types: deb
        URIs: https://apt.postgresql.org/pub/repos/apt
        Suites: ${VERSION_CODENAME}-pgdg
        Architectures: ${architecture}
        Components: main
        Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
        EOF
        sudo apt-get update -qq
        sudo apt-get install -y -qq postgresql-client-17
        test -x /usr/lib/postgresql/17/bin/psql
        echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
    - name: Install pinned Supabase CLI
      uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
      with:
        version: 2.116.0
    - name: Verify unchanged AI-R2 backend and bounded writer UI scope
      shell: bash
      run: |
        set -euo pipefail
        (cd harness && python scripts/cp6_disposable_ui_scope.py)
        (cd candidate && python scripts/cp6_ai_gate_scope.py)
        # Require an explicit AM trial or complete AM runtime regression.
        test "$CP6_AM_TRIAL" = 'true' || test "$CP6_AM_FULL" = 'true'
    - name: Admit qualification-only source boundary
      if: ${{ env.CP6_QUALIFICATION_ONLY == 'true' }}
      working-directory: harness
      run: |
        set -euo pipefail
        python - <<'PY'
        import json,subprocess
        from pathlib import Path
        baseline='79587cc225cc70391bf59beb146696229a77702b'
        allowed={'.github/workflows/cp6-final-boundary-audit.yml',
          'scripts/cp6_foundation_qualification.py',
          'docs/evidence/cp6-disposable-ui-source-pins.json','docs/cp6-frontend-recovery.md'}
        git=lambda *a:subprocess.check_output(['git',*a],text=True).strip()
        assert git('merge-base',baseline,'HEAD')==baseline
        changed=set(git('diff','--name-only',baseline,'HEAD').splitlines())
        assert changed <= allowed,changed-allowed
        Path('../candidate/cp6-proof/final-audit/QUALIFICATION_SCOPE.json').write_text(json.dumps(dict(
          status='QUALIFICATION_ONLY',candidate_head=git('rev-parse','HEAD'),
          unchanged_product_baseline=baseline,product_backend_unchanged=True,
          original_al_business230_reexecuted=False,al_full_family_acceptance=False,
          global_cp6_acceptance=False,production_go=False),indent=2)+'\n')
        PY
    - name: Create next migration stamp with pinned CLI in empty scratch directory
      if: ${{ env.CP6_AM_TRIAL != 'true' && env.CP6_AM_FOLLOWUP != 'true' }}
      working-directory: harness
      run: |
        set -euo pipefail
        cli_work="$RUNNER_TEMP/cp6-next-migration"
        mkdir -p "$cli_work" ../candidate/cp6-proof/final-audit/next-migration
        supabase --version > ../candidate/cp6-proof/final-audit/next-migration/CLI_VERSION.txt
        test "$(cat ../candidate/cp6-proof/final-audit/next-migration/CLI_VERSION.txt)" = '2.116.0'
        supabase migration new erp_v2_6_20an_cp6_cutting_selectors --workdir "$cli_work"
        cp "$cli_work"/supabase/migrations/*_erp_v2_6_20an_cp6_cutting_selectors.sql \
          ../candidate/cp6-proof/final-audit/next-migration/
    - name: Admit AM SQL trial without treating it as a full product gate
      if: ${{ env.CP6_AM_TRIAL == 'true' || env.CP6_AM_FULL == 'true' }}
      working-directory: harness
      run: |
        python - <<'PY'
        import json,os,subprocess
        from pathlib import Path
        baseline='4e74e25270c6a062d98e1adaa58cf50ea22e2e8c'
        git=lambda *a:subprocess.check_output(['git',*a],text=True).strip()
        assert git('merge-base',baseline,'HEAD')==baseline
        assert not git('diff','--name-only',baseline,'HEAD','--','src','tests','package.json','package-lock.json')
        assert not git('diff','--name-only','--diff-filter=MDRTCUXB',baseline,'HEAD','--','supabase')
        expected={'supabase/migrations/20260921214120_erp_v2_6_20am_cp6_transfer_integrity.sql',
          'supabase/rollbacks/20260921214120_erp_v2_6_20am_cp6_transfer_integrity.rollback.sql'}
        assert set(git('diff','--name-only',baseline,'HEAD','--','supabase').splitlines())==expected
        Path('../candidate/cp6-proof/final-audit/AM_TRIAL_SCOPE.json').write_text(json.dumps(dict(
          status='AM_FULL_REGRESSION_REQUIRED' if os.environ['CP6_AM_FULL']=='true' else 'AM_SQL_TRIAL_ONLY',candidate_head=git('rev-parse','HEAD'),
          unchanged_frontend_and_installed_al_baseline=baseline,am_installed_only_inside_uncommitted_trial=os.environ['CP6_AM_FULL']!='true',
          original_al_business230_reexecuted=False,am_full_family_acceptance=False,
          global_cp6_acceptance=False,production_go=False),indent=2)+'\n')
        PY
    - name: Verify exact completed AM evidence and unchanged product for follow-up
      if: ${{ env.CP6_AM_FOLLOWUP == 'true' }}
      working-directory: candidate
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10668124130/zip > "$RUNNER_TEMP/am-combined.zip"
        python ../harness/scripts/cp6_v2620am_followup.py --reuse "$RUNNER_TEMP/am-combined.zip"
    - name: Verify original ordinary staged QC counterexample
      working-directory: harness
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        gh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10460209095/zip > "$RUNNER_TEMP/cp6-ui-qc-original.zip"
        python - <<'PY'
        import hashlib,json,os,re,subprocess,zipfile
        from pathlib import Path
        p=Path(os.environ['RUNNER_TEMP'])/'cp6-ui-qc-original.zip'
        digest=hashlib.sha256(p.read_bytes()).hexdigest()
        assert p.stat().st_size==2491309
        assert digest=='d06eebd9d9089c81b3f5d8f627fbfae5a5c8804331cda4d862b83d7947eb4088'
        with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            for name in z.namelist():
                assert not re.search(rb'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+|-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY',z.read(name)),name
            r=json.loads(z.read('candidate/cp6-proof/final-audit/UI.json'))
            assert r['backend_head']=='25fa4736329e5148dfdb3572bc169952cba23251'
            assert r['frontend_head']=='68db9a5387cb993921476433a964b68fa6d08521'
            assert r['status']=='INCOMPLETE' and len(r['completed'])==8 and len(r['planned_case_ids'])==36
            case=r['rejected_mutation']
            assert case['http_status']==400 and case['response']['code']=='P0001'
            assert case['response']['message']=='CP6 completion_mode PARTIAL_SELECTION conflicts with authoritative ready-for-QC remainder 0 after atomic posting'
            payload=case['request']['p_payload']
            assert payload['good_qty_pcs']==3 and payload['completion_mode']=='PARTIAL_SELECTION'
            assert case['state_before']==case['state_after']
            for key,value in {'fg_qty':5,'fg':35,'wip':35,'accrued':-70,'posted_qc':1,'fg_movements':1,'journal_rows':4,'unbalanced':0,'execution_context':0}.items():
                assert case['state_after'][key]==value
            original=subprocess.check_output(['git','show','25fa4736329e5148dfdb3572bc169952cba23251:src/ConnectedQcFinalPage.tsx'])
            assert hashlib.sha256(original).hexdigest()==case['qc_ui_source_sha256']=='7d5ed652ce85d287ee5954800e16c2756633f5df37612e831dac978fb485897c'
            assert r['cleanup']['status']=='PASS'
        output=Path('../candidate/cp6-proof/final-audit/ORIGINAL_QC_COUNTEREXAMPLE.json')
        output.parent.mkdir(parents=True,exist_ok=True)
        output.write_text(json.dumps(dict(status='COUNTEREXAMPLE_VERIFIED',artifact_id=10460209095,sha256=digest,zip_crc='PASS',token_pattern_scan='PASS',
            original_ui_source_sha256=case['qc_ui_source_sha256'],completed=8,planned=36,rejection=case['response'],atomic_state=case['state_after'],
            new_candidate_acceptance=False,production_go=False),indent=2)+'\n')
        print('CP6 original ordinary QC counterexample verified: exact ZIP, CRC, original UI source, HTTP refusal and atomic state')
        PY
    - name: Start disposable database
      working-directory: base
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = 1bdca3766f7c9800d68295ff5122798060b8a05d
        test "$(git rev-parse HEAD^{tree})" = 334629c626257b8b713826f491cdf62385d5299b
        test -z "$(git status --porcelain)"
        supabase --help >/dev/null
        supabase init --help >/dev/null
        supabase start --help >/dev/null
        mkdir cp5-local
        supabase init --force --workdir cp5-local
        mkdir -p cp5-local/supabase/.temp
        echo '17.6.1.165' > cp5-local/supabase/.temp/postgres-version
        sed -i '0,/^enable_signup = true$/s//enable_signup = false/' cp5-local/supabase/config.toml
        supabase start --workdir cp5-local \
          -x realtime,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor \
          > "$RUNNER_TEMP/cp6-local-start.log" 2>&1
    - name: Verify exact incoming AF writer proof
      working-directory: candidate
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p cp6-proof/independent-af cp6-proof/writer-ae cp6-proof/writer-af
        gh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10429202482/zip > "$RUNNER_TEMP/af-writer.zip"
        python - <<'PYVERIFY'
        from pathlib import Path
        import os,hashlib,zipfile,json
        p=Path(os.environ['RUNNER_TEMP'])/'af-writer.zip'
        assert p.stat().st_size==45580397
        assert hashlib.sha256(p.read_bytes()).hexdigest()=='f35be1721e99df6ce2c03662b1ae6856f38e9886dcfc8fe5165ba12e2737696c'
        with zipfile.ZipFile(p) as z:
         assert z.testzip() is None
         for phase,count in {'admission':7,'focused':30,'detector':11,'crossflow':134}.items():
          r=json.loads(z.read('candidate/cp6-proof/writer-af/'+phase+'.json'))
          assert r['head']=='f46699865501b03f9fba3a8b188f3fd01eedf404' and r['status']=='PASS' and r['passed']==count and r['failed']==0
         r=json.loads(z.read('candidate/cp6-proof/AF_MAINTENANCE_ROLLBACK/manifest.json'))
         assert r['status']=='PASS' and r['completed_case_count']==20
        Path('cp6-proof/independent-af/INCOMING_WRITER.json').write_text(json.dumps({'status':'REUSED_VERIFIED_AF_NATIVE10','artifact_id':10429202482,'artifact_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'historical_matrix_reexecuted':False,'production_go':False},indent=2)+'\n')
        PYVERIFY
    - name: Restore exact AC runtime
      working-directory: base
      env:
        GITHUB_SHA: 1bdca3766f7c9800d68295ff5122798060b8a05d
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        export CP6_AC_WRITER_ARTIFACT="$RUNNER_TEMP/ac-native200.zip"
        gh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10392910720/zip \
          > "$CP6_AC_WRITER_ARTIFACT"
        PYTHONPATH=scripts python ../candidate/scripts/cp6_ac_audit_bootstrap.py
    - name: Apply exact AD predecessor
      working-directory: candidate
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p cp6-proof/writer-ae
        psql "$PGURL" -X -v ON_ERROR_STOP=1 \
          -f supabase/migrations/20260915113627_erp_v2_6_20ad_cp6_opening_material_business_day.sql \
          > cp6-proof/writer-ae/AD_APPLY.log 2>&1
        PYTHONPATH=scripts python - <<'PY'
        import os
        import psycopg
        import cp6_v2620ad_runtime as runtime
        with psycopg.connect(os.environ['PGURL']) as connection, connection.cursor() as cur:
            cur.execute(
                'insert into supabase_migrations.schema_migrations(version,name,statements) '
                'values(%s,%s,%s)',
                (runtime.STAMP, runtime.NAME, [runtime.MIGRATION.read_text()]),
            )
            assert len(runtime.verified_successor(cur)) == 274
        PY
    - name: Apply exact AE comparison runtime
      working-directory: candidate
      shell: bash
      run: |
        set -euo pipefail
        psql "$PGURL" -X -v ON_ERROR_STOP=1 \
          -f supabase/migrations/20260915201500_erp_v2_6_20ae_cp6_opening_roll_integrity.sql \
          > cp6-proof/writer-ae/AE_APPLY.log 2>&1
        PYTHONPATH=scripts python - <<'PY'
        import os
        import psycopg
        import cp6_v2620ae_runtime as runtime
        with psycopg.connect(os.environ['PGURL']) as connection, connection.cursor() as cur:
            cur.execute(
                'insert into supabase_migrations.schema_migrations(version,name,statements) '
                'values(%s,%s,%s)',
                (runtime.STAMP, runtime.NAME, [runtime.MIGRATION.read_text()]),
            )
            assert len(runtime.verified_successor(cur)) == 276
        PY
    - name: Install AF and bind exact 278-object runtime
      working-directory: candidate
      shell: bash
      run: |
        set -euo pipefail
        psql "$PGURL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260916014332_erp_v2_6_20af_cp6_posted_child_integrity.sql > cp6-proof/writer-af/AF_APPLY.log 2>&1
        PYTHONPATH=scripts python - <<'PYINSTALL'
        import os,psycopg
        import cp6_v2620af_runtime as r
        with psycopg.connect(os.environ['PGURL']) as conn,conn.cursor() as cur:
         cur.execute('insert into supabase_migrations.schema_migrations(version,name,statements) values(%s,%s,%s)',(r.STAMP,r.NAME,[r.MIGRATION.read_text()]))
         assert len(r.verified_successor(cur))==278
        PYINSTALL
    - name: Verify exact AG writer and original return counterexample artifacts
      working-directory: candidate
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        set -euo pipefail
        mkdir -p cp6-proof/writer-ah
        # Evidence is read and hashed, never executed as SQL.
        gh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10432153459/zip > "$RUNNER_TEMP/ag-writer.zip"
        gh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10434213550/zip > cp6-proof/writer-ah/AG_ORIGINAL_RETURN_COUNTEREXAMPLE.zip
        python - <<'PYVERIFY'
        from pathlib import Path
        import os,hashlib,zipfile,json
        p=Path(os.environ['RUNNER_TEMP'])/'ag-writer.zip'
        assert p.stat().st_size==44481450
        assert hashlib.sha256(p.read_bytes()).hexdigest()=='c7292683dcb0729b9634f1736f1dc42d2ed56b32af6a209b569b001a20e0b469'
        with zipfile.ZipFile(p) as z:
         assert z.testzip() is None
         for phase,count in {'admission':10,'focused':51,'detector':23,'crossflow':142}.items():
          r=json.loads(z.read('candidate/cp6-proof/writer-ag/'+phase+'.json'))
          assert r['head']=='119f8f133131eaf373f08cc45b7b3d6fc27a3d3e' and r['status']=='PASS' and r['passed']==count and r['failed']==0
         r=json.loads(z.read('candidate/cp6-proof/AG_MAINTENANCE_ROLLBACK/manifest.json'))
         assert r['status']=='PASS' and r['completed_case_count']==20
        p=Path('cp6-proof/writer-ah/AG_ORIGINAL_RETURN_COUNTEREXAMPLE.zip')
        assert p.stat().st_size==44431
        assert hashlib.sha256(p.read_bytes()).hexdigest()=='2b5e604bcf42fc6185f4de50ed8be5bb6a403ec93661028e6b4ef24df39e48c3'
        with zipfile.ZipFile(p) as z:
         assert z.testzip() is None
         r=json.loads(z.read('candidate/cp6-proof/ag-residual/RESULT.json'))
         assert r['candidate_head']=='119f8f133131eaf373f08cc45b7b3d6fc27a3d3e'
         assert r['status']=='QUALIFIED_COUNTEREXAMPLE' and (r['controls'],r['counterexamples'],r['incomplete'])==(15,6,0)
         assert r['source_sha256']==hashlib.sha256(Path('scripts/cp6_ag_residual_review.py').read_bytes()).hexdigest()
        Path('cp6-proof/writer-ah/INCOMING_AG.json').write_text(json.dumps(dict(status='VERIFIED',writer_run=35060285362,counterexample_run=35066611261,historical_500_matrix_reexecuted=False,independent_ag_acceptance=False,production_go=False),indent=2)+'\n')
        PYVERIFY
    - name: Install unchanged AG predecessor and verify 690 objects
      working-directory: candidate
      run: |-
        set -euo pipefail
        psql "$PGURL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260916050822_erp_v2_6_20ag_cp6_sale_reservation_lineage.sql > cp6-proof/writer-ah/AG_APPLY.log 2>&1
