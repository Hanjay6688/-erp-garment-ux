name: Writer A - Global invoice posting 1, 10 and 100
on:
  push:
    branches: [writer-a/cp7-close12-g14-public]
    paths:
      - '.github/workflows/cp7-close12-g14.yml'
      - 'qualification/close12/check.py'
      - 'qualification/close12/candidate.json'
      - 'qualification/close12/product/**'
      - 'qualification/close11/audit_access.py'
      - 'qualification/close11/audit_job.py'
permissions:
  actions: read
  contents: read
jobs:
  ordinary:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: |
            qualification/close11
            qualification/close12
          persist-credentials: false
      - name: Checkout immutable synthetic fixture clients
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a62504d71a6ca1cdbaa59b6fe0fd5739693f100a
          sparse-checkout: |
            scripts
            src
            contracts
            supabase
            ops
            docs/cp7/d17-18
            docs/cp7/framework-v2
            docs/cp7/d17-14
            docs/evidence
          path: fixtures
          persist-credentials: false
      - name: Prepare database clients
        run: python -m pip install --quiet 'psycopg[binary]==3.2.10' 'PyYAML==6.0.2' 'jsonschema==4.25.1'
      - id: global
        name: Restore pinned synthetic Global on this runner
        uses: ./qualification/close11/open
        with:
          origin-run: '44671146483'
          origin-runner: f8520a7da6cec188540a1e52bb20ecbfaf064b19
      - name: Upgrade, measure through commit and reconcile
        working-directory: fixtures
        env:
          PGHOST: ${{ steps.global.outputs.socket }}
          WRITER_RESULTS: ${{ runner.temp }}/g14-writer-results
          PYTHONPATH: ${{ github.workspace }}/fixtures/scripts
        run: python -u "$GITHUB_WORKSPACE/qualification/close12/check.py"
      - name: Preserve Writer measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: writer-g14-originals-${{ github.run_id }}
          path: ${{ runner.temp }}/g14-writer-results/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Remove the test clone
        if: ${{ always() && steps.global.outcome == 'success' }}
        env:
          C: ${{ steps.global.outputs.container }}
        run: |
          test -n "$C"
          docker rm -f "$C"
          docker volume rm "$C-data" "$C-config"
          docker network rm "$C-network"
