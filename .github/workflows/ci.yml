name: Build UX

on:
  push:
    branches: [main, cp3.5/canonical-cleanup-r1-20260901]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:security
      - run: npm run build
      - run: npm run scan:dist
      - name: Verify Cloudflare package
        run: npx --no-install wrangler deploy --dry-run --outdir .wrangler-dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: erp-ux-dist
          path: dist
          retention-days: 3
