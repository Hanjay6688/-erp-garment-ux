name: AUDIT/SOL/cp6-g01-baseline
permissions:
  contents: read
  actions: read
concurrency:
  group: sol-full-cp6-g01-baseline-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  baseline:
    name: Rebuild test chain to v2.6.20 and fingerprint its catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CP6_AC_INDEPENDENT_CONFIRM: postgres
      CP6_DATABASE_CONTAINER: supabase_db_cp5-local
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: auditor
        fetch-depth: 0
        ref: 0b7049d9203bac52b47a4c89f3e0d75646067a8f
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: base
        fetch-depth: 0
        ref: 1bdca3766f7c9800d68295ff5122798060b8a05d
        persist-credentials: false
    - name: SOL verify frozen candidate and product identity
      working-directory: auditor
      shell: bash
      run: 'set -euo pipefail

        python - <<''PY''

        import hashlib,json,os,subprocess

        from pathlib import Path

        sha=''0b7049d9203bac52b47a4c89f3e0d75646067a8f''

        trees={''src'': ''d6553972f94a4ad4e9170e8a946b30cdac9712fd'', ''supabase'': ''5d040436db384b4e574785376367b360a084acb7'',
        ''supabase/migrations'': ''8f6053bbd0bda80da18065418ad43371cdfd9461'', ''supabase/release'': ''be1e91c172ffb5c05b694a3a54c69562700c6d5e'',
        ''supabase/dev'': ''88759f4fc51864a1ec9e224fcb4f236204b5c853'', ''supabase/rollbacks'': ''9e216e7bcca6b583341d9ea78cbc0414134ecee2'',
        ''scripts'': ''b67664091c4394b0ff6a187409d9e9b32213a0e0'', ''scripts/cp7-src'': ''7bcf45e174499f3712c67ee08788a90a8c5f7881'',
        ''.github/workflows'': ''4d7712279bfdfb6aec10dca4a216dd927875f483''}

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()==sha

        for path,want in trees.items():assert subprocess.check_output([''git'',''rev-parse'',sha+'':''+path],text=True).strip()==want,path

        assert not subprocess.check_output([''git'',''diff'',''HEAD'',''--name-only''],text=True).strip()

        d={''candidate_sha'':sha,''candidate_tree'':subprocess.check_output([''git'',''rev-parse'',''HEAD^{tree}''],text=True).strip(),''workflow_sha'':os.environ[''GITHUB_SHA''],''trees'':trees,''guide_sha256'':hashlib.sha256(Path(''docs/AUDIT_PANDUAN_PRO_MAX.md'').read_bytes()).hexdigest(),''workflow_origin'':''cp6-g01-baseline.yml'',''oracle_origin'':''UNCHANGED_PREEXISTING_PROVIDER'',''fixture_origin'':''UNCHANGED_PREEXISTING_PROVIDER'',''evidence_origin'':''INDEPENDENT_NATIVE_RERUN'',''production_go'':False}

        Path(os.environ[''RUNNER_TEMP''],''SOL_SOURCE_IDENTITY.json'').write_text(json.dumps(d,indent=2)+''\n'')

        print(json.dumps(d))

        PY

        '
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - name: Install pinned disposable runtime
      shell: bash
      run: "set -euo pipefail\npython -m pip install --quiet 'psycopg[binary]==3.2.10' 'PyYAML==6.0.2'\nsudo apt-get\
        \ update -qq\nsudo apt-get install -y -qq ca-certificates curl gnupg\nsudo install -d /usr/share/postgresql-common/pgdg\n\
        sudo curl --fail --silent --show-error \\\n  -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\
        \ \\\n  https://www.postgresql.org/media/keys/ACCC4CF8.asc\nkey_fingerprint=\"$(gpg --show-keys --with-colons\
        \ \\\n  /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \\\n  | awk -F: '$1 == \"fpr\" { print\
        \ $10; exit }')\"\ntest \"$key_fingerprint\" = 'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'\n. /etc/os-release\n\
        architecture=\"$(dpkg --print-architecture)\"\nsudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null\
        \ <<EOF\nTypes: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: ${VERSION_CODENAME}-pgdg\n\
        Architectures: ${architecture}\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n\
        EOF\nsudo apt-get update -qq\nsudo apt-get install -y -qq postgresql-client-17\ntest -x /usr/lib/postgresql/17/bin/psql\n\
        echo '/usr/lib/postgresql/17/bin' >> \"$GITHUB_PATH\"\n"
    - name: Install pinned Supabase CLI
      uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
      with:
        version: 2.116.0
    - name: Start disposable database
      working-directory: base
      shell: bash
      run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = 1bdca3766f7c9800d68295ff5122798060b8a05d\ntest \"\
        $(git rev-parse HEAD^{tree})\" = 334629c626257b8b713826f491cdf62385d5299b\ntest -z \"$(git status --porcelain)\"\
        \nmkdir cp5-local\nsupabase init --force --workdir cp5-local\nmkdir -p cp5-local/supabase/.temp\necho '17.6.1.165'\
        \ > cp5-local/supabase/.temp/postgres-version\nsed -i '0,/^enable_signup = true$/s//enable_signup = false/'\
        \ cp5-local/supabase/config.toml\n# Image pulls from ghcr.io can hit its rate limit before anything runs;\n\
        # retry the start itself (infrastructure only, no test has run yet).\n# ghcr.io can rate-limit image pulls\
        \ before anything runs. Retry the start\n# only (no test has run), falling back to the same image tags on\
        \ public.ecr.aws.\nfor attempt in 1 2 3 4; do\n  if [ \"$attempt\" -ge 2 ]; then export SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws;\
        \ fi\n  if supabase start --workdir cp5-local \\\n    -x realtime,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor\
        \ \\\n    > \"$RUNNER_TEMP/cp6-local-start.log\" 2>&1; then\n    echo \"supabase start succeeded on attempt\
        \ $attempt from ${SUPABASE_INTERNAL_IMAGE_REGISTRY:-default}\"\n    break\n  fi\n  tail -n 20 \"$RUNNER_TEMP/cp6-local-start.log\"\
        \n  supabase stop --workdir cp5-local --no-backup || true\n  if [ \"$attempt\" = 4 ]; then exit 1; fi\n\
        \  sleep $((attempt * 60))\ndone\n"
    - name: Rebuild the frozen test chain and stop after v2.6.20
      working-directory: base
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\nmkdir -p ../auditor/cp6-proof/g01\nexport CP6_AC_WRITER_ARTIFACT=\"$RUNNER_TEMP/ac-native200.zip\"\
        \ngh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10392910720/zip \\\n  > \"$CP6_AC_WRITER_ARTIFACT\"\
        \nPYTHONPATH=scripts python ../auditor/scripts/cp6_g01_baseline.py ../auditor/cp6-proof/g01/BASELINE_BUILD.json\n\
        cat ../auditor/cp6-proof/g01/BASELINE_BUILD.json\n"
    - name: Capture the read-only fingerprint and compare with hosted
      working-directory: auditor
      shell: bash
      run: "set -euo pipefail\npython scripts/cp6_g01_fingerprint.py capture cp6-proof/g01/BASELINE_V2620.json\n\
        python scripts/cp6_g01_fingerprint.py compare docs/evidence/cp6-g01/hosted_summary.json cp6-proof/g01/BASELINE_V2620.json\
        \ \\\n  | tee cp6-proof/g01/COMPARE_HOSTED_BASELINE.json\n"
    - name: Align the test baseline with hosted (G-01 option 1) and verify every changed object
      working-directory: auditor
      shell: bash
      run: 'set -euo pipefail

        # Test side only: the script asserts the local disposable endpoint and never connects to hosted.

        python scripts/cp6_g01_align.py sql > cp6-proof/g01/ALIGN.sql

        status=0

        python scripts/cp6_g01_align.py apply cp6-proof/g01/ALIGN_PER_OBJECT.json || status=$?

        cat cp6-proof/g01/ALIGN_PER_OBJECT.json

        exit "$status"

        '
    - name: Capture the aligned fingerprint and compare with hosted
      working-directory: auditor
      shell: bash
      run: "set -euo pipefail\npython scripts/cp6_g01_fingerprint.py capture cp6-proof/g01/ALIGNED_V2620.json >\
        \ cp6-proof/g01/ALIGNED_CAPTURE.log\npython scripts/cp6_g01_fingerprint.py compare docs/evidence/cp6-g01/hosted_summary.json\
        \ cp6-proof/g01/ALIGNED_V2620.json \\\n  | tee cp6-proof/g01/COMPARE_HOSTED_ALIGNED.json\n"
    - name: Remove disposable database
      if: always()
      working-directory: base
      run: supabase stop --workdir cp5-local --no-backup
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cp1-7-20261014-SOL-0b7049d9-cp6-g01-baseline-cp6-g01-baseline
        path: auditor/cp6-proof/g01
        retention-days: 30
    - name: SOL retain source identity separately
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: cp1-7-20261014-SOL-0b7049d9-cp6-g01-baseline-${{ github.job }}-${{ strategy.job-index }}-identity
        path: ${{ runner.temp }}/SOL_SOURCE_IDENTITY.json
        retention-days: 30
        if-no-files-found: warn
run-name: AUDIT/cp1-7-20261014/SOL/0b7049d9/cp6-g01-baseline/${{ github.run_attempt }}
'on':
  push:
    branches:
    - audit/sol-cp1-7-0b7049d9-20261014
    paths:
    - .github/workflows/audit-sol-full-cp6-g01-baseline.yml
  workflow_dispatch: {}
