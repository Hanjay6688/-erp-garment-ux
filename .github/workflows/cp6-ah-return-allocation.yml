name: CP6 AH Return Allocation Family
'on':
  push:
    branches:
    - competition/cp6-j-closure-20260911
    paths:
    - .github/workflows/cp6-ah-return-allocation.yml
    - scripts/cp6_v2620ah_*.py
    - scripts/cp6_ah_gate_scope.py
    - scripts/cp6_preuse_rollback_maintenance.py
    - docs/cp6-ah-competition-handoff.md
    - docs/evidence/cp6-ah-*.json
    - supabase/migrations/20260916070451_erp_v2_6_20ah_cp6_return_allocation_eligibility.sql
    - supabase/rollbacks/20260916070451_erp_v2_6_20ah_cp6_return_allocation_eligibility.rollback.sql
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: cp6-ah-return-allocation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CP6_AC_INDEPENDENT_CONFIRM: postgres
      CP6_AF_INDEPENDENT_CONFIRM: postgres
      CP6_AF_HARNESS_HEAD: ${{ github.sha }}
      CP6_AUDIT_HARNESS_HEAD: ${{ github.sha }}
      CP6_DATABASE_CONTAINER: supabase_db_cp5-local
      CP6_MAINTENANCE_PGURL: postgresql://postgres:postgres@127.0.0.1:54322/template1
      CP6_ROLLBACK_RACE_PGURL: postgresql://postgres:postgres@127.0.0.1:54322/cp6_rollback
      CP6_MAINTENANCE_CONFIRM_DATABASE: postgres
      CP6_MAINTENANCE_ALLOW_SYSTEM_DATABASE: postgres
      CP6_AH_CONFIRM: postgres
    steps:
    - name: Checkout exact AH candidate
      uses: actions/checkout@v4
      with:
        path: candidate
        fetch-depth: 0
    - name: Checkout immutable AC runtime source
      uses: actions/checkout@v4
      with:
        path: base
        ref: 1bdca3766f7c9800d68295ff5122798060b8a05d
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned disposable runtime
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --quiet 'psycopg[binary]==3.2.10' 'PyYAML==6.0.2'
        sudo apt-get update -qq
        sudo apt-get install -y -qq ca-certificates curl gnupg
        sudo install -d /usr/share/postgresql-common/pgdg
        sudo curl --fail --silent --show-error \
          -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
          https://www.postgresql.org/media/keys/ACCC4CF8.asc
        key_fingerprint="$(gpg --show-keys --with-colons \
          /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
          | awk -F: '$1 == "fpr" { print $10; exit }')"
        test "$key_fingerprint" = 'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'
        . /etc/os-release
        architecture="$(dpkg --print-architecture)"
        sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<EOF
        Types: deb
        URIs: https://apt.postgresql.org/pub/repos/apt
        Suites: ${VERSION_CODENAME}-pgdg
        Architectures: ${architecture}
        Components: main
        Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
        EOF
        sudo apt-get update -qq
        sudo apt-get install -y -qq postgresql-client-17
        test -x /usr/lib/postgresql/17/bin/psql
        echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
    - name: Install pinned Supabase CLI
      uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
      with:
        version: 2.116.0
    - name: Verify pinned whole-family scope
      working-directory: candidate
      run: python scripts/cp6_ah_gate_scope.py
    - name: Start disposable database
      working-directory: base
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = 1bdca3766f7c9800d68295ff5122798060b8a05d
        test "$(git rev-parse HEAD^{tree})" = 334629c626257b8b713826f491cdf62385d5299b
        test -z "$(git status --porcelain)"
        mkdir cp5-local
        supabase init --force --workdir cp5-local
        mkdir -p cp5-local/supabase/.temp
        echo '17.6.1.165' > cp5-local/supabase/.temp/postgres-version
        sed -i '0,/^enable_signup = true$/s//enable_signup = false/' cp5-local/supabase/config.toml
        supabase start --workdir cp5-local \
          -x realtime,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor
    - name: Verify exact incoming AF writer proof
      working-directory: candidate
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p cp6-proof/independent-af cp6-proof/writer-ae cp6-proof/writer-af
        gh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10429202482/zip > "$RUNNER_TEMP/af-writer.zip"
        python - <<'PYVERIFY'
        from pathlib import Path
        import os,hashlib,zipfile,json
        p=Path(os.environ['RUNNER_TEMP'])/'af-writer.zip'
        assert p.stat().st_size==45580397
        assert hashlib.sha256(p.read_bytes()).hexdigest()=='f35be1721e99df6ce2c03662b1ae6856f38e9886dcfc8fe5165ba12e2737696c'
        with zipfile.ZipFile(p) as z:
         assert z.testzip() is None
         for phase,count in {'admission':7,'focused':30,'detector':11,'crossflow':134}.items():
          r=json.loads(z.read('candidate/cp6-proof/writer-af/'+phase+'.json'))
          assert r['head']=='f46699865501b03f9fba3a8b188f3fd01eedf404' and r['status']=='PASS' and r['passed']==count and r['failed']==0
         r=json.loads(z.read('candidate/cp6-proof/AF_MAINTENANCE_ROLLBACK/manifest.json'))
         assert r['status']=='PASS' and r['completed_case_count']==20
        Path('cp6-proof/independent-af/INCOMING_WRITER.json').write_text(json.dumps({'status':'REUSED_VERIFIED_AF_NATIVE10','artifact_id':10429202482,'artifact_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'historical_matrix_reexecuted':False,'production_go':False},indent=2)+'\n')
        PYVERIFY
    - name: Restore exact AC runtime
      working-directory: base
      env:
        GITHUB_SHA: 1bdca3766f7c9800d68295ff5122798060b8a05d
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        export CP6_AC_WRITER_ARTIFACT="$RUNNER_TEMP/ac-native200.zip"
        gh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10392910720/zip \
          > "$CP6_AC_WRITER_ARTIFACT"
        PYTHONPATH=scripts python ../candidate/scripts/cp6_ac_audit_bootstrap.py
    - name: Apply exact AD predecessor
      working-directory: candidate
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p cp6-proof/writer-ae
        psql "$PGURL" -X -v ON_ERROR_STOP=1 \
          -f supabase/migrations/20260915113627_erp_v2_6_20ad_cp6_opening_material_business_day.sql \
          > cp6-proof/writer-ae/AD_APPLY.log 2>&1
        PYTHONPATH=scripts python - <<'PY'
        import os
        import psycopg
        import cp6_v2620ad_runtime as runtime
        with psycopg.connect(os.environ['PGURL']) as connection, connection.cursor() as cur:
            cur.execute(
                'insert into supabase_migrations.schema_migrations(version,name,statements) '
                'values(%s,%s,%s)',
                (runtime.STAMP, runtime.NAME, [runtime.MIGRATION.read_text()]),
            )
            assert len(runtime.verified_successor(cur)) == 274
        PY
    - name: Apply exact AE comparison runtime
      working-directory: candidate
      shell: bash
      run: |
        set -euo pipefail
        psql "$PGURL" -X -v ON_ERROR_STOP=1 \
          -f supabase/migrations/20260915201500_erp_v2_6_20ae_cp6_opening_roll_integrity.sql \
          > cp6-proof/writer-ae/AE_APPLY.log 2>&1
        PYTHONPATH=scripts python - <<'PY'
        import os
        import psycopg
        import cp6_v2620ae_runtime as runtime
        with psycopg.connect(os.environ['PGURL']) as connection, connection.cursor() as cur:
            cur.execute(
                'insert into supabase_migrations.schema_migrations(version,name,statements) '
                'values(%s,%s,%s)',
                (runtime.STAMP, runtime.NAME, [runtime.MIGRATION.read_text()]),
            )
            assert len(runtime.verified_successor(cur)) == 276
        PY
    - name: Install AF and bind exact 278-object runtime
      working-directory: candidate
      shell: bash
      run: |
        set -euo pipefail
        psql "$PGURL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260916014332_erp_v2_6_20af_cp6_posted_child_integrity.sql > cp6-proof/writer-af/AF_APPLY.log 2>&1
        PYTHONPATH=scripts python - <<'PYINSTALL'
        import os,psycopg
        import cp6_v2620af_runtime as r
        with psycopg.connect(os.environ['PGURL']) as conn,conn.cursor() as cur:
         cur.execute('insert into supabase_migrations.schema_migrations(version,name,statements) values(%s,%s,%s)',(r.STAMP,r.NAME,[r.MIGRATION.read_text()]))
         assert len(r.verified_successor(cur))==278
        PYINSTALL
    - name: Verify exact AG writer and original return counterexample artifacts
      working-directory: candidate
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        set -euo pipefail
        mkdir -p cp6-proof/writer-ah
        # Evidence is read and hashed, never executed as SQL.
        gh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10432153459/zip > "$RUNNER_TEMP/ag-writer.zip"
        gh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10434213550/zip > cp6-proof/writer-ah/AG_ORIGINAL_RETURN_COUNTEREXAMPLE.zip
        python - <<'PYVERIFY'
        from pathlib import Path
        import os,hashlib,zipfile,json
        p=Path(os.environ['RUNNER_TEMP'])/'ag-writer.zip'
        assert p.stat().st_size==44481450
        assert hashlib.sha256(p.read_bytes()).hexdigest()=='c7292683dcb0729b9634f1736f1dc42d2ed56b32af6a209b569b001a20e0b469'
        with zipfile.ZipFile(p) as z:
         assert z.testzip() is None
         for phase,count in {'admission':10,'focused':51,'detector':23,'crossflow':142}.items():
          r=json.loads(z.read('candidate/cp6-proof/writer-ag/'+phase+'.json'))
          assert r['head']=='119f8f133131eaf373f08cc45b7b3d6fc27a3d3e' and r['status']=='PASS' and r['passed']==count and r['failed']==0
         r=json.loads(z.read('candidate/cp6-proof/AG_MAINTENANCE_ROLLBACK/manifest.json'))
         assert r['status']=='PASS' and r['completed_case_count']==20
        p=Path('cp6-proof/writer-ah/AG_ORIGINAL_RETURN_COUNTEREXAMPLE.zip')
        assert p.stat().st_size==44431
        assert hashlib.sha256(p.read_bytes()).hexdigest()=='2b5e604bcf42fc6185f4de50ed8be5bb6a403ec93661028e6b4ef24df39e48c3'
        with zipfile.ZipFile(p) as z:
         assert z.testzip() is None
         r=json.loads(z.read('candidate/cp6-proof/ag-residual/RESULT.json'))
         assert r['candidate_head']=='119f8f133131eaf373f08cc45b7b3d6fc27a3d3e'
         assert r['status']=='QUALIFIED_COUNTEREXAMPLE' and (r['controls'],r['counterexamples'],r['incomplete'])==(15,6,0)
         assert r['source_sha256']==hashlib.sha256(Path('scripts/cp6_ag_residual_review.py').read_bytes()).hexdigest()
        Path('cp6-proof/writer-ah/INCOMING_AG.json').write_text(json.dumps(dict(status='VERIFIED',writer_run=35060285362,counterexample_run=35066611261,historical_500_matrix_reexecuted=False,independent_ag_acceptance=False,production_go=False),indent=2)+'\n')
        PYVERIFY
    - name: Install unchanged AG predecessor and verify 690 objects
      working-directory: candidate
      run: |-
        set -euo pipefail
        psql "$PGURL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260916050822_erp_v2_6_20ag_cp6_sale_reservation_lineage.sql > cp6-proof/writer-ah/AG_APPLY.log 2>&1
        PYTHONPATH=scripts python - <<'PYINSTALL'
        import os,psycopg
        import cp6_v2620ag_runtime as r
        with psycopg.connect(os.environ['PGURL']) as conn,conn.cursor() as cur:
         cur.execute('insert into supabase_migrations.schema_migrations(version,name,statements) values(%s,%s,%s)',(r.STAMP,r.NAME,[r.MIGRATION.read_text()]))
         assert len(r.verified_successor(cur))==690
        PYINSTALL
    - name: Provision isolated rollback authority
      working-directory: candidate
      shell: bash
      run: |
        set -euo pipefail
        maintenance_password="$(openssl rand -hex 32)"
        maintenance_pgurl="postgresql://cp6_maintenance_admission:${maintenance_password}@127.0.0.1:54322/template1"
        echo "::add-mask::$maintenance_password"
        echo "::add-mask::$maintenance_pgurl"
        docker exec -i "$CP6_DATABASE_CONTAINER" \
          psql -U supabase_admin -d template1 -X -v ON_ERROR_STOP=1 \
            -v cp6_password="$maintenance_password" <<'SQL'
        create role cp6_maintenance_admission
          login superuser noinherit nocreatedb nocreaterole noreplication
          connection limit 4 password :'cp6_password';
        SQL
        printf 'CP6_ADMISSION_CONTROL_PGURL=%s\n' "$maintenance_pgurl" >> "$GITHUB_ENV"
    - name: Check AH admission and exact original AG boundary
      working-directory: candidate
      run: PYTHONPATH=scripts python scripts/cp6_v2620ah_family.py --phase admission
    - name: Install AH and verify all 533 functions and 157 relation objects
      working-directory: candidate
      run: |
        set -euo pipefail
        psql "$PGURL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260916070451_erp_v2_6_20ah_cp6_return_allocation_eligibility.sql > cp6-proof/writer-ah/AH_APPLY.log 2>&1
        PYTHONPATH=scripts python - <<'PYINSTALL'
        import os,json,psycopg
        from pathlib import Path
        import cp6_v2620ah_runtime as r
        with psycopg.connect(os.environ['PGURL']) as conn,conn.cursor() as cur:
         cur.execute('insert into supabase_migrations.schema_migrations(version,name,statements) values(%s,%s,%s)',(r.STAMP,r.NAME,[r.MIGRATION.read_text()]))
         objects=r.verified_successor(cur);assert len(objects)==690
         Path('cp6-proof/writer-ah/AH_INSTALLED_RUNTIME.json').write_text(json.dumps({'status':'PASS','head':os.environ['GITHUB_SHA'],'objects':objects,'production_go':False},indent=2)+'\n')
        PYINSTALL
    - name: Run consolidated focused and report checks before combined gate
      working-directory: candidate
      run: |
        status=0
        for phase in focused detector; do
          PYTHONPATH=scripts python scripts/cp6_v2620ah_family.py --phase "$phase" || status=1
        done
        exit "$status"
    - name: Run relevant combined business oracles after focused checks pass
      working-directory: candidate
      run: PYTHONPATH=scripts python scripts/cp6_v2620ah_family.py --phase crossflow
    - name: Run eight actual concurrent transactions
      working-directory: candidate
      run: PYTHONPATH=scripts python scripts/cp6_v2620ah_concurrency.py
    - name: Run twenty AH maintenance schedules
      working-directory: candidate
      env:
        CP6_AH_MAINTENANCE_CONFIRM: cp6_rollback
        CP6_MAINTENANCE_CONFIRM_DATABASE: cp6_rollback
      run: PYTHONPATH=scripts python scripts/cp6_v2620ah_maintenance_schedules.py
    - name: Prove eight rollback refusals and exact AG restore
      working-directory: candidate
      run: PYTHONPATH=scripts python scripts/cp6_v2620ah_rollback_guards.py
    - name: Stop disposable database and prove removal
      if: always()
      working-directory: base
      shell: bash
      run: |
        set -euo pipefail
        if test -f cp5-local/supabase/config.toml; then
          supabase stop --workdir cp5-local --no-backup
        fi
        remaining="$(docker ps -aq --filter name='^/supabase_db_cp5-local$')"
        test -z "$remaining"
        mkdir -p ../candidate/cp6-proof/writer-ah
        printf 'status=PASS\nremaining_database_container=0\nproduction_go=false\n' > ../candidate/cp6-proof/writer-ah/PHYSICAL_CLEANUP.txt
    - name: Preserve AH evidence and every failed attempt
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cp6-ah-return-allocation-family
        path: |-
          candidate/cp6-proof/writer-ah
          candidate/cp6-proof/AH_MAINTENANCE_ROLLBACK
          base/cp6-proof/AC_AUDIT_RUNTIME_BOOTSTRAP.json
        if-no-files-found: error
        compression-level: 9
        retention-days: 30
