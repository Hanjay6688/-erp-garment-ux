name: CP3 Patch Authoritative Roster Once

on:
  push:
    branches:
      - cp3/hpp-attendance-sewing-terminal-candidate-20260901
    paths:
      - .github/workflows/cp3-patch-authoritative-roster-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: cp3/hpp-attendance-sewing-terminal-candidate-20260901
          fetch-depth: 1
      - name: Replace direct worker-history setup with authoritative roster RPC
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cp3_patch_authoritative_roster_fixture_once.py
          git diff --check
          grep -nE 'save_worker_roster_v1|cp3_worker_|cp3_rate_|worker_employment_periods|worker_daily_rate_versions|rollback;' supabase/tests/attendance_hpp_sewing_terminal_rollback.sql | head -n 120
          sha256sum supabase/tests/attendance_hpp_sewing_terminal_rollback.sql
          git config user.name 'cp3-source-writer'
          git config user.email 'cp3-source-writer@users.noreply.github.com'
          git add supabase/tests/attendance_hpp_sewing_terminal_rollback.sql
          git commit -m 'test(cp3): create worker roster through authoritative RPC'
          git push origin HEAD:cp3/hpp-attendance-sewing-terminal-candidate-20260901
