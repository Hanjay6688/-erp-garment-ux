name: CP7.5 independent factory from BF through the current Global
'on':
  push:
    branches:
    - writer-a/cp75-baseline-public
    paths:
    - .github/workflows/cp75-factory-global.yml
    - qualification/cp75-factory-global/**
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  foundation:
    name: Install and restore the current Global from clean BF
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CP6_AC_INDEPENDENT_CONFIRM: postgres
      CP6_AUDIT_HARNESS_HEAD: c6b0e4fb119c4e91fecea66ebf2d789426b22c2b
      CP6_DATABASE_CONTAINER: supabase_db_cp5-local
      CP6_MAINTENANCE_CONFIRM_DATABASE: cp6_rollback
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: writer
        fetch-depth: 1
        ref: ca7f09556397801c50a2277bdb65b1bf019f9a05
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: 6b22d308e83e69c2ea6fafa937ade1ee1f6498c4
        path: capture
        sparse-checkout: qualification/close11
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: qualification-source
        sparse-checkout: |
          qualification/cp75-sku-forward
          qualification/cp75-factory-global
          qualification/cp75-factory-source
          qualification/cp75-comparison
          qualification/cp75-original-live
          qualification/cp75-original-access
          qualification/cp75-global-pair
          qualification/cp75-clean-bf
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: auditor
        fetch-depth: 1
        persist-credentials: false
        ref: a62504d71a6ca1cdbaa59b6fe0fd5739693f100a
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: base
        fetch-depth: 1
        ref: 1bdca3766f7c9800d68295ff5122798060b8a05d
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ca7f09556397801c50a2277bdb65b1bf019f9a05
        path: foundation-writer
        sparse-checkout: |
          scripts
          supabase/tests
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install pinned disposable runtime
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --quiet 'psycopg[binary]==3.2.10' 'PyYAML==6.0.2' 'jsonschema==4.25.1'
        sudo apt-get update -qq
        sudo apt-get install -y -qq ca-certificates curl gnupg
        sudo install -d /usr/share/postgresql-common/pgdg
        sudo curl --fail --silent --show-error \
          -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
          https://www.postgresql.org/media/keys/ACCC4CF8.asc
        key_fingerprint="$(gpg --show-keys --with-colons \
          /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
          | awk -F: '$1 == "fpr" { print $10; exit }')"
        test "$key_fingerprint" = 'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'
        . /etc/os-release
        architecture="$(dpkg --print-architecture)"
        sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<EOF
        Types: deb
        URIs: https://apt.postgresql.org/pub/repos/apt
        Suites: ${VERSION_CODENAME}-pgdg
        Architectures: ${architecture}
        Components: main
        Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
        EOF
        sudo apt-get update -qq
        sudo apt-get install -y -qq postgresql-client-17
        test -x /usr/lib/postgresql/17/bin/psql
        echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
    - name: Verify clean foundation sources against the submitted product
      run: |
        set -euo pipefail
        test "$(git -C auditor hash-object .github/workflows/cp7-current-installation.yml)" = 68cf8b133e82ef22d91b989a4a5ea8ba65824ca5
        test "$(git -C auditor hash-object scripts/cp6_t3_aligned_chain.py)" = 91dc30c6c795e1e1a4fc8e84bb83e12d00a45dbb
        test "$(git -C auditor hash-object scripts/cp6_ac_audit_bootstrap.py)" = 1803ccc161ad97d38f36570910426b729fb3f402
        test "$(git -C auditor hash-object scripts/cp6_pre_u_inventory.py)" = 9ca8dab066e4537f697a45f5fd0731ca599f56a8
        test "$(git -C auditor hash-object scripts/cp6_g01_baseline.py)" = 5f40e1a3eee24d32e1399297269a2a9dae78b4b7
        test "$(git -C auditor hash-object scripts/cp6_g01_align.py)" = cd44246253480aa6982cc9c7dc02255c4f8cee46
        test "$(git -C auditor hash-object scripts/cp6_g01_fingerprint.py)" = b30172a78ce3927026275933e77d105207d9014b
        test "$(git -C auditor hash-object docs/evidence/cp6-g01/hosted_summary.json)" = 04b6b7ac931c1623f035ec97990dca81970ec57b
        test "$(git -C base hash-object supabase/tests/fixtures/erp_enteng_cp45a_catalog_bootstrap.manifest.json)" = f47d42025ac10a9d08a16ddaff67e22cd3475214
        test "$(git -C base hash-object supabase/tests/fixtures/erp_enteng_cp45a_catalog_bootstrap.sql.gz)" = f7e970d72e0bcd44015c8f7d092fcc725baeb158
        test "$(git -C base hash-object supabase/tests/fixtures/erp_enteng_cp45a_external_application_triggers.sql)" = 554e1cf1ab7c19f2732524f43819d3cc4caefbc3
        test "$(git -C base hash-object .github/workflows/cp6-full-schema-validation.yml)" = 65340533b6307a6d2e0af8947547392aed4ab75b
    - name: Install pinned Supabase CLI
      uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
      with:
        version: 2.116.0
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: 6fbbc85996d76c768afde58befbcabc2221935b1
        path: released
        sparse-checkout: qualification
        persist-credentials: false
    - name: Prepare immutable source checkouts for the released SKU installer
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p sku-build "$RUNNER_TEMP/cp75-sku"
        cd sku-build
        set -euo pipefail
        umask 077
        export GIT_TERMINAL_PROMPT=0
        git init -q auditor
        git -C auditor remote add origin https://github.com/Hanjay6688/-erp-garment-ux.git
        # Test sources, reviewed catalogues and fixtures. Exclude the
        # accumulated run evidence stored under unrelated documentation.
        git -C auditor sparse-checkout set src scripts contracts supabase tests ops public .github \
          docs/evidence docs/cp7/d17-14 docs/cp7/d17-18 docs/cp7/framework-v2 \
          docs/cp7/sku-cumulative-source-20261110
        heads=(
          a62504d71a6ca1cdbaa59b6fe0fd5739693f100a
          a0e7d5616a0ac470876409d31c41388159f17692
          fd797083eab093d9dc97f2d52ca61dc37812b437
          f1674ae84739f577571d68415beabfca3f3b832b
          9b1b0fcc9fbf477634619f07d4628d5be3a1b634
          090b85d3fcb738d3e694d4329d306f199a686eb8
          ca7f09556397801c50a2277bdb65b1bf019f9a05
          c6b0e4fb119c4e91fecea66ebf2d789426b22c2b
          25fa4736329e5148dfdb3572bc169952cba23251
          1bdca3766f7c9800d68295ff5122798060b8a05d
          469ed1e8b2edf80f7988feba38162a5be7251b8c
          05bad4f465c61caabddfc0e8f4d5914b39aab22a
          6d056959d33808dc59b8c38fb15ce8492db44523
          3776a052ea97695dce95da018be182fdf21fe85b
          e3261d84ae217d1d37374990dec5804fd1970934
          ffa0b63dbb6f0b7888eeaec59d0f39347cd58e0e
          014019a612260525e9c3b9459e354a86209336c1
          c7f06b855512e0c8d450522c36e84f4cab570a2a
          10a36e35b956febd9e34907f20fc5b782ec48dc1
          a5944f25a5e3ba1f1f537a18abe923eb753f922f
          0da4d79a4f7201ef053d6de1eb155d990b4bfa4d
          927ee03213a80e854fda30779d824c5c617644bd
          e6684b07f98d753b5f78b24c7af52cd981971c0c
          1601415d974d5e2fc9d627e35b976e38d6daee8c
          56e7b238e68620c5cc172b7961c83a46bda8783a
          1c66a74295eae2f09b7535619325e4d023942e19
          5f099fa6852c9088ab46daa0f1079a0f6a1f3185
          c296fd06167ddd177e1192c1008992e2a1e3d628
          f6a853813e6db252b44fa8044310b9f499210420
          e63c758990f54dbec4e635ecf3d53c6e80b03041
          1cc838c834ebc49642f4d27274a8c5ebabb46822
          fea75841e26645f1892d880905231625b47e3065
          ae480ca43d750a6abe41681fc6f90e6ad81a9135
        )
        git -C auditor fetch --no-tags origin "${heads[@]}" > "$RUNNER_TEMP/sku-source.log" 2>&1
        git -C auditor checkout --quiet --detach "${heads[0]}"
        test "$(git -C auditor rev-parse 'HEAD^{tree}')" = df64669b64e82f4b5027ccad837cc3d014dbcafa
        python -m pip install --quiet 'psycopg[binary]==3.2.10' 'PyYAML==6.0.2' 'jsonschema==4.25.1'
    - name: Materialize the retained dependencies without rerunning their acceptance cases
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        python -u released/qualification/sku_inputs.py "$GITHUB_WORKSPACE/sku-build" --settings-file "$RUNNER_TEMP/cp75-sku-settings.json" | tee "$RUNNER_TEMP/cp75-sku/source-progress.log"
        PYTHONPATH=released/qualification python -c 'import os; from pathlib import Path; from sku_parent import retrieve,retained; path=Path(os.environ["RUNNER_TEMP"])/"cp75-original-sku.zip"; retrieve(path); retained(path)'
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: f8520a7da6cec188540a1e52bb20ecbfaf064b19
        path: global-release
        sparse-checkout: qualification
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: eafbbde103c3d0fd716ebf559ea3f24022b071df
        path: sku-build/close11-audit-input
        sparse-checkout: qualification/astra-public/installer
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: faa6a2edf23e52daa42fd268b2effc7374315e52
        path: g14
        sparse-checkout: qualification/close12/product
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: b18e79a87eeda6fa45ef3b01a7cc0f80f6fceeef
        path: rig
        sparse-checkout: qualification/cp75-order
        persist-credentials: false
    - name: Materialize the accepted P20, Switch Roll, S06 and Global sources
      working-directory: sku-build
      env:
        P21_PRODUCT_SHA: a752459a0a8baf1920d0e6d1c1fba6f4ef14af8d
        CP7_P21_SWITCH_ROLL_HEAD: 00272ba94b2e467c3b97a63f97548e47187a8b35
        CP7_P21_SWITCH_ROLL_TREE: 07c39c54bdf79e4c0bae58f442af743304990c89
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        p20_assets="$GITHUB_WORKSPACE/global-release/qualification/global_owning/p20"
        (
          cd "$p20_assets"
          sha256sum --strict --check INPUTS.sha256
        )
        git clone --quiet --shared --no-checkout "$GITHUB_WORKSPACE/auditor" p20-product
        test "$(git -C p20-product rev-parse HEAD)" = a62504d71a6ca1cdbaa59b6fe0fd5739693f100a
        git -C p20-product bundle verify "$p20_assets/P20_BASE.bundle"
        git -C p20-product fetch "$p20_assets/P20_BASE.bundle" refs/heads/writer-a/cp7-p20-review
        git -C p20-product bundle verify "$p20_assets/P20_REPAIR.bundle"
        git -C p20-product fetch "$p20_assets/P20_REPAIR.bundle" refs/heads/writer-a/cp7-ow07-report-readiness
        git -C p20-product checkout --quiet --detach FETCH_HEAD
        test "$(git -C p20-product rev-parse HEAD)" = "$P21_PRODUCT_SHA"
        test "$(git -C p20-product rev-parse 'HEAD^{tree}')" = 3440cb483c8f809987efb04c3e26072d14039ff2
        set -euo pipefail
        umask 077
        bundle="$GITHUB_WORKSPACE/global-release/qualification/p21/switch-roll/PRODUCT.bundle"
        printf '%s  %s\n' 'ae7834256cc26cd4b22a4358914afd6dbad4a825fd43e098636ba51ebc8774f6' "$bundle" | sha256sum --strict --check
        git clone --quiet --shared --no-checkout p20-product switch-roll-product
        git -C switch-roll-product sparse-checkout set src scripts tests contracts public supabase docs/evidence docs/cp7/evidence/p00 docs/cp7/framework-v2
        git -C switch-roll-product bundle verify "$bundle"
        git -C switch-roll-product fetch "$bundle" refs/heads/writer-a/cp7-switch-roll
        git -C switch-roll-product checkout --quiet --detach FETCH_HEAD
        test "$(git -C switch-roll-product rev-parse HEAD)" = "$CP7_P21_SWITCH_ROLL_HEAD"
        test "$(git -C switch-roll-product rev-parse 'HEAD^{tree}')" = "$CP7_P21_SWITCH_ROLL_TREE"
        test "$(git -C switch-roll-product rev-parse 'HEAD^')" = "$P21_PRODUCT_SHA"
        set -euo pipefail
        umask 077
        bundle="$RUNNER_TEMP/g04-final-ui.bundle"
        base64 -d "$GITHUB_WORKSPACE/global-release"/qualification/p21/g04-final-ui.bundle.b64 > "$bundle"
        printf '%s  %s\n' '2a27d94d53925870d5f76d4f262393871cbb0a6a5139c938ab9fcd35fe9b1c74' "$bundle" | sha256sum --strict --check
        git clone --quiet --shared --no-checkout switch-roll-product g04-product
        git -C g04-product sparse-checkout set src scripts tests contracts public supabase docs/evidence docs/cp7/evidence/p00 docs/cp7/framework-v2
        git -C g04-product bundle verify "$bundle"
        git -C g04-product fetch "$bundle" refs/heads/writer-b/cp7-operator-ui-20261117
        git -C g04-product checkout --quiet --detach FETCH_HEAD
        test "$(git -C g04-product rev-parse HEAD)" = 9ee09e9562978e8a501da2a9d36defd9ea30bfcf
        test "$(git -C g04-product rev-parse 'HEAD^{tree}')" = 747313f22979077f2b149b6e90bf24374e9bb869
        git -C g04-product diff --exit-code "$CP7_P21_SWITCH_ROLL_HEAD" HEAD -- scripts supabase contracts
        ln -s qualification-source "$GITHUB_WORKSPACE/source"
        PYTHONPATH="$GITHUB_WORKSPACE/global-release/qualification" python -u "$GITHUB_WORKSPACE/source/qualification/cp75-factory-global/materialize.py"
    - name: Start disposable database
      working-directory: base
      shell: bash
      env:
        GHCR_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = 1bdca3766f7c9800d68295ff5122798060b8a05d
        test "$(git rev-parse HEAD^{tree})" = 334629c626257b8b713826f491cdf62385d5299b
        test -z "$(git status --porcelain)"
        supabase --help >/dev/null
        supabase init --help >/dev/null
        supabase start --help >/dev/null
        # Authenticated pulls: anonymous ghcr.io/public.ecr.aws pulls were refused (toomanyrequests,
        # Data limit exceeded) before any test ran (OW12a run 39847548230).
        printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        mkdir cp5-local
        supabase init --force --workdir cp5-local
        mkdir -p cp5-local/supabase/.temp
        echo '17.6.1.165' > cp5-local/supabase/.temp/postgres-version
        sed -i '0,/^enable_signup = true$/s//enable_signup = false/' cp5-local/supabase/config.toml
        # ghcr.io can rate-limit image pulls before anything runs. Retry the start
        # only (no test has run), falling back to the same image tags on public.ecr.aws.
        for attempt in 1 2 3 4; do
          if [ "$attempt" -ge 2 ]; then export SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws; fi
          if supabase start --workdir cp5-local \
            -x realtime,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor \
            > "$RUNNER_TEMP/cp6-local-start.log" 2>&1; then
            echo "supabase start succeeded on attempt $attempt from ${SUPABASE_INTERNAL_IMAGE_REGISTRY:-default}"
            break
          fi
          tail -n 20 "$RUNNER_TEMP/cp6-local-start.log"
          supabase stop --workdir cp5-local --no-backup || true
          if [ "$attempt" = 4 ]; then exit 1; fi
          sleep $((attempt * 60))
        done
    - name: Rebuild to v2.6.20, align with hosted, continue the frozen path to AB
      working-directory: base
      env:
        GITHUB_SHA: 1bdca3766f7c9800d68295ff5122798060b8a05d
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        export CP6_AC_WRITER_ARTIFACT="$RUNNER_TEMP/ac-native200.zip"
        gh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10392910720/zip \
          > "$CP6_AC_WRITER_ARTIFACT" || { rm -f "$CP6_AC_WRITER_ARTIFACT"; echo 'AC writer artifact 10392910720 unavailable (kept 30 days, expired 15 Oct 2026, owner D14-17); cp6_pre_u_inventory captures the pre-U table set before U'; }
        mkdir -p ../auditor/cp6-proof/t3
        status=0
        PYTHONPATH=scripts python ../auditor/scripts/cp6_t3_aligned_chain.py ../auditor/cp6-proof/t3/ALIGNED_CHAIN.json --stop-after-ab || status=$?
        python - <<'PY'
        import json
        d=json.load(open('../auditor/cp6-proof/t3/ALIGNED_CHAIN.json'))
        print(json.dumps({k:d.get(k) for k in ('status','refused_step','alignment')},default=str)[:6000])
        print(json.dumps([(s['name'],s['exit_code'],s['after_alignment']) for s in d['steps']])[:6000])
        PY
        exit "$status"
    - name: Read the clean boundary and resulting installed version
      working-directory: base
      run: |
        set -euo pipefail
        python - <<'PROOF'
        import json, os
        from pathlib import Path
        import psycopg
        base = Path('cp6-proof')
        output = Path('../auditor/cp6-proof/t3')
        boundary = json.loads((base/'CP45A_RESTORED_BOUNDARY.json').read_text())
        inventory = json.loads((output/'ALIGNED_CHAIN.json').read_text())
        assert boundary['status']=='PASS' and boundary['auth_users']==boundary['app_users']==boundary['audit_logs']==0
        assert inventory['status']=='PASS_ALIGNED_CHAIN_TO_AB' and inventory['hosted_fingerprint']['equal']
        with psycopg.connect(os.environ['PGURL']) as conn:
            conn.read_only = True
            db,latest,auth_users,app_users = conn.execute(
                "select current_database(), exists(select 1 from supabase_migrations.schema_migrations where version='20260914190500' and name='erp_v2_6_20ab_cp6_operational_business_clock'), (select count(*) from auth.users), (select count(*) from erp.app_users)"
            ).fetchone()
        assert db=='postgres' and latest and auth_users==app_users==0
        record = dict(product="486d344e0ce47d2b184e2a7bfccf2a927424d184",old_product="475980f2d07a60ea9a2576fe0d8fe50e63653434",
            stage="clean CP4.5a foundation through v2.6.20ab",origin="new isolated Supabase, catalog plus allowlisted configuration",
            foundation=boundary,installed="v2.6.20ab",app_users_at_end=app_users,auth_users_at_end=auth_users,
            commands_completed=len(inventory['steps']),compared_catalog_groups=inventory['hosted_fingerprint']['kinds'],
            complete_global_clean_upgrade_comparison=False,production_go=False)
        (output/'CP75_CLEAN_FOUNDATION.json').write_text(json.dumps(record,indent=2)+'\n')
        print(json.dumps(record))
        PROOF
    - name: Provision isolated rollback authority
      working-directory: writer
      shell: bash
      run: |
        set -euo pipefail
        maintenance_password="$(openssl rand -hex 32)"
        maintenance_pgurl="postgresql://cp6_maintenance_admission:${maintenance_password}@127.0.0.1:54322/template1"
        echo "::add-mask::$maintenance_password"
        echo "::add-mask::$maintenance_pgurl"
        docker exec -i "$CP6_DATABASE_CONTAINER" \
          psql -U supabase_admin -d template1 -X -v ON_ERROR_STOP=1 \
            -v cp6_password="$maintenance_password" <<'SQL'
        create role cp6_maintenance_admission
          login superuser noinherit nocreatedb nocreaterole noreplication
          connection limit 4 password :'cp6_password';
        SQL
        printf 'CP6_ADMISSION_CONTROL_PGURL=%s\n' "$maintenance_pgurl" >> "$GITHUB_ENV"
    - name: Clone the aligned AB state for install
      working-directory: writer
      run: |
        set -euo pipefail
        mkdir -p '../auditor/cp6-proof/t3'
        bash scripts/clone-cp6-disposable-database.sh \
          'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
          'postgresql://postgres:postgres@127.0.0.1:54322/template1' \
          'postgresql://postgres:postgres@127.0.0.1:54322/cp6_rollback' \
          cp6_rollback supabase_db_cp5-local '../auditor/cp6-proof/t3/CLONE_install'
    - name: Install all 30 immutable AC through BF release files on the clean branch
      run: |
        set -euo pipefail
        test "$(git -C auditor rev-parse HEAD:supabase/release/cp6-t3)" = 557896a51f0661f73b74bdf9babaf9d08e7314a9
        test "$(git -C auditor rev-parse HEAD:scripts/cp6_t3_release_package.py)" = fcd10d27213000d97a6f713463a670337f2dd24a
        (cd auditor && PYTHONPATH="$GITHUB_WORKSPACE/auditor/scripts" python scripts/cp6_t3_release_package.py install cp6-proof/t3/CP75_RELEASE_FILES.json)
    - name: Qualify the complete factory installation on the measured BF
      env:
        STAGE_PATH: ${{ runner.temp }}/cp75-global
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$STAGE_PATH"
        python -m pip install --quiet 'cryptography==46.0.3'
        PYTHONPATH="$GITHUB_WORKSPACE/capture/qualification:$GITHUB_WORKSPACE/auditor/scripts" python -u source/qualification/cp75-sku-forward/observe.py before
        PYTHONPATH="$GITHUB_WORKSPACE/global-release/qualification" python -u source/qualification/cp75-factory-global/install.py
    - name: Upgrade the new factory install, exercise its records, and restore the snapshot
      working-directory: auditor
      env:
        STAGE_PATH: ${{ runner.temp }}/cp75-global
        AUDIT_RESULTS: ${{ runner.temp }}/cp75-original-observations/business
        PGHOST: 127.0.0.1
        PGPORT: '54322'
        PGUSER: supabase_admin
        PGPASSWORD: postgres
      shell: bash
      run: |
        set -euo pipefail
        export PYTHONPATH="$GITHUB_WORKSPACE/source/qualification/cp75-factory-source:$GITHUB_WORKSPACE/source/qualification/cp75-comparison:$GITHUB_WORKSPACE/source/qualification/cp75-original-live:$GITHUB_WORKSPACE/source/qualification/cp75-original-access:$GITHUB_WORKSPACE/released/qualification/astra-public/global-final:$GITHUB_WORKSPACE/released/qualification:$GITHUB_WORKSPACE/auditor/scripts:$GITHUB_WORKSPACE/capture/qualification"
        python -u ../source/qualification/cp75-factory-global/target.py
    - name: Retain measured factory output
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: cp75-current-factory-${{ github.run_id }}
        path: |
          ${{ runner.temp }}/cp75-global/
          ${{ runner.temp }}/cp75-original-observations/*.json
        retention-days: 90
        if-no-files-found: warn
    - name: Remove any separately opened recovery clone
      if: always()
      run: |
        for lane in factory-clean factory-upgrade clean-posted-recovery clean-baseline-recovery factory-history-restore; do
          name="cp75-$lane-$GITHUB_RUN_ID"
          if docker inspect "$name" >/dev/null 2>&1; then docker rm -f "$name"; fi
          for v in "$name-data" "$name-config"; do if docker volume inspect "$v" >/dev/null 2>&1; then docker volume rm "$v"; fi; done
        done
    - name: Remove disposable database
      if: always()
      working-directory: base
      run: if command -v supabase >/dev/null 2>&1 && test -d cp5-local; then supabase stop --workdir cp5-local --no-backup; fi
