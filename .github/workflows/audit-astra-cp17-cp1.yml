name: AUDIT/Astra/cp17-cp1-fingerprint
'on':
  push:
    branches:
    - audit/astra-cp1-7-0b7049d9-20261014
    paths:
    - .github/workflows/audit-astra-cp17-cp1.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: astra-cp17-cp1-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  baseline:
    name: Rebuild test chain to v2.6.20 and fingerprint its catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CP6_AC_INDEPENDENT_CONFIRM: postgres
      CP6_DATABASE_CONTAINER: supabase_db_cp5-local
    steps:
    - uses: actions/checkout@v4
      with:
        path: auditor
        fetch-depth: 0
        ref: 0b7049d9203bac52b47a4c89f3e0d75646067a8f
    - uses: actions/checkout@v4
      with:
        path: base
        fetch-depth: 0
        ref: 1bdca3766f7c9800d68295ff5122798060b8a05d
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install pinned disposable runtime
      shell: bash
      run: "set -euo pipefail\npython -m pip install --quiet 'psycopg[binary]==3.2.10' 'PyYAML==6.0.2'\nsudo apt-get update\
        \ -qq\nsudo apt-get install -y -qq ca-certificates curl gnupg\nsudo install -d /usr/share/postgresql-common/pgdg\n\
        sudo curl --fail --silent --show-error \\\n  -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \\\n  https://www.postgresql.org/media/keys/ACCC4CF8.asc\n\
        key_fingerprint=\"$(gpg --show-keys --with-colons \\\n  /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \\\
        \n  | awk -F: '$1 == \"fpr\" { print $10; exit }')\"\ntest \"$key_fingerprint\" = 'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'\n\
        . /etc/os-release\narchitecture=\"$(dpkg --print-architecture)\"\nsudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null\
        \ <<EOF\nTypes: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: ${VERSION_CODENAME}-pgdg\nArchitectures:\
        \ ${architecture}\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\nEOF\nsudo\
        \ apt-get update -qq\nsudo apt-get install -y -qq postgresql-client-17\ntest -x /usr/lib/postgresql/17/bin/psql\n\
        echo '/usr/lib/postgresql/17/bin' >> \"$GITHUB_PATH\"\n"
    - name: Install pinned Supabase CLI
      uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
      with:
        version: 2.116.0
    - name: Start disposable database
      working-directory: base
      shell: bash
      run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = 1bdca3766f7c9800d68295ff5122798060b8a05d\ntest \"$(git rev-parse\
        \ HEAD^{tree})\" = 334629c626257b8b713826f491cdf62385d5299b\ntest -z \"$(git status --porcelain)\"\nmkdir cp5-local\n\
        supabase init --force --workdir cp5-local\nmkdir -p cp5-local/supabase/.temp\necho '17.6.1.165' > cp5-local/supabase/.temp/postgres-version\n\
        sed -i '0,/^enable_signup = true$/s//enable_signup = false/' cp5-local/supabase/config.toml\n# Image pulls from ghcr.io\
        \ can hit its rate limit before anything runs;\n# retry the start itself (infrastructure only, no test has run yet).\n\
        # ghcr.io can rate-limit image pulls before anything runs. Retry the start\n# only (no test has run), falling back\
        \ to the same image tags on public.ecr.aws.\nfor attempt in 1 2 3 4; do\n  if [ \"$attempt\" -ge 2 ]; then export\
        \ SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws; fi\n  if supabase start --workdir cp5-local \\\n    -x realtime,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor\
        \ \\\n    > \"$RUNNER_TEMP/cp6-local-start.log\" 2>&1; then\n    echo \"supabase start succeeded on attempt $attempt\
        \ from ${SUPABASE_INTERNAL_IMAGE_REGISTRY:-default}\"\n    break\n  fi\n  tail -n 20 \"$RUNNER_TEMP/cp6-local-start.log\"\
        \n  supabase stop --workdir cp5-local --no-backup || true\n  if [ \"$attempt\" = 4 ]; then exit 1; fi\n  sleep $((attempt\
        \ * 60))\ndone\n"
    - name: Rebuild the frozen test chain and stop after v2.6.20
      working-directory: base
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\nmkdir -p ../auditor/cp6-proof/g01\nexport CP6_AC_WRITER_ARTIFACT=\"$RUNNER_TEMP/ac-native200.zip\"\
        \ngh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10392910720/zip \\\n  > \"$CP6_AC_WRITER_ARTIFACT\"\n\
        PYTHONPATH=scripts python ../auditor/scripts/cp6_g01_baseline.py ../auditor/cp6-proof/g01/BASELINE_BUILD.json\ncat\
        \ ../auditor/cp6-proof/g01/BASELINE_BUILD.json\n"
    - name: Capture the read-only fingerprint and compare with hosted
      working-directory: auditor
      shell: bash
      run: "set -euo pipefail\npython scripts/cp6_g01_fingerprint.py capture cp6-proof/g01/BASELINE_V2620.json\npython scripts/cp6_g01_fingerprint.py\
        \ compare docs/evidence/cp6-g01/hosted_summary.json cp6-proof/g01/BASELINE_V2620.json \\\n  | tee cp6-proof/g01/COMPARE_HOSTED_BASELINE.json\n"
    - name: Align the test baseline with hosted (G-01 option 1) and verify every changed object
      working-directory: auditor
      shell: bash
      run: 'set -euo pipefail

        # Test side only: the script asserts the local disposable endpoint and never connects to hosted.

        python scripts/cp6_g01_align.py sql > cp6-proof/g01/ALIGN.sql

        status=0

        python scripts/cp6_g01_align.py apply cp6-proof/g01/ALIGN_PER_OBJECT.json || status=$?

        cat cp6-proof/g01/ALIGN_PER_OBJECT.json

        exit "$status"

        '
    - name: Capture the aligned fingerprint and compare with hosted
      working-directory: auditor
      shell: bash
      run: "set -euo pipefail\npython scripts/cp6_g01_fingerprint.py capture cp6-proof/g01/ALIGNED_V2620.json > cp6-proof/g01/ALIGNED_CAPTURE.log\n\
        python scripts/cp6_g01_fingerprint.py compare docs/evidence/cp6-g01/hosted_summary.json cp6-proof/g01/ALIGNED_V2620.json\
        \ \\\n  | tee cp6-proof/g01/COMPARE_HOSTED_ALIGNED.json\n"
    - name: Remove disposable database
      if: always()
      working-directory: base
      run: supabase stop --workdir cp5-local --no-backup
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cp17-astra-0b7049d9-cp1-fingerprint
        path: auditor/cp6-proof/g01
        retention-days: 30
run-name: AUDIT/cp17-20261014/Astra/0b7049d9/cp1/${{ github.run_attempt }}
