name: Measure Afui final packet reader with retained source bytes
'on':
  push:
    branches: [astra-a/afui-evidence-intake-20261105]
    paths:
      - .github/workflows/afui-evidence-intake-20261105.yml
      - scripts/afui-evidence-intake-20261105/sample_final_reader.py
permissions:
  contents: read
  actions: read
concurrency:
  group: afui-evidence-intake-20261105
  cancel-in-progress: false
jobs:
  read:
    name: Verify exact archive input and success-sized reader envelope
    if: github.ref == 'refs/heads/astra-a/afui-evidence-intake-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: verifier
          persist-credentials: false
          sparse-checkout: scripts/afui-evidence-intake-20261105
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: exact-candidate
          ref: fd797083eab093d9dc97f2d52ca61dc37812b437
          persist-credentials: false
          sparse-checkout: scripts/cp7_accessory_nonpayable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run only the final packet reader resource check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C exact-candidate rev-parse HEAD)" = "fd797083eab093d9dc97f2d52ca61dc37812b437"
          test "$(git -C exact-candidate rev-parse HEAD^{tree})" = "02a8812e9eae2272a976d1dbd1e21aff8c022467"
          python -B verifier/scripts/afui-evidence-intake-20261105/sample_final_reader.py exact-candidate
