name: Check operator latency measurement without an ERP database
'on':
  push:
    branches: [astra-a/afui-evidence-intake-20261105]
    paths: [.github/workflows/afui-evidence-intake-20261105.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: afui-evidence-intake-20261105
  cancel-in-progress: false
jobs:
  preflight:
    name: Check the visible-result timing control in Chromium
    if: github.ref == 'refs/heads/astra-a/afui-evidence-intake-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0b81e4aa9cf498bbaef667ca346d5741a5917fa6
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install the locked Chromium test dependencies
        run: |
          set -euo pipefail
          npm ci --include=dev
          npx --no-install playwright install --with-deps chromium
      - name: Run the timing control against a deterministic browser page
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0b81e4aa9cf498bbaef667ca346d5741a5917fa6"
          test "$(git rev-parse HEAD^{tree})" = "26ed7caab1c70b32487cc93650b5a2134546e080"
          node --check scripts/cp7_r3_chain_browser.mjs
          node --check scripts/cp7_p11_sales_browser.mjs
          node scripts/cp7_p19_browser_latency_test.mjs --browser
