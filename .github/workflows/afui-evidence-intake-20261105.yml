name: Read fixed completed Afui evidence without ERP execution
on:
  push:
    branches: [astra-a/afui-evidence-intake-20261105]
    paths:
      - scripts/afui-evidence-intake-20261105/**
      - .github/workflows/afui-evidence-intake-20261105.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: afui-evidence-intake-20261105
  cancel-in-progress: false
jobs:
  retain:
    if: github.ref == 'refs/heads/astra-a/afui-evidence-intake-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Retrieve complete original failure and supervision reports first
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/afui-evidence-intake-20261105/retain.py core
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: afui-41878688074-exact-core
          path: afui-evidence-intake-20261105/core
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Verify and split complete failed-run archive; no ERP imports or commands
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/afui-evidence-intake-20261105/retain.py archive
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: afui-41878688074-exact-diagnostics
          path: afui-evidence-intake-20261105/diagnostics
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: afui-41878688074-exact-part-001
          path: afui-evidence-intake-20261105/part-001
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: afui-41878688074-exact-part-002
          path: afui-evidence-intake-20261105/part-002
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: afui-41878688074-exact-part-003
          path: afui-evidence-intake-20261105/part-003
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: afui-41878688074-exact-part-004
          path: afui-evidence-intake-20261105/part-004
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: afui-41878688074-exact-part-005
          path: afui-evidence-intake-20261105/part-005
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
