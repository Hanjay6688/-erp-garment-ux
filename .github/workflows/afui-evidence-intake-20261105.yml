name: Check Afui browser report gate before database provisioning
'on':
  push:
    branches: [astra-a/afui-evidence-intake-20261105]
    paths: [.github/workflows/afui-evidence-intake-20261105.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: afui-evidence-intake-20261105
  cancel-in-progress: false
jobs:
  preflight:
    name: Check exact Afui successor source and browser gate
    if: github.ref == 'refs/heads/astra-a/afui-evidence-intake-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: aabf5303230d3d1118179512189f8314ddfae11f
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install only the owning preflight Python dependencies
        run: python -m pip install --quiet 'psycopg[binary]==3.2.10' 'PyYAML==6.0.2' 'jsonschema==4.25.1'
      - name: Verify the exact successor and run the pre-database source checks
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "aabf5303230d3d1118179512189f8314ddfae11f"
          test "$(git rev-parse HEAD^{tree})" = "6b8615a93f5fb37ec71f09c1246790d42dcc9e46"
          python -B scripts/cp7_accessory_nonpayable/workflow.py --check
          python -B scripts/cp7_accessory_nonpayable/qualification.py --check-static
