name: Verify existing Afui prerequisite and access evidence without ERP
'on':
  push:
    branches: [astra-a/afui-evidence-intake-20261105]
    paths:
      - scripts/afui-evidence-intake-20261105/**
      - .github/workflows/afui-evidence-intake-20261105.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: afui-evidence-intake-20261105
  cancel-in-progress: false
jobs:
  retain:
    name: Verify existing Afui prerequisite and access Originals
    if: github.ref == 'refs/heads/astra-a/afui-evidence-intake-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: scripts/afui-evidence-intake-20261105
      - name: Check remote verifier setup and same-run small Originals
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 -B scripts/afui-evidence-intake-20261105/observe_access.py
