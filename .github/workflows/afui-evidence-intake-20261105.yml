name: Verify the historical SKU evidence reader without ERP
'on':
  push:
    branches: [astra-a/afui-evidence-intake-20261105]
    paths:
      - scripts/afui-evidence-intake-20261105/verify_sku_wib_history.py
      - .github/workflows/afui-evidence-intake-20261105.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: afui-evidence-intake-20261105
  cancel-in-progress: false
jobs:
  retain:
    name: Verify four historical Originals and the catalogue comparison
    if: github.ref == 'refs/heads/astra-a/afui-evidence-intake-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: scripts/afui-evidence-intake-20261105
      - name: Verify the prior installation and WIB failures from original archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/afui-evidence-intake-20261105/verify_sku_wib_history.py
      - name: Retain the verified reader prerequisites
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sku-wib-43187520935-reader-prerequisites
          path: sku-wib-reader-prerequisites/
          retention-days: 30
          if-no-files-found: error
