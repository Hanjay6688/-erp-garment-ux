name: CP3 R4 Full-Schema Validation

on:
  push:
    branches:
      - cp3/hpp-attendance-sewing-terminal-r4-20260901
    paths:
      - '.github/workflows/cp3-r4-full-schema-validation.yml'
      - 'supabase/migrations/20260901023200_erp_v2_6_14c_attendance_hpp_uat_alignment.sql'
      - 'supabase/tests/cp3_r3_full_schema_seed.sql'
      - 'supabase/migrations/20260901023400_erp_v2_6_14d_cp3_r4_race_and_reversal_hardening.sql'
      - 'supabase/tests/cp3_r4_full_schema_seed.sql'
      - 'supabase/tests/cp3_r4_full_schema_race_seed.sql'
      - 'supabase/tests/attendance_hpp_r4_full_schema_rollback.sql'
      - 'scripts/cp3_render_r4_reviewed_rollback.py'
      - 'scripts/test_cp3_render_r4_reviewed_rollback.py'
      - 'docs/evidence/cp3_r4_source_hashes.json'
      - 'supabase/tests/cp3_r3_full_schema_race_seed.sql'
      - 'supabase/tests/attendance_hpp_r3_full_schema_rollback.sql'
      - 'supabase/tests/attendance_hpp_r3_validator_benchmark_rollback.sql'
      - 'scripts/cp3_r3_full_schema_concurrency.py'
      - 'scripts/cp3_r4_full_schema_concurrency.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-full-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CP3_R3_CONCURRENCY_REPORT: cp3-r3-concurrency-report.json
      CP3_R4_CONCURRENCY_REPORT: cp3-r4-concurrency-report.json
    steps:
      - name: Checkout exact R3 candidate
        uses: actions/checkout@v4

      - name: Set up Python and Supabase CLI
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          python -m pip install --quiet 'psycopg[binary]==3.2.10'

      - name: Import exact reviewed CP2 restore generators
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 41bda0f748ebef57155013ea1e2f3dc86602a85a
          git show 41bda0f748ebef57155013ea1e2f3dc86602a85a:scripts/cp2_generate_catalog_restore.py > /tmp/cp3_generate_catalog_restore.py
          git show 41bda0f748ebef57155013ea1e2f3dc86602a85a:scripts/cp2_verify_local_restore.py > /tmp/cp3_verify_local_restore.py
          sha256sum /tmp/cp3_generate_catalog_restore.py /tmp/cp3_verify_local_restore.py

      - name: Download encrypted full-schema backup and separate key
        uses: actions/download-artifact@v4
        with:
          name: cp2-encrypted-backup
          path: transport/backup
          github-token: ${{ github.token }}
          run-id: 33430989888

      - name: Download recovery key separately
        uses: actions/download-artifact@v4
        with:
          name: cp2-recovery-key-separate
          path: transport/key
          github-token: ${{ github.token }}
          run-id: 33430989888

      - name: Decrypt and validate exact CP2 recovery archive
        shell: bash
        run: |
          set -euo pipefail
          encrypted="$(find transport/backup -type f -name 'ERP_ENTENG_CP2_BACKUP_*.zip.enc' -print -quit)"
          keyfile="$(find transport/key -type f -name 'ERP_ENTENG_CP2_RECOVERY_KEY_*.txt' -print -quit)"
          test -n "$encrypted"; test -n "$keyfile"
          awk 'BEGIN{blank=0} {if(blank){print; exit} if($0=="") blank=1}' "$keyfile" > transport/recovery-passphrase.tmp
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 \
            -pass file:transport/recovery-passphrase.tmp -in "$encrypted" -out transport/erp-enteng-cp2-raw.zip
          echo 'e176cac94d78915cb5fd73a065f58150184ee0b37801e6eb70fbc8fcfa29ef53  transport/erp-enteng-cp2-raw.zip' | sha256sum -c -
          unzip -tq transport/erp-enteng-cp2-raw.zip
          mkdir restore
          unzip -q transport/erp-enteng-cp2-raw.zip -d restore
          rm -f transport/recovery-passphrase.tmp
          python /tmp/cp3_generate_catalog_restore.py

      - name: Start disposable local Supabase matching hosted PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          mkdir cp3-local
          supabase init --force --workdir cp3-local
          mkdir -p cp3-local/supabase/.temp
          echo '17.6.1.165' > cp3-local/supabase/.temp/postgres-version
          supabase start --workdir cp3-local \
            -x realtime,imgproxy,studio,postgres-meta,mailpit,edge-runtime,logflare,vector,supavisor

      - name: Restore exact ERP Enteng schema, data, ledger, cron, and sequences
        shell: bash
        run: |
          set -euo pipefail
          psql "$PGURL" -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists supabase_migrations;
          create table if not exists supabase_migrations.schema_migrations(version text primary key);
          alter table supabase_migrations.schema_migrations add column if not exists statements text[];
          alter table supabase_migrations.schema_migrations add column if not exists name text;
          SQL
          psql "$PGURL" -v ON_ERROR_STOP=1 -f restore/catalog-schema-restore.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f restore/ERP_ENTENG_DATA_RESTORE.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f restore/platform-ledger-restore.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f restore/sequence-reseed.sql
          python /tmp/cp3_verify_local_restore.py | tee cp3-r3-baseline-restore.log

      - name: Source boundary and candidate digests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          paths=[
            'supabase/migrations/20260901023000_erp_v2_6_14_attendance_hpp_sewing_terminal_foundation.sql',
            'supabase/migrations/20260901023100_erp_v2_6_14b_attendance_hpp_candidate_hardening.sql',
            'supabase/migrations/20260901023200_erp_v2_6_14c_attendance_hpp_uat_alignment.sql',
            'supabase/tests/cp3_r3_full_schema_seed.sql',
            'supabase/tests/cp3_r3_full_schema_race_seed.sql',
            'supabase/tests/attendance_hpp_r3_full_schema_rollback.sql',
            'supabase/tests/attendance_hpp_r3_validator_benchmark_rollback.sql',
            'scripts/cp3_r3_full_schema_concurrency.py',
          ]
          report={'status':'PASS','head':os.environ['GITHUB_SHA'],'files':{}}
          for name in paths:
            raw=Path(name).read_bytes()
            report['files'][name]={'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'lines':raw.count(b'\n')}
          m14c=Path(paths[2]).read_text()
          executable='\n'.join(x for x in m14c.splitlines() if not x.lstrip().startswith('--'))
          forbidden=[token for token in ['fresh_qc_good','qc_good_denominator','physical_at::date',"where ps.status = 'PAID'"]
                     if token.lower() in executable.lower()]
          if forbidden: raise SystemExit(f'forbidden R3 tokens: {forbidden}')
          required=['PAYROLL_ATTENDANCE_ACCRUAL','payment_settlement_only','Asia/Jakarta',
                    '_cp3_lock_business_period','_cp3_parse_canonical_date',
                    "jsonb_typeof(v_item->'attendance_required_snapshot')",'VOIDED','v2.6.14c']
          missing=[x for x in required if x not in m14c]
          if missing: raise SystemExit(f'missing R3 symbols: {missing}')
          if re.search(r'(?im)^\s*grant\s+(execute|select|insert|update|delete|all)\b',m14c):
            raise SystemExit('R3 migration must not add grants before CP4')
          audit_actions=re.findall(
              r"insert\s+into\s+erp\.audit_logs\s*\([^)]*\)\s*values\s*\(\s*[^,]+,\s*[^,]+,\s*'([^']+)'",
              m14c,re.I|re.S,
          )
          allowed={'INSERT','UPDATE','DELETE','POST','REVERSE','RECALCULATE','WORK_BOM_COMMIT','CANCEL_UNPAID','REVERSE_PAID'}
          if not audit_actions or not set(audit_actions)<=allowed:
            raise SystemExit(f'R3 audit actions are not target-compatible: {audit_actions}')
          report['audit_actions']=sorted(set(audit_actions))
          Path('cp3-r3-source-digests.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY

      - name: Verify fixed CP3 R4 source hashes and exact runtime head
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cp3-r4-proof
          python - <<'PY' | tee cp3-r4-proof/r4-fixed-source-hash-verification.json
          import hashlib,json,os,pathlib,subprocess
          manifest=json.loads(pathlib.Path('docs/evidence/cp3_r4_source_hashes.json').read_text())
          failures=[]
          actual={}
          for path,expected in manifest['files'].items():
              data=pathlib.Path(path).read_bytes()
              digest=hashlib.sha256(data).hexdigest()
              actual[path]={'sha256':digest,'bytes':len(data)}
              if digest!=expected['sha256'] or len(data)!=expected['bytes']:
                  failures.append(path)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          if head!=os.environ['GITHUB_SHA']:
              failures.append('GITHUB_SHA')
          result={'status':'PASS' if not failures else 'FAIL','head':head,'schema_fingerprint':manifest['schema_fingerprint'],'files':actual,'failures':failures}
          print(json.dumps(result,sort_keys=True))
          if failures: raise SystemExit(1)
          PY

      - name: Prove exact 14c rollback renderer on full schema
        shell: bash
        run: |
          set -euo pipefail
          (cd scripts && python -m unittest -v test_cp3_render_reviewed_rollback.py)
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260901023000_erp_v2_6_14_attendance_hpp_sewing_terminal_foundation.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260901023100_erp_v2_6_14b_attendance_hpp_candidate_hardening.sql
          before="$(psql "$PGURL" -At -c "select md5(pg_get_functiondef('erp.approve_payroll(uuid)'::regprocedure))")"
          source='supabase/migrations/20260901023200_erp_v2_6_14c_attendance_hpp_uat_alignment.sql'
          python scripts/cp3_render_reviewed_rollback.py \
            --source "$source" --expected-sha256 "$(sha256sum "$source"|awk '{print $1}')" \
            --expected-bytes "$(stat -c %s "$source")" \
            --output cp3-r3-rendered-14c-rollback.sql --report cp3-r3-render-report.json
          psql "$PGURL" -v ON_ERROR_STOP=1 -f cp3-r3-rendered-14c-rollback.sql
          after="$(psql "$PGURL" -At -c "select md5(pg_get_functiondef('erp.approve_payroll(uuid)'::regprocedure))")"
          test "$before" = "$after"
          test "$(psql "$PGURL" -At -c "select count(*) from erp.schema_migrations where version='v2.6.14c'")" = 0

      - name: Apply exact 14c on restored full schema
        shell: bash
        run: |
          set -euo pipefail
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260901023200_erp_v2_6_14c_attendance_hpp_uat_alignment.sql
          test "$(psql "$PGURL" -At -c "select count(*) from erp.schema_migrations where version in('v2.6.14a','v2.6.14b','v2.6.14c')")" = 3

      - name: Capture exact pre-14d function and ACL baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cp3-r4-proof
          psql "$PGURL" -At -v ON_ERROR_STOP=1 <<'SQL' > cp3-r4-proof/pre14d_function_acl_snapshot.json
          select jsonb_build_object(
            'functions',jsonb_agg(jsonb_build_object(
              'identity',format('%I.%I(%s)',n.nspname,p.proname,pg_get_function_identity_arguments(p.oid)),
              'definition_sha256',encode(extensions.digest(convert_to(pg_get_functiondef(p.oid),'UTF8'),'sha256'),'hex'),
              'acl',coalesce(p.proacl::text,'NULL'),
              'owner',pg_get_userbyid(p.proowner)
            ) order by p.proname,pg_get_function_identity_arguments(p.oid))
          )
          from pg_proc p join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='erp' and p.proname in (
            'approve_payroll','set_contractor_hpp_policy_v1','reverse_work_completion','reverse_journal',
            'cancel_attendance_hpp_pool_v1','cancel_unpaid_payroll','reverse_paid_payroll'
          );
          SQL

      - name: Prove exact v2.6.14d byte-bound rollback renderer
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_cp3_render_r4_reviewed_rollback.py | tee cp3-r4-proof/r4-renderer-unit.log
          python scripts/cp3_render_r4_reviewed_rollback.py \
            --output cp3-r4-proof/v2.6.14d.reviewed.rollback.sql \
            | tee cp3-r4-proof/r4-renderer-result.json

      - name: Apply exact v2.6.14d on restored full schema
        shell: bash
        run: |
          set -euo pipefail
          psql "$PGURL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260901023400_erp_v2_6_14d_cp3_r4_race_and_reversal_hardening.sql \
            2>&1 | tee cp3-r4-proof/r4-migration-apply.log

      - name: Run target-faithful behavior, accounting, timezone, JSON, and rollback acceptance
        shell: bash
        run: |
          set -euo pipefail
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/attendance_hpp_r3_full_schema_rollback.sql | tee cp3-r3-full-schema-acceptance.log

      - name: Run CP3 R4 protected-journal and private-boundary acceptance
        shell: bash
        run: |
          set -euo pipefail
          psql "$PGURL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/attendance_hpp_r4_full_schema_rollback.sql \
            2>&1 | tee cp3-r4-proof/r4-full-schema-acceptance.log

      - name: Run bounded 2,000-destination validator benchmark on full schema
        shell: bash
        run: |
          set -euo pipefail
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/attendance_hpp_r3_validator_benchmark_rollback.sql | tee cp3-r3-validator-benchmark.log

      - name: Run committed full-schema seed and real two-connection source races
        shell: bash
        run: |
          set -euo pipefail
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/cp3_r4_full_schema_race_seed.sql 2>&1 | tee cp3-r4-proof/r4-race-seed.log
          python scripts/cp3_r4_full_schema_concurrency.py 2>&1 | tee cp3-r4-proof/r4-concurrency.log

      - name: Roll back exact v2.6.14d and prove byte-equivalent pre-14d restoration
        shell: bash
        run: |
          set -euo pipefail
          psql "$PGURL" -v ON_ERROR_STOP=1 \
            -f cp3-r4-proof/v2.6.14d.reviewed.rollback.sql \
            2>&1 | tee cp3-r4-proof/r4-reviewed-rollback-execution.log
          psql "$PGURL" -At -v ON_ERROR_STOP=1 <<'SQL' > cp3-r4-proof/post14d_rollback_function_acl_snapshot.json
          select jsonb_build_object(
            'functions',jsonb_agg(jsonb_build_object(
              'identity',format('%I.%I(%s)',n.nspname,p.proname,pg_get_function_identity_arguments(p.oid)),
              'definition_sha256',encode(extensions.digest(convert_to(pg_get_functiondef(p.oid),'UTF8'),'sha256'),'hex'),
              'acl',coalesce(p.proacl::text,'NULL'),
              'owner',pg_get_userbyid(p.proowner)
            ) order by p.proname,pg_get_function_identity_arguments(p.oid))
          )
          from pg_proc p join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='erp' and p.proname in (
            'approve_payroll','set_contractor_hpp_policy_v1','reverse_work_completion','reverse_journal',
            'cancel_attendance_hpp_pool_v1','cancel_unpaid_payroll','reverse_paid_payroll'
          );
          SQL
          cmp cp3-r4-proof/pre14d_function_acl_snapshot.json cp3-r4-proof/post14d_rollback_function_acl_snapshot.json
          psql "$PGURL" -At -v ON_ERROR_STOP=1 <<'SQL' | tee cp3-r4-proof/r4-rollback-residue.json
          select jsonb_build_object(
            'status',case when
              not exists(select 1 from erp.schema_migrations where version='v2.6.14d')
              and to_regclass('erp.cp3_r4_rollback_capsule') is null
              and to_regprocedure('erp._cp3_r4_reverse_journal_internal(uuid,text)') is null
              and to_regprocedure('erp._cp3_r4_active_pool_affects_contractor(uuid,date,date)') is null
              then 'PASS' else 'FAIL' end,
            'migration_marker',exists(select 1 from erp.schema_migrations where version='v2.6.14d'),
            'capsule',to_regclass('erp.cp3_r4_rollback_capsule'),
            'private_reverse',to_regprocedure('erp._cp3_r4_reverse_journal_internal(uuid,text)'),
            'active_pool_helper',to_regprocedure('erp._cp3_r4_active_pool_affects_contractor(uuid,date,date)')
          );
          SQL
          grep -F '"status" : "PASS"' cp3-r4-proof/r4-rollback-residue.json >/dev/null

      - name: Restore baseline business data after race and prove zero residue
        shell: bash
        run: |
          set -euo pipefail
          psql "$PGURL" -v ON_ERROR_STOP=1 -f restore/ERP_ENTENG_DATA_RESTORE.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into erp.schema_migrations(version,description,installed_at) values
          ('v2.6.14a','Private no-hook/no-grant attendance HPP foundation using immutable SELESAI_DIJAHIT, explicit normal-Mandor policy, exact debit-line journal lineage, deterministic manifest, and active-pool cancellation',clock_timestamp()),
          ('v2.6.14b','Candidate hardening: nullable open-ended policy manifest key, one direct correction lineage, deterministic visible exclusion summary',clock_timestamp()),
          ('v2.6.14c','CP3 R3 UAT alignment: approval-time attendance WIP accrual, settlement-only payment, Asia/Jakarta canonical dates, strict nested JSON types, allowed audit vocabulary, and shared source/pool locks',clock_timestamp())
          on conflict(version) do nothing;
          SQL
          psql "$PGURL" -At -v ON_ERROR_STOP=1 <<'SQL' | tee cp3-r3-final-reconciliation.json
          select jsonb_pretty(jsonb_build_object(
            'status','PASS',
            'candidate_versions',(select jsonb_agg(version order by version) from erp.schema_migrations where version in('v2.6.14a','v2.6.14b','v2.6.14c')),
            'candidate_table_rows',jsonb_build_object(
              'policies',(select count(*) from erp.contractor_hpp_policy_versions),
              'sewing',(select count(*) from erp.sewing_terminal_events),
              'pools',(select count(*) from erp.attendance_hpp_pools),
              'sources',(select count(*) from erp.attendance_hpp_pool_sources),
              'allocations',(select count(*) from erp.attendance_hpp_pool_allocations),
              'journal_links',(select count(*) from erp.attendance_hpp_journal_line_links)
            ),
            'synthetic_contractors',(select count(*) from erp.contractors where contractor_code like 'CP3R3-%' or contractor_code like 'CP3R4-%'),
            'synthetic_payrolls',(select count(*) from erp.payroll_settlements where payroll_number like 'CP3R3-%' or payroll_number like 'CP3R4-%'),
            'synthetic_pos',(select count(*) from erp.production_orders where po_number like 'CP3R3-%' or po_number like 'CP3R4-%'),
            'authenticated_pool_select',has_table_privilege('authenticated','erp.attendance_hpp_pools','SELECT'),
            'service_pool_select',has_table_privilege('service_role','erp.attendance_hpp_pools','SELECT'),
            'authenticated_activate',has_function_privilege('authenticated','erp.activate_attendance_hpp_pool_v1(uuid,text,uuid,bigint)','EXECUTE'),
            'service_activate',has_function_privilege('service_role','erp.activate_attendance_hpp_pool_v1(uuid,text,uuid,bigint)','EXECUTE'),
            'audit_constraint',(
              select pg_get_constraintdef(c.oid,true) from pg_constraint c join pg_class t on t.oid=c.conrelid join pg_namespace n on n.oid=t.relnamespace
              where n.nspname='erp' and t.relname='audit_logs' and c.conname='audit_logs_action_check'
            )
          ));
          SQL
          python - <<'PY'
          import json
          from pathlib import Path
          rec=json.loads(Path('cp3-r3-final-reconciliation.json').read_text())
          assert rec['candidate_versions']==['v2.6.14a','v2.6.14b','v2.6.14c']
          assert all(v==0 for v in rec['candidate_table_rows'].values())
          assert rec['synthetic_contractors']==rec['synthetic_payrolls']==rec['synthetic_pos']==0
          assert rec['authenticated_pool_select'] is False and rec['service_pool_select'] is False
          assert rec['authenticated_activate'] is False and rec['service_activate'] is False
          report=json.loads(Path('cp3-r4-concurrency-report.json').read_text())
          assert report['status']=='PASS'
          PY

      - name: Upload non-secret CP3 R4 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp3-r4-full-schema-proof
          path: |
            cp3-r3-source-digests.json
            cp3-r3-baseline-restore.log
            cp3-r3-render-report.json
            cp3-r3-full-schema-acceptance.log
            cp3-r3-validator-benchmark.log
            cp3-r3-concurrency-report.json
            cp3-r3-concurrency.log
            cp3-r3-final-reconciliation.json
            cp3-r4-concurrency-report.json
            cp3-r4-proof
          if-no-files-found: warn
          retention-days: 14

      - name: Destroy local stack and decrypted recovery material
        if: always()
        shell: bash
        run: |
          supabase stop --no-backup --workdir cp3-local || true
          rm -rf restore transport cp3-local cp3-r3-rendered-14c-rollback.sql
