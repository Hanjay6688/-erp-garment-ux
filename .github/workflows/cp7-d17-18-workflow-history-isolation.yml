name: CP7 D17-18 exact historical workflow isolation
on:
  push:
    branches: [astra-a/d17-18-workflow-history-isolation-check-20261028]
    paths:
      - .github/workflows/cp7-d17-18-workflow-history-isolation.yml
      - scripts/current-workflow-history-isolation/**
permissions:
  contents: read
concurrency:
  group: cp7-d17-18-workflow-history-isolation-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact frozen workflow bytes and every current source
        run: python scripts/current-workflow-history-isolation/check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workflow-history-isolation-source-${{ github.run_attempt }}
          path: cp6-proof/workflow-history-isolation/
          if-no-files-found: error
          retention-days: 30
  codeql:
    name: Historical workflow isolation CodeQL ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [actions]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          output: workflow-history-isolation-codeql
          upload: never
          upload-database: false
      - name: Reject CodeQL findings or incomplete runs
        run: |
          python3 - <<'PY'
          import json, pathlib
          files = list(pathlib.Path('workflow-history-isolation-codeql').glob('*.sarif'))
          assert files, 'No SARIF produced'
          for f in files:
              report = json.loads(f.read_text())
              assert report.get('runs'), 'No analysis runs'
              for run in report['runs']:
                  assert not run.get('results'), 'CodeQL findings need review'
                  assert run.get('invocations'), 'No invocation evidence'
                  for invocation in run['invocations']:
                      assert invocation.get('executionSuccessful') is True, 'Incomplete CodeQL'
          print('CodeQL completed with zero findings')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workflow-history-isolation-codeql-${{ matrix.language }}
          path: workflow-history-isolation-codeql
          if-no-files-found: error
          retention-days: 30
