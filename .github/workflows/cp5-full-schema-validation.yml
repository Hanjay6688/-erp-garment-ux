name: CP5 BS Resolution and Cutting Bridge Full-Schema Validation

on:
  push:
    branches:
      - pre-cp5/cutting-persistence-pickup-wip-r1-20260903
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cp5-r1-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_BASE_SHA: 8bfac13b91ea1be92111139e2fddcabccf9ae19a
  SOURCE_BASE_TREE: a9b193010266bb686c57709865a992769a835855
  PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  CP45_PATTERN_ASSIGNMENT_RACE_REPORT: cp5-proof/cp45-pattern-assignment-concurrency.json
  CP45_AUTH_REPORT: cp5-proof/cp45-auth-permission-e2e.json
  CP5_BS_RESOLUTION_RACE_REPORT: cp5-proof/cp5-bs-resolution-concurrency.json
  CP5_AUTH_REPORT: cp5-proof/cp5-auth-permission-e2e.json

jobs:
  validate-full-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout exact CP5 candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity, ancestry, ownership, and source gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cp5-proof
          test "$(git merge-base HEAD "$SOURCE_BASE_SHA")" = "$SOURCE_BASE_SHA"
          test "$(git rev-parse "$SOURCE_BASE_SHA^{tree}")" = "$SOURCE_BASE_TREE"
          test "$(git rev-list --count "$SOURCE_BASE_SHA"..HEAD)" -ge 1
          test -z "$(git rev-list --merges "$SOURCE_BASE_SHA"..HEAD)"
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          npm ci
          npm run check:backend
          npm run check:access
          node --check scripts/cp5_auth_permission_e2e.mjs
          python -m py_compile scripts/cp5_bs_resolution_concurrency.py
          npx playwright test --list --config playwright.cp5.config.ts
          npx playwright test tests/browser/cutting-bridge.spec.ts --list
          git diff --check "$SOURCE_BASE_SHA" "$GITHUB_SHA"
          printf 'branch=%s\nhead=%s\nparent=%s\nbase=%s\nbase_tree=%s\nremote_head=%s\ncommit_count=%s\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(git rev-parse HEAD^)" "$SOURCE_BASE_SHA" "$SOURCE_BASE_TREE" "$remote_head" \
            "$(git rev-list --count "$SOURCE_BASE_SHA"..HEAD)" | tee cp5-proof/IDENTITY.txt

      - name: Set up Python and PostgreSQL client
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          python -m pip install --quiet 'psycopg[binary]==3.2.10'

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Record pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          supabase --version | tee cp5-proof/SUPABASE_CLI_VERSION.txt
          psql --version | tee cp5-proof/PSQL_VERSION.txt
          node --version | tee cp5-proof/NODE_VERSION.txt

      - name: Verify immutable CP4.5a catalog/config bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip,hashlib,json
          from pathlib import Path
          fixture=Path('supabase/tests/fixtures/erp_enteng_cp45a_catalog_bootstrap.sql.gz')
          external_fixture=Path('supabase/tests/fixtures/erp_enteng_cp45a_external_application_triggers.sql')
          manifest=json.loads(Path('supabase/tests/fixtures/erp_enteng_cp45a_catalog_bootstrap.manifest.json').read_text())
          packed=fixture.read_bytes(); sql=gzip.decompress(packed); external_sql=external_fixture.read_bytes()
          digest=lambda value:hashlib.sha256(value).hexdigest()
          assert manifest['format']=='ERP_ENTENG_CP45A_CATALOG_CONFIG_BOOTSTRAP_V1'
          assert manifest['source_project_ref']=='siimvrusnzxexizpyoib'
          assert manifest['source_kind']=='READ_ONLY_PG_CATALOG_PLUS_ALLOWLISTED_CONFIGURATION'
          assert manifest['contains_business_rows'] is False
          assert manifest['contains_auth_rows'] is False
          assert manifest['contains_app_users'] is False
          assert manifest['contains_credentials'] is False
          assert manifest['counts']=={
            'constraints':1064,'functions':500,'indexes':202,'platform_migrations':63,
            'policies':190,'sequences':6,'tables':159,'triggers':398,'views':51,
          }
          assert manifest['safe_configuration_rows']=={
            'app_roles':9,'app_permissions':111,'app_role_permissions':329,
            'chart_accounts':24,'accounting_account_mappings':24,'uom_definitions':8,
            'misc_finance_categories':2,'accounting_period_control':1,'cash_accounts':1,
            'system_release_info':1,'schema_migrations':48,
            'cp3_r4_rollback_capsule':7,'cp4_v2616_rollback_capsule':4,
            'cp45_v2617_rollback_capsule':3,'cp45_v2617a_rollback_capsule':2,
          }
          assert len(packed)==manifest['gzip_bytes'] and digest(packed)==manifest['gzip_sha256']
          assert len(sql)==manifest['sql_bytes'] and digest(sql)==manifest['sql_sha256']
          external=manifest['external_application_triggers']
          assert external['count']==1
          assert external['fixture_path']==str(external_fixture)
          assert len(external_sql)==external['sql_bytes'] and digest(external_sql)==external['sql_sha256']
          assert b'trg_cp45_guard_last_owner_auth_delete' in external_sql
          report={
            'status':'PASS','source_kind':manifest['source_kind'],
            'captured_at_utc':manifest['captured_at_utc'],
            'contains_business_rows':False,'contains_auth_rows':False,
            'catalog_payload_sha256':manifest['catalog_payload_sha256'],
            'external_application_trigger_sha256':external['sql_sha256'],
            'sql_sha256':manifest['sql_sha256'],'gzip_sha256':manifest['gzip_sha256'],
          }
          Path('cp5-proof/CP45A_CATALOG_BOOTSTRAP_VERIFICATION.json').write_text(json.dumps(report,indent=2)+'\n')
          PY

      - name: Start free disposable local Supabase
        shell: bash
        run: |
          set -euo pipefail
          mkdir cp5-local
          supabase init --force --workdir cp5-local
          mkdir -p cp5-local/supabase/.temp
          echo '17.6.1.165' > cp5-local/supabase/.temp/postgres-version
          sed -i '0,/^enable_signup = true$/s//enable_signup = false/' cp5-local/supabase/config.toml
          python - <<'PY'
          import json,tomllib
          from pathlib import Path
          config=tomllib.loads(Path('cp5-local/supabase/config.toml').read_text())
          assert config['auth']['enable_signup'] is False
          assert config['auth']['email']['enable_signup'] is True
          Path('cp5-proof/LOCAL_AUTH_CONFIG.json').write_text(json.dumps({
            'global_public_signup':False,'email_provider_enabled':True,
          },indent=2)+'\n')
          PY
          supabase start --workdir cp5-local \
            -x realtime,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor

      - name: Restore exact CP4.5a schema and allowlisted configuration
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc supabase/tests/fixtures/erp_enteng_cp45a_catalog_bootstrap.sql.gz \
            | psql "$PGURL" -v ON_ERROR_STOP=1 \
            | tee cp5-proof/CP45A_CATALOG_BOOTSTRAP.log
          psql "$PGURL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/fixtures/erp_enteng_cp45a_external_application_triggers.sql \
            2>&1 | tee cp5-proof/CP45A_EXTERNAL_APPLICATION_TRIGGERS.log
          psql "$PGURL" -At -v ON_ERROR_STOP=1 <<'SQL' | tee cp5-proof/CP45A_RESTORED_BOUNDARY.json
          select jsonb_build_object(
            'status',case when
              (select count(*) from auth.users)=0
              and (select count(*) from erp.app_users)=0
              and (select count(*) from erp.audit_logs)=0
              and (select count(*) from erp.schema_migrations)=48
              and (select count(*) from erp.schema_migrations where version='v2.6.17a')=1
              and (select count(*) from supabase_migrations.schema_migrations)=63
              and (select count(*) from supabase_migrations.schema_migrations where version='20260902043000')=1
              and (select count(*) from supabase_migrations.schema_migrations where version='20260902104937')=1
              and (select count(*) from supabase_migrations.schema_migrations where version='20260902185106')=1
              and (select count(*) from erp.cp3_r4_rollback_capsule)=7
              and (select count(*) from erp.cp4_v2616_rollback_capsule)=4
              and (select count(*) from erp.cp45_v2617_rollback_capsule)=3
              and (select count(*) from erp.cp45_v2617a_rollback_capsule)=2
              and (select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace tn on tn.oid=c.relnamespace join pg_proc p on p.oid=t.tgfoid join pg_namespace fn on fn.oid=p.pronamespace where not t.tgisinternal and tn.nspname<>'erp' and fn.nspname='erp')=1
              and exists(select 1 from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace tn on tn.oid=c.relnamespace where not t.tgisinternal and tn.nspname='auth' and c.relname='users' and t.tgname='trg_cp45_guard_last_owner_auth_delete')
              then 'PASS' else 'FAIL' end,
            'tables',(select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='erp' and c.relkind='r'),
            'views',(select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname in('erp','public') and c.relkind='v' and (n.nspname='erp' or not exists(select 1 from pg_depend d where d.classid='pg_class'::regclass and d.objid=c.oid and d.deptype='e'))),
            'functions',(select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname in('erp','public') and not exists(select 1 from pg_depend d where d.classid='pg_proc'::regclass and d.objid=p.oid and d.deptype='e')),
            'triggers',(select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='erp' and not t.tgisinternal),
            'external_application_triggers',(select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace tn on tn.oid=c.relnamespace join pg_proc p on p.oid=t.tgfoid join pg_namespace fn on fn.oid=p.pronamespace where not t.tgisinternal and tn.nspname<>'erp' and fn.nspname='erp'),
            'constraints',(select count(*) from pg_constraint co join pg_class c on c.oid=co.conrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='erp' and c.relkind='r'),
            'indexes',(select count(*) from pg_index i join pg_class c on c.oid=i.indrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='erp'),
            'policies',(select count(*) from pg_policy p join pg_class c on c.oid=p.polrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='erp'),
            'platform_count',(select count(*) from supabase_migrations.schema_migrations),
            'application_count',(select count(*) from erp.schema_migrations),
            'auth_users',(select count(*) from auth.users),
            'app_users',(select count(*) from erp.app_users),
            'audit_logs',(select count(*) from erp.audit_logs)
          );
          SQL
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('cp5-proof/CP45A_RESTORED_BOUNDARY.json').read_text())
          assert r['status']=='PASS',r
          assert r=={
            'status':'PASS','tables':159,'views':51,'functions':500,'triggers':398,
            'external_application_triggers':1,'constraints':1064,'indexes':462,'policies':190,
            'platform_count':63,'application_count':48,'auth_users':0,'app_users':0,'audit_logs':0,
          },r
          PY

      - name: Prove frozen predecessor behavior and real CP4.5 races
        shell: bash
        run: |
          set -euo pipefail
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/cp45_pattern_assignment_immutability_rollback.sql 2>&1 | tee cp5-proof/CP45A_BASELINE_ACCEPTANCE.log
          python scripts/cp45_pattern_assignment_concurrency.py 2>&1 | tee cp5-proof/CP45A_BASELINE_CONCURRENCY.log
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/cp4_hpp_route_auth_rollback.sql 2>&1 | tee cp5-proof/CP4_BASELINE_ACCEPTANCE.log
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/attendance_hpp_r4_full_schema_rollback.sql 2>&1 | tee cp5-proof/CP3_R4_BASELINE_ACCEPTANCE.log
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/payroll_component_entitlement_rollback.sql 2>&1 | tee cp5-proof/V2615_BASELINE_ACCEPTANCE.log
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('cp5-proof/cp45-pattern-assignment-concurrency.json').read_text())
          assert r['status']=='PASS',r
          assert all(r['assertions'].values()),r
          assert all(value==0 for value in r['residue'].values()),r
          PY

      - name: Prove real local Auth and permission foundation before CP5
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:54321/auth/v1/health >/dev/null; then break; fi
            sleep 1
          done
          source <(supabase status --workdir cp5-local -o env)
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export CP45_PROOF_CLASSIFICATION=LOCAL_FULL_SCHEMA_AUTH_VERIFIED
          node scripts/cp45_auth_permission_e2e.mjs 2>&1 | tee cp5-proof/CP45_AUTH_FOUNDATION.log
          test "$(psql "$PGURL" -At -c 'select count(*) from auth.users')" = '0'
          test "$(psql "$PGURL" -At -c 'select count(*) from erp.app_users')" = '0'

      - name: Capture exact pre-Cutting and pre-CP5 boundary
        shell: bash
        run: |
          set -euo pipefail
          psql "$PGURL" -At -v ON_ERROR_STOP=1 <<'SQL' | tee cp5-proof/PRE_CP5_BOUNDARY.json
          select jsonb_build_object(
            'status',case when
              exists(select 1 from erp.schema_migrations where version='v2.6.17a')
              and not exists(select 1 from erp.schema_migrations where version in('v2.6.18','v2.6.18a','v2.6.19','v2.6.19a','v2.6.19b'))
              and md5(pg_get_functiondef('erp.require_internal()'::regprocedure))='785838675ae23699ce163e4218f058bf'
              and md5(pg_get_functiondef('erp.list_patterns_v1(text,text,integer,integer)'::regprocedure))='feff17283c331b4883b208227bc99079'
              and (select count(*) from auth.users)=0
              and (select count(*) from erp.app_users)=0
              then 'PASS' else 'FAIL' end,
            'platform_versions',(select jsonb_agg(version order by version) from supabase_migrations.schema_migrations where version like '2026090%'),
            'application_versions',(select jsonb_agg(version order by version) from erp.schema_migrations where version like 'v2.6.1%'),
            'require_internal_md5',md5(pg_get_functiondef('erp.require_internal()'::regprocedure)),
            'list_patterns_md5',md5(pg_get_functiondef('erp.list_patterns_v1(text,text,integer,integer)'::regprocedure))
          );
          SQL
          test "$(python -c "import json;print(json.load(open('cp5-proof/PRE_CP5_BOUNDARY.json'))['status'])")" = 'PASS'

      - name: Apply v2.6.18 Cutting Bridge once and reject replay
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < supabase/migrations/20260903022604_erp_v2_6_18_cutting_persistence_pickup_wip.sql)" = '80392'
          echo '6a568a78ad0b9baa2ef5ee958ee967d7c997cc1f4dfb7f0e4ef5e6ff69e5038f  supabase/migrations/20260903022604_erp_v2_6_18_cutting_persistence_pickup_wip.sql' | sha256sum -c - | tee cp5-proof/V2618_MIGRATION_SHA256.txt
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260903022604_erp_v2_6_18_cutting_persistence_pickup_wip.sql 2>&1 | tee cp5-proof/V2618_APPLY.log
          psql "$PGURL" -v ON_ERROR_STOP=1 -c "insert into supabase_migrations.schema_migrations(version,name,statements) values('20260903022604','erp_v2_6_18_cutting_persistence_pickup_wip',array[]::text[]) on conflict(version) do nothing"
          set +e
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260903022604_erp_v2_6_18_cutting_persistence_pickup_wip.sql > cp5-proof/V2618_REPLAY_REJECTION.log 2>&1
          replay_status=$?
          set -e
          test "$replay_status" -ne 0
          grep -F 'v2.6.18 is already recorded' cp5-proof/V2618_REPLAY_REJECTION.log >/dev/null

      - name: Prove exact recorded and unused v2.6.18 boundary
        shell: bash
        run: |
          set -euo pipefail
          psql "$PGURL" -At -v ON_ERROR_STOP=1 <<'SQL' | tee cp5-proof/V2618_RECORDED_BOUNDARY.json
          select jsonb_build_object(
            'status',case when
              exists(select 1 from erp.schema_migrations where version='v2.6.18')
              and not exists(select 1 from erp.schema_migrations where version in('v2.6.18a','v2.6.19','v2.6.19a','v2.6.19b'))
              and exists(select 1 from supabase_migrations.schema_migrations
                where version='20260903022604' and name='erp_v2_6_18_cutting_persistence_pickup_wip')
              and (select count(*) from erp.cutting_bridge_v2618_rollback_capsule where object_kind='FUNCTION')=8
              and (select count(*) from erp.cutting_bridge_v2618_rollback_capsule where object_kind='RELATION')=9
              and not (select relrowsecurity from pg_class where oid='erp.cutting_bridge_v2618_rollback_capsule'::regclass)
              and to_regclass('erp.cutting_bridge_v2618a_rollback_capsule') is null
              and to_regclass('erp.cutting_bridge_execution_context') is null
              and to_regclass('erp.idx_material_stock_location_roll') is not null
              and to_regclass('erp.idx_material_stock_roll_location') is null
              and md5(pg_get_functiondef('erp.require_internal()'::regprocedure))='785838675ae23699ce163e4218f058bf'
              and md5(pg_get_functiondef('erp.list_patterns_v1(text,text,integer,integer)'::regprocedure))='feff17283c331b4883b208227bc99079'
              and md5(pg_get_functiondef('erp.post_cutting_material_issue(uuid,uuid)'::regprocedure))='bf91c08814f5eba65412439b7edb07bb'
              and not exists(select 1 from erp.cutting_pickups)
              and not exists(select 1 from erp.cutting_distribution_batches)
              and not exists(select 1 from erp.cutting_distribution_allocations)
              and not exists(select 1 from erp.cutting_groups where source_location_id is not null)
              then 'PASS' else 'FAIL' end,
            'function_capsule',(select count(*) from erp.cutting_bridge_v2618_rollback_capsule where object_kind='FUNCTION'),
            'relation_capsule',(select count(*) from erp.cutting_bridge_v2618_rollback_capsule where object_kind='RELATION'),
            'cutting_facts',(select count(*) from erp.cutting_pickups),
            'require_internal_md5',md5(pg_get_functiondef('erp.require_internal()'::regprocedure))
          );
          SQL
          test "$(python -c "import json;print(json.load(open('cp5-proof/V2618_RECORDED_BOUNDARY.json'))['status'])")" = 'PASS'

      - name: Apply v2.6.18a reconciliation once and reject replay
        shell: bash
        run: |
          set -euo pipefail
          sha256sum supabase/migrations/20260903070931_erp_v2_6_18a_cutting_bridge_reconciliation.sql | tee cp5-proof/V2618A_MIGRATION_SHA256.txt
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260903070931_erp_v2_6_18a_cutting_bridge_reconciliation.sql 2>&1 | tee cp5-proof/V2618A_APPLY.log
          psql "$PGURL" -v ON_ERROR_STOP=1 -c "insert into supabase_migrations.schema_migrations(version,name,statements) values('20260903070931','erp_v2_6_18a_cutting_bridge_reconciliation',array[]::text[]) on conflict(version) do nothing"
          set +e
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260903070931_erp_v2_6_18a_cutting_bridge_reconciliation.sql > cp5-proof/V2618A_REPLAY_REJECTION.log 2>&1
          replay_status=$?
          set -e
          test "$replay_status" -ne 0
          grep -F 'v2.6.18a is already recorded or CP5 is already installed' cp5-proof/V2618A_REPLAY_REJECTION.log >/dev/null
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/cutting_bridge_persistence_pickup_wip_rollback.sql 2>&1 | tee cp5-proof/V2618_ACCEPTANCE.log

      - name: Apply v2.6.19 CP5 once and reject replay
        shell: bash
        run: |
          set -euo pipefail
          sha256sum supabase/migrations/20260903070932_erp_v2_6_19_cp5_bs_resolution_recovery.sql | tee cp5-proof/V2619_MIGRATION_SHA256.txt
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260903070932_erp_v2_6_19_cp5_bs_resolution_recovery.sql 2>&1 | tee cp5-proof/V2619_APPLY.log
          psql "$PGURL" -v ON_ERROR_STOP=1 -c "insert into supabase_migrations.schema_migrations(version,name,statements) values('20260903070932','erp_v2_6_19_cp5_bs_resolution_recovery',array[]::text[]) on conflict(version) do nothing"
          set +e
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260903070932_erp_v2_6_19_cp5_bs_resolution_recovery.sql > cp5-proof/V2619_REPLAY_REJECTION.log 2>&1
          replay_status=$?
          set -e
          test "$replay_status" -ne 0
          grep -F 'v2.6.19 is already recorded' cp5-proof/V2619_REPLAY_REJECTION.log >/dev/null

      - name: Apply official v2.6.19a accessory-lineage correction once and reject replay
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < supabase/migrations/20260903151034_erp_v2_6_19a_cp5_rework_accessory_lineage.sql)" = '55354'
          echo '204b9246f3c8c6464476da1a7f1574f5e0ae4c46f024c082704795b3eef5210f  supabase/migrations/20260903151034_erp_v2_6_19a_cp5_rework_accessory_lineage.sql' | sha256sum -c - | tee cp5-proof/V2619A_MIGRATION_SHA256.txt
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260903151034_erp_v2_6_19a_cp5_rework_accessory_lineage.sql 2>&1 | tee cp5-proof/V2619A_APPLY.log
          psql "$PGURL" -v ON_ERROR_STOP=1 -c "insert into supabase_migrations.schema_migrations(version,name,statements) values('20260903151034','erp_v2_6_19a_cp5_rework_accessory_lineage',array[]::text[]) on conflict(version) do nothing"
          set +e
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260903151034_erp_v2_6_19a_cp5_rework_accessory_lineage.sql > cp5-proof/V2619A_REPLAY_REJECTION.log 2>&1
          replay_status=$?
          set -e
          test "$replay_status" -ne 0
