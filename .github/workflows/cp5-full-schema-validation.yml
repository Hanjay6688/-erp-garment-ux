      - name: Destroy disposable stack and recovery material
        if: always()
        shell: bash
        run: |
          supabase stop --workdir cp5-local --no-backup 2>/dev/null || true
          find recovery recovery-transport -type f \( -name '*.zip' -o -name '*.zip.enc' -o -name '*KEY*.txt' -o -name '*passphrase*' \) -exec shred -u {} + 2>/dev/null || true
          rm -rf cp5-local recovery restore recovery-transport /tmp/v2615-byte-bound-body.sql
