name: CP7 recover verified finance evidence
'on':
  push:
    branches: [cp7/integration]
    paths:
      - .github/workflows/cp7-evidence-recovery.yml
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify original artifacts and emit selected evidence manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/cp7_recover_finance_evidence.py
