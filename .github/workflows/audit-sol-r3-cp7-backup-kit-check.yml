name: AUDIT/Sol/cp7-backup-kit-check
permissions:
  contents: read
concurrency:
  group: audit-sol-r3-cp7-backup-kit-check-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: tool
        persist-credentials: false
        fetch-depth: 0
        ref: b53b5acdf260b03ebac3474e9ae837fcef6f6eb1
    - name: Sol record exact candidate and product trees
      run: "python3 - <<'SOL_IDENTITY'\nimport json,os,pathlib,subprocess,hashlib\nsha='b53b5acdf260b03ebac3474e9ae837fcef6f6eb1'\npaths=['tool']\nitems=[]\nfor p in paths:\n r=pathlib.Path(p)\n g=lambda *a:subprocess.check_output(['git','-C',str(r),*a],text=True).strip()\n head=g('rev-parse','HEAD')\n # T3 intentionally keeps an inherited frozen UI checkout in its browser phase; actual identity remains visible.\n items.append(dict(path=p,head=head,tree=g('rev-parse','HEAD^{tree}'),candidate_exact=head==sha,product_trees={q:g('rev-parse','HEAD:'+q)for q in ['src','supabase/release','supabase/migrations','scripts/cp7-src','supabase/dev']},tracked_product_diff=g('diff','--name-only','--','src','scripts/cp7-src','supabase/release','supabase/migrations','supabase/dev'),lock_sha256=hashlib.sha256((r/'package-lock.json').read_bytes()).hexdigest()))\nout=dict(candidate_sha=sha,workflow_sha=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],attempt=os.environ['GITHUB_RUN_ATTEMPT'],suite='cp7-backup-kit-check',checkouts=items,evidence_origin='INDEPENDENT_NATIVE_RERUN',oracle_origin='WRITER_OR_INHERITED_DECLARED',fixture_origin='PUBLIC_REPO_SYNTHETIC')\n\
        p=pathlib.Path(os.environ['RUNNER_TEMP'])/'sol-proof';p.mkdir(exist_ok=True);(p/'IDENTITY.json').write_text(json.dumps(out,indent=2)+'\\n');print(json.dumps(out))\nassert any(x['candidate_exact']for x in items) or 'cp7-backup-kit-check'=='cp6-t3-release-package'\nSOL_IDENTITY"
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Client tools (PostgreSQL 17 client, rclone, gpg, psycopg)
      shell: bash
      run: "set -euo pipefail\nsudo apt-get update -qq\nsudo apt-get install -y -qq ca-certificates curl gnupg rclone\nsudo install -d /usr/share/postgresql-common/pgdg\nsudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \\\n  https://www.postgresql.org/media/keys/ACCC4CF8.asc\ntest \"$(gpg --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc | awk -F: '$1 == \"fpr\" { print $10; exit }')\" \\\n  = 'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'\n. /etc/os-release\necho \"deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main\" \\\n  | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null\nsudo apt-get update -qq\nsudo apt-get install -y -qq postgresql-client-17\necho '/usr/lib/postgresql/17/bin' >> \"$GITHUB_PATH\"\npython -m pip install --quiet 'psycopg[binary]==3.2.10'\n"
    - name: Supabase Postgres image and S3 emulator
      shell: bash
      run: 'set -euo pipefail

        image=public.ecr.aws/supabase/postgres:17.6.1.165

        docker pull -q "$image" || { image=ghcr.io/supabase/postgres:17.6.1.165; docker pull -q "$image"; }

        echo "IMAGE=$image" >> "$GITHUB_ENV"

        python -m venv "$RUNNER_TEMP/s3emu"

        "$RUNNER_TEMP/s3emu/bin/pip" install --quiet ''moto[server]==5.1.10''

        nohup "$RUNNER_TEMP/s3emu/bin/moto_server" -H 127.0.0.1 -p 9000 > "$RUNNER_TEMP/s3emu.log" 2>&1 &

        umask 077

        printf ''[s3emu]\ntype = s3\nprovider = Other\naccess_key_id = kit\nsecret_access_key = kit\nendpoint = http://127.0.0.1:9000\nregion = us-east-1\n'' > "$RUNNER_TEMP/rclone.conf"

        openssl rand -base64 48 > "$RUNNER_TEMP/kit.pass"

        echo "RCLONE_CONFIG=$RUNNER_TEMP/rclone.conf" >> "$GITHUB_ENV"

        for i in $(seq 1 30); do RCLONE_CONFIG="$RUNNER_TEMP/rclone.conf" rclone mkdir s3emu:cp7-kit >/dev/null 2>&1 && break; sleep 2; done

        '
    - name: Kit proof (S3 emulator)
      env:
        TOOL: ${{ github.workspace }}/tool
      run: "REMOTE=\"s3emu:cp7-kit/proof-${{ github.run_id }}\" PASS_FILE=\"$RUNNER_TEMP/kit.pass\" OUT=\"$RUNNER_TEMP/kit-s3.json\" \\\n  bash tool/ops/backup-repo/proof.sh\n"
    - name: Kit proof (local folder)
      env:
        TOOL: ${{ github.workspace }}/tool
      run: "REMOTE=\"$RUNNER_TEMP/kit-local/proof-${{ github.run_id }}\" PASS_FILE=\"$RUNNER_TEMP/kit.pass\" OUT=\"$RUNNER_TEMP/kit-local.json\" \\\n  bash tool/ops/backup-repo/proof.sh\n"
    - name: Remove the emulator
      if: always()
      run: pkill -f moto_server || true
    - name: Sol preserve audit identity
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cp17-r3-Sol-b53b5acd-cp7-backup-kit-check-${{ github.job }}-${{ strategy.job-index }}-identity
        path: ${{ runner.temp }}/sol-proof
        retention-days: 30
        if-no-files-found: warn
run-name: AUDIT/cp17-r3/Sol/b53b5acd/cp7-backup-kit-check/1
'on':
  push:
    branches:
    - audit/sol-cp1-7-r3-b53b5acd-20261017
    paths:
    - .github/workflows/audit-sol-r3-cp7-backup-kit-check.yml
  workflow_dispatch: {}
