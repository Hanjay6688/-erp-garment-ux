name: CP7 D17-18 current integrated build security and fixture browsers
on:
  push:
    branches: [astra-a/d17-18-integration-shell-check-20261028]
    paths:
      - .github/workflows/cp7-d17-18-integration-shell.yml
      - scripts/current-integration-shell-qualification/**
permissions:
  contents: read
concurrency:
  group: cp7-d17-18-integration-shell-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Admit exact integrated source and retained full test suite
        run: python scripts/current-integration-shell-qualification/check.py
      - name: Install exact locked dependencies
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee cp6-proof/current-integration-shell/npm-ci.log
      - name: Run unchanged complete security and frozen boundary checks
        run: |
          set -o pipefail
          npm run test:security 2>&1 | tee cp6-proof/current-integration-shell/security.log
      - name: Build complete application and scan exact client artifacts
        run: |
          set -o pipefail
          npm run build 2>&1 | tee cp6-proof/current-integration-shell/build.log
      - name: Install pinned Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Run all six original desktop and mobile fixture cases
        run: |
          set -o pipefail
          npx --no-install playwright test --config playwright.cp7.config.ts 2>&1 | tee cp6-proof/current-integration-shell/browser.log
      - name: Retain every result and first failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-integration-shell-${{ github.run_attempt }}
          path: |
            cp6-proof/current-integration-shell/
            test-results/cp7-shell-proof/
          if-no-files-found: error
          retention-days: 30
  codeql:
    name: Current integration CodeQL ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          output: current-integration-codeql
          upload: never
          upload-database: false
      - name: Reject CodeQL findings or incomplete runs
        run: |
          python3 - <<'PY'
          import json, pathlib
          files = list(pathlib.Path('current-integration-codeql').glob('*.sarif'))
          assert files, 'No SARIF produced'
          for f in files:
              report = json.loads(f.read_text())
              assert report.get('runs'), 'No analysis runs'
              for run in report['runs']:
                  assert not run.get('results'), 'CodeQL findings need review'
                  assert run.get('invocations'), 'No invocation evidence'
                  for invocation in run['invocations']:
                      assert invocation.get('executionSuccessful') is True, 'Incomplete CodeQL'
          print('CodeQL completed with zero findings')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: current-integration-codeql-${{ matrix.language }}
          path: current-integration-codeql
          if-no-files-found: error
          retention-days: 30
