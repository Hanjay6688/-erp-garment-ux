name: CP7.5 read installation and recovery receipts
'on':
  push:
    branches: [writer-a/cp75-baseline-public]
    paths: ['qualification/cp75-receipts/request.json']
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: qualification/cp75-receipts
          persist-credentials: false
      - name: Verify ZIPs and summarize their SQL receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 qualification/cp75-receipts/read.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cp75-receipts-${{ github.run_id }}
          path: cp75-receipts.json
          if-no-files-found: error
          retention-days: 90
