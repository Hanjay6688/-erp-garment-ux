# Checks the private backup repository kit (ops/backup-repo/, owner decision 13 Oct 2026 D13-8) on disposable
# servers: ops/backup-repo/proof.sh with an S3 emulator and a local folder in place of Google Drive. This proves the
# kit's mechanics only; the Google Drive proof is the owner's run of drive-proof.yml in the private repository.
name: CP7 Backup Kit Check
'on':
  push:
    branches:
    - claude/new-session-deapao
    paths:
    - ops/backup-repo/**
    - scripts/cp7_offsite_backup.py
    - scripts/cp7_offsite_backup_cases.py
    - scripts/cp7_nightly_backup.py
    - .github/workflows/cp7-backup-kit-check.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: cp7-backup-kit-check-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: tool
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Client tools (PostgreSQL 17 client, rclone, gpg, psycopg)
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq ca-certificates curl gnupg rclone
        sudo install -d /usr/share/postgresql-common/pgdg
        sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
          https://www.postgresql.org/media/keys/ACCC4CF8.asc
        test "$(gpg --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc | awk -F: '$1 == "fpr" { print $10; exit }')" \
          = 'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'
        . /etc/os-release
        echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
          | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
        sudo apt-get update -qq
        sudo apt-get install -y -qq postgresql-client-17
        echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
        python -m pip install --quiet 'psycopg[binary]==3.2.10'
    - name: Supabase Postgres image and S3 emulator
      shell: bash
      run: |
        set -euo pipefail
        image=public.ecr.aws/supabase/postgres:17.6.1.165
        docker pull -q "$image" || { image=ghcr.io/supabase/postgres:17.6.1.165; docker pull -q "$image"; }
        echo "IMAGE=$image" >> "$GITHUB_ENV"
        python -m venv "$RUNNER_TEMP/s3emu"
        "$RUNNER_TEMP/s3emu/bin/pip" install --quiet 'moto[server]==5.1.10'
        nohup "$RUNNER_TEMP/s3emu/bin/moto_server" -H 127.0.0.1 -p 9000 > "$RUNNER_TEMP/s3emu.log" 2>&1 &
        umask 077
        printf '[s3emu]\ntype = s3\nprovider = Other\naccess_key_id = kit\nsecret_access_key = kit\nendpoint = http://127.0.0.1:9000\nregion = us-east-1\n' > "$RUNNER_TEMP/rclone.conf"
        openssl rand -base64 48 > "$RUNNER_TEMP/kit.pass"
        echo "RCLONE_CONFIG=$RUNNER_TEMP/rclone.conf" >> "$GITHUB_ENV"
        for i in $(seq 1 30); do RCLONE_CONFIG="$RUNNER_TEMP/rclone.conf" rclone mkdir s3emu:cp7-kit >/dev/null 2>&1 && break; sleep 2; done
    - name: Kit proof (S3 emulator)
      env:
        TOOL: ${{ github.workspace }}/tool
      run: |
        REMOTE="s3emu:cp7-kit/proof-${{ github.run_id }}" PASS_FILE="$RUNNER_TEMP/kit.pass" OUT="$RUNNER_TEMP/kit-s3.json" \
          bash tool/ops/backup-repo/proof.sh
    - name: Kit proof (local folder)
      env:
        TOOL: ${{ github.workspace }}/tool
      run: |
        REMOTE="$RUNNER_TEMP/kit-local/proof-${{ github.run_id }}" PASS_FILE="$RUNNER_TEMP/kit.pass" OUT="$RUNNER_TEMP/kit-local.json" \
          bash tool/ops/backup-repo/proof.sh
    - name: Remove the emulator
      if: always()
      run: pkill -f moto_server || true
