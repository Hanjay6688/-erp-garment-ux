name: Collect official Supabase test binaries
on:
  push:
    branches: [audit/astra-cp7-public-ffda]
    paths: [.github/workflows/astra-cp7-tools.yml]
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download and verify the two upstream release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir tools
          cd tools
          curl --fail --silent --show-error --location --retry 2 --output auth.tar.gz https://github.com/supabase/auth/releases/download/v2.186.0/auth-v2.186.0-x86.tar.gz
          curl --fail --silent --show-error --location --retry 2 --output postgrest.tar.xz https://github.com/PostgREST/postgrest/releases/download/v13.0.7/postgrest-v13.0.7-linux-static-x86-64.tar.xz
          echo '2683b9549e922d0644621129fdabd7edb8b78c35274e133e61a3280ad9675161  auth.tar.gz' | sha256sum -c -
          echo '4153f81ccc40e7b735edc89cd84b49da25ba27eb37d57c7f6a82c9005a0b762b  postgrest.tar.xz' | sha256sum -c -
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: upstream-official-linux-tools
          path: tools/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
