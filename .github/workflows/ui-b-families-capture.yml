name: Writer B isolated UI family capture - no ERP database
on:
  push:
    branches: [astra-b/ui-family-refinement-20261103]
    paths:
      - 'src/**'
      - 'scripts/ui-reference/**'
      - '.github/workflows/ui-b-families-capture.yml'
permissions:
  contents: read
concurrency:
  group: writer-b-ui-families
  cancel-in-progress: false
jobs:
  capture:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: after
          fetch-depth: 2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: before
          ref: 462099c6cc59fa93766c81db66ec820b6cd54055
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Fetch exact inherited UI candidate only
        run: git -C after fetch --no-tags --depth=1 origin 462099c6cc59fa93766c81db66ec820b6cd54055
      - name: Install exact unchanged UI dependencies once
        working-directory: after
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reuse identical dependencies for before and isolated fixture
        run: |
          cmp before/package-lock.json after/package-lock.json
          ln -s ../after/node_modules before/node_modules
      - name: Admit B exact UI successor and unchanged non-UI source
        working-directory: after
        run: node scripts/ui-reference/verify-families.mjs
      - name: Install browser only - no Supabase or ERP service
        working-directory: after
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: Capture actual routes, mobile navigation, Mandor dialog and CP7 states
        working-directory: after
        run: node scripts/ui-reference/capture-families.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: writer-b-ui-families-${{ github.sha }}
          path: ui-family-proof/
          retention-days: 30
          if-no-files-found: warn
