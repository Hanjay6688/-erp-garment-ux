name: AUDIT/Sol/cp7-supabase-restore-drill
permissions:
  contents: read
  actions: read
concurrency:
  group: audit-sol-r3-cp7-supabase-restore-drill-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  drill:
    name: supabase-restore-drill
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CP6_AC_INDEPENDENT_CONFIRM: postgres
      CP6_AF_INDEPENDENT_CONFIRM: postgres
      CP6_AH_CONFIRM: postgres
      CP6_AI_CONFIRM: postgres
      CP6_AH_INDEPENDENT_CONFIRM: postgres
      CP6_AI_INDEPENDENT_CONFIRM: postgres
      CP6_AUDIT_HARNESS_HEAD: c6b0e4fb119c4e91fecea66ebf2d789426b22c2b
      CP6_AF_HARNESS_HEAD: c6b0e4fb119c4e91fecea66ebf2d789426b22c2b
      CP6_DATABASE_CONTAINER: supabase_db_cp5-local
      CP6_MAINTENANCE_CONFIRM_DATABASE: cp6_rollback
      CP6_AR_CONFIRM: cp6_rollback
      CP6_AU_BROWSER_CONFIRM: cp6_rollback
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: writer
        fetch-depth: 0
        ref: ca7f09556397801c50a2277bdb65b1bf019f9a05
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: auditor
        fetch-depth: 0
        persist-credentials: false
        ref: b53b5acdf260b03ebac3474e9ae837fcef6f6eb1
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: harness
        fetch-depth: 0
        ref: c6b0e4fb119c4e91fecea66ebf2d789426b22c2b
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: candidate
        fetch-depth: 0
        ref: 25fa4736329e5148dfdb3572bc169952cba23251
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: base
        fetch-depth: 0
        ref: 1bdca3766f7c9800d68295ff5122798060b8a05d
        persist-credentials: false
    - name: Sol record exact candidate and product trees
      run: "python3 - <<'SOL_IDENTITY'\nimport json,os,pathlib,subprocess,hashlib\nsha='b53b5acdf260b03ebac3474e9ae837fcef6f6eb1'\npaths=['auditor']\nitems=[]\nfor p in paths:\n r=pathlib.Path(p)\n g=lambda *a:subprocess.check_output(['git','-C',str(r),*a],text=True).strip()\n head=g('rev-parse','HEAD')\n # T3 intentionally keeps an inherited frozen UI checkout in its browser phase; actual identity remains visible.\n items.append(dict(path=p,head=head,tree=g('rev-parse','HEAD^{tree}'),candidate_exact=head==sha,product_trees={q:g('rev-parse','HEAD:'+q)for q in ['src','supabase/release','supabase/migrations','scripts/cp7-src','supabase/dev']},tracked_product_diff=g('diff','--name-only','--','src','scripts/cp7-src','supabase/release','supabase/migrations','supabase/dev'),lock_sha256=hashlib.sha256((r/'package-lock.json').read_bytes()).hexdigest()))\nout=dict(candidate_sha=sha,workflow_sha=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],attempt=os.environ['GITHUB_RUN_ATTEMPT'],suite='cp7-supabase-restore-drill',checkouts=items,evidence_origin='INDEPENDENT_NATIVE_RERUN',oracle_origin='WRITER_OR_INHERITED_DECLARED',fixture_origin='PUBLIC_REPO_SYNTHETIC')\n\
        p=pathlib.Path(os.environ['RUNNER_TEMP'])/'sol-proof';p.mkdir(exist_ok=True);(p/'IDENTITY.json').write_text(json.dumps(out,indent=2)+'\\n');print(json.dumps(out))\nassert any(x['candidate_exact']for x in items) or 'cp7-supabase-restore-drill'=='cp6-t3-release-package'\nSOL_IDENTITY"
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - name: Install pinned disposable runtime
      shell: bash
      run: "set -euo pipefail\npython -m pip install --quiet 'psycopg[binary]==3.2.10' 'PyYAML==6.0.2' 'jsonschema==4.25.1'\nsudo apt-get update -qq\nsudo apt-get install -y -qq ca-certificates curl gnupg\nsudo install -d /usr/share/postgresql-common/pgdg\nsudo curl --fail --silent --show-error \\\n  -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \\\n  https://www.postgresql.org/media/keys/ACCC4CF8.asc\nkey_fingerprint=\"$(gpg --show-keys --with-colons \\\n  /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \\\n  | awk -F: '$1 == \"fpr\" { print $10; exit }')\"\ntest \"$key_fingerprint\" = 'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'\n. /etc/os-release\narchitecture=\"$(dpkg --print-architecture)\"\nsudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<EOF\nTypes: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: ${VERSION_CODENAME}-pgdg\nArchitectures: ${architecture}\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n\
        EOF\nsudo apt-get update -qq\nsudo apt-get install -y -qq postgresql-client-17\ntest -x /usr/lib/postgresql/17/bin/psql\necho '/usr/lib/postgresql/17/bin' >> \"$GITHUB_PATH\"\n"
    - name: Install pinned Supabase CLI
      uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
      with:
        version: 2.116.0
    - name: Record proposed source and prepare isolated proof paths
      id: source_scope
      working-directory: writer
      run: 'set -euo pipefail

        PYTHONPATH=scripts python -c "import cp6_au_trial; cp6_au_trial.source()"

        mkdir -p ../candidate/cp6-proof/writer-{ae,af,ah,ai,aj,ak,al,am,an}

        '
    - name: Start disposable database
      working-directory: base
      shell: bash
      run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = 1bdca3766f7c9800d68295ff5122798060b8a05d\ntest \"$(git rev-parse HEAD^{tree})\" = 334629c626257b8b713826f491cdf62385d5299b\ntest -z \"$(git status --porcelain)\"\nsupabase --help >/dev/null\nsupabase init --help >/dev/null\nsupabase start --help >/dev/null\nmkdir cp5-local\nsupabase init --force --workdir cp5-local\nmkdir -p cp5-local/supabase/.temp\necho '17.6.1.165' > cp5-local/supabase/.temp/postgres-version\nsed -i '0,/^enable_signup = true$/s//enable_signup = false/' cp5-local/supabase/config.toml\n# ghcr.io can rate-limit image pulls before anything runs. Retry the start\n# only (no test has run), falling back to the same image tags on public.ecr.aws.\nfor attempt in 1 2 3 4; do\n  if [ \"$attempt\" -ge 2 ]; then export SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws; fi\n  if supabase start --workdir cp5-local \\\n    -x realtime,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor \\\n    > \"$RUNNER_TEMP/cp6-local-start.log\"\
        \ 2>&1; then\n    echo \"supabase start succeeded on attempt $attempt from ${SUPABASE_INTERNAL_IMAGE_REGISTRY:-default}\"\n    break\n  fi\n  tail -n 20 \"$RUNNER_TEMP/cp6-local-start.log\"\n  supabase stop --workdir cp5-local --no-backup || true\n  if [ \"$attempt\" = 4 ]; then exit 1; fi\n  sleep $((attempt * 60))\ndone\n"
    - name: Rebuild to v2.6.20, align with hosted, continue the frozen path to AB
      working-directory: base
      env:
        GITHUB_SHA: 1bdca3766f7c9800d68295ff5122798060b8a05d
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\nexport CP6_AC_WRITER_ARTIFACT=\"$RUNNER_TEMP/ac-native200.zip\"\ngh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10392910720/zip \\\n  > \"$CP6_AC_WRITER_ARTIFACT\" || { rm -f \"$CP6_AC_WRITER_ARTIFACT\"; echo 'AC writer artifact 10392910720 unavailable (kept 30 days, expired 15 Oct 2026, owner D14-17); cp6_pre_u_inventory captures the pre-U table set before U'; }\nmkdir -p ../auditor/cp6-proof/t3\nstatus=0\nPYTHONPATH=scripts python ../auditor/scripts/cp6_t3_aligned_chain.py ../auditor/cp6-proof/t3/ALIGNED_CHAIN.json --stop-after-ab || status=$?\npython - <<'PY'\nimport json\nd=json.load(open('../auditor/cp6-proof/t3/ALIGNED_CHAIN.json'))\nprint(json.dumps({k:d.get(k) for k in ('status','refused_step','alignment')},default=str)[:6000])\nprint(json.dumps([(s['name'],s['exit_code'],s['after_alignment']) for s in d['steps']])[:6000])\nPY\nexit \"$status\"\n"
    - name: Clone the aligned AB state for install
      working-directory: writer
      run: "set -euo pipefail\nmkdir -p '../auditor/cp6-proof/t3'\nbash scripts/clone-cp6-disposable-database.sh \\\n  'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \\\n  'postgresql://postgres:postgres@127.0.0.1:54322/template1' \\\n  'postgresql://postgres:postgres@127.0.0.1:54322/cp6_rollback' \\\n  cp6_rollback supabase_db_cp5-local '../auditor/cp6-proof/t3/CLONE_install'\n"
    - name: Fresh target Supabase stack (second project on this runner) and scratch server
      working-directory: base
      shell: bash
      run: "set -euo pipefail\nmkdir drill-target\nsupabase init --force --workdir drill-target\nmkdir -p drill-target/supabase/.temp\necho '17.6.1.165' > drill-target/supabase/.temp/postgres-version\nsed -i 's/^project_id = .*/project_id = \"cp7-drill-target\"/' drill-target/supabase/config.toml\nsed -i -E 's/\\b543([0-9]{2})\\b/553\\1/g; s/\\b8083\\b/8093/g' drill-target/supabase/config.toml\nsed -i '0,/^enable_signup = true$/s//enable_signup = false/' drill-target/supabase/config.toml\ngrep -nE '^(project_id|port|shadow_port) ' drill-target/supabase/config.toml | head -20\nfor attempt in 1 2 3; do\n  if [ \"$attempt\" -ge 2 ]; then export SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws; fi\n  if supabase start --workdir drill-target \\\n    -x realtime,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor \\\n    > \"$RUNNER_TEMP/drill-target-start.log\" 2>&1; then break; fi\n  tail -n 20 \"$RUNNER_TEMP/drill-target-start.log\"\n  supabase stop --workdir drill-target --no-backup\
        \ || true\n  if [ \"$attempt\" = 3 ]; then exit 1; fi\n  sleep $((attempt * 60))\ndone\npsql 'postgresql://postgres:postgres@127.0.0.1:55322/postgres' -XAtc \"select 'target', current_setting('server_version'), rolsuper from pg_roles where rolname=current_user\"\nsudo apt-get install -y -qq rclone gnupg\nimage=\"$(docker inspect supabase_db_cp5-local --format '{{.Config.Image}}')\"\ndocker run -d --name cp7_drill_scratch -p 127.0.0.1:54339:5432 -e POSTGRES_PASSWORD=postgres \"$image\" >/dev/null\nfor i in $(seq 1 120); do\n  docker exec cp7_drill_scratch psql -U supabase_admin -d postgres -XAtc \"select 1 from pg_roles where rolname='authenticated'\" 2>/dev/null | grep -q 1 && break\n  if [ \"$i\" = 120 ]; then docker logs --tail 40 cp7_drill_scratch; exit 1; fi\n  sleep 2\ndone\nsleep 3\ndocker exec -i cp7_drill_scratch psql -U supabase_admin -d postgres -X -q -v ON_ERROR_STOP=1 \\\n  -c \"create role cp7_scratch_admin login superuser password 'cp7-scratch'\"\nopenssl rand -base64\
        \ 48 > \"$RUNNER_TEMP/drill.pass\"\n"
    - name: Two synthetic logins in the disposable source (the drill restores auth.users and auth.identities)
      shell: bash
      run: "set -euo pipefail\ndocker exec -i supabase_db_cp5-local psql -U supabase_admin -d cp6_rollback -X -q -v ON_ERROR_STOP=1 <<'SQL'\ninsert into auth.users (instance_id, id, aud, role, email, encrypted_password, email_confirmed_at, raw_app_meta_data, raw_user_meta_data, created_at, updated_at)\nselect '00000000-0000-0000-0000-000000000000', u.id, 'authenticated', 'authenticated', u.email, '', now(),\n       '{\"provider\":\"email\",\"providers\":[\"email\"]}', '{}', now(), now()\nfrom (values ('a7d0c000-0000-4000-8000-000000000001'::uuid, 'drill-one@example.invalid'),\n             ('a7d0c000-0000-4000-8000-000000000002'::uuid, 'drill-two@example.invalid')) u(id, email);\ninsert into auth.identities (provider_id, user_id, identity_data, provider, last_sign_in_at, created_at, updated_at)\nselect u.id::text, u.id, jsonb_build_object('sub', u.id::text, 'email', u.email, 'email_verified', true), 'email', now(), now(), now()\nfrom auth.users u where u.email like 'drill-%@example.invalid';\n\
        SQL\npsql 'postgresql://postgres:postgres@127.0.0.1:54322/cp6_rollback' -XAtc \"select 'source logins', (select count(*) from auth.users), (select count(*) from auth.identities)\"\n"
    - name: One night from the disposable ERP copy to a local store
      working-directory: auditor
      shell: bash
      run: "set -euo pipefail\npython scripts/cp7_offsite_backup.py --source-url 'postgresql://postgres:postgres@127.0.0.1:54322/cp6_rollback' \\\n  --scratch-admin-url 'postgresql://cp7_scratch_admin:cp7-scratch@127.0.0.1:54339/postgres' \\\n  --remote \"$RUNNER_TEMP/drill-store/nightly\" --passphrase-file \"$RUNNER_TEMP/drill.pass\" | tee \"$RUNNER_TEMP/night.json\"\necho \"NIGHT=$(python -c \"import json,sys;print(json.loads(open(sys.argv[1]).read().strip().splitlines()[-1])['night'])\" \"$RUNNER_TEMP/night.json\")\" >> \"$GITHUB_ENV\"\n"
    - name: Restore drill into the fresh target as its postgres role
      working-directory: auditor
      shell: bash
      run: "set -euo pipefail\nstatus=0\npython scripts/cp7_supabase_restore_drill.py --remote \"$RUNNER_TEMP/drill-store/nightly\" --night \"$NIGHT\" \\\n  --passphrase-file \"$RUNNER_TEMP/drill.pass\" --source-url 'postgresql://postgres:postgres@127.0.0.1:54322/cp6_rollback' \\\n  --target-url 'postgresql://postgres:postgres@127.0.0.1:55322/postgres' --detail-out \"$RUNNER_TEMP/drill-detail.json\" || status=$?\n# Disposable CI data only: show what differed, to read the first failure from the log.\npython - \"$RUNNER_TEMP/drill-detail.json\" <<'PY'\nimport json, sys\nd = json.load(open(sys.argv[1]))\nprint(json.dumps(dict(error=d.get('error'), application_schemas=d.get('application_schemas'), extensions_added=d.get('extensions_added'),\n    extension_versions_differ=d.get('extension_versions_differ'), roles_created=d.get('roles_created'),\n    toc_owners_not_assumable=d.get('toc_owners_not_assumable'),\n    toc_restored_outside_application_schemas=d.get('toc_restored_outside_application_schemas'),\n\
        \    restore_errors=(d.get('pg_restore_errors') or [])[:20], data_differ=list(d.get('data_differ') or {})[:15],\n    left_behind=d.get('left_behind'),\n    structure_differ={k: dict(count=v['count'], only_source=[x[:300] for x in v['only_source'][:6]], only_restored=[x[:300] for x in v['only_restored'][:6]])\n                      for k, v in (d.get('structure_differ') or {}).items()},\n    structure_explained={k: v['count'] for k, v in (d.get('structure_explained') or {}).items()},\n    structure_raw_differ={k: v['count'] for k, v in (d.get('structure_raw_differ') or {}).items()}), indent=1, default=str)[:40000])\nPY\nexit \"$status\"\n"
    - name: Refusal cases (used target, altered copy, superuser postgres)
      working-directory: auditor/scripts
      shell: bash
      run: "set -euo pipefail\npython - \"$RUNNER_TEMP\" \"$NIGHT\" <<'PY'\nimport json, shutil, subprocess, sys\nfrom pathlib import Path\nimport cp7_offsite_backup as off, cp7_supabase_restore_drill as d\ntmp, night = Path(sys.argv[1]), sys.argv[2]\nstore, altered = tmp / 'drill-store' / 'nightly', tmp / 'drill-store' / 'altered'\nsrc = 'postgresql://postgres:postgres@127.0.0.1:54322/cp6_rollback'\ntgt = 'postgresql://postgres:postgres@127.0.0.1:55322/postgres'\nshutil.copytree(store, altered)\nf = altered / (night + '.dump.gpg')\nb = bytearray(f.read_bytes())\nb[len(b) // 2] ^= 1\nf.write_bytes(bytes(b))\ndef superuser_postgres():\n    subprocess.run(['docker', 'exec', 'supabase_db_cp7-drill-target', 'psql', '-U', 'supabase_admin', '-d', 'postgres', '-X', '-q',\n                    '-v', 'ON_ERROR_STOP=1', '-c', 'alter role postgres superuser'], check=True)\ncases = [('DRILL_REFUSES_USED_TARGET', store, None, 'DRILL_TARGET_NOT_FRESH'),\n         ('DRILL_REFUSES_ALTERED_COPY', altered,\
        \ None, 'DRILL_REMOTE_COPY_DIFFERS'),\n         ('DRILL_REFUSES_SUPERUSER_POSTGRES', store, superuser_postgres, 'DRILL_TARGET_ROLE_NOT_HOSTED_LIKE')]\nbad = 0\nfor name, where, before, code in cases:\n    if before:\n        before()\n    out, _ = d.drill(off.Remote(str(where)), night, str(tmp / 'drill.pass'), src, tgt)\n    ok = out['codes'] == [code] and out['restore_verified'] is False\n    bad += not ok\n    print(json.dumps(dict(case=name, result='PASS' if ok else 'FAIL', codes=out['codes'])))\nshutil.rmtree(altered)\nprint(json.dumps(dict(refusal_cases=len(cases), passed=len(cases) - bad)))\nsys.exit(1 if bad else 0)\nPY\n"
    - name: Remove disposable servers
      if: always()
      working-directory: base
      run: 'docker rm -f cp7_drill_scratch || true

        supabase stop --workdir drill-target --no-backup || true

        supabase stop --workdir cp5-local --no-backup

        '
    - name: Sol preserve audit identity
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cp17-r3-Sol-b53b5acd-cp7-supabase-restore-drill-${{ github.job }}-${{ strategy.job-index }}-identity
        path: ${{ runner.temp }}/sol-proof
        retention-days: 30
        if-no-files-found: warn
run-name: AUDIT/cp17-r3/Sol/b53b5acd/cp7-supabase-restore-drill/1
'on':
  push:
    branches:
    - audit/sol-cp1-7-r3-b53b5acd-20261017
    paths:
    - .github/workflows/audit-sol-r3-cp7-supabase-restore-drill.yml
  workflow_dispatch: {}
