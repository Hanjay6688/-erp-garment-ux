name: AUDIT SOL independent PR44
run-name: AUDIT/cp1-7-20261014/SOL/0b7049d9/pr44
on:
  push:
    branches: [audit/sol-cp1-7-0b7049d9-20261014]
    paths: [.github/workflows/audit-sol-pr44.yml]
permissions:
  contents: read
jobs:
  independent-parity-and-mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0b7049d9203bac52b47a4c89f3e0d75646067a8f
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: sol
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Pin source and independent probe before cases
        run: |
          test "$(git rev-parse HEAD)" = 0b7049d9203bac52b47a4c89f3e0d75646067a8f
          mkdir -p audit/sol_cp1_7
          cp sol/audit/sol_cp1_7/pr44.mjs audit/sol_cp1_7/pr44.mjs
          sha256sum audit/sol_cp1_7/pr44.mjs scripts/cp7-src/planning/netting.sql
          if ! test -x /usr/lib/postgresql/16/bin/initdb; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-16
          fi
      - name: Sol complete JSON and refusal parity, shared supply and twin mutants
        run: node audit/sol_cp1_7/pr44.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cp1-7-20261014-SOL-0b7049d9-pr44
          path: test-results/sol-cp1-7-pr44
          if-no-files-found: error
          retention-days: 30
