name: Writer B Mandor and SKU browser controls
on:
  push:
    branches: [astra-b/ui-mandor-sku-smoke-20261106]
    paths:
      - '.github/workflows/ui-b-mandor-sku-smoke.yml'
      - 'scripts/ui-b-mandor-sku-smoke/**'
permissions:
  contents: read
concurrency:
  group: writer-b-mandor-sku-smoke
  cancel-in-progress: false
jobs:
  smoke:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/writer-b-playwright
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: driver
          persist-credentials: false
          sparse-checkout: scripts/ui-b-mandor-sku-smoke
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 49a0f1c643595d81840c4d457f53f400242423cd
          path: smoke-work/sku
          persist-credentials: false
          sparse-checkout: |
            src
            public
            contracts
            tests/fixtures
            scripts/cp7_accessory_nonpayable
            scripts/current-sku-automatic-composite-preparation
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 415e951c66a9406a7498182f48f827b7f00d475a
          path: smoke-work/mandor
          persist-credentials: false
          sparse-checkout: |
            scripts/current-mandor-shop-native-qualification
            scripts/current-sku-pair-browser-qualification
            scripts/current-s03-sku-s05-composite-qualification
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify exact candidate source and common build inputs
        run: |
          mkdir -p smoke-proof
          cp driver/scripts/ui-b-mandor-sku-smoke/smoke*.mjs smoke-work/
          python driver/scripts/ui-b-mandor-sku-smoke/check_sources.py | tee smoke-proof/SOURCE_CHECK.json
      - name: Install both pinned packages in their own roots
        run: |
          npm --prefix smoke-work/sku ci --ignore-scripts --no-audit --no-fund
          npm --prefix smoke-work/mandor ci --ignore-scripts --no-audit --no-fund
      - name: Build the common disposable App on loopback
        working-directory: smoke-work/sku
        env:
          VITE_ERP_RUNTIME_MODE: DISPOSABLE_TEST
          VITE_SUPABASE_URL: http://127.0.0.1:54099
          VITE_DISPOSABLE_API_PORT: '54099'
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJub25lIn0.eyJyb2xlIjoiYW5vbiIsInJlZiI6ImxvY2FsIn0.cHJlZmxpZ2h0
        run: npm run build:cp6-disposable 2>&1 | tee ../../smoke-proof/BUILD.log
      - name: Install the Chromium revision pinned by Playwright
        working-directory: smoke-work/sku
        run: node_modules/.bin/playwright install --with-deps chromium 2>&1 | tee ../../smoke-proof/CHROMIUM_INSTALL.log
      - name: Run both existing control paths against local fixtures
        working-directory: smoke-work
        run: |
          (cd sku && exec node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4176 --strictPort --outDir cp6-ui-build) > ../smoke-proof/SERVER.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          for try in $(seq 1 25); do
            if curl --silent --fail http://127.0.0.1:4176/ >/dev/null; then break; fi
            kill -0 "$server"
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4176/ >/dev/null
          mandor=0; sku=0
          node smoke.mjs mandor ../smoke-proof/MANDOR.json > ../smoke-proof/MANDOR.log 2>&1 || mandor=$?
          node smoke.mjs sku ../smoke-proof/SKU.json > ../smoke-proof/SKU.log 2>&1 || sku=$?
          cat ../smoke-proof/MANDOR.log ../smoke-proof/SKU.log
          test "$mandor" = 0 && test "$sku" = 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: writer-b-mandor-sku-browser-${{ github.sha }}
          path: smoke-proof/
          retention-days: 30
          if-no-files-found: error
