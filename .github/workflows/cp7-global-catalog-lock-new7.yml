name: CP7 A catalog quiescence focused3 only
'on':
  push:
    branches: [astra-a/global-catalog-lock-new7-20261102]
    paths:
      - .github/workflows/cp7-global-catalog-lock-new7.yml
      - scripts/current-global-catalog-lock-controls/**
permissions:
  contents: read
concurrency:
  group: cp7-global-catalog-lock-new7-20261102
  cancel-in-progress: false
jobs:
  catalog-controls:
    if: github.ref == 'refs/heads/astra-a/global-catalog-lock-new7-20261102'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      model:
        image: postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: catalog-only-local-not-erp
          POSTGRES_DB: cp7_catalog_locks
        ports:
          - 127.0.0.1:55441:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cp7_catalog_locks"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact isolated client
        run: python -m pip install --quiet 'psycopg[binary]==3.2.10'
      - name: Check sealed source before model SQL and record exact image
        run: |
          mkdir -p cp7-proof
          docker image inspect postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929 --format '{{json .RepoDigests}}' > cp7-proof/MODEL_POSTGRES_IMAGE.json
          python -B scripts/current-global-catalog-lock-controls/focused3.py --check > cp7-proof/MODEL_SOURCE_IDENTITY.json
      - name: Run only missing catalog quiescence3 without repeating actual retained4
        env:
          CATALOG_LOCK_CONFIRM: cp7_catalog_locks
          CATALOG_LOCK_URL: postgresql://postgres:catalog-only-local-not-erp@127.0.0.1:55441/cp7_catalog_locks
        run: python -B scripts/current-global-catalog-lock-controls/focused3.py --run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cp7-catalog-quiescence-focused3-${{ github.sha }}
          path: cp7-proof/
          retention-days: 30
