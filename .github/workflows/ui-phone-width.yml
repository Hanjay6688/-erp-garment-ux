# R2-09 (Sol SOL-R1-004/005; best practice D17): every menu of the demo build on a 390 px phone keeps
# document.documentElement.scrollWidth <= window.innerWidth, and (R4-04, ASTRA-R3-03) every text keeps 2:1 contrast.
name: UI phone width census
on:
  workflow_dispatch: {}
  push:
    branches: ['claude/r2-fixes-20261016']
    paths: ['src/**', 'scripts/ui_phone_width_census.mjs', 'scripts/cp7_r4_readable_browser.mjs', '.github/workflows/ui-phone-width.yml']
permissions:
  contents: read
concurrency:
  group: ui-phone-width-${{ github.ref }}
  cancel-in-progress: false
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - name: 48 menus at 390 px
        run: node scripts/ui_phone_width_census.mjs dist test-results/ui-phone-width/UI_PHONE_WIDTH.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-phone-width
          path: test-results/ui-phone-width
          if-no-files-found: warn
          retention-days: 30
