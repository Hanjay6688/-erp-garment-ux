name: AUDIT/Sol/r5/reader-multirow-capture-q2
run-name: AUDIT/r5/Sol/17fa2507/reader-multirow-capture-q2/1
'on':
  push:
    branches:
    - audit/sol-cp1-7-r5-17fa2507-20261019
    paths:
    - .github/workflows/audit-sol-r5-reader-multirow-capture-q2.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: audit-sol-r5-reader-multirow-capture-q2-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
        sparse-checkout: audit/sol_cp17_r5
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Retrieve exact previously captured own artifact; do not replay SQL
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/12181840235/zip > "$RUNNER_TEMP/sol-r5-captured-multirow.zip"
    - name: Qualify unchanged oracles and SQL NULL decoding from pinned observations
      run: python audit/sol_cp17_r5/qualify_multirow_capture.py "$RUNNER_TEMP/sol-r5-captured-multirow.zip" SOL_R5_MULTIROW_CAPTURE_Q2.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: audit-r5-Sol-17fa2507-reader-multirow-capture-q2
        path: SOL_R5_MULTIROW_CAPTURE_Q2.json
        if-no-files-found: error
        retention-days: 30
