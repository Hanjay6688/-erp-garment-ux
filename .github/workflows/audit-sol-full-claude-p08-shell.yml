        for path,want in trees.items():assert subprocess.check_output([''git'',''rev-parse'',sha+'':''+path],text=True).strip()==want,path

        assert not subprocess.check_output([''git'',''diff'',''HEAD'',''--name-only''],text=True).strip()

        d={''candidate_sha'':sha,''candidate_tree'':subprocess.check_output([''git'',''rev-parse'',''HEAD^{tree}''],text=True).strip(),''workflow_sha'':os.environ[''GITHUB_SHA''],''trees'':trees,''guide_sha256'':hashlib.sha256(Path(''docs/AUDIT_PANDUAN_PRO_MAX.md'').read_bytes()).hexdigest(),''workflow_origin'':''claude-p08-shell.yml'',''oracle_origin'':''UNCHANGED_PREEXISTING_PROVIDER'',''fixture_origin'':''UNCHANGED_PREEXISTING_PROVIDER'',''evidence_origin'':''INDEPENDENT_NATIVE_RERUN'',''production_go'':False}

        Path(os.environ[''RUNNER_TEMP''],''SOL_SOURCE_IDENTITY.json'').write_text(json.dumps(d,indent=2)+''\n'')

        print(json.dumps(d))

        PY

        '
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
        cache: npm
    - run: npm ci
    - run: npx --no-install vitest run tests/cp7/families/f05-assembly.test.ts tests/cp7/families/f05-timeline.test.ts
        tests/cp7/families/f05-kernel-maps.test.ts tests/cp7/families/f05-report-render.test.ts tests/cp7/families/f04-demand-history-linear.test.ts
        tests/cp7/families/f04-history-build-linear.test.ts tests/cp7/families/f04-demand-estimate-rounding.test.ts
        tests/cp7/families/f04-schedule-scenario-linear.test.ts tests/cp7/families/f04-wip-normalize-linear.test.ts
        tests/cp7/families/f04-netting-linear.test.ts tests/cp7/families/f04-allocation-linear.test.ts tests/cp7/families/f04-baseline-build-linear.test.ts
        tests/cp7/families/f04-supply-exhausted.test.ts tests/cp7/families/f04-supply-proofs.test.ts tests/cp7/families/f04-model-knowledge-cutoff.test.ts
    - run: node scripts/cp7_p19_assembly_benchmark.mjs test-results/cp7-shell-proof/P19_ASSEMBLY_KERNEL.json
    - run: node scripts/cp7_p19_report_render_benchmark.mjs test-results/cp7-shell-proof/P19_REPORT_RENDER_KERNEL.json
    - run: node scripts/cp7_p19_demand_history_benchmark.mjs test-results/cp7-shell-proof/P19_DEMAND_HISTORY_KERNEL.json
    - run: node scripts/cp7_p19_schedule_benchmark.mjs test-results/cp7-shell-proof/P19_SCHEDULE_SCENARIO_KERNEL.json
    - run: node scripts/cp7_p19_wip_normalize_benchmark.mjs test-results/cp7-shell-proof/P19_WIP_NORMALIZE_KERNEL.json
    - run: node scripts/cp7_p19_netting_benchmark.mjs test-results/cp7-shell-proof/P19_NETTING_KERNEL.json
    - run: node scripts/cp7_p19_allocation_benchmark.mjs test-results/cp7-shell-proof/P19_ALLOCATION_KERNEL.json
    - run: node scripts/cp7_p19_baseline_benchmark.mjs test-results/cp7-shell-proof/P19_BASELINE_BUILD_KERNEL.json
    - run: node scripts/cp7_pl8_exhausted_benchmark.mjs test-results/cp7-shell-proof/PL8_EXHAUSTED_CLASSIFICATION.json
    - run: node scripts/cp7_pl8_proof_benchmark.mjs test-results/cp7-shell-proof/PL8_EXHAUSTION_PROOFS.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cp1-7-20261014-SOL-0b7049d9-claude-p08-shell-cp7-p19-assembly
        path: 'test-results/cp7-shell-proof/P19_*_KERNEL.json

          test-results/cp7-shell-proof/PL8_*.json

          '
        if-no-files-found: warn
        retention-days: 30
    - name: SOL retain source identity separately
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: cp1-7-20261014-SOL-0b7049d9-claude-p08-shell-${{ github.job }}-${{ strategy.job-index }}-identity
        path: ${{ runner.temp }}/SOL_SOURCE_IDENTITY.json
        retention-days: 30
        if-no-files-found: warn
