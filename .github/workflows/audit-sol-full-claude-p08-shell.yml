        ''scripts'': ''b67664091c4394b0ff6a187409d9e9b32213a0e0'', ''scripts/cp7-src'': ''7bcf45e174499f3712c67ee08788a90a8c5f7881'',
        ''.github/workflows'': ''4d7712279bfdfb6aec10dca4a216dd927875f483''}

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()==sha

        for path,want in trees.items():assert subprocess.check_output([''git'',''rev-parse'',sha+'':''+path],text=True).strip()==want,path

        assert not subprocess.check_output([''git'',''diff'',''HEAD'',''--name-only''],text=True).strip()

        d={''candidate_sha'':sha,''candidate_tree'':subprocess.check_output([''git'',''rev-parse'',''HEAD^{tree}''],text=True).strip(),''workflow_sha'':os.environ[''GITHUB_SHA''],''trees'':trees,''guide_sha256'':hashlib.sha256(Path(''docs/AUDIT_PANDUAN_PRO_MAX.md'').read_bytes()).hexdigest(),''workflow_origin'':''claude-p08-shell.yml'',''oracle_origin'':''UNCHANGED_PREEXISTING_PROVIDER'',''fixture_origin'':''UNCHANGED_PREEXISTING_PROVIDER'',''evidence_origin'':''INDEPENDENT_NATIVE_RERUN'',''production_go'':False}

        Path(os.environ[''RUNNER_TEMP''],''SOL_SOURCE_IDENTITY.json'').write_text(json.dumps(d,indent=2)+''\n'')

        print(json.dumps(d))

        PY

        '
    - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        queries: security-extended
    - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63
      with:
        output: cp7-codeql
        upload: never
        upload-database: false
    - name: Reject CodeQL findings or incomplete runs
      run: "python3 - <<'PY'\nimport json, pathlib\nfiles = list(pathlib.Path('cp7-codeql').glob('*.sarif'))\nassert\
        \ files, 'No SARIF produced'\nfor f in files:\n    report = json.loads(f.read_text())\n    assert report.get('runs'),\
        \ 'No analysis runs'\n    for run in report['runs']:\n        assert not run.get('results'), 'CodeQL findings\
        \ need review'\n        assert run.get('invocations'), 'No invocation evidence'\n        for invocation\
        \ in run['invocations']:\n            assert invocation.get('executionSuccessful') is True, 'Incomplete\
        \ CodeQL'\nprint('CodeQL completed with zero findings')\nPY\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cp1-7-20261014-SOL-0b7049d9-claude-p08-shell-cp7-codeql-${{ matrix.language }}
        path: cp7-codeql
        if-no-files-found: error
        retention-days: 30
    - name: SOL retain source identity separately
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: cp1-7-20261014-SOL-0b7049d9-claude-p08-shell-${{ github.job }}-${{ strategy.job-index }}-identity
        path: ${{ runner.temp }}/SOL_SOURCE_IDENTITY.json
        retention-days: 30
        if-no-files-found: warn
run-name: AUDIT/cp1-7-20261014/SOL/0b7049d9/claude-p08-shell/${{ github.run_attempt }}
'on':
  push:
    branches:
    - audit/sol-cp1-7-0b7049d9-20261014
