name: CP3 R3 Verified Bootstrap

on:
  push:
    branches:
      - cp3/hpp-attendance-sewing-terminal-r3-20260901
    paths:
      - '.github/workflows/cp3-r3-bootstrap.yml'
      - '.cp3-r3-bootstrap/**'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact bootstrap head
        uses: actions/checkout@v4
        with:
          ref: cp3/hpp-attendance-sewing-terminal-r3-20260901
          fetch-depth: 0

      - name: Verify immutable bootstrap boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '58803928cd50c2dddd2aa23dc6989d868f685539'
          test "$(wc -c < .cp3-r3-bootstrap/part00.b64)" = 7000
          test "$(wc -c < .cp3-r3-bootstrap/part01.b64)" = 7000
          test "$(wc -c < .cp3-r3-bootstrap/part02.b64)" = 7000
          test "$(wc -c < .cp3-r3-bootstrap/part03.b64)" = 7000
          test "$(wc -c < .cp3-r3-bootstrap/part04.b64)" = 7000
          test "$(wc -c < .cp3-r3-bootstrap/part05.b64)" = 1616
          cat .cp3-r3-bootstrap/part00.b64 \
              .cp3-r3-bootstrap/part01.b64 \
              .cp3-r3-bootstrap/part02.b64 \
              .cp3-r3-bootstrap/part03.b64 \
              .cp3-r3-bootstrap/part04.b64 \
              .cp3-r3-bootstrap/part05.b64 > /tmp/cp3-r3-patch.tar.gz.b64
          test "$(wc -c < /tmp/cp3-r3-patch.tar.gz.b64)" = 36616
          base64 --decode /tmp/cp3-r3-patch.tar.gz.b64 > /tmp/cp3-r3-patch.tar.gz
          echo '88ed79ffbc2fb05bd54a25efa2d1c3b863f96de1869fb02980bddf9a8b1d19cb  /tmp/cp3-r3-patch.tar.gz' | sha256sum -c -

      - name: Inspect and extract exact reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import tarfile
          from pathlib import PurePosixPath

          expected = {
              '.github/workflows/cp3-r3-full-schema-validation.yml',
              'docs/evidence/2026-09-01/cp3_r3_patch_status.md',
              'scripts/cp3_r3_full_schema_concurrency.py',
              'supabase/migrations/20260901023200_erp_v2_6_14c_attendance_hpp_uat_alignment.sql',
              'supabase/tests/attendance_hpp_r3_full_schema_rollback.sql',
              'supabase/tests/attendance_hpp_r3_validator_benchmark_rollback.sql',
              'supabase/tests/cp3_r3_full_schema_race_seed.sql',
              'supabase/tests/cp3_r3_full_schema_seed.sql',
          }
          actual = set()
          with tarfile.open('/tmp/cp3-r3-patch.tar.gz', 'r:gz') as tf:
              for member in tf.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  normalized = str(path).removeprefix('./')
                  if member.isfile():
                      actual.add(normalized)
              if actual != expected:
                  raise SystemExit(f'archive file set mismatch: missing={sorted(expected-actual)} extra={sorted(actual-expected)}')
              tf.extractall('.', filter='data')
          PY
          cat <<'SUMS' | sha256sum -c -
          3c96cacb81ff7293586897018949e2689f0ca7a50f0842c7cb2a3f2548d5dc5d  .github/workflows/cp3-r3-full-schema-validation.yml
          7b8a7b9d180e70efff7d0fc8b558422362af3da55a40688b1d2c545ff410af97  docs/evidence/2026-09-01/cp3_r3_patch_status.md
          765086e30cc9e5bd7d6ae6078f86ac3abc893de46770358046f8b36f18e171a2  scripts/cp3_r3_full_schema_concurrency.py
          2c98802925ef45d173ca23e88cd43357479c783a9571b89d4614911bfb500967  supabase/migrations/20260901023200_erp_v2_6_14c_attendance_hpp_uat_alignment.sql
          a1b2007d4facd5bf2dc363c5af7e5ef80daa0139705ebd45f2bdba47b3425d52  supabase/tests/attendance_hpp_r3_full_schema_rollback.sql
          7bbd0b0570fdadb6e3666f99544a40ce767fc06afab8e345b7c6ee5270a4a80d  supabase/tests/attendance_hpp_r3_validator_benchmark_rollback.sql
          cfe4ffc9c63ab8d9ef66c765af5eb420c5f31a56254fb6bf3ebdf70e858ce0a9  supabase/tests/cp3_r3_full_schema_race_seed.sql
          e2c17320074e2dcadc4d69cbc1b4be5f7ea78708715cf9681dbe9b6a797f8edf  supabase/tests/cp3_r3_full_schema_seed.sql
          SUMS
          python -m py_compile scripts/cp3_r3_full_schema_concurrency.py

      - name: Remove bootstrap transport and publish exact candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .cp3-r3-bootstrap
          rm -f .github/workflows/cp3-r3-bootstrap.yml
          rm -f /tmp/cp3-r3-patch.tar.gz /tmp/cp3-r3-patch.tar.gz.b64
          git config user.name 'Chat Sol Pro CP3 Writer'
          git config user.email 'noreply@openai.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add CP3 R3 UAT-aligned source and full-schema harness'
          git push origin HEAD:cp3/hpp-attendance-sewing-terminal-r3-20260901
