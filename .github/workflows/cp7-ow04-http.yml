name: CP7 OW04 Real Auth HTTP and SQL Recovery Qualification
'on':
  push:
    branches:
    - cp7/integration
    - astra/d17-14-20261020
    - codex/ow04-source-http-20261021
    - codex/writer-takeover-20261021
    - codex/ow04-credit-dependencies-20261021
    paths:
    - docs/cp7/MERGE_QUALIFICATION_REQUEST.json
    - scripts/ow04-qualification/**
    - '!scripts/ow04-qualification/browser*'
    - '!scripts/ow04-qualification/BROWSER_EXPECTED.json'
    - .github/workflows/cp7-ow04-http.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cp7-ow04-http-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  phase:
    name: OW04 full owning HTTP18, six retained races and two source-inverse races
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CP6_AC_INDEPENDENT_CONFIRM: postgres
      CP6_AF_INDEPENDENT_CONFIRM: postgres
      CP6_AH_CONFIRM: postgres
      CP6_AI_CONFIRM: postgres
      CP6_AH_INDEPENDENT_CONFIRM: postgres
      CP6_AI_INDEPENDENT_CONFIRM: postgres
      CP6_AUDIT_HARNESS_HEAD: c6b0e4fb119c4e91fecea66ebf2d789426b22c2b
      CP6_AF_HARNESS_HEAD: c6b0e4fb119c4e91fecea66ebf2d789426b22c2b
      CP6_DATABASE_CONTAINER: supabase_db_cp5-local
      CP6_MAINTENANCE_CONFIRM_DATABASE: cp6_rollback
      CP6_AR_CONFIRM: cp6_rollback
      CP6_AU_BROWSER_CONFIRM: cp6_rollback
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: writer
        fetch-depth: 0
        ref: ca7f09556397801c50a2277bdb65b1bf019f9a05
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: auditor
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: harness
        fetch-depth: 0
        ref: c6b0e4fb119c4e91fecea66ebf2d789426b22c2b
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: candidate
        fetch-depth: 0
        ref: 25fa4736329e5148dfdb3572bc169952cba23251
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: base
        fetch-depth: 0
        ref: 1bdca3766f7c9800d68295ff5122798060b8a05d
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - name: Install pinned disposable runtime
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --quiet 'psycopg[binary]==3.2.10' 'PyYAML==6.0.2' 'jsonschema==4.25.1'
        sudo apt-get update -qq
        sudo apt-get install -y -qq ca-certificates curl gnupg
        sudo install -d /usr/share/postgresql-common/pgdg
        sudo curl --fail --silent --show-error \
          -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
          https://www.postgresql.org/media/keys/ACCC4CF8.asc
        key_fingerprint="$(gpg --show-keys --with-colons \
          /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
          | awk -F: '$1 == "fpr" { print $10; exit }')"
        test "$key_fingerprint" = 'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'
        . /etc/os-release
        architecture="$(dpkg --print-architecture)"
        sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<EOF
        Types: deb
        URIs: https://apt.postgresql.org/pub/repos/apt
        Suites: ${VERSION_CODENAME}-pgdg
        Architectures: ${architecture}
        Components: main
        Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
        EOF
        sudo apt-get update -qq
        sudo apt-get install -y -qq postgresql-client-17
        test -x /usr/lib/postgresql/17/bin/psql
        echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
    - name: Check qualifier imports before rebuilding the disposable database
      working-directory: writer
      run: |
        ERP_REPO=../auditor PYTHONPATH=../auditor/scripts:../auditor/scripts/ow04-qualification python -c "import transport_probe as p; assert p.qualified_core()['native_case_count']==73 and len(p.http_cases.IDS)==18; print('OW04_HTTP14_IMPORT_ADMISSION_PASS_NOT_EXECUTED')"
        ERP_REPO=../auditor PYTHONPATH=../auditor/scripts:../auditor/scripts/ow04-qualification python -c "import transport_probe as p; assert p.core.SIGNED_SOURCE and len(p.core.IDS)==63; print('OW04_REUSED_NATIVE63_IMPORT_ADMISSION_PASS_NOT_EXECUTED')"
        ERP_REPO=../auditor PYTHONPATH=../auditor/scripts:../auditor/scripts/ow04-qualification python -c "import race_probe as r; r.transport_backend.qualified_core(); assert len(r.race_cases.races(None,None))==6; print('OW04_RACE_IMPORT_ADMISSION_PASS_NOT_EXECUTED')"
        ERP_REPO=../auditor PYTHONPATH=../auditor/scripts:../auditor/scripts/ow04-qualification python -c "import race_probe as r; assert r.transport_backend.qualified_core()['native_case_count']==73; assert len(r.source_race_cases.races(None,None))==2; print('OW04_SOURCE_RACE2_IMPORT_ADMISSION_PASS_NOT_EXECUTED')"
        PYTHONDONTWRITEBYTECODE=1 python ../auditor/scripts/ow04-qualification/native_binding_recheck.py
        PYTHONDONTWRITEBYTECODE=1 python ../auditor/scripts/ow04-qualification/final_binding_recheck.py
        ERP_REPO=../auditor PYTHONPATH=../auditor/scripts:../auditor/scripts/ow04-qualification python ../auditor/scripts/ow04-qualification/fixture_recheck.py
    - name: Install candidate browser dependencies
      working-directory: auditor
      run: |
        npm ci
        npx playwright install --with-deps chromium
    - name: Install pinned Supabase CLI
      uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
      with:
        version: 2.116.0
    - name: Record proposed source and prepare isolated proof paths
      id: source_scope
      working-directory: writer
      run: |
        set -euo pipefail
        PYTHONPATH=scripts python -c "import cp6_au_trial; cp6_au_trial.source()"
        mkdir -p ../candidate/cp6-proof/writer-{ae,af,ah,ai,aj,ak,al,am,an}
    - name: Start disposable database
      working-directory: base
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = 1bdca3766f7c9800d68295ff5122798060b8a05d
        test "$(git rev-parse HEAD^{tree})" = 334629c626257b8b713826f491cdf62385d5299b
        test -z "$(git status --porcelain)"
        supabase --help >/dev/null
        supabase init --help >/dev/null
        supabase start --help >/dev/null
        mkdir cp5-local
        supabase init --force --workdir cp5-local
        mkdir -p cp5-local/supabase/.temp
        echo '17.6.1.165' > cp5-local/supabase/.temp/postgres-version
        sed -i '0,/^enable_signup = true$/s//enable_signup = false/' cp5-local/supabase/config.toml
        # ghcr.io can rate-limit image pulls before anything runs. Retry the start
        # only (no test has run), falling back to the same image tags on public.ecr.aws.
        for attempt in 1 2 3 4; do
          if [ "$attempt" -ge 2 ]; then export SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws; fi
          if supabase start --workdir cp5-local \
            -x realtime,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor \
            > "$RUNNER_TEMP/cp6-local-start.log" 2>&1; then
            echo "supabase start succeeded on attempt $attempt from ${SUPABASE_INTERNAL_IMAGE_REGISTRY:-default}"
            break
          fi
          tail -n 20 "$RUNNER_TEMP/cp6-local-start.log"
          supabase stop --workdir cp5-local --no-backup || true
          if [ "$attempt" = 4 ]; then exit 1; fi
          sleep $((attempt * 60))
        done
    - name: Rebuild to v2.6.20, align with hosted, continue the frozen path to AB
      working-directory: base
      env:
        GITHUB_SHA: 1bdca3766f7c9800d68295ff5122798060b8a05d
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        export CP6_AC_WRITER_ARTIFACT="$RUNNER_TEMP/ac-native200.zip"
        gh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10392910720/zip \
          > "$CP6_AC_WRITER_ARTIFACT" || { rm -f "$CP6_AC_WRITER_ARTIFACT"; echo 'AC writer artifact 10392910720 unavailable (kept 30 days, expired 15 Oct 2026, owner D14-17); cp6_pre_u_inventory captures the pre-U table set before U'; }
        mkdir -p ../auditor/cp6-proof/t3
        status=0
        PYTHONPATH=scripts python ../auditor/scripts/cp6_t3_aligned_chain.py ../auditor/cp6-proof/t3/ALIGNED_CHAIN.json --stop-after-ab || status=$?
        python - <<'PY'
        import json
        d=json.load(open('../auditor/cp6-proof/t3/ALIGNED_CHAIN.json'))
        print(json.dumps({k:d.get(k) for k in ('status','refused_step','alignment')},default=str)[:6000])
        print(json.dumps([(s['name'],s['exit_code'],s['after_alignment']) for s in d['steps']])[:6000])
        PY
        exit "$status"
    - name: Provision isolated rollback authority
      working-directory: writer
      shell: bash
      run: |
        set -euo pipefail
        maintenance_password="$(openssl rand -hex 32)"
        maintenance_pgurl="postgresql://cp6_maintenance_admission:${maintenance_password}@127.0.0.1:54322/template1"
        echo "::add-mask::$maintenance_password"
        echo "::add-mask::$maintenance_pgurl"
        docker exec -i "$CP6_DATABASE_CONTAINER" \
          psql -U supabase_admin -d template1 -X -v ON_ERROR_STOP=1 \
            -v cp6_password="$maintenance_password" <<'SQL'
        create role cp6_maintenance_admission
          login superuser noinherit nocreatedb nocreaterole noreplication
          connection limit 4 password :'cp6_password';
        SQL
        printf 'CP6_ADMISSION_CONTROL_PGURL=%s\n' "$maintenance_pgurl" >> "$GITHUB_ENV"
    - name: Clone the aligned AB state for install
      working-directory: writer
      run: |
        set -euo pipefail
        mkdir -p '../auditor/cp6-proof/t3'
        bash scripts/clone-cp6-disposable-database.sh \
          'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
          'postgresql://postgres:postgres@127.0.0.1:54322/template1' \
          'postgresql://postgres:postgres@127.0.0.1:54322/cp6_rollback' \
          cp6_rollback supabase_db_cp5-local '../auditor/cp6-proof/t3/CLONE_install'
    - name: Install exact Native73-qualified full product and qualify eighteen real Auth HTTP cases
      working-directory: writer
      run: python '../auditor/scripts/ow04-qualification/transport_probe.py'
      id: http_settlement
      continue-on-error: true
    - name: Preserve HTTP evidence and clone fresh AB state for the separate race entry
      working-directory: writer
      run: |
        set -euo pipefail
        python - <<'PY_SAFE'
        import json,pathlib
        root=pathlib.Path('../auditor/cp6-proof/t3')
        http=json.loads((root/'CP7_OW04_HTTP.json').read_text())
        package=json.loads((root/'T3_PACKAGE_INSTALL.json').read_text())
        assert http.get('cp6_restored') is True, 'HTTP did not restore CP6; race entry refused'
        assert package.get('primary_unchanged') is True, 'HTTP changed primary; race entry refused'
        assert (http.get('http',{}).get('auth_counts') or {}).get('restored') is True, 'HTTP Auth cleanup incomplete; race entry refused'
        PY_SAFE
        python - <<'PY_COPY'
        import shutil
        shutil.copytree('../auditor/cp6-proof/t3','../auditor/cp6-proof/ow04-http-completed')
        PY_COPY
        set -euo pipefail
        mkdir -p '../auditor/cp6-proof/t3'
        bash scripts/clone-cp6-disposable-database.sh \
          'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
          'postgresql://postgres:postgres@127.0.0.1:54322/template1' \
          'postgresql://postgres:postgres@127.0.0.1:54322/cp6_rollback' \
          cp6_rollback supabase_db_cp5-local '../auditor/cp6-proof/t3/CLONE_race_install'
    - name: Qualify six retained SQL races-recovery and two separate source-inverse races
      working-directory: writer
      run: python '../auditor/scripts/ow04-qualification/race_probe.py'
      id: race_settlement
      continue-on-error: true
    - name: Require all eighteen HTTP, six retained races and two source-inverse races
      if: always()
      working-directory: writer
      run: python '../auditor/scripts/ow04-qualification/qualification_gate.py' '../auditor/cp6-proof/t3'
      env:
        OW04_HTTP_STEP_OUTCOME: ${{ steps.http_settlement.outcome }}
        OW04_RACE_STEP_OUTCOME: ${{ steps.race_settlement.outcome }}
    - name: Preserve exact original transport JSON bytes
      if: always()
      working-directory: auditor
      run: |
        python - <<'PY'
        import base64,gzip,hashlib,json
        from pathlib import Path
        root=Path('cp6-proof/t3')
        names=('CP7_OW04_HTTP.json','CP7_OW04_RACES.json','CP7_OW04_BROWSER.json','OW04_HTTP_RACE_FINAL.json','T3_PACKAGE_INSTALL.json','T3_BACKUP_RESTORE_DRILL.json')
        paths=[root/name for name in names]
        paths.append(root.parent/'ow04-http-completed/T3_PACKAGE_INSTALL.json')
        for path in paths:
            if not path.is_file():
                continue
            raw=path.read_bytes();packed=gzip.compress(raw,mtime=0)
            print(json.dumps(dict(ow04_original_report_bytes=True,path=str(path),name=path.name,
                raw_bytes=len(raw),raw_sha256=hashlib.sha256(raw).hexdigest(),
                gzip_bytes=len(packed),gzip_sha256=hashlib.sha256(packed).hexdigest(),
                gzip_base64=base64.b64encode(packed).decode('ascii'))),flush=True)
        PY
    - name: Remove disposable database
      if: always()
      working-directory: base
      run: supabase stop --workdir cp5-local --no-backup
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cp7-ow04-http-races
        path: |
          auditor/cp6-proof/t3
          auditor/cp6-proof/ow04-http-completed
        retention-days: 30
        if-no-files-found: error
