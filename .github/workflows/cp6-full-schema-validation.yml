          preflight_remaining='UNKNOWN'
          cleanup_preflight() {
            prior_status=$?
            trap - EXIT
            set +e
            docker exec "$CP6_DATABASE_CONTAINER" \
              dropdb -U supabase_admin --if-exists --force --maintenance-db=template1 cp6_preflight
            drop_status=$?
            if test "$drop_status" -eq 0; then
              preflight_remaining="$(docker exec "$CP6_DATABASE_CONTAINER" \
                psql -U supabase_admin -d template1 -X -At -v ON_ERROR_STOP=1 \
                -c "select count(*) from pg_database where datname='cp6_preflight'")"
              query_status=$?
            else
              query_status=1
            fi
            if test "$drop_status" -ne 0 || test "$query_status" -ne 0 \
              || test "$preflight_remaining" != '0'; then prior_status=1; fi
            set -e
            printf 'clone_database=cp6_preflight\nremaining_databases=%s\nstatus=%s\n' \
              "$preflight_remaining" "$(test "$prior_status" -eq 0 && echo PASS || echo FAIL)" \
              | tee cp6-proof/CP6_PREFLIGHT_CLONE_CLEANUP.txt
            exit "$prior_status"
