              'scripts/cp6_v2620ae_maintenance_schedules.py': '7d88f6a54c35c0ae32e25cae4540056945e083603766cdb2ecaa1080582f722d'})
          ad_exact=False
          ad_round=False
          ae_exact=False
          ae_independent=False
          af_exact=False
          af_pins={'.github/workflows/cp6-ad-roll-opening-check.yml': 'fefe2440e24e4a1748fce656b92d181ef13e7183ae7b646da809e18711f6e434', 'docs/cp6-af-competition-handoff.md': '034da875c2e2716e39bc7b93c9aff8633e8474c8a23cb21ee4b0b27b575dce15', 'docs/evidence/cp6-af-family-disposition.json': 'fe17694cb5b2b8cc4924fdd2bcba4eee33788b446c5e173053d30239fa304d70', 'docs/evidence/cp6-af-predecessor-functions.json': '9eafb434cf36de84b40614f031d8f56aa732720aae985cfb092cc5a37319db65', 'docs/evidence/cp6-af-runtime-pins.json': 'a6a1e6fde1eb068193cca57024ade6d043f08fce4b9467ad2eb27ce063579dbe', 'scripts/cp6_preuse_rollback_maintenance.py': 'df8e546679407f9fcdbe0883afb14fe1f4da7074085fb1eeca1dae24811f0433', 'scripts/cp6_v2620af_build_sql.py': '759a1fae056795fa5d74464a51de45df18129c3067cbf91d1cbbc9f852e36d56', 'scripts/cp6_v2620af_concurrency.py': '83a2b8f5d5b78020476d7c13dd2da0becff93960b988f816c996750a20dfdcbf', 'scripts/cp6_v2620af_family.py': '8fccff330d2d0c1662988c34c716705816356dbbce056e842b8b753aed4b1e29', 'scripts/cp6_v2620af_maintenance_schedules.py': '72c51a1197a3aa70e54c33d1abadadbf711643524a189d5562ee69b29267bba3', 'scripts/cp6_v2620af_rollback_guards.py': '3f98c9ed99a09e363fe94078ebbabba0c206b5b042d03b9c8fc9bc34f841d9ea', 'scripts/cp6_v2620af_runtime.py': '448dcedebd85c53f21aa8bb0307265d21d65c78e1069728a3515d385c671838c', 'supabase/migrations/20260916014332_erp_v2_6_20af_cp6_posted_child_integrity.sql': 'c9cabce7f9e983e8390bfcc9eb2f47e17ca1e45b68bf337747b5acde149505a0', 'supabase/rollbacks/20260916014332_erp_v2_6_20af_cp6_posted_child_integrity.rollback.sql': 'd3a432dfa7e5bd37e7296ba02c8f0c63b553c36089be9f708b078af833448c11', '.github/workflows/cp6-ac-independent-audit.yml': 'e4b9997c891e4a32b72d0ae01884cf827f80b5924c707ae975fb7a0204d384ed'}
          ae_independent_pins={'.github/workflows/cp6-ad-roll-opening-check.yml': '3028654b84498833c95ddfadd797d6cd23f624c0383cdaacb5f65ee4c0e851d2', 'scripts/cp6_ae_independent_audit.py': 'c73acb420aceeb9cf7dda100af2b5b12095b8022a042fa4b80de5d4ddb157ba4'}
          try:
              ancestor=subprocess.check_output(['git','merge-base',frozen,'HEAD'],text=True).strip()==frozen
              changed=set(subprocess.check_output(['git','diff','--name-only',frozen,'HEAD'],text=True).splitlines())
              current=Path('.github/workflows/cp6-full-schema-validation.yml').read_text()
              marker_a='  # BEGIN AC AUDIT EVIDENCE ROUTER\n'
              marker_b='  # END AC AUDIT EVIDENCE ROUTER\n'
              start=current.index(marker_a);end=current.index(marker_b,start)+len(marker_b)
              restored=current[:start]+current[end:]
              routing="    needs: audit-scope\n    if: needs.audit-scope.outputs.full == 'true'\n"
              assert restored.count(routing)==1
              restored=restored.replace(routing,'',1)
              original_matches=hashlib.sha256(restored.encode()).hexdigest()=='5ba14137aca8992f92f32357d2b0a3c15a1ca40a988b3ec79754dde7a6eb8302'
              audit_only=ancestor and bool(changed) and changed<=allowed and original_matches
