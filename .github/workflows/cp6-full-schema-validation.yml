      - name: Package complete native evidence for lossless transfer
        run: python scripts/package_cp6_native_evidence.py cp6-proof cp6-native-transfer

      - name: Upload complete native evidence transfer
        uses: actions/upload-artifact@v4
        with:
          name: cp6-r1-v2620ac-lossless-native-transfer
          path: cp6-native-transfer
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Preserve AC qualification and diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp6-ac-temporal-surface-qualification
          path: |
            cp6-proof/writer-ac
            cp6-proof/AC_MAINTENANCE_ROLLBACK
            cp6-proof/CP6_V2620AC_*.json
            cp6-proof/V2620AC_*
            cp6-proof/CP6_AB189_MATRIX_CARRY_FORWARD.json
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve AB qualification and before-after diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp6-ab-operational-clock-qualification
          path: |
            cp6-proof/independent-ab
            cp6-proof/independent-aa
            cp6-proof/CP6_V2620AB_*.json
            cp6-proof/V2620AB_*
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve AA qualification and diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp6-aa-material-day-qualification
          path: |
            cp6-proof/independent-aa
            cp6-proof/CP6_V2620AA_*.json
            cp6-proof/V2620AA_*
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve Z close qualification even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp6-z-close-qualification
          path: |
            cp6-proof/independent-z
            cp6-proof/CP6_V2620Z_*.json
            cp6-proof/V2620Z_*
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve independent Y evidence even on qualified failure or fixture error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp6-y-independent-audit
          path: cp6-proof/independent-y
          if-no-files-found: error
          retention-days: 30

      - name: Preserve independent X audit even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp6-y-cash-date-qualification
          path: |
            cp6-proof/CP6_V2620Y_*.json
            cp6-proof/V2620Y_*.log
            cp6-proof/V2620Y_*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload non-secret CP6 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp6-r1-v2620ac-full-schema-auth-browser-proof
          path: cp6-proof
          if-no-files-found: warn
          include-hidden-files: false
          compression-level: 9
          retention-days: 30

      - name: Destroy disposable stack
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          set +e
          supabase stop --workdir cp5-local --no-backup
          stop_exit=$?
          if docker inspect "$CP6_DATABASE_CONTAINER" >/dev/null 2>&1; then
            remaining_database_container=1
          else
            remaining_database_container=0
          fi
          rm -rf cp5-local supabase/.temp
          if test "$remaining_database_container" -eq 0; then
            cleanup_status=PASS
          else
            cleanup_status=FAIL
          fi
          printf 'stop_exit=%s\nremaining_database_container=%s\nstatus=%s\n' \
            "$stop_exit" "$remaining_database_container" "$cleanup_status"
          test "$cleanup_status" = 'PASS'
