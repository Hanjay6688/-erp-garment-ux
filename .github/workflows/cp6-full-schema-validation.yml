      - name: Run thirty-four native CP6 races plus three abort qualifications, temporal, paging, and scale proofs
        shell: bash
        run: |
          set -euo pipefail
          cleanup_race() {
            docker exec "$CP6_DATABASE_CONTAINER" \
              dropdb -U supabase_admin --if-exists --force --maintenance-db=template1 cp6_race
            remaining="$(docker exec "$CP6_DATABASE_CONTAINER" \
