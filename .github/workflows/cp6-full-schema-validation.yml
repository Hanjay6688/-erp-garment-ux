      - name: Bind successful CP6 proof to the exact runtime SHA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          root=Path('.')
          proof=root/'cp6-proof'
          required=[
            'CP6_AUTH_PERMISSION_E2E.log','cp6-auth-permission-e2e.json',
            'CP6_LAUNDRY_QC_CONCURRENCY.log','cp6-laundry-qc-concurrency.json',
            'CP6_REVERSAL_CONCURRENCY_MATRIX.log','cp6-reversal-concurrency-matrix.json',
            'CP6_WORKSPACE_SCALE.json','CP6_WORKSPACE_OPERATOR_LOAD.log',
            'cp6-workspace-operator-load.json',
            'V2620C_MIGRATION_SHA256.txt','V2620C_APPLY.log','V2620C_REPLAY_REJECTION.log',
            'V2620C_LIVE_ROLLBACK_WRITER_FIRST.json','V2620C_LIVE_ROLLBACK_ROLLBACK_FIRST.json',
            'V2620C_LIVE_ROLLBACK_CLONE_CLEANUP.txt','V2620C_MAIN_PRE_USE_ROLLBACK.log',
            'V2620B_ROLLBACK_CONCURRENCY.json',
            'V2620B_ROLLBACK.log','FINAL_RECONCILIATION.json',
            'CP6_AUTH_CLONE_CLEANUP.txt','CP6_RACE_CLONE_CLEANUP.txt',
            'CP6_PREFLIGHT_CLONE_CLEANUP.txt','cp6-browser-contract/results.json',
          ]
          missing=[name for name in required if not (proof/name).is_file()]
          assert not missing,missing
          assert json.loads((proof/'FINAL_RECONCILIATION.json').read_text())['status']=='PASS'

          browser=json.loads((proof/'cp6-browser-contract/results.json').read_text())
          tests=[]
          def walk(suite):
              for spec in suite.get('specs',[]): tests.extend(spec.get('tests',[]))
              for child in suite.get('suites',[]): walk(child)
          for suite in browser.get('suites',[]): walk(suite)
          assert len(tests)==26,len(tests)
          assert all(test.get('results') and test['results'][-1].get('status')=='passed' for test in tests)

          digest=lambda value:hashlib.sha256(value).hexdigest()
          source_paths=[
            'supabase/migrations/20260904111157_erp_v2_6_20_cp6_laundry_qc_fg_authoritative.sql',
            'supabase/migrations/20260905110913_erp_v2_6_20a_cp6_audit_reliability_closure.sql',
            'supabase/migrations/20260905170334_erp_v2_6_20b_cp6_reaudit_reliability_closure.sql',
            'supabase/rollbacks/20260905170334_erp_v2_6_20b_cp6_reaudit_reliability_closure.rollback.sql',
            'supabase/migrations/20260907190000_erp_v2_6_20c_cp6_deep_business_reliability.sql',
            'supabase/rollbacks/20260907190000_erp_v2_6_20c_cp6_deep_business_reliability.rollback.sql',
          ]
          sources={}
          for name in source_paths:
              data=(root/name).read_bytes()
              sources[name]={
                'bytes':len(data),'sha256':digest(data),
                **({'platform_ledger_sha256':digest(data[:-1])} if '/migrations/' in name else {}),
              }
          proof_files={}
          for path in sorted(item for item in proof.rglob('*') if item.is_file()):
              relative_path=path.relative_to(proof)
              relative=str(relative_path)
              if relative=='CP6_V2620C_RUNTIME_MANIFEST.json': continue
              # actions/upload-artifact excludes hidden path components when
              # include-hidden-files is false.  The manifest must describe
              # exactly the files an independent reviewer can download.
              if any(part.startswith('.') for part in relative_path.parts): continue
              data=path.read_bytes()
              proof_files[relative]={'bytes':len(data),'sha256':digest(data)}
          assert all(
              not any(part.startswith('.') for part in Path(name).parts)
              for name in proof_files
          )

          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head==os.environ['GITHUB_SHA']
          manifest={
            'format':'CP6_V2620C_RUNTIME_PROOF_V1',
            'status':'PASS_EXACT_LOCAL_DISPOSABLE_CI',
            'observed_at_utc':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'identity':{
              'repository':os.environ['GITHUB_REPOSITORY'],
              'ref_name':os.environ['GITHUB_REF_NAME'],
              'head_sha':head,
              'head_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
              'parents':subprocess.check_output(['git','show','-s','--format=%P','HEAD'],text=True).strip().split(),
              'workflow':os.environ['GITHUB_WORKFLOW'],
              'run_id':int(os.environ['GITHUB_RUN_ID']),
              'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'job':os.environ['GITHUB_JOB'],
            },
            'owner_rules':[
              'VENI. VIDI. VICI. ERP. — I CONQUERED ERP.',
              'Reliable data adalah dewa. Keuangan termasuk laporan, stok, dan HPP adalah raja.',
            ],
            'sources':sources,
            'proof_contract':{
              'browser_executions':26,
              'real_auth_jwt_http':True,
              'mutation_action_kinds':7,
              'native_runtime_race_schedules':34,
              'reject_abort_qualifications':3,
              'manual_prelock_count':0,
              'actual_business_facade_rollback_race_orders':2,
              'financial_confidence_corruption_probes':3,
              'full_future_temporal_prefixes':True,
              'partial_hpp_wip_conservation':True,
              'source_bound_sku_paging':True,
              'simultaneous_operators':8,
              'rollback_and_complete_ladder':True,
              'physical_clone_residue_zero':True,
            },
            'archive_policy':{
              'include_hidden_files':False,
              'manifest_excludes_hidden_path_components':True,
            },
            'hosted_boundary':{
              'uat_project_ref':'siimvrusnzxexizpyoib',
              'legacy_project_ref':'vlxdhpkjeevubjxexnfo',
              'mutated_by_this_workflow':False,
              'uat_v2620a_v2620b_v2620c_state':'NOT_TESTED_OR_APPLIED_BY_THIS_RUN',
              'legacy_state':'NOT_TESTED_OR_MUTATED_BY_THIS_RUN',
            },
            'proof_files':proof_files,
            'production_go':False,
          }
          (proof/'CP6_V2620C_RUNTIME_MANIFEST.json').write_text(
              json.dumps(manifest,indent=2,sort_keys=True)+'\n',encoding='utf8',
          )
          print(json.dumps({
            'status':manifest['status'],'head_sha':head,
            'proof_file_count':len(proof_files),'production_go':False,
          },sort_keys=True))
          PY

