          psql "$CP6_RACE_PGURL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/cp6_laundry_qc_concurrency_seed.sql \
            2>&1 | tee cp6-proof/CP6_RACE_SEED.log
          python scripts/cp6_laundry_qc_concurrency.py \
            2>&1 | tee cp6-proof/CP6_LAUNDRY_QC_CONCURRENCY.log
          psql "$CP6_RACE_PGURL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/cp6_reversal_concurrency_seed.sql \
            2>&1 | tee cp6-proof/CP6_REVERSAL_RACE_SEED.log
          python scripts/cp6_reversal_concurrency_matrix.py \
            2>&1 | tee cp6-proof/CP6_REVERSAL_CONCURRENCY_MATRIX.log
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report=json.loads(Path(os.environ['CP6_REVERSAL_RACE_REPORT']).read_text())
          expected={
            'post_receipt_vs_failed_wash',
            'reverse_delivery_vs_post_receipt','post_receipt_vs_reverse_delivery',
            'reverse_delivery_vs_failed_wash','failed_wash_vs_reverse_delivery',
            'reverse_receipt_vs_vendor_invoice','reverse_receipt_vs_final_sku',
            'reverse_qc_vs_reverse_receipt',
            'reverse_qc_vs_vendor_invoice','vendor_invoice_vs_reverse_qc',
            'reverse_qc_vs_vendor_invoice_reversal','vendor_invoice_reversal_vs_reverse_qc',
            'reverse_qc_vs_post_final_sku','post_final_sku_vs_reverse_qc',
            'invoice_vs_save_sale_draft','save_sale_draft_vs_invoice',
            'invoice_vs_post_sale_draft','post_sale_draft_vs_invoice',
            'invoice_vs_cancel_sale_draft','cancel_sale_draft_vs_invoice',
            'invoice_vs_reverse_sale','reverse_sale_vs_invoice',
          }
          assert report['status']=='PASS',report
          assert report['race_count']==22,report
          assert set(report['races'])==expected,report
          assert report['all_blockers_observed'] is True,report
          assert all(row['pg_blocking_pids_observed'] for row in report['races'].values()),report
          sales_hpp_races={
            'invoice_vs_save_sale_draft','save_sale_draft_vs_invoice',
            'invoice_vs_post_sale_draft','post_sale_draft_vs_invoice',
            'invoice_vs_cancel_sale_draft','cancel_sale_draft_vs_invoice',
            'invoice_vs_reverse_sale','reverse_sale_vs_invoice',
          }
          assert all(
            report['races'][key]['shared_advisory_lock_observed'] is True
            for key in sales_hpp_races
          ),report
          assert report['qualification_probe_count']==2,report
          assert report['manual_prelock_count']==0,report
          assert set(report['qualification_probes'])=={
            'reverse_receipt_reject_then_reverse_qc',
            'replacement_post_reject_then_invoice_reversal',
          },report
          assert all(row['manual_prelock_used'] is False for row in report['qualification_probes'].values()),report
          assert all(row['pg_blocking_pids_claimed'] is False for row in report['qualification_probes'].values()),report
          for key in ('reverse_qc_vs_post_final_sku','post_final_sku_vs_reverse_qc'):
            state=report['states'][key]
            assert state['current_hpp']==35,state
            assert state['active_laundry_hpp']==35,state
            assert state['wip_net']==35 and state['fg_net']==35,state
            assert state['reversed_lot_count']==1,state
            assert state['reversed_lot_hpp_rows']>=1,state
            assert state['reversed_lot_hpp_history']>0,state
          partial=report['states']['partial_nonzero_labor_laundry_cost']
          assert partial['partial']['current_hpp']==45 and partial['partial']['wip_net']==45,partial
          assert partial['partial']['fg_net']==45 and partial['partial']['contractor_payable_net']==-20,partial
          assert partial['repriced']['current_hpp']==60 and partial['repriced']['wip_net']==60,partial
          assert partial['completed']['current_hpp']==120 and partial['completed']['wip_net']==0,partial
          assert partial['invoice_reversed']['current_hpp']==90,partial
          for key in ('invoice_vs_post_sale_draft','post_sale_draft_vs_invoice'):
            state=report['states'][key]['after_race']
            assert state['sale_status']=='POSTED' and state['invoice_status']=='POSTED',state
            assert state['fg_qty']==5 and state['fg_state']==50 and state['cogs_state']==50,state
            assert state['fg_book']==50 and state['cogs_book']==50 and state['wip_book']==0,state
