            'v2620_application',exists(select 1 from erp.schema_migrations where version='v2.6.20'),
            'production_go',false
          );
          SQL
          test "$(python -c "import json;print(json.load(open('cp6-proof/FINAL_RECONCILIATION.json'))['status'])")" = 'PASS'

      - name: Upload non-secret CP6 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp6-r1-full-schema-auth-browser-proof
          path: cp6-proof
          if-no-files-found: warn
          retention-days: 30

      - name: Destroy disposable stack
        if: always()
        shell: bash
        run: |
          supabase stop --workdir cp5-local --no-backup 2>/dev/null || true
          rm -rf cp5-local supabase/.temp
