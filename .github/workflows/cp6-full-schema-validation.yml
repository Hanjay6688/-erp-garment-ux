      - name: Serialize v2.6.20 rollback against an in-flight writer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee cp6-proof/V2620_ROLLBACK_CONCURRENCY.log
          import json
          import os
          import subprocess
          import threading
          import time
          from pathlib import Path

          import psycopg

          pgurl = os.environ['PGURL']
          request_id = 'c7ff0000-0000-4000-8000-000000000002'
          ready = threading.Event()
          holder_error = []

          def hold_in_flight_writer():
              try:
                  with psycopg.connect(pgurl) as connection:
                      with connection.cursor() as cursor:
                          cursor.execute(
                              '''insert into erp.idempotency_requests(
                                   actor_key,operation_name,client_request_id,request_hash
                                 ) values(%s,%s,%s::uuid,%s)''',
                              (
                                  'cp6-v2620-concurrent-rollback-proof',
                                  'cp6_laundry_qc_action_v1:post_delivery',
                                  request_id,
                                  'synthetic-in-flight-rollback-proof',
                              ),
                          )
                          ready.set()
                          time.sleep(1.0)
                      connection.commit()
              except Exception as exc:
                  holder_error.append(str(exc))
                  ready.set()

          holder = threading.Thread(target=hold_in_flight_writer, daemon=True)
          holder.start()
          if not ready.wait(timeout=10):
              raise RuntimeError('Concurrent writer never acquired its table lock')
          started = time.monotonic()
          rollback = subprocess.run(
              [
                  'psql', pgurl, '-v', 'ON_ERROR_STOP=1', '-f',
                  'supabase/rollbacks/20260904111157_erp_v2_6_20_cp6_laundry_qc_fg_authoritative.rollback.sql',
              ],
              text=True,
              capture_output=True,
              timeout=30,
              check=False,
          )
          elapsed = time.monotonic() - started
          holder.join(timeout=10)
          combined = rollback.stdout + rollback.stderr
          if holder.is_alive() or holder_error:
              raise RuntimeError(f'Concurrent writer failed: {holder_error}')
          if rollback.returncode == 0:
              raise RuntimeError('Rollback crossed a committed in-flight CP6 writer')
          if 'v2.6.20 rollback refused: post-install CP6 physical/financial/stock/HPP/idempotency/audit history exists' not in combined:
              raise RuntimeError(f'Rollback returned the wrong rejection: {combined}')
          if elapsed < 0.5:
              raise RuntimeError(f'Rollback did not serialize behind the writer: {elapsed:.3f}s')

          with psycopg.connect(pgurl) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      "select count(*) from erp.schema_migrations where version='v2.6.20'"
                  )
                  if cursor.fetchone()[0] != 1:
                      raise RuntimeError('Rejected rollback removed the v2.6.20 marker')
                  cursor.execute(
                      'delete from erp.idempotency_requests where client_request_id=%s::uuid',
                      (request_id,),
                  )
              connection.commit()

          report = {
              'status': 'PASS',
              'writer_committed_before_decision': True,
              'rollback_waited_seconds': round(elapsed, 3),
              'rollback_refused': True,
              'test_residue_removed': True,
              'production_go': False,
          }
          Path('cp6-proof/V2620_ROLLBACK_CONCURRENCY.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf8'
          )
          print(json.dumps(report, sort_keys=True))
          PY
          test "$(psql "$PGURL" -At -c "select count(*) from erp.idempotency_requests where client_request_id='c7ff0000-0000-4000-8000-000000000002'")" = '0'
          test "$(psql "$PGURL" -At -c "select count(*) from erp.schema_migrations where version='v2.6.20'")" = '1'

