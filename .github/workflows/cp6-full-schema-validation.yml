      - name: Run post-CP6 real Auth JWT HTTP permissions and residue-zero E2E
        shell: bash
        run: |
          set -euo pipefail
          auth_rest_name='cp6_auth_rest'
          auth_rest_env="$(mktemp)"
          auth_rest_json="${auth_rest_env}.json"
          cleanup_auth_clone() {
            prior_status=$?
            trap - EXIT
            set +e
            docker rm -f "$auth_rest_name" >/dev/null 2>&1
            rm -f "$auth_rest_env" "$auth_rest_json"
            docker exec "$CP6_DATABASE_CONTAINER" \
              dropdb -U supabase_admin --if-exists --force --maintenance-db=template1 cp6_auth
            remaining="$(docker exec "$CP6_DATABASE_CONTAINER" \
              psql -U supabase_admin -d template1 -X -At -v ON_ERROR_STOP=1 \
              -c "select count(*) from pg_database where datname='cp6_auth'")"
            if test "$remaining" != '0'; then prior_status=1; fi
            printf 'clone_database=cp6_auth\nremaining_databases=%s\npostgrest_container_removed=true\nsecrets_persisted=false\nstatus=%s\n' \
              "$remaining" "$(test "$remaining" = '0' && echo PASS || echo FAIL)" \
              | tee cp6-proof/CP6_AUTH_CLONE_CLEANUP.txt
            exit "$prior_status"
          }
          trap cleanup_auth_clone EXIT

          status_env=''
          for attempt in $(seq 1 45); do
            if status_env="$(supabase status --workdir cp5-local -o env 2>/dev/null)" \
              && grep -q '^API_URL=' <<<"$status_env"; then
              break
            fi
            sleep 2
          done
          test -n "$status_env"
          grep -q '^API_URL=' <<<"$status_env"
          grep -q '^ANON_KEY=' <<<"$status_env"
          grep -q '^SERVICE_ROLE_KEY=' <<<"$status_env"
          eval "$status_env"

          bash scripts/clone-cp6-disposable-database.sh \
            "$PGURL" "$CP6_MAINTENANCE_PGURL" "$CP6_AUTH_PGURL" cp6_auth \
            "$CP6_DATABASE_CONTAINER" cp6-proof/CP6_AUTH_CLONE_BOUNDARY
          psql "$CP6_AUTH_PGURL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/cp3_r4_full_schema_seed.sql \
            2>&1 | tee cp6-proof/CP6_AUTH_FOUNDATION_SEED.log
          psql "$CP6_AUTH_PGURL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/cp6_laundry_qc_concurrency_seed.sql \
            2>&1 | tee cp6-proof/CP6_AUTH_BUSINESS_SEED.log

          # Auth stays on the untouched primary local database. A second,
          # temporary PostgREST process points only at cp6_auth and explicitly
          # exposes `erp` so private-schema ACL denial is tested directly.
          rest_container="$(docker ps --format '{{.Names}}' | awk '/^supabase_rest_/ {print; exit}')"
          test -n "$rest_container"
          rest_image="$(docker inspect -f '{{.Config.Image}}' "$rest_container")"
          rest_network="$(docker inspect -f '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' "$rest_container" | head -1)"
          test -n "$rest_image"
          test -n "$rest_network"
          docker inspect -f '{{json .Config.Env}}' "$rest_container" > "$auth_rest_json"
          AUTH_REST_JSON="$auth_rest_json" AUTH_REST_ENV="$auth_rest_env" python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit, urlunsplit

          values={}
          for item in json.loads(Path(os.environ['AUTH_REST_JSON']).read_text()):
              key,value=item.split('=',1)
              values[key]=value
          uri=urlsplit(values['PGRST_DB_URI'])
          values['PGRST_DB_URI']=urlunsplit((
              uri.scheme,uri.netloc,'/cp6_auth',uri.query,uri.fragment,
          ))
          schemas=[value.strip() for value in values.get('PGRST_DB_SCHEMAS','public').split(',') if value.strip()]
          if 'erp' not in schemas:
              schemas.append('erp')
          values['PGRST_DB_SCHEMAS']=','.join(schemas)
          values['PGRST_SERVER_PORT']='3000'
          Path(os.environ['AUTH_REST_ENV']).write_text(
              ''.join(f'{key}={value}\n' for key,value in sorted(values.items())),
              encoding='utf8',
          )
          PY
          docker run -d --name "$auth_rest_name" --network "$rest_network" \
            --env-file "$auth_rest_env" -p 127.0.0.1:54329:3000 "$rest_image" >/dev/null

          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error \
              -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" \
              http://127.0.0.1:54329/ >/dev/null \
              && curl --fail --silent --show-error "$API_URL/auth/v1/health" >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" \
            http://127.0.0.1:54329/ >/dev/null
          curl --fail --silent --show-error "$API_URL/auth/v1/health" >/dev/null

          export SUPABASE_URL="$API_URL"
          export SUPABASE_AUTH_URL="$API_URL"
          export SUPABASE_REST_URL='http://127.0.0.1:54329'
          export SUPABASE_REST_PREFIX=''
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export CP6_AUTH_CONTROL_PGURL="$PGURL"
          export CP6_AUTH_DATABASE_NAME='cp6_auth'
          node scripts/cp6_auth_permission_e2e.mjs 2>&1 | tee cp6-proof/CP6_AUTH_PERMISSION_E2E.log
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report=json.loads(Path(os.environ['CP6_AUTH_REPORT']).read_text())
          assert report['status']=='PASS',report
          assert report['classification']=='LOCAL_POST_CP6_REAL_AUTH_JWT_HTTP',report
          assert report['target']=='PHYSICAL_DISPOSABLE_CP6_AUTH_CLONE_AFTER_V2620C',report
          assert report['disposable_database']=='cp6_auth',report
          assert report['database_disposal_required'] is True,report
          assert report['positive_evidence']['partial_hpp_wip']['active_laundry_hpp']==35,report
          assert report['positive_evidence']['partial_hpp_wip']['wip_net']==35,report
          assert report['positive_evidence']['fully_reversed']['fg_net']==0,report
          assert report['positive_evidence']['failed_wash_cost_only']['wip_net']==140,report
          assert report['positive_evidence']['failed_wash_cost_only']['accrued_net']==-140,report
          assert report['positive_evidence']['positive_facade_actions']==12,report
          assert report['positive_evidence']['granular_reverse_actions']==6,report
          expected_actions={
            'POST_DELIVERY','POST_RECEIPT','POST_FAILED_WASH','POST_FINAL_SKU',
            'REVERSE_DELIVERY','REVERSE_RECEIPT','REVERSE_FINAL_SKU',
          }
          assert set(report['positive_evidence']['mutation_action_kinds'])==expected_actions,report
          assert set(report['positive_evidence']['viewer_denied_action_kinds'])==expected_actions,report
          assert report['positive_evidence']['all_actions_fully_reversed']==report['positive_evidence']['fully_reversed'],report
          assert report['facade_role_matrix'],report
          assert any(row['facade']=='erp_post_final_sku_allocation_v1' and row['expectation']=='ALLOW' for row in report['facade_role_matrix']),report
          assert any(row['facade']=='erp_post_final_sku_allocation_v1' and row['expectation']=='DENY' for row in report['facade_role_matrix']),report
          for facade in ('erp_search_final_sku_products_v1','erp_search_laundry_bs_products_v1'):
            rows=[row for row in report['facade_role_matrix'] if row['facade']==facade]
            assert {row['role'] for row in rows}=={'owner','operator','viewer','anonymous','unmapped','inactive'},rows
            assert all(row['status']==200 for row in rows if row['expectation']=='ALLOW'),rows
            assert all(row['status']!=200 for row in rows if row['expectation']=='DENY'),rows
          assert report['private_schema_evidence']['schema_profile_requested']=='erp',report
          assert all(value is False for value in report['private_schema_evidence']['authenticated_execute_acl'].values()),report
          assert report['production_go'] is False,report
          assert all(report['tested'].values()),report
          assert all(value==0 for value in report['residue'].values()),report
          PY
          test "$(psql "$PGURL" -At -c 'select count(*) from auth.users')" = '0'
          test "$(psql "$PGURL" -At -c 'select count(*) from erp.app_users')" = '0'
          test "$(psql "$CP6_AUTH_PGURL" -At -c 'select count(*) from erp.cp6_laundry_qc_execution_context')" = '0'

