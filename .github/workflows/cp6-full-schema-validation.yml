              'scripts/cp6_v2620ae_build_sql.py': 'd36adaf08324e25f665ebe6fcf952518a1f33eb08195260bd1c88dbd347c4922',
              'scripts/cp6_v2620ae_family.py': '855f0481b093271412ba291261cad2a8800e75a4a813ef53ba36d94d46dfacd9',
