      - name: Stop disposable stack and prove physical cleanup
        shell: bash
        run: |
          set -uo pipefail
          set +e
          supabase stop --workdir cp5-local --no-backup \
            2>&1 | tee cp6-proof/CP6_STACK_STOP.log
          stop_status=${PIPESTATUS[0]}
          if docker inspect "$CP6_DATABASE_CONTAINER" >/dev/null 2>&1; then
            remaining_database_container=1
          else
            remaining_database_container=0
          fi
          if test "$stop_status" -eq 0 && test "$remaining_database_container" -eq 0; then
            cleanup_status=PASS
          else
            cleanup_status=FAIL
          fi
          printf 'stop_exit=%s\nremaining_database_container=%s\nstatus=%s\nproduction_go=false\n' \
            "$stop_status" "$remaining_database_container" "$cleanup_status" \
            | tee cp6-proof/CP6_STACK_CLEANUP.txt
          test "$cleanup_status" = 'PASS'

      - name: Bind successful CP6 proof to the exact runtime SHA
        shell: bash
