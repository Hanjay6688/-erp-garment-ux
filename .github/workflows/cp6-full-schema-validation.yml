          import subprocess
          import threading
          import time
          from pathlib import Path

          import psycopg

          pgurl = os.environ['PGURL']
          request_id = 'c7ff0000-0000-4000-8000-000000000002'
          ready = threading.Event()
          holder_error = []

          def hold_in_flight_writer():
              try:
                  with psycopg.connect(pgurl) as connection:
                      with connection.cursor() as cursor:
                          cursor.execute(
                              '''insert into erp.idempotency_requests(
                                   actor_key,operation_name,client_request_id,request_hash
                                 ) values(%s,%s,%s::uuid,%s)''',
                              (
                                  'cp6-v2620a-concurrent-rollback-proof',
                                  'cp6_laundry_qc_action_v1:post_delivery',
                                  request_id,
                                  'synthetic-in-flight-rollback-proof',
                              ),
                          )
                          ready.set()
                          time.sleep(1.0)
                      connection.commit()
              except Exception as exc:
                  holder_error.append(str(exc))
                  ready.set()

          holder = threading.Thread(target=hold_in_flight_writer, daemon=True)
          holder.start()
          if not ready.wait(timeout=10):
              raise RuntimeError('Concurrent writer never acquired its table lock')
          started = time.monotonic()
          rollback = subprocess.run(
              [
                  'psql', pgurl, '-v', 'ON_ERROR_STOP=1', '-f',
                  'supabase/rollbacks/20260905110913_erp_v2_6_20a_cp6_audit_reliability_closure.rollback.sql',
              ],
              text=True,
              capture_output=True,
              timeout=30,
              check=False,
          )
          elapsed = time.monotonic() - started
          holder.join(timeout=10)
          combined = rollback.stdout + rollback.stderr
          if holder.is_alive() or holder_error:
              raise RuntimeError(f'Concurrent writer failed: {holder_error}')
          if rollback.returncode == 0:
              raise RuntimeError('Rollback crossed a committed in-flight CP6 writer')
          if 'v2.6.20a rollback refused: CP6 business/idempotency history exists' not in combined:
