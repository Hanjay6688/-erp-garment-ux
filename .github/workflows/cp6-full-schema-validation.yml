  validate-full-schema:
    needs: audit-scope
    if: needs.audit-scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact CP6 candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity, ancestry, ownership, and source gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cp6-proof
          test "$(git merge-base HEAD "$SOURCE_BASE_SHA")" = "$SOURCE_BASE_SHA"
          test "$(git rev-parse "$SOURCE_BASE_SHA^{tree}")" = "$SOURCE_BASE_TREE"
          test "$(git rev-list --count "$SOURCE_BASE_SHA"..HEAD)" -ge 1
          test -z "$(git rev-list --merges "$SOURCE_BASE_SHA"..HEAD)"
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          npm ci
          npm run check:cp6
          python -m py_compile scripts/cp6_v2620aa_runtime.py scripts/cp6_v2620aa_install_qualification.py scripts/cp6_v2620aa_rollback_guards.py
          python -m py_compile scripts/cp6_v2620ab_runtime.py scripts/cp6_v2620ab_install_qualification.py scripts/cp6_v2620ab_rollback_guards.py scripts/cp6_v2620ab_audit_wave.py scripts/cp6_v2620ab_proof.py
          python -m py_compile scripts/cp6_aa_invoice_partial_audit.py scripts/cp6_aa_revocation_audit.py scripts/cp6_aa_midnight_audit.py
          python -m py_compile scripts/cp6_v2620ac_temporal_spec.py scripts/cp6_v2620ac_build_sql.py scripts/cp6_v2620ac_runtime.py scripts/cp6_v2620ac_static_qualification.py scripts/cp6_v2620ac_install_qualification.py scripts/cp6_v2620ac_invoice_partial_regression.py scripts/cp6_v2620ac_linked_lifecycle_regression.py scripts/cp6_v2620ac_operational_clock_regression.py scripts/cp6_v2620ac_revocation_regression.py scripts/cp6_v2620ac_maintenance_schedules.py scripts/cp6_v2620ac_rollback_guards.py scripts/cp6_v2620ac_proof.py
          PYTHONPATH=scripts python scripts/cp6_v2620ac_static_qualification.py
          cc -std=c11 -shared -fPIC -O2 -Wall -Wextra -Werror supabase/tests/support/cp6_clock_offset.c -o /tmp/cp6-aa-clock.so
          python -m py_compile scripts/cp6_v2620z_runtime.py scripts/cp6_v2620z_install_qualification.py scripts/cp6_v2620z_rollback_guards.py scripts/cp6_z_expanded_integrity_audit.py
          npm run check:cp6:counterexamples
          npm run check:backend
          npm run check:access
          node --check scripts/cp5_auth_permission_e2e.mjs
          node --check scripts/cp6_auth_permission_e2e.mjs
          python -m py_compile scripts/cp5_bs_resolution_concurrency.py
          python -m py_compile scripts/cp6_laundry_qc_concurrency.py
          python -m py_compile scripts/cp6_reversal_concurrency_matrix.py
          python -m py_compile scripts/cp6_workspace_operator_load.py
          python -m py_compile scripts/cp6_v2620c_live_rollback_race.py
          python -m py_compile scripts/cp6_v2620e_counterexample_regression.py
          python -m py_compile scripts/cp6_v2620f_final_runtime_regression.py
          python -m py_compile scripts/cp6_v2620g_independent_regression.py scripts/cp6_v2620g_rollback_guards.py scripts/cp6_v2620g_expanded_rollback_races.py
          python -m py_compile scripts/cp6_preuse_rollback_maintenance.py scripts/cp6_preuse_rollback_maintenance_unit.py scripts/cp6_v2620h_adversarial_regression.py scripts/cp6_v2620h_maintenance_rollback_matrix.py scripts/cp6_v2620h_rollback_guards.py scripts/cp6_v2620i_h2_audit_regression.py scripts/cp6_v2620i_rollback_guards.py scripts/cp6_v2620j_payment_fact_regression.py scripts/cp6_v2620j_rollback_guards.py
          python -m py_compile scripts/cp6_v2620n_runtime.py scripts/cp6_v2620n_supplier_cent_regression.py scripts/cp6_v2620n_rollback_guards.py scripts/cp6_v2620o_runtime.py scripts/cp6_v2620o_supplier_return_regression.py scripts/cp6_v2620o_rollback_guards.py
          python -m py_compile scripts/cp6_v2620t_runtime.py scripts/cp6_v2620t_material_adjustment_revaluation_regression.py scripts/cp6_v2620t_rollback_guards.py scripts/cp6_v2620t_material_adjustment_races.py
          python -m py_compile scripts/cp6_v2620u_runtime.py scripts/cp6_v2620u_canonical_business_date_regression.py scripts/cp6_v2620u_rollback_guards.py
          python -m py_compile scripts/cp6_v2620y_runtime.py scripts/cp6_v2620y_cash_business_date_regression.py scripts/cp6_v2620y_install_qualification.py scripts/cp6_v2620y_rollback_guards.py scripts/cp6_x_independent_audit.py
          python -m py_compile scripts/package_cp6_native_evidence.py
          python -m py_compile scripts/cp6_v_failed159_recovery.py
          python scripts/cp6_v_failed159_recovery.py --unit
          python -m py_compile scripts/cp6_v2620v_runtime.py scripts/cp6_v2620v_misc_finance_business_date_regression.py scripts/cp6_v2620v_misc_finance_races.py scripts/cp6_v2620v_rollback_guards.py
          python -m py_compile scripts/cp6_v2620w_runtime.py scripts/cp6_v2620w_scrap_business_date_regression.py scripts/cp6_v2620w_scrap_races.py scripts/cp6_v2620w_rollback_guards.py
          python -m py_compile scripts/cp6_v2620s_runtime.py scripts/cp6_v2620s_supplier_payment_business_date_regression.py scripts/cp6_v2620s_rollback_guards.py
          python -m py_compile scripts/cp6_v2620r_runtime.py scripts/cp6_v2620r_receipt_invoice_dependency_regression.py scripts/cp6_v2620r_rollback_guards.py scripts/cp6_v2620r_receipt_invoice_races.py
          python -m py_compile scripts/cp6_v2620q_runtime.py scripts/cp6_v2620q_supplier_invoice_exact_quantity_regression.py scripts/cp6_v2620q_rollback_guards.py
          python -m py_compile scripts/cp6_v2620p_runtime.py scripts/cp6_v2620p_supplier_return_match_state_regression.py scripts/cp6_v2620p_rollback_guards.py
          bash -n scripts/run_cp6_v2620f_live_rollback_races.sh
          npx playwright test --list --config playwright.cp5.config.ts
          npx playwright test --list --config playwright.cp6.config.ts
          npx playwright test tests/browser/cutting-bridge.spec.ts --list
          git diff --check "$SOURCE_BASE_SHA" "$GITHUB_SHA"
          printf 'branch=%s\nhead=%s\nparent=%s\nbase=%s\nbase_tree=%s\nremote_head=%s\ncommit_count=%s\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(git rev-parse HEAD^)" "$SOURCE_BASE_SHA" "$SOURCE_BASE_TREE" "$remote_head" \
            "$(git rev-list --count "$SOURCE_BASE_SHA"..HEAD)" | tee cp6-proof/IDENTITY.txt

      - name: Set up Python and PostgreSQL client
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ca-certificates curl gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          key_fingerprint="$(gpg --show-keys --with-colons \
