      - name: Prove v2.6.20b rollback refuses post-use and serializes with an in-flight writer
        shell: bash
        run: |
          set -euo pipefail
          set +e
          psql "$PGURL" -v ON_ERROR_STOP=1 <<'SQL' > cp6-proof/V2620B_ROLLBACK_POST_USE_REJECTION.log 2>&1
          begin;
          insert into erp.idempotency_requests(
            actor_key,operation_name,client_request_id,request_hash
          ) values(
            'cp6-v2620b-rollback-proof','cp6_laundry_qc_action_v1:post_delivery',
            'c7fb0000-0000-4000-8000-000000000001','synthetic-post-use-proof'
          );
          \i supabase/rollbacks/20260905170334_erp_v2_6_20b_cp6_reaudit_reliability_closure.rollback.sql
          SQL
          rollback_status=$?
          set -e
          test "$rollback_status" -ne 0
          grep -F 'v2.6.20b rollback refused: post-install business/HPP history exists' \
            cp6-proof/V2620B_ROLLBACK_POST_USE_REJECTION.log >/dev/null
          test "$(psql "$PGURL" -At -c "select count(*) from erp.idempotency_requests where client_request_id='c7fb0000-0000-4000-8000-000000000001'")" = '0'

          python - <<'PY' 2>&1 | tee cp6-proof/V2620B_ROLLBACK_CONCURRENCY.log
          import json
          import os
          import subprocess
          import threading
          import time
          from pathlib import Path

          import psycopg

          pgurl=os.environ['PGURL']
          request_id='c7fb0000-0000-4000-8000-000000000002'
          ready=threading.Event()
          holder={}

          def writer():
              try:
                  with psycopg.connect(pgurl,application_name='cp6-v2620b-rollback-holder') as conn:
                      with conn.cursor() as cur:
                          cur.execute('select pg_backend_pid()')
                          holder['pid']=cur.fetchone()[0]
                          cur.execute(
                              '''insert into erp.idempotency_requests(
                                   actor_key,operation_name,client_request_id,request_hash
                                 ) values(%s,%s,%s::uuid,%s)''',
                              ('cp6-v2620b-concurrent-rollback-proof',
                               'cp6_laundry_qc_action_v1:post_delivery',request_id,
                               'synthetic-in-flight-rollback-proof'),
                          )
                          ready.set()
                          time.sleep(1.5)
                      conn.commit()
                  holder['status']='PASS'
              except Exception as exc:
                  holder['status']='FAIL'
                  holder['error']=str(exc)
                  ready.set()

          thread=threading.Thread(target=writer,daemon=True)
          thread.start()
          if not ready.wait(timeout=10):
              raise RuntimeError('v20b rollback holder never acquired its write lock')
          env={**os.environ,'PGAPPNAME':'cp6-v2620b-rollback-waiter'}
          started=time.monotonic()
          rollback=subprocess.Popen(
              ['psql',pgurl,'-v','ON_ERROR_STOP=1','-f',
               'supabase/rollbacks/20260905170334_erp_v2_6_20b_cp6_reaudit_reliability_closure.rollback.sql'],
              text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,env=env,
          )
          blocker_observed=False
          waiter_pid=None
          deadline=time.monotonic()+1.4
          while time.monotonic()<deadline and rollback.poll() is None:
              with psycopg.connect(pgurl) as probe, probe.cursor() as cur:
                  cur.execute("select pid from pg_stat_activity where application_name='cp6-v2620b-rollback-waiter'")
                  row=cur.fetchone()
                  if row:
                      waiter_pid=row[0]
                      cur.execute('select pg_blocking_pids(%s)',(waiter_pid,))
                      if holder.get('pid') in cur.fetchone()[0]:
                          blocker_observed=True
                          break
              time.sleep(0.025)
          stdout,stderr=rollback.communicate(timeout=30)
          elapsed=time.monotonic()-started
          thread.join(timeout=10)
          if thread.is_alive() or holder.get('status')!='PASS':
              raise RuntimeError(f'v20b rollback holder failed: {holder}')
          combined=stdout+stderr
          if rollback.returncode==0 or not blocker_observed:
              raise RuntimeError(
                  f'v20b rollback did not wait/refuse: rc={rollback.returncode}, '
                  f'blocker={blocker_observed}, output={combined}'
              )
          if 'v2.6.20b rollback refused: post-install business/HPP history exists' not in combined:
              raise RuntimeError(f'v20b rollback returned wrong refusal: {combined}')
          with psycopg.connect(pgurl) as conn, conn.cursor() as cur:
              cur.execute('delete from erp.idempotency_requests where client_request_id=%s::uuid',(request_id,))
              conn.commit()
          report={
              'status':'PASS','holder_pid':holder['pid'],'waiter_pid':waiter_pid,
              'pg_blocking_pids_observed':blocker_observed,
              'rollback_waited_seconds':round(elapsed,3),'rollback_refused':True,
              'test_marker_removed':True,'production_go':False,
          }
          Path('cp6-proof/V2620B_ROLLBACK_CONCURRENCY.json').write_text(
              json.dumps(report,indent=2,sort_keys=True)+'\n',encoding='utf8'
          )
          print(json.dumps(report,sort_keys=True))
          PY
          test "$(psql "$PGURL" -At -c "select count(*) from erp.idempotency_requests where client_request_id='c7fb0000-0000-4000-8000-000000000002'")" = '0'
          test "$(psql "$PGURL" -At -c "select count(*) from erp.schema_migrations where version='v2.6.20b'")" = '1'

