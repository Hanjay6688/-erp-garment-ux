name: CP7 Completed Native Artifact Projection
'on':
  push:
    branches:
      - cp7/integration
    paths:
      - docs/cp7/MERGE_QUALIFICATION_REQUEST.json
      - scripts/cp7_native_artifact_projection.py
      - scripts/cp7_native_artifact_projection_test.py
      - scripts/cp7_verify_retained_originals.py
      - scripts/cp7_verify_retained_originals_test.py
      - docs/cp7/native284_artifact_projection.json
      - docs/cp7/native152_artifact_projection.json
      - docs/cp7/native152_first_v2_source_projection.json
      - docs/cp7/native152_v2_source_qualified_projection.json
      - docs/cp7/native284_latest_qualified_artifact_projection.json
      - docs/cp7/native40_incomplete_artifact_projection.json
      - docs/cp7/native_cutting_observation44_artifact_projection.json
      - docs/cp7/native_cutting_model53_artifact_projection.json
      - .github/workflows/cp7-native-artifact-projection.yml
permissions:
  contents: read
  actions: read
jobs:
  retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Retain completed Native reports and every member hash without ERP access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/cp7_native_artifact_projection_test.py
          python scripts/cp7_native_artifact_projection.py docs/cp7/native284_artifact_projection.json cp7-proof/native284
          python scripts/cp7_native_artifact_projection.py docs/cp7/native152_artifact_projection.json cp7-proof/native152
          python scripts/cp7_native_artifact_projection.py docs/cp7/native152_first_v2_source_projection.json cp7-proof/native152-first-v2-source
          python scripts/cp7_native_artifact_projection.py docs/cp7/native152_v2_source_qualified_projection.json cp7-proof/native152-v2-source-qualified
          python scripts/cp7_native_artifact_projection.py docs/cp7/native284_latest_qualified_artifact_projection.json cp7-proof/native284-qualified-current
          python scripts/cp7_native_artifact_projection.py docs/cp7/native40_incomplete_artifact_projection.json cp7-proof/native40-incomplete3c
          python scripts/cp7_native_artifact_projection.py docs/cp7/native_cutting_observation44_artifact_projection.json cp7-proof/cutting-observation44-qualified3c
          python scripts/cp7_native_artifact_projection.py docs/cp7/native_cutting_model53_artifact_projection.json cp7-proof/cutting-model53-qualified3c
      - name: Verify qualified Original roots, case identities and exact source pins
        run: |
          python scripts/cp7_verify_retained_originals_test.py
          python scripts/cp7_verify_retained_originals.py cp7-proof/native152 --manifest docs/cp7/native152_artifact_projection.json --projection-head "$GITHUB_SHA"
          python scripts/cp7_verify_retained_originals.py cp7-proof/native152-v2-source-qualified --manifest docs/cp7/native152_v2_source_qualified_projection.json --projection-head "$GITHUB_SHA"
          python scripts/cp7_verify_retained_originals.py cp7-proof/native284-qualified-current --manifest docs/cp7/native284_latest_qualified_artifact_projection.json --projection-head "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cp7-native284-exact-original-reports
          path: cp7-proof/
          if-no-files-found: error
          retention-days: 90
