name: CP7 Completed Native Artifact Projection
'on':
  push:
    branches:
      - cp7/integration
      - claude/new-session-deapao
    paths:
      - scripts/cp7_native_artifact_projection.py
      - docs/cp7/native284_artifact_projection.json
      - docs/cp7/native152_artifact_projection.json
      - docs/cp7/native284_latest_qualified_artifact_projection.json
      - docs/cp7/native40_incomplete_artifact_projection.json
      - docs/cp7/native_cutting_observation44_artifact_projection.json
      - docs/cp7/native_cutting_model53_artifact_projection.json
      - .github/workflows/cp7-native-artifact-projection.yml
permissions:
  contents: read
  actions: read
jobs:
  retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Retain completed Native reports and every member hash without ERP access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/cp7_native_artifact_projection.py docs/cp7/native284_artifact_projection.json cp7-proof/native284
          python scripts/cp7_native_artifact_projection.py docs/cp7/native152_artifact_projection.json cp7-proof/native152
          python scripts/cp7_native_artifact_projection.py docs/cp7/native284_latest_qualified_artifact_projection.json cp7-proof/native284-qualified13b
          python scripts/cp7_native_artifact_projection.py docs/cp7/native40_incomplete_artifact_projection.json cp7-proof/native40-incomplete3c
          python scripts/cp7_native_artifact_projection.py docs/cp7/native_cutting_observation44_artifact_projection.json cp7-proof/cutting-observation44-qualified3c
          python scripts/cp7_native_artifact_projection.py docs/cp7/native_cutting_model53_artifact_projection.json cp7-proof/cutting-model53-qualified3c
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cp7-native284-exact-original-reports
          path: cp7-proof/
          if-no-files-found: error
          retention-days: 90
