name: CP7 Choice Preparation Recovery Real Browser6
'on':
  push:
    branches: [astra/d17-14-produksi]
    paths:
      - scripts/cp7_frozen_choice_preparation/client/**
      - scripts/cp7_frozen_choice_ui/client/**
      - scripts/cp7_frozen_analysis_facade_v2/client/nativeFrozenWait.ts
      - scripts/cp7_ow12b_choice_preparation_browser.mjs
      - .github/workflows/cp7-ow12b-choice-preparation-browser.yml
      - docs/cp7/d17-14/ow12b/CHOICE_PREPARATION_BROWSER6_CONTRACT.json
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: cp7-choice-preparation-browser-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit -p scripts/cp7_frozen_choice_preparation/client/tsconfig.json
      - run: npx vitest run scripts/cp7_frozen_choice_preparation/client scripts/cp7_frozen_choice_ui/client scripts/cp7_frozen_analysis_choice_v2/client
      - name: Actual prepared UI recovery with controlled identity and HTTP RPC
        run: node scripts/cp7_ow12b_choice_preparation_browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: choice-preparation-browser6-complete-original
          path: cp6-proof/t3/CHOICE_PREPARATION_BROWSER6.json
          if-no-files-found: error
          retention-days: 30
