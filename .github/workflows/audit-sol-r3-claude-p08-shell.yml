name: AUDIT/Sol/claude-p08-shell
permissions:
  contents: read
concurrency:
  group: audit-sol-r3-claude-p08-shell-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ 'b53b5acdf260b03ebac3474e9ae837fcef6f6eb1' }}
        fetch-depth: 0
        persist-credentials: false
    - name: Sol record exact candidate and product trees
      run: "python3 - <<'SOL_IDENTITY'\nimport json,os,pathlib,subprocess,hashlib\nsha='b53b5acdf260b03ebac3474e9ae837fcef6f6eb1'\npaths=['.']\nitems=[]\nfor p in paths:\n r=pathlib.Path(p)\n g=lambda *a:subprocess.check_output(['git','-C',str(r),*a],text=True).strip()\n head=g('rev-parse','HEAD')\n # T3 intentionally keeps an inherited frozen UI checkout in its browser phase; actual identity remains visible.\n items.append(dict(path=p,head=head,tree=g('rev-parse','HEAD^{tree}'),candidate_exact=head==sha,product_trees={q:g('rev-parse','HEAD:'+q)for q in ['src','supabase/release','supabase/migrations','scripts/cp7-src','supabase/dev']},tracked_product_diff=g('diff','--name-only','--','src','scripts/cp7-src','supabase/release','supabase/migrations','supabase/dev'),lock_sha256=hashlib.sha256((r/'package-lock.json').read_bytes()).hexdigest()))\nout=dict(candidate_sha=sha,workflow_sha=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],attempt=os.environ['GITHUB_RUN_ATTEMPT'],suite='claude-p08-shell',checkouts=items,evidence_origin='INDEPENDENT_NATIVE_RERUN',oracle_origin='WRITER_OR_INHERITED_DECLARED',fixture_origin='PUBLIC_REPO_SYNTHETIC')\n\
        p=pathlib.Path(os.environ['RUNNER_TEMP'])/'sol-proof';p.mkdir(exist_ok=True);(p/'IDENTITY.json').write_text(json.dumps(out,indent=2)+'\\n');print(json.dumps(out))\nassert any(x['candidate_exact']for x in items) or 'claude-p08-shell'=='cp6-t3-release-package'\nSOL_IDENTITY"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
        cache: npm
    - run: npm ci
    - run: python3 scripts/cp7_contract_receipt.py
    - run: python3 scripts/cp7_native_fixture_window_test.py
    - run: python3 scripts/cp7_probe_evidence_test.py
    - run: python3 scripts/cp6_auditor_business_day_test.py
    - run: python3 scripts/cp6_auditor_runner_difference_test.py
    - run: node scripts/cp6_auditor_business_day_test.mjs
    - name: P19 browser loading boundary controls
      run: node scripts/cp7_p19_browser_latency_test.mjs
    - name: Verify complete Original retention and corruption controls
      run: python3 scripts/cp7_integration_originals_test.py
    - run: npm test
    - run: npm run test:security
    - run: npm run build
    - run: npx --no-install playwright install --with-deps chromium
    - run: npx --no-install playwright test --config playwright.cp7.config.ts
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cp17-r3-Sol-b53b5acd-cp7-shell-proof
        path: test-results/cp7-shell-proof
        if-no-files-found: warn
        retention-days: 30
    - name: Sol preserve audit identity
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cp17-r3-Sol-b53b5acd-claude-p08-shell-${{ github.job }}-${{ strategy.job-index }}-identity
        path: ${{ runner.temp }}/sol-proof
        retention-days: 30
        if-no-files-found: warn
  p19-assembly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ 'b53b5acdf260b03ebac3474e9ae837fcef6f6eb1' }}
        fetch-depth: 0
        persist-credentials: false
    - name: Sol record exact candidate and product trees
      run: "python3 - <<'SOL_IDENTITY'\nimport json,os,pathlib,subprocess,hashlib\nsha='b53b5acdf260b03ebac3474e9ae837fcef6f6eb1'\npaths=['.']\nitems=[]\nfor p in paths:\n r=pathlib.Path(p)\n g=lambda *a:subprocess.check_output(['git','-C',str(r),*a],text=True).strip()\n head=g('rev-parse','HEAD')\n # T3 intentionally keeps an inherited frozen UI checkout in its browser phase; actual identity remains visible.\n items.append(dict(path=p,head=head,tree=g('rev-parse','HEAD^{tree}'),candidate_exact=head==sha,product_trees={q:g('rev-parse','HEAD:'+q)for q in ['src','supabase/release','supabase/migrations','scripts/cp7-src','supabase/dev']},tracked_product_diff=g('diff','--name-only','--','src','scripts/cp7-src','supabase/release','supabase/migrations','supabase/dev'),lock_sha256=hashlib.sha256((r/'package-lock.json').read_bytes()).hexdigest()))\nout=dict(candidate_sha=sha,workflow_sha=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],attempt=os.environ['GITHUB_RUN_ATTEMPT'],suite='claude-p08-shell',checkouts=items,evidence_origin='INDEPENDENT_NATIVE_RERUN',oracle_origin='WRITER_OR_INHERITED_DECLARED',fixture_origin='PUBLIC_REPO_SYNTHETIC')\n\
        p=pathlib.Path(os.environ['RUNNER_TEMP'])/'sol-proof';p.mkdir(exist_ok=True);(p/'IDENTITY.json').write_text(json.dumps(out,indent=2)+'\\n');print(json.dumps(out))\nassert any(x['candidate_exact']for x in items) or 'claude-p08-shell'=='cp6-t3-release-package'\nSOL_IDENTITY"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
        cache: npm
    - run: npm ci
    - run: npx --no-install vitest run tests/cp7/families/f05-assembly.test.ts tests/cp7/families/f05-timeline.test.ts tests/cp7/families/f05-kernel-maps.test.ts tests/cp7/families/f05-report-render.test.ts tests/cp7/families/f04-demand-history-linear.test.ts tests/cp7/families/f04-history-build-linear.test.ts tests/cp7/families/f04-demand-estimate-rounding.test.ts tests/cp7/families/f04-schedule-scenario-linear.test.ts tests/cp7/families/f04-wip-normalize-linear.test.ts tests/cp7/families/f04-netting-linear.test.ts tests/cp7/families/f04-allocation-linear.test.ts tests/cp7/families/f04-baseline-build-linear.test.ts tests/cp7/families/f04-supply-exhausted.test.ts tests/cp7/families/f04-supply-proofs.test.ts tests/cp7/families/f04-model-knowledge-cutoff.test.ts
    - run: node scripts/cp7_p19_assembly_benchmark.mjs test-results/cp7-shell-proof/P19_ASSEMBLY_KERNEL.json
    - run: node scripts/cp7_p19_report_render_benchmark.mjs test-results/cp7-shell-proof/P19_REPORT_RENDER_KERNEL.json
    - run: node scripts/cp7_p19_demand_history_benchmark.mjs test-results/cp7-shell-proof/P19_DEMAND_HISTORY_KERNEL.json
    - run: node scripts/cp7_p19_schedule_benchmark.mjs test-results/cp7-shell-proof/P19_SCHEDULE_SCENARIO_KERNEL.json
    - run: node scripts/cp7_p19_wip_normalize_benchmark.mjs test-results/cp7-shell-proof/P19_WIP_NORMALIZE_KERNEL.json
    - run: node scripts/cp7_p19_netting_benchmark.mjs test-results/cp7-shell-proof/P19_NETTING_KERNEL.json
    - run: node scripts/cp7_p19_allocation_benchmark.mjs test-results/cp7-shell-proof/P19_ALLOCATION_KERNEL.json
    - run: node scripts/cp7_p19_baseline_benchmark.mjs test-results/cp7-shell-proof/P19_BASELINE_BUILD_KERNEL.json
    - run: node scripts/cp7_pl8_exhausted_benchmark.mjs test-results/cp7-shell-proof/PL8_EXHAUSTED_CLASSIFICATION.json
    - run: node scripts/cp7_pl8_proof_benchmark.mjs test-results/cp7-shell-proof/PL8_EXHAUSTION_PROOFS.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cp17-r3-Sol-b53b5acd-cp7-p19-assembly
        path: 'test-results/cp7-shell-proof/P19_*_KERNEL.json

          test-results/cp7-shell-proof/PL8_*.json

          '
        if-no-files-found: warn
        retention-days: 30
    - name: Sol preserve audit identity
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cp17-r3-Sol-b53b5acd-claude-p08-shell-${{ github.job }}-${{ strategy.job-index }}-identity
        path: ${{ runner.temp }}/sol-proof
        retention-days: 30
        if-no-files-found: warn
  p19-staged:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ 'b53b5acdf260b03ebac3474e9ae837fcef6f6eb1' }}
        fetch-depth: 0
        persist-credentials: false
    - name: Sol record exact candidate and product trees
      run: "python3 - <<'SOL_IDENTITY'\nimport json,os,pathlib,subprocess,hashlib\nsha='b53b5acdf260b03ebac3474e9ae837fcef6f6eb1'\npaths=['.']\nitems=[]\nfor p in paths:\n r=pathlib.Path(p)\n g=lambda *a:subprocess.check_output(['git','-C',str(r),*a],text=True).strip()\n head=g('rev-parse','HEAD')\n # T3 intentionally keeps an inherited frozen UI checkout in its browser phase; actual identity remains visible.\n items.append(dict(path=p,head=head,tree=g('rev-parse','HEAD^{tree}'),candidate_exact=head==sha,product_trees={q:g('rev-parse','HEAD:'+q)for q in ['src','supabase/release','supabase/migrations','scripts/cp7-src','supabase/dev']},tracked_product_diff=g('diff','--name-only','--','src','scripts/cp7-src','supabase/release','supabase/migrations','supabase/dev'),lock_sha256=hashlib.sha256((r/'package-lock.json').read_bytes()).hexdigest()))\nout=dict(candidate_sha=sha,workflow_sha=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],attempt=os.environ['GITHUB_RUN_ATTEMPT'],suite='claude-p08-shell',checkouts=items,evidence_origin='INDEPENDENT_NATIVE_RERUN',oracle_origin='WRITER_OR_INHERITED_DECLARED',fixture_origin='PUBLIC_REPO_SYNTHETIC')\n\
        p=pathlib.Path(os.environ['RUNNER_TEMP'])/'sol-proof';p.mkdir(exist_ok=True);(p/'IDENTITY.json').write_text(json.dumps(out,indent=2)+'\\n');print(json.dumps(out))\nassert any(x['candidate_exact']for x in items) or 'claude-p08-shell'=='cp6-t3-release-package'\nSOL_IDENTITY"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
        cache: npm
    - run: npm ci
    - run: npx --no-install vitest run tests/cp7/families/f05-staged-analysis.test.ts tests/cp7/families/f05-staged-scenario.test.ts tests/cp7/families/f05-staged-pages.test.ts tests/cp7/families/f05-staged-api.test.ts tests/cp7/families/f05-analysis-jobs.test.ts --maxWorkers=1
    - name: Measure all 5,000 targets with the real product kernels
      env:
        CP7_P19_STAGED: 1000x30,5000x30,5000x100
        CP7_P19_SINGLE: '1'
      run: node scripts/cp7_p19_staged_benchmark.mjs test-results/cp7-shell-proof/P19_STAGED_ANALYSIS_KERNEL.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cp17-r3-Sol-b53b5acd-cp7-p19-staged
        path: test-results/cp7-shell-proof/P19_STAGED_ANALYSIS_KERNEL.json
        if-no-files-found: warn
        retention-days: 30
    - name: Sol preserve audit identity
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cp17-r3-Sol-b53b5acd-claude-p08-shell-${{ github.job }}-${{ strategy.job-index }}-identity
        path: ${{ runner.temp }}/sol-proof
        retention-days: 30
        if-no-files-found: warn
  codeql:
    name: CP7 CodeQL ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language:
        - javascript-typescript
        - actions
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ 'b53b5acdf260b03ebac3474e9ae837fcef6f6eb1' }}
        persist-credentials: false
        fetch-depth: 0
    - name: Sol record exact candidate and product trees
      run: "python3 - <<'SOL_IDENTITY'\nimport json,os,pathlib,subprocess,hashlib\nsha='b53b5acdf260b03ebac3474e9ae837fcef6f6eb1'\npaths=['.']\nitems=[]\nfor p in paths:\n r=pathlib.Path(p)\n g=lambda *a:subprocess.check_output(['git','-C',str(r),*a],text=True).strip()\n head=g('rev-parse','HEAD')\n # T3 intentionally keeps an inherited frozen UI checkout in its browser phase; actual identity remains visible.\n items.append(dict(path=p,head=head,tree=g('rev-parse','HEAD^{tree}'),candidate_exact=head==sha,product_trees={q:g('rev-parse','HEAD:'+q)for q in ['src','supabase/release','supabase/migrations','scripts/cp7-src','supabase/dev']},tracked_product_diff=g('diff','--name-only','--','src','scripts/cp7-src','supabase/release','supabase/migrations','supabase/dev'),lock_sha256=hashlib.sha256((r/'package-lock.json').read_bytes()).hexdigest()))\nout=dict(candidate_sha=sha,workflow_sha=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],attempt=os.environ['GITHUB_RUN_ATTEMPT'],suite='claude-p08-shell',checkouts=items,evidence_origin='INDEPENDENT_NATIVE_RERUN',oracle_origin='WRITER_OR_INHERITED_DECLARED',fixture_origin='PUBLIC_REPO_SYNTHETIC')\n\
        p=pathlib.Path(os.environ['RUNNER_TEMP'])/'sol-proof';p.mkdir(exist_ok=True);(p/'IDENTITY.json').write_text(json.dumps(out,indent=2)+'\\n');print(json.dumps(out))\nassert any(x['candidate_exact']for x in items) or 'claude-p08-shell'=='cp6-t3-release-package'\nSOL_IDENTITY"
    - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        queries: security-extended
    - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63
      with:
        output: cp7-codeql
        upload: never
        upload-database: false
    - name: Reject CodeQL findings or incomplete runs
      run: "python3 - <<'PY'\nimport json, pathlib\nfiles = list(pathlib.Path('cp7-codeql').glob('*.sarif'))\nassert files, 'No SARIF produced'\nfor f in files:\n    report = json.loads(f.read_text())\n    assert report.get('runs'), 'No analysis runs'\n    for run in report['runs']:\n        assert not run.get('results'), 'CodeQL findings need review'\n        assert run.get('invocations'), 'No invocation evidence'\n        for invocation in run['invocations']:\n            assert invocation.get('executionSuccessful') is True, 'Incomplete CodeQL'\nprint('CodeQL completed with zero findings')\nPY\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cp17-r3-Sol-b53b5acd-cp7-codeql-${{ matrix.language }}
        path: cp7-codeql
        if-no-files-found: error
        retention-days: 30
    - name: Sol preserve audit identity
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cp17-r3-Sol-b53b5acd-claude-p08-shell-${{ github.job }}-${{ strategy.job-index }}-identity
        path: ${{ runner.temp }}/sol-proof
        retention-days: 30
        if-no-files-found: warn
run-name: AUDIT/cp17-r3/Sol/b53b5acd/claude-p08-shell/1
'on':
  push:
    branches:
    - audit/sol-cp1-7-r3-b53b5acd-20261017
    paths:
    - .github/workflows/audit-sol-r3-claude-p08-shell.yml
  workflow_dispatch: {}
