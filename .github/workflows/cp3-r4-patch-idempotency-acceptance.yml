name: CP3 R4 Patch Rollback Residue Assertion

on:
  push:
    branches:
      - cp3/hpp-attendance-sewing-terminal-r4-20260901
    paths:
      - '.github/workflows/cp3-r4-patch-idempotency-acceptance.yml'

permissions:
  contents: write

concurrency:
  group: cp3-r4-patch-rollback-residue-assertion
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cp3/hpp-attendance-sewing-terminal-r4-20260901
          fetch-depth: 0

      - name: Replace formatting-dependent rollback residue grep
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          workflow_path = Path('.github/workflows/cp3-r4-full-schema-validation.yml')
          source = workflow_path.read_text()
          old = "          grep -F '\"status\" : \"PASS\"' cp3-r4-proof/r4-rollback-residue.json >/dev/null\n"
          new = (
              "          python - <<'PY'\n"
              "          import json\n"
              "          from pathlib import Path\n"
              "          residue=json.loads(Path('cp3-r4-proof/r4-rollback-residue.json').read_text())\n"
              "          assert residue['status']=='PASS', residue\n"
              "          assert residue['migration_marker'] is False, residue\n"
              "          assert residue['capsule'] is None, residue\n"
              "          assert residue['private_reverse'] is None, residue\n"
              "          assert residue['active_pool_helper'] is None, residue\n"
              "          PY\n"
          )

          count = source.count(old)
          if count != 1:
              raise SystemExit(f'rollback residue grep anchor expected once, found {count}')
          source = source.replace(old, new, 1)
          if "grep -F '\"status\" : \"PASS\"'" in source:
              raise SystemExit('formatting-dependent residue grep remains')
          workflow_path.write_text(source)

          manifest_path = Path('docs/evidence/cp3_r4_source_hashes.json')
          manifest = json.loads(manifest_path.read_text())
          raw = workflow_path.read_bytes()
          manifest['files'][workflow_path.as_posix()] = {
              'bytes': len(raw),
              'sha256': hashlib.sha256(raw).hexdigest(),
          }
          manifest['last_workflow_harness_patch'] = {
              'scope': 'CP3 R4 source-only full-schema rollback proof',
              'defect': 'compact jsonb output passed semantically but failed spacing-dependent grep',
              'fix': 'parse rollback residue JSON and assert every residue field explicitly',
              'business_runtime_changed': False,
              'uat_applied': False,
              'legacy_mutated': False,
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')

          print(json.dumps({
              'status': 'PASS',
              'patched': workflow_path.as_posix(),
              'bytes': len(raw),
              'sha256': hashlib.sha256(raw).hexdigest(),
          }, sort_keys=True))
          PY

          git diff --check
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path('docs/evidence/cp3_r4_source_hashes.json').read_text())
          failures = []
          for path, expected in manifest['files'].items():
              raw = Path(path).read_bytes()
              if len(raw) != expected['bytes'] or hashlib.sha256(raw).hexdigest() != expected['sha256']:
                  failures.append(path)
          if failures:
              raise SystemExit(f'fixed-source manifest mismatch after rollback assertion repair: {failures}')
          print(json.dumps({'status': 'PASS', 'manifest_entries': len(manifest['files'])}, sort_keys=True))
          PY

      - name: Commit exact rollback proof repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/cp3-r4-full-schema-validation.yml docs/evidence/cp3_r4_source_hashes.json
          git commit -m 'test(cp3): parse rollback residue semantically'
          git push origin HEAD:cp3/hpp-attendance-sewing-terminal-r4-20260901
