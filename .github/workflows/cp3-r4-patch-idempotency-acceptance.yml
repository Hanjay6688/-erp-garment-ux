name: CP3 R4 Patch Policy Lock Order

on:
  push:
    branches:
      - cp3/hpp-attendance-sewing-terminal-r4-20260901
    paths:
      - '.github/workflows/cp3-r4-patch-idempotency-acceptance.yml'

permissions:
  contents: write

concurrency:
  group: cp3-r4-patch-policy-lock-order
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cp3/hpp-attendance-sewing-terminal-r4-20260901
          fetch-depth: 0

      - name: Remove contractor-row versus advisory-lock inversion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          migration_path = Path('supabase/migrations/20260901023400_erp_v2_6_14d_cp3_r4_race_and_reversal_hardening.sql')
          source = migration_path.read_text()

          old = """-- 2. Policy change after ACTIVE pool: lock is already held by the R3 setter;
-- check the exact new effective slice after next-version boundary is known.
select pg_temp.cp3_r4_replace_function(
"""
          new = """-- 2. Policy mutation lock-order hardening. Activation takes the contractor
-- advisory lock before post_journal() requests a foreign-key KEY SHARE lock on
-- erp.contractors. The setter must therefore take the same advisory lock before
-- locking the contractor row, otherwise activation-vs-policy can deadlock.
select pg_temp.cp3_r4_replace_function(
  'set_contractor_hpp_policy_v1',
  $anchor$  select * into v_contractor
  from erp.contractors
  where id = v_contractor_id
  for update;$anchor$,
  $patch$  perform pg_advisory_xact_lock(hashtextextended('CONTRACTOR_HPP_POLICY|' || v_contractor_id::text, 0));

  select * into v_contractor
  from erp.contractors
  where id = v_contractor_id
  for update;$patch$,
  1,1
);

select pg_temp.cp3_r4_replace_function(
  'set_contractor_hpp_policy_v1',
  $anchor$  perform pg_advisory_xact_lock(hashtextextended('CONTRACTOR_HPP_POLICY|' || v_contractor_id::text, 0));

  select * into v_current$anchor$,
  $patch$  select * into v_current$patch$,
  1,1
);

-- 3. Policy change after ACTIVE pool: the contractor advisory lock is now
-- acquired before the contractor row lock; check the exact effective slice
-- after the next-version boundary is known.
select pg_temp.cp3_r4_replace_function(
"""

          count = source.count(old)
          if count != 1:
              raise SystemExit(f'policy lock-order insertion anchor expected once, found {count}')
          source = source.replace(old, new, 1)

          required = [
              'Policy mutation lock-order hardening',
              "$anchor$  select * into v_contractor",
              "$anchor$  perform pg_advisory_xact_lock(hashtextextended('CONTRACTOR_HPP_POLICY|' || v_contractor_id::text, 0));",
              'The setter must therefore take the same advisory lock before',
          ]
          missing = [token for token in required if token not in source]
          if missing:
              raise SystemExit(f'policy lock-order patch incomplete: {missing}')
          if source.count("'set_contractor_hpp_policy_v1',") < 3:
              raise SystemExit('expected lock-order move plus active-pool policy patch')

          migration_path.write_text(source)

          manifest_path = Path('docs/evidence/cp3_r4_source_hashes.json')
          manifest = json.loads(manifest_path.read_text())
          raw = migration_path.read_bytes()
          manifest['files'][migration_path.as_posix()] = {
              'bytes': len(raw),
              'sha256': hashlib.sha256(raw).hexdigest(),
          }
          manifest['last_runtime_patch'] = {
              'scope': 'v2.6.14d source-only candidate',
              'defect': 'activate-vs-policy deadlock from contractor row/advisory lock inversion',
              'fix': 'contractor advisory lock precedes contractor FOR UPDATE in set_contractor_hpp_policy_v1',
              'uat_applied': False,
              'legacy_mutated': False,
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')

          print(json.dumps({
              'status': 'PASS',
              'patched': migration_path.as_posix(),
              'bytes': len(raw),
              'sha256': hashlib.sha256(raw).hexdigest(),
          }, sort_keys=True))
          PY

          git diff --check
          python scripts/test_cp3_render_r4_reviewed_rollback.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path('docs/evidence/cp3_r4_source_hashes.json').read_text())
          failures = []
          for path, expected in manifest['files'].items():
              raw = Path(path).read_bytes()
              if len(raw) != expected['bytes'] or hashlib.sha256(raw).hexdigest() != expected['sha256']:
                  failures.append(path)
          if failures:
              raise SystemExit(f'fixed-source manifest mismatch after runtime lock-order patch: {failures}')
          print(json.dumps({'status': 'PASS', 'manifest_entries': len(manifest['files'])}, sort_keys=True))
          PY

      - name: Commit source-only runtime fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/20260901023400_erp_v2_6_14d_cp3_r4_race_and_reversal_hardening.sql docs/evidence/cp3_r4_source_hashes.json
          git commit -m 'fix(cp3): order policy locks before contractor row lock'
          git push origin HEAD:cp3/hpp-attendance-sewing-terminal-r4-20260901
