name: CP3 R4 Patch Concurrency Assertions

on:
  push:
    branches:
      - cp3/hpp-attendance-sewing-terminal-r4-20260901
    paths:
      - '.github/workflows/cp3-r4-patch-idempotency-acceptance.yml'

permissions:
  contents: write

concurrency:
  group: cp3-r4-patch-concurrency-assertions
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cp3/hpp-attendance-sewing-terminal-r4-20260901
          fetch-depth: 0

      - name: Align real two-connection harness with exact runtime rejection contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          script_path = Path('scripts/cp3_r4_full_schema_concurrency.py')
          source = script_path.read_text()

          replacements = [
              (
                  "        'ACTIVE_ATTENDANCE_HPP_POOL_BLOCKS_PAYROLL_APPROVAL',\n",
                  "        'Cancel the ACTIVE pool first before approving this payroll',\n",
                  1,
                  'activate-vs-approve runtime rejection',
              ),
              (
                  "        'ACTIVE_ATTENDANCE_HPP_POOL_BLOCKS_POLICY_CHANGE',\n",
                  "        'overlaps an ACTIVE attendance HPP pool',\n",
                  1,
                  'activate-vs-policy runtime rejection',
              ),
              (
                  "        'SEWING_TERMINAL_DEPENDENCY',\n",
                  "        'reverse_sewing_terminal_v1() terlebih dahulu',\n",
                  1,
                  'activate-vs-reverse-work runtime rejection',
              ),
              (
                  "                    reverse_result['error'] = str(exc)\n                    reverse_result['status'] = 'EXPECTED_REJECTION' if 'SEWING_TERMINAL_DEPENDENCY' in str(exc) else 'WRONG_ERROR'\n",
                  "                    message = str(exc)\n                    reverse_result['error'] = message\n                    reverse_result['status'] = (\n                        'EXPECTED_REJECTION'\n                        if 'Work completion masih memiliki SELESAI_DIJAHIT aktif' in message\n                        and 'reverse_sewing_terminal_v1() terlebih dahulu' in message\n                        else 'WRONG_ERROR'\n                    )\n",
                  1,
                  'reverse-work-first fail-closed rejection',
              ),
              (
                  "            for index, journal_id in enumerate((pool_journal, payroll_journal), start=1):\n",
                  "            protected = (\n                (pool_journal, 'ATTENDANCE_HPP_POOL'),\n                (payroll_journal, 'PAYROLL_ATTENDANCE_ACCRUAL'),\n            )\n            for index, (journal_id, expected_source_type) in enumerate(protected, start=1):\n",
                  1,
                  'protected journal source-type matrix',
              ),
              (
                  "                    if 'PROTECTED_JOURNAL_REQUIRES_OWNING_LIFECYCLE' not in message:\n                        raise RuntimeError(f'wrong protected reversal error: {message}')\n",
                  "                    if (\n                        f'Protected journal source type {expected_source_type}' not in message\n                        or 'cannot be reversed through generic reverse_journal' not in message\n                    ):\n                        raise RuntimeError(f'wrong protected reversal error: {message}')\n",
                  1,
                  'service-role protected journal rejection',
              ),
          ]

          applied = []
          for old, new, expected_count, label in replacements:
              count = source.count(old)
              if count != expected_count:
                  raise SystemExit(f'{label}: expected {expected_count} exact anchor(s), found {count}')
              source = source.replace(old, new)
              applied.append({'label': label, 'count': count})

          forbidden = [
              'ACTIVE_ATTENDANCE_HPP_POOL_BLOCKS_PAYROLL_APPROVAL',
              'ACTIVE_ATTENDANCE_HPP_POOL_BLOCKS_POLICY_CHANGE',
              "'SEWING_TERMINAL_DEPENDENCY'",
              'PROTECTED_JOURNAL_REQUIRES_OWNING_LIFECYCLE',
          ]
          residue = [token for token in forbidden if token in source]
          if residue:
              raise SystemExit(f'stale concurrency assertion-contract residue remains: {residue}')

          script_path.write_text(source)

          manifest_path = Path('docs/evidence/cp3_r4_source_hashes.json')
          manifest = json.loads(manifest_path.read_text())
          raw = script_path.read_bytes()
          manifest['files'][script_path.as_posix()] = {
              'bytes': len(raw),
              'sha256': hashlib.sha256(raw).hexdigest(),
          }
          manifest['last_concurrency_assertion_alignment'] = {
              'scope': 'harness-only; runtime source unchanged',
              'applied': applied,
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')

          print(json.dumps({
              'status': 'PASS',
              'patched': script_path.as_posix(),
              'bytes': len(raw),
              'sha256': hashlib.sha256(raw).hexdigest(),
              'applied': applied,
          }, sort_keys=True))
          PY

          python -m py_compile scripts/cp3_r4_full_schema_concurrency.py
          git diff --check
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path('docs/evidence/cp3_r4_source_hashes.json').read_text())
          failures = []
          for path, expected in manifest['files'].items():
              raw = Path(path).read_bytes()
              if len(raw) != expected['bytes'] or hashlib.sha256(raw).hexdigest() != expected['sha256']:
                  failures.append(path)
          if failures:
              raise SystemExit(f'fixed-source manifest mismatch after concurrency alignment: {failures}')
          print(json.dumps({'status': 'PASS', 'manifest_entries': len(manifest['files'])}, sort_keys=True))
          PY

      - name: Commit exact concurrency assertion alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/cp3_r4_full_schema_concurrency.py docs/evidence/cp3_r4_source_hashes.json
          git commit -m 'test(cp3): align R4 race assertions with runtime contracts'
          git push origin HEAD:cp3/hpp-attendance-sewing-terminal-r4-20260901
