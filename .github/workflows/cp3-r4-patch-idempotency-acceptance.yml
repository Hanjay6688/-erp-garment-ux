name: CP3 R4 Stage Rollback Assertion Patch

on:
  push:
    branches:
      - cp3/hpp-attendance-sewing-terminal-r4-20260901
    paths:
      - '.github/workflows/cp3-r4-patch-idempotency-acceptance.yml'

permissions:
  contents: write

concurrency:
  group: cp3-r4-stage-rollback-assertion-patch
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cp3/hpp-attendance-sewing-terminal-r4-20260901
          fetch-depth: 0

      - name: Generate exact patched workflow and manifest as non-workflow blobs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          workflow_path = Path('.github/workflows/cp3-r4-full-schema-validation.yml')
          source = workflow_path.read_text()
          old = "          grep -F '\"status\" : \"PASS\"' cp3-r4-proof/r4-rollback-residue.json >/dev/null\n"
          new = (
              "          python - <<'PY'\n"
              "          import json\n"
              "          from pathlib import Path\n"
              "          residue=json.loads(Path('cp3-r4-proof/r4-rollback-residue.json').read_text())\n"
              "          assert residue['status']=='PASS', residue\n"
              "          assert residue['migration_marker'] is False, residue\n"
              "          assert residue['capsule'] is None, residue\n"
              "          assert residue['private_reverse'] is None, residue\n"
              "          assert residue['active_pool_helper'] is None, residue\n"
              "          PY\n"
          )

          count = source.count(old)
          if count != 1:
              raise SystemExit(f'rollback residue grep anchor expected once, found {count}')
          source = source.replace(old, new, 1)
          workflow_path.write_text(source)

          manifest_path = Path('docs/evidence/cp3_r4_source_hashes.json')
          manifest = json.loads(manifest_path.read_text())
          raw = workflow_path.read_bytes()
          manifest['files'][workflow_path.as_posix()] = {
              'bytes': len(raw),
              'sha256': hashlib.sha256(raw).hexdigest(),
          }
          manifest['last_workflow_harness_patch'] = {
              'scope': 'CP3 R4 source-only full-schema rollback proof',
              'defect': 'compact jsonb output passed semantically but failed spacing-dependent grep',
              'fix': 'parse rollback residue JSON and assert every residue field explicitly',
              'business_runtime_changed': False,
              'uat_applied': False,
              'legacy_mutated': False,
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')

          failures = []
          for path, expected in manifest['files'].items():
              data = Path(path).read_bytes()
              if len(data) != expected['bytes'] or hashlib.sha256(data).hexdigest() != expected['sha256']:
                  failures.append(path)
          if failures:
              raise SystemExit(f'fixed-source manifest mismatch after rollback assertion repair: {failures}')

          out_dir = Path('docs/evidence/generated')
          out_dir.mkdir(parents=True, exist_ok=True)
          out_workflow = out_dir / 'cp3-r4-full-schema-validation.patched.yml'
          out_manifest = out_dir / 'cp3_r4_source_hashes.patched.json'
          out_workflow.write_bytes(workflow_path.read_bytes())
          out_manifest.write_bytes(manifest_path.read_bytes())

          print(json.dumps({
              'status': 'PASS',
              'workflow_blob_source': out_workflow.as_posix(),
              'manifest_blob_source': out_manifest.as_posix(),
              'workflow_bytes': len(raw),
              'workflow_sha256': hashlib.sha256(raw).hexdigest(),
          }, sort_keys=True))
          PY

          git diff --check
          git checkout -- .github/workflows/cp3-r4-full-schema-validation.yml docs/evidence/cp3_r4_source_hashes.json
          test -z "$(git status --short -- .github/workflows/cp3-r4-full-schema-validation.yml docs/evidence/cp3_r4_source_hashes.json)"

      - name: Commit only generated non-workflow blob sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/evidence/generated/cp3-r4-full-schema-validation.patched.yml docs/evidence/generated/cp3_r4_source_hashes.patched.json
          git commit -m 'chore(cp3): stage rollback proof patch blobs'
          git push origin HEAD:cp3/hpp-attendance-sewing-terminal-r4-20260901
