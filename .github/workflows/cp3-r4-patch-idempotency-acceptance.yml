name: CP3 R4 Patch Contract Assertions

on:
  push:
    branches:
      - cp3/hpp-attendance-sewing-terminal-r4-20260901
    paths:
      - '.github/workflows/cp3-r4-patch-idempotency-acceptance.yml'

permissions:
  contents: write

concurrency:
  group: cp3-r4-patch-contract-assertions
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cp3/hpp-attendance-sewing-terminal-r4-20260901
          fetch-depth: 0

      - name: Align acceptance assertions with exact fail-closed runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          test_path = Path('supabase/tests/attendance_hpp_r4_full_schema_rollback.sql')
          source = test_path.read_text()

          replacements = [
              (
                  "    if sqlerrm not like 'PROTECTED_JOURNAL_REQUIRES_OWNING_LIFECYCLE:%ATTENDANCE_HPP_POOL%' then raise; end if;\n",
                  "    if sqlerrm not like 'Protected journal source type ATTENDANCE_HPP_POOL cannot be reversed through generic reverse_journal.%owning attendance HPP pool%' then raise; end if;\n",
                  1,
                  'pool protected-journal rejection',
              ),
              (
                  "    if sqlerrm not like 'PROTECTED_JOURNAL_REQUIRES_OWNING_LIFECYCLE:%PAYROLL_ATTENDANCE_ACCRUAL%' then raise; end if;\n",
                  "    if sqlerrm not like 'Protected journal source type PAYROLL_ATTENDANCE_ACCRUAL cannot be reversed through generic reverse_journal.%payroll cancellation/reversal flow%' then raise; end if;\n",
                  1,
                  'payroll protected-journal rejection',
              ),
              (
                  "    if sqlerrm not like 'SEWING_TERMINAL_DEPENDENCY:%reverse_sewing_terminal_v1%' then raise; end if;\n",
                  "    if sqlerrm not like 'Work completion masih memiliki SELESAI_DIJAHIT aktif.%reverse_sewing_terminal_v1()%' then raise; end if;\n",
                  2,
                  'work completion terminal dependency rejection',
              ),
              (
                  "    if sqlerrm not like 'ACTIVE_ATTENDANCE_HPP_POOL_BLOCKS_PAYROLL_APPROVAL:%cancel the active attendance HPP pool first%' then raise; end if;\n",
                  "    if sqlerrm not like 'Attendance HPP pool for payroll period % is already ACTIVE. Cancel the ACTIVE pool first before approving this payroll.%' then raise; end if;\n",
                  1,
                  'active-pool payroll approval rejection',
              ),
              (
                  "    if sqlerrm not like 'ACTIVE_ATTENDANCE_HPP_POOL_BLOCKS_POLICY_CHANGE:%cancel the active pool first%' then raise; end if;\n",
                  "    if sqlerrm not like 'Contractor HPP policy effective from % overlaps an ACTIVE attendance HPP pool. Cancel the ACTIVE pool first, then write the new policy version.%' then raise; end if;\n",
                  1,
                  'active-pool policy rejection',
              ),
              (
                  "  exception when others then\n    if sqlerrm like 'Expected future policy%'\n       or position('idempot' in lower(sqlerrm))=0 then raise; end if;\n  end;\n",
                  "  exception when others then\n    if sqlerrm like 'Expected future policy%'\n       or position('client_request_id' in lower(sqlerrm)) = 0\n       or position('different payload' in lower(sqlerrm)) = 0 then\n      raise;\n    end if;\n  end;\n",
                  1,
                  'future-policy idempotency payload mismatch',
              ),
          ]

          applied = []
          for old, new, expected_count, label in replacements:
              count = source.count(old)
              if count != expected_count:
                  raise SystemExit(f'{label}: expected {expected_count} exact anchor(s), found {count}')
              source = source.replace(old, new)
              applied.append({'label': label, 'count': count})

          forbidden = [
              'PROTECTED_JOURNAL_REQUIRES_OWNING_LIFECYCLE:',
              'SEWING_TERMINAL_DEPENDENCY:',
              'ACTIVE_ATTENDANCE_HPP_POOL_BLOCKS_PAYROLL_APPROVAL:',
              'ACTIVE_ATTENDANCE_HPP_POOL_BLOCKS_POLICY_CHANGE:',
              "position('idempot' in lower(sqlerrm))",
          ]
          residue = [token for token in forbidden if token in source]
          if residue:
              raise SystemExit(f'stale assertion-contract residue remains: {residue}')

          test_path.write_text(source)

          manifest_path = Path('docs/evidence/cp3_r4_source_hashes.json')
          manifest = json.loads(manifest_path.read_text())
          raw = test_path.read_bytes()
          manifest['files'][test_path.as_posix()] = {
              'bytes': len(raw),
              'sha256': hashlib.sha256(raw).hexdigest(),
          }
          manifest['last_assertion_alignment'] = {
              'scope': 'acceptance-only; runtime source unchanged',
              'applied': applied,
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')

          print(json.dumps({
              'status': 'PASS',
              'patched': test_path.as_posix(),
              'bytes': len(raw),
              'sha256': hashlib.sha256(raw).hexdigest(),
              'applied': applied,
          }, sort_keys=True))
          PY

          git diff --check
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path('docs/evidence/cp3_r4_source_hashes.json').read_text())
          failures = []
          for path, expected in manifest['files'].items():
              raw = Path(path).read_bytes()
              if len(raw) != expected['bytes'] or hashlib.sha256(raw).hexdigest() != expected['sha256']:
                  failures.append(path)
          if failures:
              raise SystemExit(f'fixed-source manifest mismatch after assertion alignment: {failures}')
          print(json.dumps({'status': 'PASS', 'manifest_entries': len(manifest['files'])}, sort_keys=True))
          PY

      - name: Commit exact assertion alignment to writer branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/tests/attendance_hpp_r4_full_schema_rollback.sql docs/evidence/cp3_r4_source_hashes.json
          git commit -m 'test(cp3): align R4 rejection assertions with runtime contracts'
          git push origin HEAD:cp3/hpp-attendance-sewing-terminal-r4-20260901
