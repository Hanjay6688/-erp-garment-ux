name: CP3 R4 Patch Private Primitive Harness

on:
  push:
    branches:
      - cp3/hpp-attendance-sewing-terminal-r4-20260901
    paths:
      - '.github/workflows/cp3-r4-patch-idempotency-acceptance.yml'

permissions:
  contents: write

concurrency:
  group: cp3-r4-patch-private-primitive-harness
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cp3/hpp-attendance-sewing-terminal-r4-20260901
          fetch-depth: 0

      - name: Correct exact private reversal primitive identity in race proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          script_path = Path('scripts/cp3_r4_full_schema_concurrency.py')
          source = script_path.read_text()

          old_proname = "p.proname='_reverse_journal_internal'"
          new_proname = "p.proname='_cp3_r4_reverse_journal_internal'"
          old_signature = "erp._reverse_journal_internal(uuid,text)"
          new_signature = "erp._cp3_r4_reverse_journal_internal(uuid,text)"

          if source.count(old_proname) != 1:
              raise SystemExit(f'expected one old private primitive proname, found {source.count(old_proname)}')
          if source.count(old_signature) != 3:
              raise SystemExit(f'expected three old private primitive signatures, found {source.count(old_signature)}')

          source = source.replace(old_proname, new_proname, 1)
          source = source.replace(old_signature, new_signature)

          if source.count(new_proname) != 1 or source.count(new_signature) != 3:
              raise SystemExit('private primitive harness identity replacement was incomplete')

          script_path.write_text(source)

          manifest_path = Path('docs/evidence/cp3_r4_source_hashes.json')
          manifest = json.loads(manifest_path.read_text())
          raw = script_path.read_bytes()
          manifest['files'][script_path.as_posix()] = {
              'bytes': len(raw),
              'sha256': hashlib.sha256(raw).hexdigest(),
          }
          manifest['last_validation_harness_patch'] = {
              'scope': 'CP3 R4 source-only full-schema concurrency proof',
              'defect': 'ACL proof referenced nonexistent erp._reverse_journal_internal(uuid,text)',
              'fix': 'assert ACL on exact erp._cp3_r4_reverse_journal_internal(uuid,text) created by v2.6.14d',
              'business_runtime_changed': False,
              'uat_applied': False,
              'legacy_mutated': False,
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')

          print(json.dumps({
              'status': 'PASS',
              'patched': script_path.as_posix(),
              'bytes': len(raw),
              'sha256': hashlib.sha256(raw).hexdigest(),
          }, sort_keys=True))
          PY

          python -m py_compile scripts/cp3_r4_full_schema_concurrency.py
          git diff --check
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path('docs/evidence/cp3_r4_source_hashes.json').read_text())
          failures = []
          for path, expected in manifest['files'].items():
              raw = Path(path).read_bytes()
              if len(raw) != expected['bytes'] or hashlib.sha256(raw).hexdigest() != expected['sha256']:
                  failures.append(path)
          if failures:
              raise SystemExit(f'fixed-source manifest mismatch after harness repair: {failures}')
          print(json.dumps({'status': 'PASS', 'manifest_entries': len(manifest['files'])}, sort_keys=True))
          PY

      - name: Commit exact harness repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/cp3_r4_full_schema_concurrency.py docs/evidence/cp3_r4_source_hashes.json
          git commit -m 'test(cp3): target exact private reversal primitive'
          git push origin HEAD:cp3/hpp-attendance-sewing-terminal-r4-20260901
