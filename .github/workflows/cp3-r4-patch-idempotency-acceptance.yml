name: CP3 R4 Patch Idempotency Acceptance

on:
  push:
    branches:
      - cp3/hpp-attendance-sewing-terminal-r4-20260901
    paths:
      - '.github/workflows/cp3-r4-patch-idempotency-acceptance.yml'

permissions:
  contents: write

concurrency:
  group: cp3-r4-patch-idempotency-acceptance
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cp3/hpp-attendance-sewing-terminal-r4-20260901
          fetch-depth: 0

      - name: Patch exact failed assertion and refresh fixed-source manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          test_path = Path('supabase/tests/attendance_hpp_r4_full_schema_rollback.sql')
          source = test_path.read_text()
          old = (
              "  exception when others then\n"
              "    if sqlerrm like 'Expected same idempotency%'\n"
              "       or position('idempot' in lower(sqlerrm))=0 then raise; end if;\n"
              "  end;\n"
          )
          new = (
              "  exception when others then\n"
              "    if sqlerrm like 'Expected same idempotency%'\n"
              "       or position('client_request_id' in lower(sqlerrm)) = 0\n"
              "       or position('different payload' in lower(sqlerrm)) = 0 then\n"
              "      raise;\n"
              "    end if;\n"
              "  end;\n"
          )
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one failed idempotency assertion block, found {count}')
          test_path.write_text(source.replace(old, new, 1))

          manifest_path = Path('docs/evidence/cp3_r4_source_hashes.json')
          manifest = json.loads(manifest_path.read_text())
          raw = test_path.read_bytes()
          manifest['files'][test_path.as_posix()] = {
              'bytes': len(raw),
              'sha256': hashlib.sha256(raw).hexdigest(),
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')

          print(json.dumps({
              'patched': test_path.as_posix(),
              'bytes': len(raw),
              'sha256': hashlib.sha256(raw).hexdigest(),
              'reason': 'accept existing fail-closed helper message only when client_request_id and different payload are both present',
          }, sort_keys=True))
          PY

          git diff --check
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path('docs/evidence/cp3_r4_source_hashes.json').read_text())
          failures = []
          for path, expected in manifest['files'].items():
              raw = Path(path).read_bytes()
              if len(raw) != expected['bytes'] or hashlib.sha256(raw).hexdigest() != expected['sha256']:
                  failures.append(path)
          if failures:
              raise SystemExit(f'fixed-source manifest mismatch after patch: {failures}')
          print(json.dumps({'status': 'PASS', 'manifest_entries': len(manifest['files'])}, sort_keys=True))
          PY

      - name: Commit patch to writer branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/tests/attendance_hpp_r4_full_schema_rollback.sql docs/evidence/cp3_r4_source_hashes.json
          git commit -m 'test(cp3): accept fail-closed idempotency payload mismatch'
          git push origin HEAD:cp3/hpp-attendance-sewing-terminal-r4-20260901
