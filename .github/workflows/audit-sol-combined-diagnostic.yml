name: AUDIT/SOL/diagnostic-retention
on:
  push:
    branches: [audit/sol-cp1-7-combined-dfab13bf-20261016]
    paths: [.github/workflows/audit-sol-combined-diagnostic.yml]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: sol-diagnostic-${{ github.run_id }}
  cancel-in-progress: false
run-name: AUDIT/cp17-combined-20261016/SOL/dfab13bf/diagnostic-retention/tool-qualified
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: [54322:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: sol
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: auditor
          ref: dfab13bf62398a69a02bf6221c06d29075e5e40b
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.10'
      - name: Pin identity and execute the declared diagnostic controls
        run: |
          test "$(git -C auditor rev-parse HEAD)" = dfab13bf62398a69a02bf6221c06d29075e5e40b
          python sol/audit/sol_cp17_combined/diagnostic_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cp17-combined-20261016-SOL-dfab13bf-diagnostic-retention
          path: diagnostic-proof/
          if-no-files-found: error
