name: CP7 F05 Native Durable Attention
'on':
  push:
    branches:
    - cp7/integration
    paths:
    - docs/cp7/MERGE_QUALIFICATION_REQUEST.json
    - scripts/cp7_note_correction_*
    - scripts/cp7-src/sales/**
    - scripts/cp7-src/fg/**
    - scripts/cp7_fg_bundle.py
    - scripts/cp7_f03_bundle.py
    - src/ConnectedSalesPage*
    - src/ConnectedFgBookPage*
    - src/noteCorrectionContract*
    - src/fgBookContract*
    - scripts/cp7_f05_attention_*
    - scripts/cp6_auditor_browser_host.mjs
    - scripts/cp7_attention_*
    - scripts/cp7_f05_receivable_*
    - scripts/cp7_f05_payable_*
    - scripts/cp7_payable_condition_cases.py
    - scripts/cp7_obligation_episode_cases.py
    - scripts/cp7_obligation_history_cases.py
    - scripts/cp7_rule_policy_cases.py
    - scripts/cp7_rule_source_*
    - scripts/cp7_other_obligation_*
    - scripts/cp7_obligation_report_*
    - scripts/cp7_f05_obligation_report_browser*
    - src/NativeObligationReportsPanel*
    - src/nativeObligationReports*
    - tests/fixtures/nativeObligationReports.ts
    - scripts/cp7_f05_other_browser*
    - scripts/cp7_f05_rule_browser*
    - scripts/cp7_f05_http_trace.mjs
    - scripts/cp7_note_http_trace.py
    - src/NativeRuleSourcePanel*
    - src/nativeRuleSource*
    - tests/fixtures/nativeRuleSource.ts
    - scripts/cp7_f05_policy_browser*
    - src/NativeReminderPolicyPanel*
    - src/nativeReminderPolicy*
    - tests/fixtures/nativeReminderPolicy.ts
    - scripts/cp7_f05_history_browser*
    - scripts/cp7_f05_episode_browser.mjs
    - scripts/cp7_f05_ai_browser.mjs
    - scripts/cp7_f05_ai_offline_browser.mjs
    - scripts/cp7_catalog_state.py
    - src/nativeObligationEpisodes*
    - src/NativeObligationObservationView.tsx
    - tests/fixtures/nativeObligationEpisodes*
    - src/nativePayableConditions*
    - tests/fixtures/nativePayableConditions*
    - src/supplierCredit*
    - scripts/cp7_receivable_condition_cases.py
    - src/nativeReceivableConditions*
    - tests/fixtures/nativeReceivableConditions*
    - scripts/cp7_reminder_bundle.py
    - scripts/cp7-src/reminders/**
    - scripts/cp7_f05_publication_*
    - scripts/cp7_f05_analysis_*
    - scripts/cp7_analysis_*
    - src/NativeAnalysis*
    - src/NativeMaterialNeedsView.tsx
    - tests/fixtures/nativeMaterialNeeds.ts
    - scripts/cp7_material_need_cases.py
    - scripts/cp7_f04_material_browser*
    - src/nativeAnalysis*
    - src/native-analysis.css
    - src/cp7/native-analysis.schema.json
    - scripts/cp7_f04_netting_*
    - src/NativeProductionPlanningPanel*
    - src/nativeProductionPlanning*
    - src/native-production-planning.css
    - scripts/cp7_netting_bundle.py
    - scripts/cp7_schedule_bundle.py
    - scripts/cp7_supply_bundle.py
    - scripts/cp7_f04_baseline_*
    - scripts/cp7_f04_history_*
    - scripts/cp7_baseline_bundle.py
    - scripts/cp7_planning_*
    - scripts/cp7-src/planning/**
    - scripts/cp7-src/demand/**
    - scripts/cp7-src/baseline/**
    - scripts/cp7-src/models/**
    - src/NativePlanningProfilePanel*
    - src/nativePlanningProfile*
    - src/native-planning-profile.css
    - src/NativeDemandHistoryPanel*
    - src/nativeDemandHistory*
    - src/native-demand-history.css
    - src/ConnectedFgStockPage*
    - .github/workflows/cp7-f05-attention.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: cp7-f05-attention-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  phase:
    name: Original analysis, own-user Native reminders and current Auth
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CP6_AC_INDEPENDENT_CONFIRM: postgres
      CP6_AF_INDEPENDENT_CONFIRM: postgres
      CP6_AH_CONFIRM: postgres
      CP6_AI_CONFIRM: postgres
      CP6_AH_INDEPENDENT_CONFIRM: postgres
      CP6_AI_INDEPENDENT_CONFIRM: postgres
      CP6_AUDIT_HARNESS_HEAD: c6b0e4fb119c4e91fecea66ebf2d789426b22c2b
      CP6_AF_HARNESS_HEAD: c6b0e4fb119c4e91fecea66ebf2d789426b22c2b
      CP6_DATABASE_CONTAINER: supabase_db_cp5-local
      CP6_MAINTENANCE_CONFIRM_DATABASE: cp6_rollback
      CP6_AR_CONFIRM: cp6_rollback
      CP6_AU_BROWSER_CONFIRM: cp6_rollback
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: writer
        fetch-depth: 0
        ref: ca7f09556397801c50a2277bdb65b1bf019f9a05
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: auditor
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: harness
        fetch-depth: 0
        ref: c6b0e4fb119c4e91fecea66ebf2d789426b22c2b
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: candidate
        fetch-depth: 0
        ref: 25fa4736329e5148dfdb3572bc169952cba23251
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: base
        fetch-depth: 0
        ref: 1bdca3766f7c9800d68295ff5122798060b8a05d
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - name: Install pinned disposable runtime
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --quiet 'psycopg[binary]==3.2.10' 'PyYAML==6.0.2' 'jsonschema==4.25.1'
        sudo apt-get update -qq
        sudo apt-get install -y -qq ca-certificates curl gnupg
        sudo install -d /usr/share/postgresql-common/pgdg
        sudo curl --fail --silent --show-error \
          -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
          https://www.postgresql.org/media/keys/ACCC4CF8.asc
        key_fingerprint="$(gpg --show-keys --with-colons \
          /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
          | awk -F: '$1 == "fpr" { print $10; exit }')"
        test "$key_fingerprint" = 'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'
        . /etc/os-release
        architecture="$(dpkg --print-architecture)"
        sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<EOF
        Types: deb
        URIs: https://apt.postgresql.org/pub/repos/apt
        Suites: ${VERSION_CODENAME}-pgdg
        Architectures: ${architecture}
        Components: main
        Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
        EOF
        sudo apt-get update -qq
        sudo apt-get install -y -qq postgresql-client-17
        test -x /usr/lib/postgresql/17/bin/psql
        echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
    - name: Install candidate browser dependencies
      working-directory: auditor
      run: |
        npm ci
        npx playwright install --with-deps chromium
    - name: Install pinned Supabase CLI
      uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
      with:
        version: 2.116.0
    - name: Record proposed source and prepare isolated proof paths
      id: source_scope
      working-directory: writer
      run: |
        set -euo pipefail
        PYTHONPATH=scripts python -c "import cp6_au_trial; cp6_au_trial.source()"
        mkdir -p ../candidate/cp6-proof/writer-{ae,af,ah,ai,aj,ak,al,am,an}
    - name: Start disposable database
      working-directory: base
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = 1bdca3766f7c9800d68295ff5122798060b8a05d
        test "$(git rev-parse HEAD^{tree})" = 334629c626257b8b713826f491cdf62385d5299b
        test -z "$(git status --porcelain)"
        supabase --help >/dev/null
        supabase init --help >/dev/null
        supabase start --help >/dev/null
        mkdir cp5-local
        supabase init --force --workdir cp5-local
        mkdir -p cp5-local/supabase/.temp
        echo '17.6.1.165' > cp5-local/supabase/.temp/postgres-version
        sed -i '0,/^enable_signup = true$/s//enable_signup = false/' cp5-local/supabase/config.toml
        # ghcr.io can rate-limit image pulls before anything runs. Retry the start
        # only (no test has run), falling back to the same image tags on public.ecr.aws.
        for attempt in 1 2 3 4; do
          if [ "$attempt" -ge 2 ]; then export SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws; fi
          if supabase start --workdir cp5-local \
            -x realtime,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor \
            > "$RUNNER_TEMP/cp6-local-start.log" 2>&1; then
            echo "supabase start succeeded on attempt $attempt from ${SUPABASE_INTERNAL_IMAGE_REGISTRY:-default}"
            break
          fi
          tail -n 20 "$RUNNER_TEMP/cp6-local-start.log"
          supabase stop --workdir cp5-local --no-backup || true
          if [ "$attempt" = 4 ]; then exit 1; fi
          sleep $((attempt * 60))
        done
    - name: Rebuild to v2.6.20, align with hosted, continue the frozen path to AB
      working-directory: base
      env:
        GITHUB_SHA: 1bdca3766f7c9800d68295ff5122798060b8a05d
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        export CP6_AC_WRITER_ARTIFACT="$RUNNER_TEMP/ac-native200.zip"
        gh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10392910720/zip \
          > "$CP6_AC_WRITER_ARTIFACT"
        mkdir -p ../auditor/cp6-proof/t3
        status=0
        PYTHONPATH=scripts python ../auditor/scripts/cp6_t3_aligned_chain.py ../auditor/cp6-proof/t3/ALIGNED_CHAIN.json --stop-after-ab || status=$?
        python - <<'PY'
        import json
        d=json.load(open('../auditor/cp6-proof/t3/ALIGNED_CHAIN.json'))
        print(json.dumps({k:d.get(k) for k in ('status','refused_step','alignment')},default=str)[:6000])
        print(json.dumps([(s['name'],s['exit_code'],s['after_alignment']) for s in d['steps']])[:6000])
        PY
        exit "$status"
    - name: Provision isolated rollback authority
      working-directory: writer
      shell: bash
      run: |
        set -euo pipefail
        maintenance_password="$(openssl rand -hex 32)"
        maintenance_pgurl="postgresql://cp6_maintenance_admission:${maintenance_password}@127.0.0.1:54322/template1"
        echo "::add-mask::$maintenance_password"
        echo "::add-mask::$maintenance_pgurl"
        docker exec -i "$CP6_DATABASE_CONTAINER" \
          psql -U supabase_admin -d template1 -X -v ON_ERROR_STOP=1 \
            -v cp6_password="$maintenance_password" <<'SQL'
        create role cp6_maintenance_admission
          login superuser noinherit nocreatedb nocreaterole noreplication
          connection limit 4 password :'cp6_password';
        SQL
        printf 'CP6_ADMISSION_CONTROL_PGURL=%s\n' "$maintenance_pgurl" >> "$GITHUB_ENV"
    - name: Clone the aligned AB state for install
      working-directory: writer
      run: |
        set -euo pipefail
        mkdir -p '../auditor/cp6-proof/t3'
        bash scripts/clone-cp6-disposable-database.sh \
          'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
          'postgresql://postgres:postgres@127.0.0.1:54322/template1' \
          'postgresql://postgres:postgres@127.0.0.1:54322/cp6_rollback' \
          cp6_rollback supabase_db_cp5-local '../auditor/cp6-proof/t3/CLONE_install'
    - name: Inspect retained Native155 handoff failures without source or credentials
      working-directory: auditor
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/11139828865/zip > "$RUNNER_TEMP/cp7-native155-retained.zip"
        python - <<'PY'
        from pathlib import Path
        import os,hashlib,zipfile,json
        p=Path(os.environ['RUNNER_TEMP'])/'cp7-native155-retained.zip'
        assert p.stat().st_size==132000390 and hashlib.sha256(p.read_bytes()).hexdigest()=='ed3ec21ec77056086a61c8b242a914d86beadfa31ee4d4864cc81bbe1f3933c0'
        results={}
        with zipfile.ZipFile(p)as z:
          for name in z.namelist():
            if name.endswith('CP7_F05_NATIVE_ATTENTION.json'):
              r=json.loads(z.read(name));results['original155']={k:r.get(k)for k in('status','expected_case_count','observed_case_count','source_sha256','cp6_restored','restore_components','advisor_gate','native_public_catalog_comparison')}
              results['original155']['groups']={g:r[g]['counts']for g in('native','races','http','browser')}
            if name.endswith('.json')and 'P17_HANDOFF_'in name and 'FAILURE'in name:
              r=json.loads(z.read(name));t=r.get('text','');o=r.get('original')or{};a=r.get('lastRead')or{}
              messages=['Salinan otomatis terlalu besar','Salin otomatis gagal','Pertanyaan dan data sumber disalin','Sumber sudah berubah','belum sesuai sumber']
              results[Path(name).name]={'message_hits':[m for m in messages if m in t],'panel_utf8_bytes':len(t.encode()),'original_analysis_utf8_bytes':len(json.dumps(o.get('analysis'),ensure_ascii=False,separators=(',',':')).encode()),'original_finance_utf8_bytes':len(json.dumps(o.get('financial_source'),ensure_ascii=False,separators=(',',':')).encode()),'last_source_state':a.get('source_state'),'same_original_analysis':a.get('analysis')==o.get('analysis'),'same_original_finance':a.get('financial_source')==o.get('financial_source')}
        out=Path('cp6-proof/t3');out.mkdir(parents=True,exist_ok=True);(out/'CP7_NATIVE155_HANDOFF_DIAGNOSTIC.json').write_text(json.dumps(results,indent=2)+'\n')
        print('CP7_NATIVE155_HANDOFF_DIAGNOSTIC '+json.dumps(results))
        PY
    - name: Retain exact qualified Native155 originals and source identity
      working-directory: auditor
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/11141076740/zip > "$RUNNER_TEMP/cp7-native155-qualified.zip"
        python scripts/cp7_native155_retained_receipt.py "$RUNNER_TEMP/cp7-native155-qualified.zip" cp6-proof/t3/retained-native155-928332d
    - name: Install accepted package and qualify the frozen Native analysis compiler
      working-directory: writer
      run: python '../auditor/scripts/cp7_f05_attention_probe.py'
    - name: Remove disposable database
      if: always()
      working-directory: base
      run: supabase stop --workdir cp5-local --no-backup
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cp7-f05-attention-original-json
        path: auditor/cp6-proof/t3/*.json
        retention-days: 30
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cp7-f05-attention
        path: auditor/cp6-proof/t3
        retention-days: 30
        if-no-files-found: error
