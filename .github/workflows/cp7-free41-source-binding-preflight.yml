name: CP7 A FREE41 writer CWD source binding only
'on':
  push:
    branches:
    - astra-a/free41-source-binding-preflight-20261102
    paths:
    - .github/workflows/cp7-free41-source-binding-preflight.yml
    - scripts/current-writer-a-takeover-20261030/free41_source_preflight.py
    - scripts/current-writer-a-takeover-20261030/intake_free3.py
permissions:
  contents: read
  actions: read
concurrency:
  group: cp7-free41-writer-cwd-source-binding-only
  cancel-in-progress: false
jobs:
  source:
    if: github.ref == 'refs/heads/astra-a/free41-source-binding-preflight-20261102'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CURRENT_ANALOG_FROZEN_SOURCE_ROOT: ${{ github.workspace }}/frozen
      CURRENT_FINANCE_FROZEN_SOURCE_ROOT: ${{ github.workspace }}/finance-frozen
      PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CP6_AC_INDEPENDENT_CONFIRM: postgres
      CP6_AF_INDEPENDENT_CONFIRM: postgres
      CP6_AH_CONFIRM: postgres
      CP6_AI_CONFIRM: postgres
      CP6_AH_INDEPENDENT_CONFIRM: postgres
      CP6_AI_INDEPENDENT_CONFIRM: postgres
      CP6_AUDIT_HARNESS_HEAD: c6b0e4fb119c4e91fecea66ebf2d789426b22c2b
      CP6_AF_HARNESS_HEAD: c6b0e4fb119c4e91fecea66ebf2d789426b22c2b
      CP6_DATABASE_CONTAINER: supabase_db_cp5-local
      CP6_MAINTENANCE_CONFIRM_DATABASE: cp6_rollback
      CP6_AR_CONFIRM: cp6_rollback
      CP6_AU_BROWSER_CONFIRM: cp6_rollback
      CURRENT_MODEL_FROZEN_SOURCE_ROOT: ${{ github.workspace }}/model-frozen
      CURRENT_TARGET_FROZEN_SOURCE_ROOT: ${{ github.workspace }}/target-frozen
      CURRENT_HISTORY_FROZEN_SOURCE_ROOT: ${{ github.workspace }}/history-frozen
      CURRENT_SCOPED_MODEL_FROZEN_SOURCE_ROOT: ${{ github.workspace }}/scoped-model-frozen
      CURRENT_VERSIONED_TARGET_FROZEN_SOURCE_ROOT: ${{ github.workspace }}/versioned-target-frozen
      B_PERFORMANCE_FROZEN_SOURCE_ROOT: ${{ github.workspace }}/B-performance-frozen
      B_FROZEN_UNITS_SOURCE_ROOT: ${{ github.workspace }}/B-frozen-units-qualified
      AUDITOR_UI_MODE: DISPOSABLE
      D17_18_SELECTED_BACKEND_ROOT: ${{ github.workspace }}/qualified-sku090b
      JOIN_CONFIRM: cp6_rollback
      S05_SKU_CONFIRM: cp6_rollback
      JOIN_QUALIFIED_SKU_ROOT: ${{ github.workspace }}/qualified-sku090b
      PERMANENT_S05_CONFIRM: cp6_rollback
      FREE_DATE_CONFIRM: cp6_rollback
      QUALIFIED_NATIVE_HEAD: 014019a612260525e9c3b9459e354a86209336c1
      QUALIFIED_B_HEAD: c7f06b855512e0c8d450522c36e84f4cab570a2a
    steps:
    - name: Checkout Root source reader and source-only caller
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: controller
        fetch-depth: 1
        sparse-checkout: scripts/current-writer-a-takeover-20261030
        persist-credentials: 'false'
    - name: Checkout exact repaired FREE41 without changing runtime branch
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: auditor
        ref: ad986b9a9d432f2ffac2b961710c3852c6c2ef90
        fetch-depth: 0
        persist-credentials: 'false'
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install only pinned Python source-reading dependencies
      run: python -m pip install --quiet 'psycopg[binary]==3.2.10' 'PyYAML==6.0.2' 'jsonschema==4.25.1'
    - name: Reuse actual passed immutable gates and require source worktree capacity
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python -B controller/scripts/current-writer-a-takeover-20261030/free41_source_preflight.py --mode retained-root-source
        python -B controller/scripts/current-writer-a-takeover-20261030/free41_source_preflight.py --mode source-capacity
    - name: Materialize every exact inherited source without database
      run: |
        set -euo pipefail
        python -B auditor/scripts/current-finance-combined-composition/materialize_sources.py
        python -B auditor/scripts/current-s03-sku-s05-composite-qualification/materialize_backend.py
        (cd auditor && python -B scripts/current-workflow-history-isolation/materialize.py)
        (cd qualified-sku090b && python -B scripts/current-workflow-history-isolation/materialize.py)
    - name: Verify exactly four historical source Originals
      env:
        GH_TOKEN: ${{ github.token }}
      run: python -B controller/scripts/current-writer-a-takeover-20261030/free41_source_preflight.py --mode fetch-originals
    - name: Check closed physical source under original database and network fence
      working-directory: auditor
      run: |
        set -euo pipefail
        python -B scripts/current-de-free-date-preparation/check.py --source > cp6-proof/free41-source-preflight/PHYSICAL_SOURCE_FENCE.json
    - name: Bind actual full runtime and fixture from exact writer working directory
      working-directory: writer
      run: |
        set -euo pipefail
        python -B ../auditor/scripts/current-de-free-date-preparation/probe.py --check > ../auditor/cp6-proof/free41-source-preflight/WRITER_CWD_NATURAL_RUNTIME_SOURCE_FENCE.json
    - name: Validate zero database activity and retained exact owning API proof
      run: python -B controller/scripts/current-writer-a-takeover-20261030/free41_source_preflight.py --mode final
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cp7-free41-source-binding-only-${{ github.run_attempt }}
        path: auditor/cp6-proof/free41-source-preflight
        retention-days: 30
        if-no-files-found: error
