name: CP7 OW10 Unified Target and Retained Analysis
'on':
  push:
    branches:
    - astra/d17-14-produksi
    paths:
    - scripts/cp7-src/baseline/target.sql
    - scripts/cp7-src/planning/baseline-source.sql
    - scripts/cp7-src/planning/analysis-stages.sql
    - scripts/cp7-src/planning/supply-source.sql
    - scripts/cp7-src/planning/netting.sql
    - scripts/cp7_planning_netting_cases.py
    - scripts/cp7_ow10_target_local.mjs
    - scripts/cp7_ow10_target_oracle.py
    - src/nativePlanningProfile.ts
    - src/NativePlanningProfilePanel.tsx
    - src/nativeProductionPlanning.ts
    - src/NativeProductionPlanningPanel.tsx
    - .github/workflows/cp7-ow10-target.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: cp7-ow10-target-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  phase:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - suite: ow10-native-baseline38
          probe: cp7_f04_baseline_probe.py
          timeout: 180
        - suite: ow10-retained-staged15
          probe: cp7_p19_staged_probe.py
          timeout: 180
        - suite: ow10-native-netting84
          probe: cp7_f04_netting_probe.py
          timeout: 180
    env:
      PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CP6_AC_INDEPENDENT_CONFIRM: postgres
      CP6_AF_INDEPENDENT_CONFIRM: postgres
      CP6_AH_CONFIRM: postgres
      CP6_AI_CONFIRM: postgres
      CP6_AH_INDEPENDENT_CONFIRM: postgres
      CP6_AI_INDEPENDENT_CONFIRM: postgres
      CP6_AUDIT_HARNESS_HEAD: c6b0e4fb119c4e91fecea66ebf2d789426b22c2b
      CP6_AF_HARNESS_HEAD: c6b0e4fb119c4e91fecea66ebf2d789426b22c2b
      CP6_DATABASE_CONTAINER: supabase_db_cp5-local
      CP6_MAINTENANCE_CONFIRM_DATABASE: cp6_rollback
      CP6_AR_CONFIRM: cp6_rollback
      CP6_AU_BROWSER_CONFIRM: cp6_rollback
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: writer
        fetch-depth: 0
        ref: ca7f09556397801c50a2277bdb65b1bf019f9a05
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: auditor
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: harness
        fetch-depth: 0
        ref: c6b0e4fb119c4e91fecea66ebf2d789426b22c2b
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: candidate
        fetch-depth: 0
        ref: 25fa4736329e5148dfdb3572bc169952cba23251
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: base
        fetch-depth: 0
        ref: 1bdca3766f7c9800d68295ff5122798060b8a05d
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - name: Prepare exact PG17 runtime with bounded installation
      shell: bash
      run: "set -euo pipefail\ntimeout 120 python -m pip install --quiet 'psycopg[binary]==3.2.10' 'PyYAML==6.0.2' 'jsonschema==4.25.1'\n\
        pg17_bin=/usr/lib/postgresql/17/bin\nif ! test -x \"$pg17_bin/psql\" || ! test -x \"$pg17_bin/pg_dump\" || ! test\
        \ -x \"$pg17_bin/pg_restore\"; then\n  sudo install -d /usr/share/postgresql-common/pgdg\n  curl --fail --silent --show-error\
        \ --connect-timeout 15 --max-time 45 --retry 2 \\\n    https://www.postgresql.org/media/keys/ACCC4CF8.asc \\\n   \
        \ -o \"$RUNNER_TEMP/ow06-postgresql-signing-key.asc\"\n  pg17_fingerprint=\"$(gpg --show-keys --with-colons \"$RUNNER_TEMP/ow06-postgresql-signing-key.asc\"\
        \ | awk -F: '$1 == \"fpr\" { print $10; exit }')\"\n  test \"$pg17_fingerprint\" = 'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'\n\
        \  sudo install -m 644 \"$RUNNER_TEMP/ow06-postgresql-signing-key.asc\" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n\
        \  . /etc/os-release\n  pg17_architecture=\"$(dpkg --print-architecture)\"\n  sudo tee /etc/apt/sources.list.d/pgdg.sources\
        \ >/dev/null <<EOF\nTypes: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: ${VERSION_CODENAME}-pgdg\n\
        Architectures: ${pg17_architecture}\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n\
        EOF\n  timeout 120 sudo apt-get -o DPkg::Lock::Timeout=45 -o Acquire::Retries=2 -o Acquire::https::Timeout=30 -o Acquire::http::Timeout=30\
        \ update -qq\n  timeout 180 sudo apt-get -o DPkg::Lock::Timeout=45 -o Acquire::Retries=2 -o Acquire::https::Timeout=30\
        \ -o Acquire::http::Timeout=30 install -y -qq postgresql-client-17\nfi\nfor pg17_tool in psql pg_dump pg_restore;\
        \ do\n  test -x \"$pg17_bin/$pg17_tool\"\n  \"$pg17_bin/$pg17_tool\" --version | grep -Eq 'PostgreSQL\\) 17[.]'\n\
        done\necho \"$pg17_bin\" >> \"$GITHUB_PATH\"\n"
      timeout-minutes: 8
    - name: Install candidate browser dependencies
      working-directory: auditor
      run: 'npm ci

        npx playwright install --with-deps chromium

        '
      timeout-minutes: 20
    - name: Install pinned Supabase CLI
      uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
      with:
        version: 2.116.0
    - name: Record proposed source and prepare isolated proof paths
      id: source_scope
      working-directory: writer
      run: 'set -euo pipefail

        PYTHONPATH=scripts python -c "import cp6_au_trial; cp6_au_trial.source()"

        mkdir -p ../candidate/cp6-proof/writer-{ae,af,ah,ai,aj,ak,al,am,an}

        '
    - name: Authenticate read-only GHCR image pulls
      env:
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ github.token }}
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

        '
    - name: Start disposable database
      working-directory: base
      shell: bash
      run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = 1bdca3766f7c9800d68295ff5122798060b8a05d\ntest \"$(git rev-parse\
        \ HEAD^{tree})\" = 334629c626257b8b713826f491cdf62385d5299b\ntest -z \"$(git status --porcelain)\"\nsupabase --help\
        \ >/dev/null\nsupabase init --help >/dev/null\nsupabase start --help >/dev/null\nmkdir cp5-local\nsupabase init --force\
        \ --workdir cp5-local\nmkdir -p cp5-local/supabase/.temp\necho '17.6.1.165' > cp5-local/supabase/.temp/postgres-version\n\
        sed -i '0,/^enable_signup = true$/s//enable_signup = false/' cp5-local/supabase/config.toml\n# Registry throttling\
        \ is an environment failure, before any test case.\n# Try the CLI's official mirrors with the same pinned service\
        \ versions.\n# A completed green suite is not retried by this loop.\nbooted=false\nfor registry in ghcr.io docker.io\
        \ public.ecr.aws; do\n  export SUPABASE_INTERNAL_IMAGE_REGISTRY=\"$registry\"\n  if timeout 120 supabase start --workdir\
        \ cp5-local \\\n    -x realtime,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor \\\n    > \"\
        $RUNNER_TEMP/cp6-local-start.log\" 2>&1; then\n    echo \"supabase start succeeded from $registry\"\n    booted=true\n\
        \    break\n  fi\n  tail -n 20 \"$RUNNER_TEMP/cp6-local-start.log\"\n  timeout 30 supabase stop --workdir cp5-local\
        \ --no-backup || true\n  if [ \"$registry\" != public.ecr.aws ]; then sleep 15; fi\ndone\nif [ \"$booted\" != true\
        \ ]; then exit 1; fi\n"
      timeout-minutes: 10
    - name: Rebuild to v2.6.20, align with hosted, continue the frozen path to AB
      working-directory: base
      env:
        GITHUB_SHA: 1bdca3766f7c9800d68295ff5122798060b8a05d
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\nexport CP6_AC_WRITER_ARTIFACT=\"$RUNNER_TEMP/ac-native200.zip\"\ngh api repos/Hanjay6688/-erp-garment-ux/actions/artifacts/10392910720/zip\
        \ \\\n  > \"$CP6_AC_WRITER_ARTIFACT\" || { rm -f \"$CP6_AC_WRITER_ARTIFACT\"; echo 'AC writer artifact 10392910720\
        \ unavailable (kept 30 days, expired 15 Oct 2026, owner D14-17); cp6_pre_u_inventory captures the pre-U table set\
        \ before U'; }\nmkdir -p ../auditor/cp6-proof/t3\nstatus=0\nPYTHONPATH=scripts python ../auditor/scripts/cp6_t3_aligned_chain.py\
        \ ../auditor/cp6-proof/t3/ALIGNED_CHAIN.json --stop-after-ab || status=$?\npython - <<'PY'\nimport json\nd=json.load(open('../auditor/cp6-proof/t3/ALIGNED_CHAIN.json'))\n\
        print(json.dumps({k:d.get(k) for k in ('status','refused_step','alignment')},default=str)[:6000])\nprint(json.dumps([(s['name'],s['exit_code'],s['after_alignment'])\
        \ for s in d['steps']])[:6000])\nPY\nexit \"$status\"\n"
    - name: Provision isolated rollback authority
      working-directory: writer
      shell: bash
      run: "set -euo pipefail\nmaintenance_password=\"$(openssl rand -hex 32)\"\nmaintenance_pgurl=\"postgresql://cp6_maintenance_admission:${maintenance_password}@127.0.0.1:54322/template1\"\
        \necho \"::add-mask::$maintenance_password\"\necho \"::add-mask::$maintenance_pgurl\"\ndocker exec -i \"$CP6_DATABASE_CONTAINER\"\
        \ \\\n  psql -U supabase_admin -d template1 -X -v ON_ERROR_STOP=1 \\\n    -v cp6_password=\"$maintenance_password\"\
        \ <<'SQL'\ncreate role cp6_maintenance_admission\n  login superuser noinherit nocreatedb nocreaterole noreplication\n\
        \  connection limit 4 password :'cp6_password';\nSQL\nprintf 'CP6_ADMISSION_CONTROL_PGURL=%s\\n' \"$maintenance_pgurl\"\
        \ >> \"$GITHUB_ENV\"\n"
    - name: Clone the aligned AB state for install
      working-directory: writer
      run: "set -euo pipefail\nmkdir -p '../auditor/cp6-proof/t3'\nbash scripts/clone-cp6-disposable-database.sh \\\n  'postgresql://postgres:postgres@127.0.0.1:54322/postgres'\
        \ \\\n  'postgresql://postgres:postgres@127.0.0.1:54322/template1' \\\n  'postgresql://postgres:postgres@127.0.0.1:54322/cp6_rollback'\
        \ \\\n  cp6_rollback supabase_db_cp5-local '../auditor/cp6-proof/t3/CLONE_install'\n"
    - name: Qualify the declared Native suite
      working-directory: writer
      run: python "../auditor/scripts/${{ matrix.probe }}"
    - name: Remove disposable database
      if: always()
      working-directory: base
      run: supabase stop --workdir cp5-local --no-backup
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ow10-${{ matrix.suite }}
        path: auditor/cp6-proof/t3
        retention-days: 30
        if-no-files-found: error
    - name: Retain every complete Original JSON independently of the full archive
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ow10-${{ matrix.suite }}-complete-json
        path: auditor/cp6-proof/t3/*.json
        retention-days: 30
        if-no-files-found: error
