name: AUDIT/Sol/ci
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ 'b53b5acdf260b03ebac3474e9ae837fcef6f6eb1' }}
        fetch-depth: 0
        persist-credentials: false
    - name: Sol record exact candidate and product trees
      run: "python3 - <<'SOL_IDENTITY'\nimport json,os,pathlib,subprocess,hashlib\nsha='b53b5acdf260b03ebac3474e9ae837fcef6f6eb1'\npaths=['.']\nitems=[]\nfor p in paths:\n r=pathlib.Path(p)\n g=lambda *a:subprocess.check_output(['git','-C',str(r),*a],text=True).strip()\n head=g('rev-parse','HEAD')\n # T3 intentionally keeps an inherited frozen UI checkout in its browser phase; actual identity remains visible.\n items.append(dict(path=p,head=head,tree=g('rev-parse','HEAD^{tree}'),candidate_exact=head==sha,product_trees={q:g('rev-parse','HEAD:'+q)for q in ['src','supabase/release','supabase/migrations','scripts/cp7-src','supabase/dev']},tracked_product_diff=g('diff','--name-only','--','src','scripts/cp7-src','supabase/release','supabase/migrations','supabase/dev'),lock_sha256=hashlib.sha256((r/'package-lock.json').read_bytes()).hexdigest()))\nout=dict(candidate_sha=sha,workflow_sha=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],attempt=os.environ['GITHUB_RUN_ATTEMPT'],suite='ci',checkouts=items,evidence_origin='INDEPENDENT_NATIVE_RERUN',oracle_origin='WRITER_OR_INHERITED_DECLARED',fixture_origin='PUBLIC_REPO_SYNTHETIC')\n\
        p=pathlib.Path(os.environ['RUNNER_TEMP'])/'sol-proof';p.mkdir(exist_ok=True);(p/'IDENTITY.json').write_text(json.dumps(out,indent=2)+'\\n');print(json.dumps(out))\nassert any(x['candidate_exact']for x in items) or 'ci'=='cp6-t3-release-package'\nSOL_IDENTITY"
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci
    - name: Install pinned Chromium test runtime
      run: npx --no-install playwright install --with-deps chromium
    - run: npm test
    - run: npm run test:security
    - run: npm run build
    - run: npm run test:browser:cp45
    - name: Retain CP4.5 Original before the shared reporter directory is reused
      run: cp -a cp45-browser-proof cp45-browser-original
    - run: npm run test:browser:precp5
    - name: Retain Pre-CP5 Original independently
      run: cp -a cp45-browser-proof precp5-browser-original
    - run: npm run test:browser:cp5
    - run: npm run test:browser:cp6
    - name: Upload non-secret browser proof
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cp17-r3-Sol-b53b5acd-erp-desktop-mobile-browser-proof
        path: 'cp45-browser-proof

          cp45-browser-original

          precp5-browser-original

          cp5-browser-contract-proof

          cp6-browser-contract-proof

          '
        if-no-files-found: warn
        retention-days: 30
    - run: npm run scan:dist
    - name: Verify Cloudflare package
      run: npx --no-install wrangler deploy --env uat-auth --dry-run --outdir .wrangler-dry-run
    - uses: actions/upload-artifact@v4
      with:
        name: cp17-r3-Sol-b53b5acd-erp-ux-dist
        path: dist
        retention-days: 3
    - name: Sol preserve audit identity
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: cp17-r3-Sol-b53b5acd-ci-${{ github.job }}-${{ strategy.job-index }}-identity
        path: ${{ runner.temp }}/sol-proof
        retention-days: 30
        if-no-files-found: warn
run-name: AUDIT/cp17-r3/Sol/b53b5acd/ci/1
'on':
  push:
    branches:
    - audit/sol-cp1-7-r3-b53b5acd-20261017
    paths:
    - .github/workflows/audit-sol-r3-ci.yml
  workflow_dispatch: {}
concurrency:
  group: audit-sol-r3-ci-${{ github.run_id }}
  cancel-in-progress: false
