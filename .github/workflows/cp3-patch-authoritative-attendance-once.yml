name: CP3 Patch Authoritative Attendance Once

on:
  push:
    branches:
      - cp3/hpp-attendance-sewing-terminal-candidate-20260901
    paths:
      - .github/workflows/cp3-patch-authoritative-attendance-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: cp3/hpp-attendance-sewing-terminal-candidate-20260901
          fetch-depth: 1
      - name: Replace posted direct attendance setup with authoritative lifecycle RPCs
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/cp3_patch_authoritative_attendance_fixture_once.py scripts/cp3_patch_authoritative_attendance_fixture_v2_once.py
          python scripts/cp3_patch_authoritative_attendance_fixture_v2_once.py
          git diff --check
          grep -nE 'save_attendance_period_v1|post_attendance_period_v1|cp3_att_period_|cp3_att_record_|insert into erp.attendance_(periods|records)|rollback;' supabase/tests/attendance_hpp_sewing_terminal_rollback.sql | head -n 200
          sha256sum supabase/tests/attendance_hpp_sewing_terminal_rollback.sql
          git config user.name 'cp3-source-writer'
          git config user.email 'cp3-source-writer@users.noreply.github.com'
          git add supabase/tests/attendance_hpp_sewing_terminal_rollback.sql
          git commit -m 'test(cp3): create and post attendance through authoritative RPCs'
          git push origin HEAD:cp3/hpp-attendance-sewing-terminal-candidate-20260901
