name: D17-18 progress controlled PostgreSQL reader
on:
  push:
    branches: ['astra-a/d17-18-honest-progress-prepared-20261026']
    paths: ['scripts/cp7_current_analysis_progress/**', '.github/workflows/cp7-d17-18-progress-controlled.yml']
permissions:
  contents: read
jobs:
  controlled-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: disposable-progress
          POSTGRES_DB: cp7_progress_controlled
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PROGRESS_CONTROLLED_PGURL: postgresql://postgres:disposable-progress@127.0.0.1:5432/cp7_progress_controlled
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned reader-test dependency
        run: python -m pip install --quiet 'psycopg[binary]==3.2.10'
      - name: Test reader mechanics on controlled PostgreSQL dependencies
        run: python scripts/cp7_current_analysis_progress/controlled_reader.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cp7-d17-18-progress-controlled-sql
          path: scripts/cp7_current_analysis_progress/CONTROLLED_SQL_RESULT.json
          if-no-files-found: error
