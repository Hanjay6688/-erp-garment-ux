name: Writer B Planner and operator browser fixtures
on:
  push:
    branches: [astra-b/planner-bs-laundry-20261112]
    paths:
      - '.github/workflows/cp7-b-planner-operator-fixture.yml'
      - 'playwright.cp7-b-operator.config.ts'
      - 'tests/browser/cp7-b-operator.spec.ts'
      - 'tests/browser/support/cp7-json-fixtures.mjs'
      - 'docs/cp7/review/b-planner-bs-laundry-20261112/OPERATOR_UI.patch'
permissions:
  contents: read
concurrency:
  group: writer-b-planner-operator-fixture
  cancel-in-progress: false
jobs:
  browser-fixture:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      VITE_ERP_RUNTIME_MODE: DISPOSABLE_TEST
      VITE_SUPABASE_URL: http://127.0.0.1:54328
      VITE_DISPOSABLE_API_PORT: '54328'
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJub25lIn0.eyJyb2xlIjoiYW5vbiIsInJlZiI6ImxvY2FsIn0.Y3A3LWItZml4dHVyZQ
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /src/
            /public/
            /contracts/
            /tests/
            /scripts/assert-cp6-disposable-env.mjs
            /scripts/build-preflight.mjs
            /scripts/scan-client-artifacts.mjs
            /scripts/cp7_accessory_nonpayable/LOCAL_SETTINGS_CONTROLS.json
            /docs/cp7/review/b-planner-bs-laundry-20261112/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install exact candidate dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Record exact candidate App inputs
        run: |
          mkdir -p b-operator-proof
          git rev-parse HEAD HEAD:src | tee b-operator-proof/BUILD_SOURCE.txt
          test "$(git rev-parse HEAD:src)" = f817f1f3ae0e53c679fdcf1a404fa0602d6bafbd
          sha256sum package-lock.json vite.config.ts index.html | tee -a b-operator-proof/BUILD_SOURCE.txt
      - name: Apply the operator UI proposal in this checkout
        run: |
          patch=docs/cp7/review/b-planner-bs-laundry-20261112/OPERATOR_UI.patch
          git apply --check "$patch"
          git apply "$patch"
          git diff --check
          git diff --name-only | tee b-operator-proof/PATCH_PATHS.txt
          sha256sum "$patch" src/ConnectedBsResolutionPage.tsx src/ConnectedLaundryPage.tsx src/connected-laundry-qc.css | tee b-operator-proof/PATCHED_SOURCE.txt
          npm run build:cp6-disposable 2>&1 | tee b-operator-proof/BUILD_PATCHED.log
      - name: Install pinned Chromium
        run: node_modules/.bin/playwright install --with-deps --only-shell chromium 2>&1 | tee b-operator-proof/CHROMIUM_INSTALL.log
      # Planner passed in run 43210650647 and Laundry passed with this patch in 43211906751.
      - name: Exercise the BS note save and reopen journey
        run: |
          export NODE_OPTIONS='--import ./tests/browser/support/cp7-json-fixtures.mjs'
          set +e
          node_modules/.bin/playwright test --config playwright.cp7-b-operator.config.ts --grep 'readable reject causes' 2>&1 | tee b-operator-proof/OPERATOR_AFTER.log
          result=${PIPESTATUS[0]}
          set -e
          echo "$result" > b-operator-proof/OPERATOR_AFTER.exit
          if [[ -d test-results/cp7-b-operator ]]; then mv test-results/cp7-b-operator b-operator-proof/operator-after; fi
      - name: Require the BS journey to pass on desktop and mobile
        run: test "$(cat b-operator-proof/OPERATOR_AFTER.exit)" = 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: writer-b-planner-operator-${{ github.sha }}
          path: b-operator-proof/
          retention-days: 30
          if-no-files-found: error
