name: CP7 D17-18 exact integration assembly
on:
  push:
    branches: [astra-a/d17-18-integration-assembly-check-20261028]
    paths:
      - .github/workflows/cp7-d17-18-integration-assembly.yml
      - scripts/current-integration-assembly-preparation/**
permissions:
  contents: read
concurrency:
  group: cp7-d17-18-integration-assembly-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned YAML parser
        run: python -m pip install 'PyYAML==6.0.2'
      - name: Verify exact assembly and closed browser boundaries
        run: python scripts/current-integration-assembly-preparation/check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integration-assembly-source-${{ github.run_attempt }}
          path: cp6-proof/current-integration-assembly/
          if-no-files-found: error
          retention-days: 30
  codeql:
    name: Integration assembly CodeQL ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [actions]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          output: integration-assembly-codeql
          upload: never
          upload-database: false
      - name: Reject CodeQL findings or incomplete runs
        run: |
          python3 - <<'PY'
          import json, pathlib
          files = list(pathlib.Path('integration-assembly-codeql').glob('*.sarif'))
          assert files, 'No SARIF produced'
          for f in files:
              report = json.loads(f.read_text())
              assert report.get('runs'), 'No analysis runs'
              for run in report['runs']:
                  assert not run.get('results'), 'CodeQL findings need review'
                  assert run.get('invocations'), 'No invocation evidence'
                  for invocation in run['invocations']:
                      assert invocation.get('executionSuccessful') is True, 'Incomplete CodeQL'
          print('CodeQL completed with zero findings')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integration-assembly-codeql-${{ matrix.language }}
          path: integration-assembly-codeql
          if-no-files-found: error
          retention-days: 30
