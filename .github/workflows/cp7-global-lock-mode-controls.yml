name: CP7 A real two-session lock primitives only
'on':
  push:
    branches: [astra-a/global-lock-mode-controls-20261102]
    paths:
      - .github/workflows/cp7-global-lock-mode-controls.yml
      - scripts/current-global-lock-mode-controls/**
permissions:
  contents: read
concurrency:
  group: cp7-global-lock-mode-controls-20261102
  cancel-in-progress: false
jobs:
  controls:
    if: github.ref == 'refs/heads/astra-a/global-lock-mode-controls-20261102'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      model:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: control-only-local-not-erp
          POSTGRES_DB: cp7_lock_modes
        ports:
          - 127.0.0.1:55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cp7_lock_modes"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact isolated model client
        run: python -m pip install --quiet 'psycopg[binary]==3.2.10'
      - name: Record actual container digest and sealed source
        run: |
          mkdir -p cp7-proof
          docker image inspect postgres:17.6 --format '{{json .RepoDigests}}' > cp7-proof/MODEL_POSTGRES_IMAGE.json
          python -B - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json,subprocess
          p=Path('scripts/current-global-lock-mode-controls/probe.py')
          manifest=Path('scripts/current-global-lock-mode-controls/SOURCE.json')
          source=json.loads(manifest.read_bytes())
          assert source['classification']=='REAL_POSTGRES_17_6_TWO_SESSION_MODEL_NOT_ERP'
          assert source['actual_ERP_cases']==0 and source['global_writer_closure']is False
          assert len(source['files'])==2
          for name,pin in source['files'].items():
              raw=Path(name).read_bytes()
              assert {'bytes':len(raw),'sha256':sha256(raw).hexdigest()}==pin
          value=dict(head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
              probe=dict(bytes=p.stat().st_size,sha256=sha256(p.read_bytes()).hexdigest()),
              source_manifest=dict(bytes=manifest.stat().st_size,sha256=sha256(manifest.read_bytes()).hexdigest()),
              actual_ERP_cases=0,production_go=False,independent_acceptance=False)
          Path('cp7-proof/MODEL_SOURCE_IDENTITY.json').write_text(json.dumps(value,indent=2)+'\n')
          PY
      - name: Run actual two-backend model without ERP
        env:
          PGLOCK_MODEL_CONFIRM: cp7_lock_modes
          PGLOCK_MODEL_URL: postgresql://postgres:control-only-local-not-erp@127.0.0.1:55439/cp7_lock_modes
        run: python -B scripts/current-global-lock-mode-controls/probe.py --run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cp7-real-lock-mode-primitives-${{ github.sha }}
          path: cp7-proof/
          retention-days: 30
