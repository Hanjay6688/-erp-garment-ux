name: Writer B source-refusal and recovery UI - isolated transport
on:
  push:
    branches: [astra-b/ui-source-refusal-browser-20261104]
    paths:
      - 'src/ConnectedPocketFabricPage.tsx'
      - 'src/ConnectedInitialImportPage.tsx'
      - 'src/initial-import.css'
      - 'scripts/ui-reference/connected-ui/**'
      - 'scripts/ui-b-source-refusal-browser/**'
      - '.github/workflows/ui-b-source-refusal-browser.yml'
permissions:
  contents: read
concurrency:
  group: writer-b-source-refusal-browser
  cancel-in-progress: false
jobs:
  capture:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: after
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Fetch exact first browser and diagnostic source base
        run: git -C after fetch --no-tags --depth=1 origin f801eba47ef38fbf43999b124149b40b66ef0b5a
      - name: Install unchanged pinned dependencies
        working-directory: after
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify caption fix local54 and retained unchanged transport5
        working-directory: after
        run: node scripts/ui-b-source-refusal-browser/verify-v2.mjs
      - name: Compile complete fixture graph and refuse product roots
        working-directory: after
        env:
          UI_PREFLIGHT_DIR: ../ui-refusal-preflight
        run: node scripts/ui-reference/connected-ui/preflight.mjs
      - name: Build the normal product and prove fixture absence
        working-directory: after
        run: |
          mkdir ../ui-refusal-product-proof
          npm run build 2>&1 | tee ../ui-refusal-product-proof/BUILD.log
          node scripts/ui-b-source-refusal-browser/product-build-proof.mjs
      - name: Install the browser only - no database or actual Auth
        working-directory: after
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: Capture28 refusal and recovery journeys with60 screenshots
        working-directory: after
        run: node scripts/ui-b-source-refusal-browser/capture.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: writer-b-source-refusal-${{ github.sha }}
          path: |
            ui-refusal-browser-proof/
            ui-refusal-preflight/
            ui-refusal-product-proof/
          retention-days: 30
          if-no-files-found: warn
