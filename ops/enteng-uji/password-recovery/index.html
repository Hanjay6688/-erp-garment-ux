<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://jxzlajjuuaexiwfjseav.supabase.co; form-action 'none'; base-uri 'none'">
  <title>Atur kata sandi · Enteng Uji</title>
  <link rel="stylesheet" href="./page.css">
  <script type="module" src="./page.js"></script>
</head>
<body>
  <main>
    <p class="project">ERP Enteng Uji</p>
    <h1>Atur kata sandi</h1>
    <form id="request" hidden>
      <p>Kami akan mengirim tautan ke email akun ERP lu. Buka tautannya di browser yang sama.</p>
      <label>Email akun ERP<input required name="email" type="email" autocomplete="email" maxlength="254"></label>
      <button>Kirim tautan ke email</button>
    </form>
    <form id="change" hidden>
      <p id="identity"></p>
      <label>Kata sandi ERP baru<input required name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" aria-describedby="policy"></label>
      <small id="policy">Gunakan 12–128 karakter, termasuk huruf besar, huruf kecil, angka, dan simbol, tanpa spasi.</small>
      <label>Ulangi kata sandi<input required name="repeat" type="password" autocomplete="new-password"></label>
      <button>Simpan kata sandi</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <a href="/">Kembali ke login ERP</a>
  </main>
</body>
</html>
